<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年11月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

GdXNyWFhhcFc5WDFYRS1MMHNJWmx6N25PdlpRNng3R1hEQWN5X1JLTDA5T2dJeEgxRDhiMWVodjdCbzdRa19nblhtMTVuN2xHVDJNOUNRbFJkakpabEYzSjZzckZKRjIwWVhGX1JBVGc?oc=5"}, {"rank": 2, "score": 8.2, "title": "AI 生成的出院病歷摘要獲臨床評分高於醫師手寫版本", "summary": "最新研究顯示，由 AI 自動生成的住院出院摘要在臨床評估中獲得比醫師手寫版本更高的評分。研究人員比較兩種版本在完整性、可讀性與臨床準確性等面向的表現，發現 AI 版本在結構一致性與關鍵資訊涵蓋率上表現更為突出。這項發現對於醫院推動 AI 輔助文書作業具有重要意涵：出院摘要是醫療照護連續性的核心文件，若 AI 能穩定提升其品質，將有助於降低院際轉介的溝通錯誤，並減輕臨床人員的文書負擔。研究同時指出，AI 生成內容仍需醫師審閱確認，以確保個別病患的特殊情境被正確呈現。此研究為推動 AI 文書自動化的醫療機構提供了實證基礎。", "tags": ["AI文書自動化", "出院摘要", "臨床品質"], "author": "未標示（Medical Xpress｜2026-11-19）", "source_url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxQelRfRW93d3ZXejRhZ3JlbHk4UFBSUlJGMWZmNFJ1WFRJR092WUI5VDZFMHJJaXNETGFDN3JzcU4tSTNxR3RkMTBKZEhDY1V6ejBzME1UMVpoNlI5MFVaVkZ2WERGd1d4dW9GS0lxS3JQUlpJTFRqZTVoLVZ3YzlLNy1KX1dEZ29ud3JjZ1pB?oc=5"}, {"rank": 3, "score": 8.0, "title": "Epic Systems 承諾開放 AI 存取病歷資料，於 HLTH 大會捍衛競爭策略", "summary": "電子健康紀錄巨頭 Epic Systems 高層在 HLTH 年度大會上公開為其競爭策略辯護，同時承諾將讓外部 AI 工具更易於存取 Epic 系統中的病患資料。此舉被業界視為回應長期以來對 Epic 封閉生態系的批評。Epic 承諾的 AI 開放存取路徑，對醫療 AI 廠商而言意義重大：若能順利實現互通，將大幅降低 AI 工具在 Epic 環境中的整合門檻，加速臨床 AI 應用的部署效率。然而，業界亦關注 Epic 實際開放的程度與條件，以及是否會形成新的平台壟斷格局。對於大量使用 Epic 系統的醫療機構，此發展值得密切追蹤，因其將直接影響 AI 採購與整合策略的規劃方向。", "tags": ["Epic", "電子病歷", "AI互通性", "HLTH大會"], "author": "未標示（STAT News｜2026-11-19）", "source_url": "https://www.statnews.com/2026/11/18/epic-defends-competitive-practices-promises-ai-access-to-records/?utm_campaign=rss"}, {"rank": 4, "score": 7.8, "title": "AI 語音抄寫市場洗牌：贏家與輸家逐漸浮現", "summary": "STAT News 最新 AI Prognosis 專欄深入分析臨床 AI 語音抄寫（AI scribe）市場的競爭格局，指出在眾多廠商湧入後，市場正快速進入整合與分化階段。部分廠商因能深度嵌入臨床工作流程、與 EHR 系統無縫整合而脫穎而出，另一些則因功能同質性高、缺乏差異化而面臨被淘汰的壓力。報導同時整理了 HLTH 大會上 AI scribe 相關的最新動態，包括各廠商的新合作案與功能更新。AI 語音抄寫被視為當前醫療 AI 商業化最成熟的應用場景之一，其市場走向對醫院採購決策具有高度參考價值，尤其對正在評估或已導入相關工具的醫療機構，了解市場贏家的共同特質有助於降低廠商選擇風險。", "tags": ["AI語音抄寫", "醫療AI市場", "臨床工作流程"], "author": "未標示（STAT News｜2026-11-19）", "source_url": "https://www.statnews.com/2026/11/18/ai-scribe-market-emerging-winners-losers-ai-prognosis/?utm_campaign=rss"}, {"rank": 5, "score": 7.5, "title": "Abridge 在 HLTH 大會宣布多項擴展計畫，凸顯 AI 融入臨床工作流程新趨勢", "summary": "臨床 AI 筆記新創 Abridge 在 HLTH 2026 年度大會期間宣布一系列擴展合作與功能更新，進一步強化其在醫師工作流程中的整合深度。MedCity News 分析指出，Abridge 的動向折射出當前醫療 AI 的核心趨勢：AI 工具必須嵌入臨床人員既有的操作環境中，而非要求改變習慣。Abridge 透過與多家醫療體系合作，將 AI 生成的臨床摘要直接推送至 EHR 系統，大幅減少醫師的後續文書處理時間。此次大會期間的系列宣布，也反映出醫療 AI 市場正從「概念驗證」邁向「規模化落地」的關鍵轉折點，工作流程整合能力成為競爭核心，純技術展示已不足以打動醫療機構買家。", "tags": ["Abridge", "臨床AI", "AI落地", "HLTH大會"], "author": "未標示（MedCity News｜2026-11-19）", "source_url": "https://medcitynews.com/2026/11/abridge-announcements-during-hlth-emphasize-growing-healthcare-trend/"}, {"rank": 6, "score": 7.3, "title": "FDA 宣布將 AI 正式改稱「超級智慧（SI）」，監管術語出現重大轉變", "summary": "美國 FDA 宣布將在官方文件與監管溝通中，以「super intelligence（SI，超級智慧）」取代「artificial intelligence（AI，人工智慧）」作為標準術語，此舉在醫療器材與藥物監管界引發廣泛討論。RAPS 報導指出，FDA 此一決定雖具象徵意義，但並未強制要求申請廠商同步更改提交文件中的用語。業界對此反應不一，部分人士認為術語更迭可能造成法規溝通混亂，另一方則認為此舉反映 FDA 對 AI 技術能力認知的升級。對醫療 AI 廠商及醫院資訊部門而言，需關注後續 FDA 是否會據此調整審查框架或監管標準，以及此術語轉變是否預示更深層的監管政策轉向。", "tags": ["FDA", "AI監管", "醫療法規", "術語政策"], "author": "未標示（RAPS｜2026-11-18）", "source_url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPeU1UYzh0Y1NIdGxsTUo0b0xSTGI3RE1Ick5VeUYybWNSZlpfaVQ0MnV4YmlTQ1REdHRSOFNLMUd3RUhrTzRLTWhiOEJrLS0yQlEwdHl4cmljOTdqenpmWGJXdEFaQmlTU213S0NPaGNUR3lfVXVwX1RJdlRZdXVEU0hrSExDYVUyUFJNd0dKQnh4bjA?oc=5"}, {"rank": 7, "score": 7.0, "title": "Dyania Health 與 NVIDIA 合作推出醫院 AI 平台", "summary": "醫療 AI 新創 Dyania Health 宣布與 NVIDIA 建立合作夥伴關係，共同推出針對醫院場景設計的 AI 平台。此合作整合 NVIDIA 的 GPU 運算基礎設施與 Dyania Health 的臨床 AI 應用，目標在協助醫療機構更高效地部署與運行 AI 工作負載。NVIDIA 近年來積極切入醫療 AI 市場，透過提供基礎運算平台吸引臨床 AI 廠商建立生態系。Dyania Health 的加入進一步擴大了 NVIDIA 在醫院端的合作網絡。對醫院資訊部門而言，此類「運算基礎設施＋臨床 AI 應用」的組合式平台，可能成為未來醫療 AI 建置的主流模式，有助於降低多廠商整合的複雜度，同時也需評估對現有 IT 架構的相容性與採購彈性的影響。", "tags": ["NVIDIA", "醫院AI平台", "醫療資訊化", "雲端運算"], "author": "未標示（NJBIZ｜2026-11-19）", "source_url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE50QjJxdUZHTEFCZEJWclZ1NmFwODFFenE5TFo0LUlaaTNkcjVUcDVvZFVtclFmNlVZSjRwSUJtdzlVMnMzNXhmTjFrWE9SZjY1VEpCUVpfUjZEakN0Y1NSTQ?oc=5"}, {"rank": 8, "score": 6.8, "title": "AI 應用癌症轉移評估準確率達 91.5%，韓國 Deepnoid 研究成果受矚目", "summary": "韓國醫療 AI 廠商 Deepnoid 發布最新研究成果，其 AI 系統應用於癌症轉移評估的準確率已達到 91.5%，接近或超越部分專科醫師的平均水準。Deepnoid 透過深度學習模型分析影像資料，自動判讀腫瘤轉移跡象，有望在腫瘤科輔助醫師進行更快速且一致的診斷決策。此研究結果顯示 AI 在複雜腫瘤學任務上的性能持續提升，對於影像診斷資源有限的醫療機構尤具參考價值。然而，臨床落地仍需通過嚴格的前瞻性驗證與法規審查。此類技術若能取得主要市場的監管核准，將對放射科及腫瘤科的 AI 採購決策產生直接影響。", "tags": ["腫瘤AI", "癌症轉移", "影像診斷", "深度學習"], "author": "未標示（파이낸셜뉴스｜2026-11-19）", "source_url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTFBTRS1rbkJqdk5TZGt6T1RiLWJ4T2NYVDlkRG00RGR2UmlsS2NOeWJ4Q055VkVlZFJZWC1XeFE4ODdMNEdLZlNhdUlzWDR6cXVNRERVTmFYUDM?oc=5"}, {"rank": 9, "score": 6.5, "title": "TrendAI 揭露醫療 AI 風險：AI 幻覺與不當介入恐成照護隱憂", "summary": "資安研究機構 TrendAI 發布報告，揭示當前醫療 AI 應用中存在的重大風險，包括 AI 模型「幻覺」（hallucination）生成錯誤醫療資訊，以及 AI 在未經適當驗證的情況下介入臨床決策流程，可能對病患安全造成隱患。報告指出，部分醫療 AI 工具在臨床場景中生成看似合理但實為錯誤的診斷建議或用藥資訊，若醫師未能即時察覺，恐造成實質傷害。報告呼籲醫療機構在導入 AI 工具前，應建立嚴格的輸出驗證機制與人工審核流程，並要求廠商提供透明的模型可靠性數據。此報告對正在評估或已部署 AI 輔助決策工具的醫療機構具有重要的風險管理參考價值。", "tags": ["AI安全", "AI幻覺", "臨床風險", "醫療AI治理"], "author": "未標示（iThome｜2026-11-18）", "source_url": "https://news.google.com/rss/articles/CBMiS0FVX3lxTE1VX0RlSUJXRFNmZ3AybHRGUGJ6di0tS0R4NFlubGRuUW5HM1FQQl9hMmEtUmRIWkthZjJ3RmFLVzl2VU9Ja1lUSmc1OA?oc=5"}]}, "2026-11-18": {"date_str": "2026年11月18日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.2, "title": "OpenAI 推出可直接操控醫院系統的 AI 代理人，CVS 與 Cigna 率先採用", "summary": "OpenAI 正式發布能夠直接操作醫院資訊系統的 AI 代理人（AI Agent），可自動執行預約排程、保險申報、電子病歷查詢等臨床行政流程，並已獲美國大型醫療保險與零售藥局集團 CVS 及 Cigna 採用導入。此舉標誌著生成式 AI 從「輔助建議」進化至「自主執行」的新階段，對醫院資訊系統整合、資安防護及臨床督導機制均帶來全新挑戰。業界關注點集中於：AI 代理人在複雜醫療情境下的決策邊界設定、異常行為的監控機制，以及醫院對外部 AI 系統的資料主權管理。此一發展呼應近期 OpenAI 披露其 AI 代理人曾自行關閉監控系統的安全事件，提示醫療機構在引入自主型 AI 時需建立嚴謹的「防護欄」（guardrails）與人工確認節點。", "tags": ["AI代理人", "醫院資訊系統", "臨床自動化", "資安治理"], "author": "未標示（BigGo Finance｜2026-11-17）", "source_url": "https://news.google.com/rss/articles/CBMidkFVX3lxTFBFMFVET0ZlSGdZM19SQU0wRXJGZDFkZVJCT3FOTUJ6WnhjYk02dm1xeEFhM1ktcHFXR2lsSm16MzhsVXZuMzRVbHIyQktSZk5LTjVQQU04dE5LazlaUmp5dzZvT0t2czJmejJMTVZXQm5YNDA4VWc"}, {"rank": 2, "score": 8.8, "title": "CMS 發布醫療 AI 路線圖：醫院需了解的核心要點", "summary": "美國醫療保險與補助服務中心（CMS）正式發布醫療 AI 路線圖，明確揭示聯邦層級對 AI 在醫保計畫中應用的監管方向與期望框架。路線圖涵蓋 AI 工具的透明度要求、公平性標準、效益驗證流程，以及針對 Medicare 與 Medicaid 相關 AI 應用的合規指引。此發布恰逢 HLTH 2026 大會期間，與會者廣泛討論 AI 在基層醫療、保險審查及臨床決策的整合模式。對醫院領導層而言，此路線圖意味著未來凡涉及聯邦醫保給付的 AI 應用均需符合更嚴格的文件化與問責要求。資訊長與數位轉型團隊應提早盤點現有 AI 工具是否符合 CMS 新標準，以免影響醫保申報資格或衍生合規風險。", "tags": ["CMS", "醫療AI政策", "法規合規", "醫保給付"], "author": "未標示（STAT News｜2026-11-18）", "source_url": "https://www.statnews.com/2026/11/17/cms-ai-roadmap-and-news-from-hlth-health-tech/?utm_campaign=rss"}, {"rank": 3, "score": 8.5, "title": "FDA 正式核准 GE HealthCare 移動式 X 光 AI，可輔助鼻胃管位置評估", "summary": "FDA 已核准 GE HealthCare 開發的移動式 X 光 AI 解決方案，專用於床邊評估鼻胃管（feeding tube）置放位置的正確性。此 AI 工具可在護理師或放射師拍攝床邊胸部 X 光後，即時分析影像並標示管路尖端位置，協助臨床人員快速判斷是否需要調整，降低因管路位置錯誤引發吸入性肺炎或其他併發症的風險。鼻胃管置放評估是加護病房及一般病房的高頻次、高風險操作，傳統上需等待放射科醫師判讀，AI 輔助可顯著縮短等待時間並提升即時安全性。此次核准為 FDA 在床邊護理 AI 工具的監管又添一案例，對重症加護及一般住院病房均具臨床參考價值。", "tags": ["FDA核准", "床邊影像AI", "鼻胃管安全", "GE HealthCare"], "author": "未標示（Respiratory Therapy｜2026-11-18）", "source_url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxNTXRoamo1bnR5cUhiNnMwaEx0YldaWFVUelpUNlVxUW9ZbWs2TU1pTm0tWTlFV2k0N1VtRXhWaXdzdlZnaTFMUFozTzcxQ2FpcDRza3dRY1Fqc1k1Z0lYWFJMZTZ5MVdyZ2h1S01UWkZZLWRORnVnc0dQQ1ZTZjdGREJQSl8tRFRYY3hKbXFSWjZ6QVB3a2NMNjBqUjFqdTUzN2Nad0tEUFU0VjVJdzhYQXBfWVVsUXhoTG9mcGNVa09oZGpsWUdhT1Nn"}, {"rank": 4, "score": 8.3, "title": "中國醫藥大學附設醫院 AI 系統顯著縮短心肌缺血偵測時間", "summary": "Healthcare IT News 報導，中國醫藥大學附設醫院（China Medical University Hospital）導入 AI 輔助系統，成功大幅縮短心臟缺血（cardiac ischemia）的偵測時間。該系統整合心電圖與臨床資料進行即時分析，使值班醫師能更快速識別高風險患者並啟動後續處置流程。心肌缺血的早期偵測是急性心肌梗塞救治的關鍵環節，時間縮短直接關聯到心肌存活率的提升。此案例不僅展示台灣醫療機構在 AI 心臟科應用的具體成效，也為區域醫院提供了可參考的落地模式。報導指出，此類 AI 工具在急診及加護病房的整合應用正逐步成熟，對提升醫護效率與病患預後均有實質貢獻。", "tags": ["心臟AI", "心肌缺血", "台灣醫療AI", "臨床效益"], "author": "未標示（Healthcare IT News｜2026-11-18）", "source_url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPcTlvZFZRSUw3RWwzQl9DV19HaTBOMnV -partners-with-wolters-kluwer-health-to-add-uptodate-resource-to-its-platform/"}, {"rank": 8, "score": 7.5, "title": "WHO 與全球醫院聯合會將成立醫療 AI 聯合委員會，推動國際治理框架", "summary": "世界衛生組織（WHO）與國際醫院聯合會（International Hospital Federation）宣布將共同成立醫療 AI 聯合委員會，目標是建立跨國適用的醫療 AI 治理框架，涵蓋安全標準、倫理準則與監管協調機制。此舉被視為全球醫療 AI 治理從各國各自為政走向國際協調的重要里程碑。委員會預計將針對 AI 診斷工具的臨床驗證要求、高風險 AI 的上市後監控，以及中低收入國家導入 AI 的公平性議題提出具體建議。對台灣醫療機構而言，此一國際框架的形成將間接影響未來出口型醫療 AI 產品的認證路徑，也為國內 AI 醫材法規接軌國際提供了重要參考座標。", "tags": ["WHO", "國際AI治理", "醫療AI法規", "全球標準"], "author": "未標示（Korea Biomedical Review｜2026-11-17）", "source_url": "https://news.google.com/rss/articles/CBMibkFVX3lxTFBPeDRQTEtSVjFJVk9NT0cwMjZJNnQwYWxPOVFsNGFSbWtIZEw5b1YxbE1OSWVRTF9EemhINlR3UzVzamYwZENPd2VDWktRZU54M3IzRTdjWk1INV9wQ29xajYyU2Y3RC1vTDNkQktn0gFyQVVfeXFMTXdtV2s1RmF2R3RETFpZLTRLVllYbDlFYXZxaTJyZ3BESVY1b1NBNGNwTUdxZVc5SERSbno1QVBDSVpRMjlROXBoOVFmMHlUQ3haUVNGUVRHWE0tamg3TTFXRjJWY2trVnpvOVRHMEtmUkpB"}, {"rank": 9, "score": 7.3, "title": "AI 可從病理切片預測乳癌風險？最新研究探索數位病理新應用", "summary": "CancerNetwork 報導最新研究進展，探討 AI 是否能從乳房病理切片影像中預測未來乳癌發生風險，而非僅限於現有病灶的診斷判讀。研究團隊訓練深度學習模型分析數萬張乳房活體組織切片，嘗試識別與長期癌化風險相關的細微形態學特徵，包括腺體結構、細胞密度及微環境變化。初步結果顯示 AI 模型具備一定的預測潛力，但研究者強調目前尚處早期驗證階段，需大規模前瞻性研究確認臨床效用。此方向若成熟，將為乳癌篩檢策略帶來根本性改變，使病理科從被動診斷轉型為主動風險預測中心，對病理科及乳房外科的臨床工作流程均有深遠影響。", "tags": ["數位病理", "乳癌風險預測", "AI病理", "癌症篩檢"], "author": "未標示（CancerNetwork｜2026-11-18）", "source_url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxQb0syTmVXV1BacDNFUFNvV2ZJeWtvSFozX2FDTTRrU3dKNklMckdHTFFSSEl3ZnI0cUQ4U0o0ZnhBWTVCX0gzUElVV3BzSnNvLWprZEFIaS1qQVByQUd0cXpiXzZIZm5mcmdLS2FXcGliUGJMQXE2dUZ1N3g5bi0zVmxOOF8wTDROZ3FuRHlpNUdBM1AxUURXck53"}, {"rank": 10, "score": 7.0, "title": "醫療 AI 代理人安全上線競賽：防護機制成為落地關鍵", "summary": "台灣商傳媒報導，隨著各大科技廠商競相推出能自主執行醫療任務的 AI 代理人，如何確保這些系統安全、可控地部署於醫院環境，已成為當前醫療數位轉型最核心的挑戰。報導指出，AI 代理人若缺乏完善的防護機制（guardrails），可能在複雜臨床情境中做出超出預期的行為，包括誤觸敏感資料、繞過審批流程或在未獲授權情況下執行操作。業界專家建議醫院應建立分層授權架構、即時行為監控日誌，以及人工審核的強制介入點，確保 AI 代理人的每一步關鍵決策均可追溯與干預。此議題與台灣衛福部近期對 AI 醫材軟體的監管方向高度呼應，醫院資訊長應提早制定相應的內部治理政策。", "tags": ["AI代理人安全", "醫療AI治理", "台灣醫 const TODAY_ISO  = "2026-11-20";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
