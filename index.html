<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年06月16日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

房的研究顯示，透過機器學習模型可在患者發生急性腎損傷（AKI）前24小時提前預測風險，為臨床團隊爭取寶貴的早期介入時間。急性腎損傷是加護病房常見且死亡率高的併發症，傳統監測方式往往在腎功能明顯惡化後才發出警示，錯失最佳治療窗口。此AI預測系統整合患者生命徵象、實驗室檢驗數據及電子病歷資訊，建立動態風險評分模型，能在症狀尚不明顯時即發出預警，協助醫護人員提早調整用藥、液體管理及腎臟保護策略。此研究對於重症醫學科、腎臟科及醫院資訊團隊均具重要參考價值，顯示AI輔助臨床決策在加護病房場域已逐步從概念驗證走向實際落地應用，對提升重症患者存活率與降低醫療資源耗用具有顯著潛力。", "tags": ["急性腎損傷", "加護病房", "AI預測", "臨床決策支援"], "author": "未標示（PChome Online 新聞｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxQaDBXV2c0RnNmeXlYMEhQUTh3aVk5RnFNeHVFNUhPU3BJSndBU2VMSi1VUEFRenhrQnhLU2xQQ3NnZ04wTHE1N093Q3JUQXAxdk5QcXllSjNwLTlQb09oTi13TmgzVTVEWkJ0Q1JTT2pOcG1qV1BvSUpMQ0wwdlVWa1pQeTIxUURD"}, {"rank": 2, "score": 7.5, "title": "通用型 AI 模型在醫療任務再度勝出，挑戰專用醫療 AI 定位", "summary": "Psychology Today於2026年6月14日刊出分析指出，近期多項測試顯示，通用型大型語言模型（如 GPT-4 等）在多項醫療問答、診斷輔助及臨床推理任務上的表現，已超越部分專門針對醫療場景訓練的垂直 AI 工具。此一現象引發業界重新審視「是否需要專用醫療 AI」的根本性問題。分析指出，通用模型因訓練資料規模龐大、泛化能力強，在開放式推理任務中具備優勢；然而，專用醫療 AI 在特定臨床流程整合、法規合規性及電子病歷系統串接等面向，仍具不可取代的價值。此報導對醫院數位轉型團隊在評估 AI 工具採購策略、選擇通用型或專科型模型時，提供了重要的市場情境參考，也進一步凸顯 AI 評估框架與臨床驗證機制的建立迫切性。", "tags": ["大型語言模型", "通用型AI", "醫療AI評估", "數位轉型"], "author": "未標示（Psychology Today｜2026-06-14）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQZHU3bHZaNGVNYlViRDJYQTVUNktHaXZwaGE2VG0zeVY5RTRFWldDdWt5V2p6UEoxS3dRUUZtREJ4MXlMNFB5ZFhnWmo0OGotZld5N0NMUEZvbUFkTG5vMFlpTm91OE5LQ1psM0I2Y3owUWFmcFI3Yl9PXzk5NGpWZjFsYzJ4YTZwQjV4SlRtT1AyREVqSEVDMUdwdGFmRDlUS0tUTnl3"}, {"rank": 3, "score": 7.0, "title": "醫療 AI 進展為何受阻？Bot vs. Bot 困境揭示產業深層矛盾", "summary": "MedCity News於2026年6月13日刊出深度分析，探討醫療 AI 領域進展遭遇的結構性阻力，並以「Bot vs. Bot」比喻描述當前困境——不同 AI 系統、保險核保演算法與臨床決策工具之間的衝突與矛盾，反而造成醫療流程的摩擦增加而非減少。文章指出，醫療 AI 的商業化落地面臨多重挑戰：各系統間缺乏互操作性、AI 輸出結果相互矛盾導致醫師決策困擾、加上醫院端採購分散化，使整體進展停滯。此外，AI 工具在降低行政負擔方面雖有成效，但在實際改善臨床結果方面的實證仍不足。對於正在評估多元 AI 系統整合的醫院管理層而言，此文提供了重要的警示，說明在缺乏統一治理架構下，部署過多 AI 工具可能帶來新的系統性風險。", "tags": ["醫療AI瓶頸", "系統整合", "AI治理", "臨床工作流程"], "author": "未標示（MedCity News｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE90eWhpcDV3ell5VThOUHVqNG9vZUpNWUVoVDBVVFdlUFRkbl9Ha2tsdlh2dmRPc3RFcUtYX2dLSlVDeTlBRldlNm1tdjViUDJLR2l1NXplSzZxUEpNQzhCLQ"}, {"rank": 4, "score": 6.5, "title": "大南方 AI 智慧健康展開幕，聚焦醫療照護 AI 落地應用", "summary": "據墨新聞報導，大南方 AI 智慧健康展於2026年6月正式開幕，展覽聚焦醫療照護領域的 AI 實際落地應用，匯聚來自台灣南部及大南方區域的醫療機構、科技業者與新創團隊，展示包括智慧診斷、遠距照護、AI 影像判讀及健康管理平台等多元應用場景。本次展覽特別強調從技術概念驗證走向臨床實用化，並促進醫療機構與產業界的跨域合作。展覽同時吸引投資機構關注，為區域醫療 AI 新創企業提供媒合平台。此一展覽的舉辦反映台灣南部地區對智慧醫療發展的高度重視，也顯示醫療 AI 產業生態系在地化發展的趨勢正逐步加速，對於有意推動智慧醫療落地合作的醫院管理層具有產業動態參考價值。", "tags": ["智慧醫療展覽", "台灣醫療AI", "AI落地應用", "產業合作"], "author": "未標示（墨新聞-MORE News｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiQkFVX3lxTE90dzNJdk92NGdlamN3aHBTemlXWDUwMFNfYlB3UmVkY1E0Y255SWlpSXY1Y2dfMTBmbWVSSEo0b3dNQQ"}, {"rank": 5, "score": 6.0, "title": "香港 AI 醫療新創面臨跨境數據成本高牆，積極尋求突破", "summary": "香港文匯網於2026年6月14日報導，香港 AI 醫療新創企業在發展過程中面臨嚴峻的數據跨境傳輸挑戰。由於中港兩地數據法規差異顯著，醫療數據「過河」（即跨境流動）成本極高，包含合規審查、安全認證及技術架構改造等費用，使許多新創公司難以跨越門檻，影響其在大灣區市場的拓展能力。業界人士呼籲政府建立更明確的醫療數據跨境流通機制與沙盒試驗環境，以降低合規成本並促進創新。此議題對台灣醫療 AI 產業亦具借鏡意義，尤其在跨機構數據共享、國際合作及法規沙盒建置方面，相關政策框架的完善對醫療 AI 產業發展至關重要，值得主管機關與醫院資訊主管共同關注。", "tags": ["醫療數據跨境", "香港AI新創", "數據法規", "大灣區"], "author": "未標示（香港文匯網｜2026-06-14）", "source_url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE4wTXFCTlZ5enZNR2l0b002MkxKd1JlS1U1bFZHaFMwNVZCX3dNbkhzSmF1bDJIdS1tTFZFMF9kTnIyeUttVVlXdGFncHVaSWVreHZvN182Y0RmaGVNWEk0b2x2ZjlTQ0dCdFhPWDdtcW9RcFRfYWJJ"}, {"rank": 6, "score": 5.5, "title": "台灣生技 IPO 熱潮湧現，AI 醫療題材領漲推升掛牌估值", "summary": "工商時報於2026年6月13日報導，台灣生技產業迎來新一波 IPO 浪潮，共有15家新興生技公司準備掛牌上市，題材涵蓋 AI 醫療影像診斷、精準醫療、再生醫療及細胞治療等多元領域。其中以 AI 醫療相關題材的公司掛牌定價最高，顯示資本市場對醫療 AI 應用的高度期待。分析人士指出，AI 醫療類股估值受惠於全球醫療數位化趨勢加速，加上台灣在半導體與資通訊產業的既有優勢，使本土醫療 AI 新創具備獨特競爭力。然而，也有法人提醒投資人需關注產品實際臨床落地進度與商業化時程，避免題材過熱導致估值脫離基本面。此報導反映台灣醫療 AI 產業生態系的資本化進程正加速，對醫院在評估潛在 AI 合作夥伴財務穩健性時具參考意義。", "tags": ["生技IPO", "台灣醫療AI", "資本市場", "精準醫療"], "author": "未標示（工商時報｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9aQlM5LXp5T2g1bk9BWGtPbFFMZzY3cEl6cGdmdUlIM3dsbDcxY1ZpVmJvZGJGNXRralNVM2VfR0NIQ3BSSkZrVWw4a2Q5SkJFaXViX1p6aENLZ0M2aTNR"}]}, "2026-06-13": {"date_str": "2026年06月13日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.0, "title": "Nature Medicine 研究：通用型大型語言模型在醫療任務表現優於專用醫療 AI 工具", "summary": "根據 Nature Medicine 最新發表的研究，通用型大型語言模型（如 GPT-4 等）在多項醫療臨床任務的表現，整體優於專為醫療場域設計的專用 AI 工具。研究分析涵蓋診斷推理、病歷摘要、臨床問答等多個面向，結果顯示通用型 LLM 在彈性與準確度上具有顯著優勢。此一發現對醫療機構的 AI 採購策略具有重要意涵：過去普遍認為「專用醫療 AI」較通用模型更具臨床可信度的假設，正面臨重新檢驗。研究同時指出，通用型模型的廣泛能力雖具優勢，但在資料隱私、法規合規與臨床驗證等層面仍需審慎評估。此研究結果可能影響醫院在選擇臨床決策支援工具時的技術路線判斷，並引發業界對醫療專用 AI 開發模式是否具有長期競爭力的深層討論。", "tags": ["大型語言模型", "臨床決策支援", "醫療AI評測", "Nature Medicine"], "author": "未標示（Crypto Briefing｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBSNElFR1k0aFhjWTJtUS1peGM0dVQyZ0xYYUpWUkcxcXhEN1hiMDZwTmNkRTJ2bk5mODRUUkwyd3lkaVgzWVhfWWRfNm1DenhhWkhzSWZyQ3JDanZKdkhmNm9INFQ4QkpkS0FrbXJsdEpjMGVYQVBSQWJ3?oc=5"}, {"rank": 2, "score": 8.5, "title": "醫療 AI 進步為何受阻？HFMA 年會揭示數據基礎設施才是關鍵瓶頸", "summary": "在美國醫療財務管理協會（HFMA）年度大會的專題討論中，來自 Oracle Health、HCA Healthcare 及 BJC Health 的高階主管共同指出，儘管醫療產業對 AI 的投入持續創新高，大量投資恐因底層數據基礎設施老舊破碎而付諸流水。與會者以「Bot vs. Bot」比喻當前困境——前端 AI 工具彼此競爭，卻建立在殘缺不全的數據地基之上，導致系統整合困難、預測結果不可靠。主管們強調，在導入任何先進 AI 應用前，醫院必須優先整頓電子病歷互通性、資料標準化與儲存架構，否則即使採用最尖端的模型，臨床效益也將大打折扣。此次討論凸顯了「數據治理」而非「演算法競賽」才是醫療 AI 落地的真正挑戰，對正規劃 AI 轉型的醫療機構具有高度參考價值。", "tags": ["醫療AI落地", "數據基礎設施", "數位轉型", "HFMA"], "author": "未標示（MedCity News｜2026-06-13）", "source_url": "https://medcitynews.com/2026/06/healthcare-ai-hfma/"}, {"rank": 3, "score": 8.0, "title": "台灣行政院長卓榮泰宣示：AI 全面走入智慧醫療與長照體系", "summary": "台灣行政院長卓榮泰公開表態，強調 AI 技術將全面導入智慧醫療與長期照護領域，以應對台灣快速邁入超高齡社會的照護量能挑戰。卓揆指出，在高齡人口比例持續攀升的背景下，單靠傳統人力已無法滿足龐大的醫療與照護需求，AI 的整合應用被視為補足量能缺口的核心策略。此次聲明恰逢「大南方 AI 智慧健康展」在台南盛大開幕，展會聚焦醫療照護 AI 落地應用，串聯產官學研各界，形塑台灣南部智慧健康產業聚落。政府高層的明確表態，預示台灣醫療 AI 政策將進一步加速推進，對醫療機構申請相關補助、規劃智慧照護方案及布局長照 AI 系統具有重要的政策訊號意義。", "tags": ["台灣智慧醫療", "長照AI", "醫療政策", "大南方AI智慧健康展"], "author": "未標示（工商時報｜2026-06-13）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFBHT2I0UEdQdUxfYUtkZTBNQU5SeElwbEJqZ1hteWtmc21iVUlodVpMTmVsdThUd25CaWRhWEVFQWxRcldPb3QtcWVEVUdqRDI2SXJJdy1kM2Nsem5yMzh3?oc=5"}, {"rank": 4, "score": 7.5, "title": "衛福部發布 5,050 筆台灣專用 LOINC 對照表，為全國醫療 AI 數據互通奠定基礎", "summary": "衛生福利部正式公布 5,050 筆台灣專用 LOINC（Logical Observation Identifiers Names and Codes）對照表，旨在建立全國一致的醫學檢驗標準語言。LOINC 是國際通行的醫療數據標準，用於統一標記檢驗項目名稱與代碼，此次台灣本土化對照表的完成，將大幅改善不同醫療機構間的檢驗數據互通性。對醫療 AI 發展而言，這是關鍵基礎建設的重要進展：AI 模型訓練、臨床決策支援系統及跨院數據分析，均高度依賴結構化且標準化的檢驗數據。此舉也與台灣推動 FHIR 醫療數據交換標準及健保 AI 應用的方向相互呼應，預計將加速醫療 AI 模型在多院所場景的部署與驗證效率，對資訊部門規劃數據治理與 AI 平台整合具有直接參考意義。", "tags": ["LOINC", "醫療數據標準", "台灣醫療AI", "數據互通"], "author": "未標示（iThome｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE9ab1pIVjJpVENBZHRRREY1NnFORnl4LUQ1Z0I1Ukk0UW05eWNKWW5CRG1HaXI3YlVGY1RJeG1Sb2Q0dXR4RG1tZlRnX1g1dw?oc=5"}, {"rank": 5, "score": 7.0, "title": "醫療 AI 下一階段：如何將預測結果轉化為真正的臨床行動", "summary": "HealthTech Magazine 發表深度分析，探討醫療 AI 從「預測模型」邁向「臨床行動」的關鍵轉型挑戰。文章指出，目前多數已部署的醫療 AI 系統擅長生成風險預測與警示，但將這些輸出結果轉化為臨床工作流程中可執行的決策仍面臨重大落差。主要障礙包括：AI 建議與電子病歷系統的整合不足、臨床人員對 AI 輸出的信任度不一、以及缺乏明確的責任歸屬機制。文章強調，真正有價值的醫療 AI 必須嵌入臨床流程節點，而非僅作為獨立分析工具存在。作者呼籲醫療機構在採購 AI 系統時，應著重評估其「工作流程整合能力」與「行動觸發機制」，而非單純比較預測準確率，此觀點對醫院評估 AI 系統採購具有直接指導意義。", "tags": ["臨床AI工作流程", "預測轉行動", "醫療AI採購", "臨床決策支援"], "author": "未標示（HealthTech Magazine｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxPLXBBUnVKSTFwdDJCNXk2Ql9JSUlvc1Q0S25INm5HQzBpdmVSdXdxRTlXV20wakk4ZlRIUVFlM1d5N2FwUS0yWEJucElJOUJjU0o1b3VFU0pGZFNZVFFCVzJmclVrX20ycGVEWEtGalFRWEVBR1drMVl6akpvdG00YWNTWmwtM2k3YW4zdHI2NjhXOVMwVVRJSHRhRGh2YkFibWRQX1cxeUpBN0pq?oc=5"}, {"rank": 6, "score": 6.5, "title": "新竹台大分院深化胸腔醫學 AI 與精準醫療整合，打造智慧醫療創新生態系", "summary": "新竹台大醫院分院宣布深化胸腔醫學領域的 AI 與精準醫療整合應用，積極建構院內智慧醫療創新生態系。院方將 AI 技術導入胸腔疾病診斷、影像判讀及個人化治療方案規劃，並結合基因體數據與臨床資料，強化精準醫療的實際落地能力。此次計畫涵蓋多科別跨域合作，包括放射科、病理科與胸腔外科的 AI 輔助診斷系統整合，目標打通院內各系統數據孤島，實現從篩檢到治療全流程的智慧化支援。此一案例展示台灣區域醫學中心在 AI 應用上已從單點工具導入，逐步進化為系統性生態系規劃，對同樣規劃智慧醫療轉型的醫院具有本土實務參考價值。", "tags": ["胸腔醫學AI", "精準醫療", "台灣智慧醫療", "新竹台大分院"], "author": "未標示（台灣好新聞｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMivANBVV95cUxPdkxfdVNUTkZ3b1NnMnM0XzR 制，正式將 AI 風險管理納入醫院評鑑框架", "summary": "美國醫院評鑑機構 Joint Commission 宣布推出針對醫療 AI 的專項認證計畫，明確將 AI 系統的風險識別、透明度要求與安全監控機制納入醫院評鑑標準。此認證框架旨在解決醫療院所在導入 AI 工具時，普遍面臨的治理漏洞與問責缺口。根據報導，認證內容涵蓋演算法偏誤稽核、AI 系統失效應對流程，以及臨床工作人員對 AI 決策輔助工具的使用培訓等面向。此舉被業界視為美國醫療 AI 監管從 FDA 單一主管機關模式，走向多層次認證體系的重要里程碑。對於正在規劃或已導入 AI 輔助臨床決策系統的醫療機構而言，此一認證標準將成為未來院所 AI 治理架構設計的重要參照依據，亦可能影響保險給付與採購契約條款。", "tags": ["AI治理", "醫院認證", "風險管理", "政策法規"], "author": "未標示（Bank Info Security｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOT3VWb0xSY1d0a1VxbnJMR1V0dW84dGdiMXpTS1hDNWhyNkNNQXFMSzY2NXJkaUVrYktJZ20zVVdHbGdNbUVHSkZORDNiWmxvOGctbjJYSzRlMmJEYzBfWWViUWduTm1wUG1CZXZ1OWtfRjV6VVNqV2hPeDFVTmFBV3FZNG1lY1RaTEpyRlNGZ2c5OXBjUnZubmpleDFPb29k?oc=5"}, {"rank": 3, "score": 8.8, "title": "AMA 針對 AI 事前授權提案立法，要求確保醫師對 AI 核保決策的監督權", "summary": "美國醫學會（AMA）正式推動政策立場，要求在保險公司使用 AI 進行事前授權（prior authorization）審查時，必須確保醫師具有實質監督與覆核權力，以防止 AI 自動拒絕給付對患者造成傷害。此項政策同時獲得多位國會議員跨黨派支持，並已有立法提案進入審議程序。報導指出，聯邦調查人員發現 Medicare Advantage 計畫中存在系統性拒絕給付再上訴後幾乎全數推翻的異常模式，顯示 AI 核保工具可能被濫用於壓低醫療支出。此議題對醫院營運影響深遠，特別是在涉及復健照護、住院申請等高拒絕率領域。AMA 的政策立場預計將對醫療保險合約談判及 AI 核保工具的設計規範產生中長期約束效果。", "tags": ["事前授權", "AI監管政策", "AMA", "醫師監督"], "author": "未標示（TechTarget｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQM1RNVHNFYnJyaXd0WmM0V3dxMFdGb3RYWUFVOXNtUmtpcThRN0Ffb1lGNHNJZjZkWGNHdEs3OUx0dVlBWExMYmU2TWlROFZsNGZXT2l2cFRBenZkWlVYdGpWR2d4elNYVkYyb0ZadTl1bGI5SGh0MElJdmc5TXJGSHRjMUdFMkZlZ1lwS3Z3eldxeGoyaVFfUm90RU1TMjJja1BZbnRMa3BsZzdwRzBBSnRnVXM2OUxfa3I2a1l2V1oxUjA2bGVvTWl2U004NkE?oc=5"}, {"rank": 4, "score": 8.5, "title": "Nature 發表 AIDx 研究：可本地部署的 AI 臨床決策支援系統正式登場", "summary": "《Nature》期刊發表一項名為 AIDx 的研究成果，介紹一套可在醫院本地端（locally deployable）運行的 AI 臨床決策支援系統，無需將患者資料傳送至外部雲端伺服器即可提供診斷輔助建議。此設計直接回應醫療機構在導入 AI 時面臨的資料隱私與資安顧慮。AIDx 系統整合了大型語言模型與結構化醫療知識庫，能根據臨床症狀與檢驗數值提供鑑別診斷建議，並以可解釋的方式呈現推理路徑，輔助臨床醫師進行判斷。研究團隊在多個臨床情境下測試，顯示系統在準確性與可用性方面具備臨床應用潛力。此研究為追求資料自主管控的醫療機構提供了新的 AI 落地路徑參考，對資訊部門評估本地端 AI 部署方案具有重要意義。", "tags": ["臨床決策支援", "本地部署AI", "資料隱私", "大型語言模型"], "author": "未標示（Nature｜2026-06-11）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5DMG5QR0VvYi1zNEJrRHhWQm9xVmVHM0Y3X0REM2F1SWpQZGdUWDJacDhZSGxCWWJVekxlaHFDM21JMm5BNGl6MU1DSTJ0QkJlZ0tKQ0VXTEs4SjNOdnZR?oc=5"}, {"rank": 5, "score": 8.2, "title": "三分之二醫療人員私下使用未經授權 AI 工具，醫院系統建置嚴重滯後", "summary": "一項最新調查顯示，高達三分之二的醫療機構工作人員在醫院未正式採購或核准的情況下，自行使用私人 AI 工具（如 ChatGPT 等消費級產品）處理臨床或行政工作。此現象揭示醫療院所在 AI 治理與基礎建設上的嚴重落差：員工因面臨工作量壓力，自發尋求效率工具，卻在資安、隱私合規與醫療責任歸屬方面形成灰色地帶。報告指出，這種「影子 AI」使用模式在護理、行政與文件記錄人員中尤為普遍。專家警告，若醫院持續在官方 AI 工具採購與部署上進展遲緩，此風險將持續擴大。此調查結果對醫院數位轉型團隊制定 AI 使用政策、員工培訓及合規框架具有直接的行動參考價值。", "tags": ["影子AI", "資安風險", "醫療合規", "數位轉型"], "author": "未標示（AD HOC NEWS｜2026-06-12）", "source_url": "https://news.google.com/rss/articles/CBMixAFBVV95cUxPbi1aeEFSZFVWTVhadk5xUkR6dmEzZC02dDR1MHRkSmpzdnFhNEhINDQ1Y182LXJlbjl1ZnJwNnBCQ3NFSFhORU04NGVvUlMzdUxaOWd0NUZVYnppSUpHUk1keTI3a0VKR1NZVmN3TmtiRDBmaXJ2QWdRcmtmcl9CUGh2aWNRSU1ndTMwRWgydy1SaEhnTTRnTGZrSl9UZkVzR1pQc2ljWm1aUkdSVjM5WERfYk81QmstQXRaWGtqOTdXOXFR?oc=5"}, {"rank": 6, "score": 7.8, "title": "乳癌篩檢 AI 偵測評分研究登上 RSNA 期刊：早期預警能力再獲實證支持", "summary": "《Radiology》期刊最新發表研究，探討以 AI 偵測評分（AI Detection Scores）應用於乳房 X 光篩檢，分析其作為乳癌早期預警指標的臨床效益。研究顯示，AI 評分系統能在傳統放射科閱片流程之外，為高風險個案提供額外的量化風險層級資訊，有助於分流後續追蹤與介入時機。此研究與先前報導的「AI 可在確診六年前預警」相互呼應，進一步強化了 AI 輔助篩檢的實證基礎。研究同時探討了 AI 評分與傳統放射科醫師判讀之間的互補關係，指出整合使用可提升整體篩檢靈敏度而不顯著增加假陽性率。對正在規劃或已導入乳房篩檢 AI 的放射科而言，本研究提供了評估工具臨床效益的重要參考數據。", "tags": ["乳癌篩檢", "放射科AI", "早期偵測", "臨床實證"], "author": "未標示（RSNA Journals｜2026-06-11）", "source_url": "https://news.google.com/rss/articles/CBMickFVX3lxTFBia1lrbmV2WVAwRjlGN0F2SlFHUm80U1ZWTzlVWmtHMTl6UVZqRE1vNjg1VGV1d2dtdzZfWkp5S084WVdjN3RpcVlHWl9uMWZhMzRWMWRvRnllUzh1VmxrVE1ucHBsTTVweWZhTnlWejh6UQ?oc=5"}, {"rank": 7, "score": 7.5, "title": "數位行為健康進入臨床判斷新階段：AI 從輔助 Copilot 走向人機協作決策系統", "summary": "MedCity News 刊出分析文章，探討數位行為健康（Digital Behavioral Health）領域的 AI 應用正在從單純的「Copilot 工具」演進為支援人機協作臨床判斷的複雜系統。作者指出，下一代醫療 AI 的關鍵不在於自動化替代，而在於建立一套讓臨床醫師、督導人員與 AI 能相互質疑、相互補強的決策架構。文章以心理健康與成癮治療為核心案例，說明當 AI 介入敏感臨床情境時，如何設計人機介面以維持醫師的最終判斷權。此觀點對精神科、身心科 ", "summary": "MobiHealthNews報導，OpenAI與Anthropic兩大AI領導企業在籌備首次公開募股（IPO）的同時，正積極擴大其在醫療健康領域的業務布局。兩家公司近期分別與多家醫療機構、健康系統及生技企業深化合作，涵蓋臨床文件自動化、醫療客服、藥物研發輔助等多個應用場景。IPO進程帶來的資金壓力與成長預期，促使兩家公司將醫療AI列為核心商業化方向之一。此一趨勢意味著未來醫療機構在採購AI工具時，將有更多來自大型基礎模型廠商的直接競爭選項，也預示著醫療AI市場的資本集中度將進一步提升。對醫院資訊部門與數位轉型團隊而言，了解主要AI平台的商業策略走向，有助於評估長期合作夥伴的穩定性與技術路線圖。", "tags": ["OpenAI", "Anthropic", "醫療AI商業化", "數位轉型"], "author": "未標示（MobiHealthNews｜2026-06-11）", "source_url": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxNLXdVcnpUMHNMQlJzM0ZwelN6ZTdINmVYZHJHRUhZcXBIM2R2ei00QUhoQ21xSzNsOXhrZExDalFEVXhfUnRhN05nUFJhcmd4TDYwMGg1X1IySmE1RjVmX1B6a1NYc1BzTElibkNCNFdGRjlhWTZjazB0c2Jqdm9kaDlHVTR1Rzh4dEdaZkJTU3BBRmZ4SWZ4dEViaFRKWjIwUjkyZTVFekhXU1E?oc=5"}, {"rank": 5, "score": 7.5, "title": "台灣行政院BTC預備會議聚焦AI生技與智慧醫療，FHIR Box病歷互通方案再受重視", "summary": "根據iThome報導，台灣行政院生技產業策略諮議委員會（BTC）預備會議將AI生技與智慧醫療列為核心議題，並再次提出建置「FHIR Box」基礎設施以實現全台病歷互通的構想。FHIR（Fast Healthcare Interoperability Resources）是國際通行的醫療數據交換標準，FHIR Box方案旨在打破各醫療機構間的數據孤島，使病患就醫紀錄能夠跨院安全共享，進而支持AI模型的訓練與臨床應用。此次會議顯示台灣政府在醫療AI基礎建設上的政策意圖持續強化，若FHIR Box方案落地，將對醫院資訊系統升級需求、數據治理規範以及跨院AI應用開發產生深遠影響，是各大醫療機構資訊部門需持續關注的政策動向。", "tags": ["台灣醫療AI", "FHIR", "病歷互通", "智慧醫療政策"], "author": "未標示（iThome｜2026-06-10）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTFBVMmNOMjdOY0dQbXFjbkxQNlhkdkxDOUMxaHRhdkNTMWptLUtpWHBtNHlBc3hscEliaVZHZ1VjMkdIcE96LXZCV2lham5zUQ?oc=5"}, {"rank": 6, "score": 7.0, "title": "DeepHealth推出Reporting Pro：為放射科報告帶來AI自動化新工具", "summary": "DeepHealth正式發布名為「Reporting Pro」的放射科AI報告自動化軟體，旨在協助放射科醫師大幅縮短報告撰寫時間並提升一致性。該產品透過AI自動擷取影像關鍵發現、結構化呈現異常區域，並產生初稿供醫師審閱與修訂，實現「AI起草、醫師確認」的工作流程。DeepHealth表示，Reporting Pro已針對多種影像模態（包括CT、MRI、X光）進行優化，並與主流PACS系統整合。放射科報告積壓與人力短缺是全球醫院普遍面臨的挑戰，此類AI自動化工具的商業落地代表市場正進入實質應用階段。對評估放射科AI工具的機構而言，此產品的功能設計與整合架構值得作為比較基準，以判斷適合自身環境的解決方案。", "tags": ["放射科AI", "報告自動化", "DeepHealth", "影像AI"], "author": "未標示（GlobeNewswire｜2026-06-10）", "source_url": "https://news.google.com/rss/articles/CBMi6wFBVV95cUxQZGpuOWhmOHM1YnBiM1MyUGtGV0Znd0p2VDFfd1F1bFctcXgtaWU5UkhmYXB6R3ZHVHpZa const TODAY_ISO  = "2026-06-16";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
