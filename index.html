<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年09月05日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

nnel 3-12｜2026-09-03）", "source_url": "https://news.google.com/rss/articles/CBMixgFBVV95cUxNYzBucE1JY1NpQWxibGFhOWpLRlZpZW1HaU0zN1VfZzYwRUtNY3Q1Q2k0UDM1Y2g4bV9lbUJXbWNUa2tyQktldmZOT090WUgtZEcxX2t3UWdrRkZORUdzQzRqQTJ6eGh5eHQ0X085aDB0dWFOYWN4YkhtX3hIWDBaSGZOeW1EODUwS3JEMWxQLWR6NGRtVEkyUWtJY3ZRVnc0dVdUaUMyS2pCd3R3MHFOUVFCVllfSkFfbHQtcS1vZzYtdENEMHc?oc=5"}, {"rank": 2, "score": 8.0, "title": "醫療 AI 人口統計資訊揭露嚴重不足，研究示警偏差風險", "summary": "最新研究指出，現行醫療 AI 模型在開發與驗證報告中，針對年齡、性別、種族、社經地位等人口統計資訊的揭露仍嚴重不足。研究團隊分析多個已上市或已發表的醫療 AI 系統後發現，絕大多數模型未完整說明訓練資料的人口組成，使外界難以評估其在特定族群中可能存在的效能落差或偏差問題。此一缺口不僅影響模型的可信度與公平性，更對監管機構的審查構成挑戰，因為缺乏透明的人口統計報告，將難以識別模型是否對特定弱勢族群存在系統性誤差。研究者呼籲學術期刊、產業界及主管機關共同建立標準化的人口統計揭露規範，以推動更具公平性的醫療 AI 發展。", "tags": ["AI公平性", "人口統計揭露", "模型偏差", "醫療AI監管"], "author": "未標示（News-Medical｜2026-09-03）", "source_url": "https://news.google.com/rss/articles/CBMitgFBVV95cUxNUVBkYi0xMWlvb19FdVlISkpYV19yTXRSU0VVUkJybjNMMGMyMFhuZHBzRFNNYW5vQmFHNFZvRndKbVBrQWVrYnYzbVNJWlMwNFNsYlM1LVFzQ3A4MFBDTmV6ZTczd282aWlRc2R4R09BanNQdVRvbzNMZTY3UXBJZE1ZeVRQOE9RcVhyeHNRSk5DbjMwSEJJNTR5bGJfWWlpTTdRUUFxZDJYZVcwRkg1THAtSmloUQ?oc=5"}, {"rank": 3, "score": 7.5, "title": "AI 將多發性骨髓瘤臨床試驗篩選時間從兩週縮短至數秒", "summary": "韓國一項臨床研究成果顯示，運用 AI 系統輔助多發性骨髓瘤（multiple myeloma）臨床試驗的患者篩選流程，可將原本需要約兩週的人工審查時間壓縮至數秒完成。該 AI 工具透過自動解析電子病歷中的診斷紀錄、用藥史與實驗室數據，即時比對試驗入排標準，大幅降低研究協調員的行政負擔，並顯著提升患者招募效率。此應用案例凸顯 AI 在加速臨床試驗流程、縮短新療法問世時程方面的實際潛力，對腫瘤科及臨床研究團隊具有直接的參考價值。研究者也指出，此模型的設計架構具有較高的可移植性，未來有望擴展至其他血液腫瘤或複雜癌種的試驗篩選情境，加速多中心試驗的患者招募工作。", "tags": ["臨床試驗AI", "血液腫瘤", "患者篩選", "自動化"], "author": "未標示（Korea Biomedical Review｜2026-09-02）", "source_url": "https://news.google.com/rss/articles/CBMibkFVX3lxTFBjY2Zvb18yYVNFOTdCMUlwclJqT0xETzN6eWNwLW02Z0FSU3l1TjB1YmhONGpoUHdOTXZmN0pxdWNsc0pTOTQ5ZGRLNDdnNGNXM0RrTUpTclRZeTJqNmF1R0ZpZkdmcnMtMFYwTUtn0gFyQVVfeXFMTW5jZnpjR01HMDIzbGhuNWo3eW9hWnlzUWRxSHdQSmNSX3pyWk9tMjZiY1JFOElxMk1NVzZDblBHNXNqZWs5Qlg1S0xVTTRHcXRhQ0NUMnhUSE1VbUZ5UG9GUE1KX0E2eVNROUgwUjVBQmF3?oc=5"}, {"rank": 4, "score": 7.0, "title": "AI 代理人有望大幅減輕臨床人員事前授權行政負擔", "summary": "事前授權（prior authorization）長期是美國醫療體系中導致臨床人員倦怠的主要來源之一。最新分析指出，AI 代理人技術的成熟為這一痛點帶來突破性解法。透過自然語言處理與自動化工作流程，AI 代理人可自動蒐集患者臨床資料、比對保險公司授權標準，並代為填寫提交相關申請文件，將原本耗費護理師與行政人員數小時的重複性作業壓縮至數分鐘內完成。分析者強調，此類應用不僅有助於緩解臨床人力短缺壓力，更能讓醫護人員將更多精力投入直接照護工作。然而，文章也提醒，AI 代理人的導入必須配套完善的錯誤偵測機制與人工監督流程，以避免自動化決策誤判對患者醫療資源取得造成負面影響。", "tags": ["AI代理人", "事前授權", "臨床工作流程", "人員倦怠"], "author": "未標示（DesignRush｜2026-09-02）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1WVmM0NTNOTHZHaG9qc0RraExPOUp0NU01UldfRUtpamxZWTM4bEhqbloxdkFXYTB5cFpfLXBJZlhDbHpuY0V1emthTXF4N3JMcXR4R0l2ODBISnhUNnlR?oc=5"}, {"rank": 5, "score": 6.5, "title": "醫療 AI 轉型關鍵：舊有基礎架構才是瓶頸，而非 AI 本身", "summary": "一篇來自 MedCity News 的深度評析指出，許多醫療機構寄望 AI 工具直接改善照護效率，卻忽略了底層系統架構老舊才是根本障礙。文章強調，當 AI 解決方案被疊加在 1990 年代設計的工作流程與資訊系統之上時，局部改善往往難以轉化為全機構的系統性變革。醫院若未能同步重新設計照護流程與資料基礎設施，AI 的導入將只是在既有低效系統上增添複雜度，而非真正提升效能。作者呼籲醫院領導層在推動數位轉型時，應將基礎設施現代化列為與 AI 採購同等重要的優先事項，唯有從架構根本出發重構，AI 才能真正發揮轉型槓桿效應，實現跨部門的整合性效益。", "tags": ["數位轉型", "醫療資訊架構", "AI導入策略", "醫院管理"], "author": "未標示（MedCity News｜2026-09-03）", "source_url": "https://medcitynews.com/2026/09/the-healthcare-inflection-point-ai-cant-fix-1990s-technology/"}, {"rank": 6, "score": 6.0, "title": "華碩攜手高通正式啟動「藥事 AI Agent」計畫，台灣智慧醫療新布局", "summary": "台灣科技大廠華碩（2357）宣布與高通（Qualcomm）合作，正式啟動「藥事 AI Agent」計畫，目標將 AI 代理人技術應用於藥事服務領域。此合作案代表台灣在地科技業者開始將邊緣運算晶片與 AI 軟體能力結合，切入醫療場域的實際服務流程，涵蓋藥物諮詢、用藥提醒與藥事行政自動化等潛在應用方向。此舉不僅顯示台灣本土智慧醫療產業鏈的整合深度持續提升，也呼應全球醫療機構對 AI 代理人應用於臨床支援工作的高度關注趨勢。對台灣醫院資訊與藥事管理部門而言，此一產業動態值得持續追蹤，未來或將出現可評估導入的本土化藥事 AI 解決方案。", "tags": ["藥事AI", "台灣醫療AI", "AI代理人", "智慧醫療"], "author": "未標示（富聯網｜2026-09-02）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxNeEtTY3VUd1oyaTBZUGVEakJmRV9kY1BabVViRnRGODBIRUFwbzlnaWNGRDFvdkdKOFQ3T290YjJfV2pBMW1DRXFqOHUtWlpBT3pfOS1VaEFBYnFRMThmVmFuck1zdlNiSEp0aGdQci11NzNMR0JOYkpSMzd0cnJpQi1GUU8yY2Z0?oc=5"}, {"rank": 7, "score": 5.5, "title": "台灣代表出席 APEC 衛生工作小組，倡議亞太醫療 AI 智慧共享", "summary": "台灣 ABAC（亞太經合組織工商諮詢理事會）代表張嘉淵出席於中國大連召開的 APEC 衛生工作小組會議，積極推動亞太地區醫療 AI 資源與知識的跨境共享機制。會議聚焦於如何透過多邊合作架構，協助成員經濟體建立醫療 AI 標準規範、資料互通協定及跨國驗證框架，以避免各國重複建設並縮小數位醫療能力落差。台灣代表的參與展現台灣在醫療 AI 領域的國際能見度，並強調透過區域平台輸出台灣醫療 AI 實踐經驗的戰略意義。此一外交與政策動態對台灣醫療機構在國際合作研究及標準接軌方面具有潛在影響，值得醫院國際事務與研究發展部門關注。", "tags": ["APEC", "醫療AI國際合作", "台灣醫療", "政策"], "author": "未標示（環球生技月刊｜2026-09-02）", "source_url": "https://news.google.com/rss/articles/CBMiaEFVX3lxTE5qa2U4ajVXSXhra2RyNXJwUTgzVWQwZ2s2VjVWVF91d0NtSi1HdkFNZm9ZZ1lidDQyc3NPVVVhUktHZVZ5ZmI3bnBQcFVTbkctOVlMM3NFLUVXQkdXaDNoTnpza0p3aVpO?oc=5"}]}, "2026-09-02": {"date_str": "2026年09月02日", "weekday": "星期三", "items": [{"rank": 1, "score": 8.5, "title": "醫院 AI 採用速度超越資安防護能力，Black Book 報告示警醫療機構潛在風險", "summary": "根據 Black Book Research 最新報告，醫院導入 AI 系統的速度已明顯超越其資安防護機制的建立速度，形成結構性安全漏洞。報告指出，多數醫療機構在部署 AI 工具時未同步強化相應的網路安全控制措施，包括存取權限管理、模型輸出監控及供應鏈風險評估等環節均存在不足。隨著 AI 系統深入臨床工作流程、病患資料處理及行政作業，一旦遭受攻擊或資料外洩，潛在損害將遠超過傳統 IT 事故。報告呼籲醫院領導層將資安治理與 AI 採購決策同步整合，並建立持續性監控框架，以確保在加速數位轉型的同時，不犧牲患者資料保護與系統穩定性。此一警示對正積極擴展 AI 應用的醫療體系而言，具有高度實務參考價值。", "tags": ["醫療AI資安", "AI治理", "醫院數位轉型", "風險管理"], "author": "未標示（FinancialContent｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMi1wFBVV95cUxQYzU1T1RISFo3SE9ocXR6S1dETzRJS3NFNWxHVGRCWHpVSFE0YWRTWjZpWmdmazZfZTNfbWRlTVJhTlBNV0VEOVhwbkw1YWdQalZfaHljQ0xzQTNYVExiOEl0cmZ3b19sSkR5anI1WmlRVmFMVlVKRFhaaUhUdnpzekpJZDhFeXQ5azczQ0hNclg2UWcwa0JaUDViQWdZcExxUjEzYU9YX2NDa2RvU1F4WmlWN2ZTcmtXVlVockM5LXVyRF9qdlZ1ZmlIdExvZTVLWlRpS05zbw"}, {"rank": 2, "score": 8.0, "title": "新加坡公立醫院與診所全面開放自建 AI 代理人，亞洲醫療 AI 民主化新里程", "summary": "新加坡衛生部旗下醫療體系正推動一項創新政策，讓公立醫院及基層診所均能自主開發並部署 AI 代理人（AI Agent），而非僅依賴中央統一採購的商業解決方案。此舉標誌著醫療 AI 治理模式的重大轉變，透過提供標準化開發平台與安全沙箱環境，賦權各臨床單位根據自身需求設計自動化工作流程，涵蓋病患溝通、排程管理、臨床決策輔助等場景。此模式有助於加速基層醫療的 AI 落地，同時保留機構層級的彈性與創新動能。對亞洲其他醫療體系而言，新加坡的「去中心化 AI 代理人」策略提供了兼顧效率與自主性的參考藍圖，尤其適合資源分布不均的多院區醫療組織借鑒。", "tags": ["AI代理人", "新加坡醫療", "醫院數位轉型", "基層醫療AI"], "author": "未標示（iThome｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE1ueEJabE1SUjVhWnJlbHBvOGVDUk1LeVVxaEdhLTFnR3p3ZFAydmlaWF91anJkZVBmTWFXVW9vWHlOVFFqN3I0YUJzS1hFZw"}, {"rank": 3, "score": 7.5, "title": "長庚大學首創「AIMD 雙學位」制度，醫學生六年同時取得 AI 碩士學位", "summary": "長庚大學宣布推出全台首創「AIMD（Artificial Intelligence in Medicine and Design）雙學位」計畫，讓醫學系學生在六年學制內同時取得 AI 碩士學位，成為兼具臨床訓練與 AI 技術能力的複合型人才。校長在受訪時明確表示，AI 不會取代醫師，但能使用 AI 的醫師將取代不會使用 AI 的醫師，強調主動培育跨域人才的必要性。此計畫課程涵蓋機器學習、醫療影像分析、自然語言處理等核心技術，並結合臨床實習場域進行實作訓練。此一制度設計對台灣醫療教育體系具有示範意義，預示未來醫學教育將朝向「AI 素養」納入標準訓練的方向演進，亦為醫院在招募與培育新世代醫師時提供重要參考。", "tags": ["醫學教育", "AI人才培育", "台灣醫療AI", "雙學位制度"], "author": "未標示（三立新聞網SETN.com｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMiSEFVX3lxTE9PUWFIc1R0WXV1dXEtQXpaSndHNnc4aDl3aVY5c3AtQlYwZXJLbEkwNFhCcUlRWFpCWVh6UzVNcks3d3dZU2Q4MtIBTEFVX3lxTE12TmlsUXQ1a2dteURsNS1ES2hKOE9kdkZXUC1ESm9pZDVmNDF0OUJNZEFkOERRRDJrSlR4RWo2ZDJoaEFGczJodFN4cmE"}, {"rank": 4, "score": 7.0, "title": "醫療 AI 正從治療走向預防：Frontiers 科學前沿深度解析預防醫學新典範", "summary": "Frontiers 學術平台發布最新科學前沿報告，指出醫療 AI 的應用重心正逐步從疾病治療轉向預防醫學。報告指出，結合可穿戴裝置、基因體學資料及電子病歷的大規模 AI 模型，已能在症狀出現前數月甚至數年預測個人罹病風險，涵蓋心血管疾病、第二型糖尿病及特定癌症等慢性病類別。此一典範轉移不僅有望顯著降低長期醫療成本，亦對醫院的服務模式產生根本性衝擊，促使醫療體系從「被動診治」轉向「主動健康管理」。報告同時指出，預防導向 AI 的普及尚需克服資料隱私、跨機構整合及健康不平等等挑戰，建議政策制定者與醫療機構同步建立相應的倫理與監管框架。", "tags": ["預防醫學", "醫療AI趨勢", "慢性病管理", "健康促進"], "author": "未標示（Frontiers｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNODhqcC1Ob2w5MEdySnVPUUFlNGlySTI0YkJYQUtJTGtlWnZKNDluNEUwZHRULTVhWklKMEdtWnVCSWEwMm53U1ZycDd3cmQtM2ZXVy1vZ2hSc0ZkSms3YVRjMU1LUTUtcU9Hc2dwWGZYd3lfWmhUbDZlWUdGQi05LW1KTGY3U2ctZllLcWNiTTlPS2xUSXZxRy1yWjlXRVM4dzg5ekpvY2NaN0pYRlE"}, {"rank": 5, "score": 7.0, "title": "AI 改變民眾就醫行為，台灣專家提出兩大原則協助查驗健康資訊可信度", "summary": "隨著生成式 AI 工具普及，越來越多台灣民眾在就醫前先向 AI 諮詢健康問題，此一趨勢正在改變傳統就醫行為模式。台灣醫療專家對此提出警示，指出 AI 提供的健康資訊品質參差不齊，民眾若缺乏正確判斷能力，可能導致延誤就醫或自行服藥等風險。專家建議民眾遵循兩大原則查驗 AI 資訊可信度：一是確認資訊是否有醫學實證或可信來源佐證；二是評估資訊是否符合個人實際病況與體質差異，而非通用性建議。此議題亦提醒醫療機構，應主動加強對患者的 AI 健康資訊素養教育，並思考如何在臨床場域中有效整合 AI 諮詢工具，以提升整體醫療品質而非造成混淆。", "tags": ["AI健康資訊", "患者AI素養", "台灣醫療AI", "就醫行為"], "author": "未標示（元氣網｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTE9zTWttSE1MVGFVNlR0VzJUWkZodktZYmJxaGxaVnFmbnluUFI2TzVuYzI1bjVuMlZRSktlSHlsVU9LVmlVNkdta2YwSTFURVAtSDVoSGg2UUY5Y2Vz0gFiQVVfeXFMUEJSRmlVcGRZc01oTHdOdEN0WVF4SGxUTXJtdHVCSG5jeGxWTDRPMFJkRnVoTG1ZV3NOeXVFeS0zQnlVMTR3WGpGX3VIUWpfNUE4NHR0R0VLazhJRHJDX1BpWkE"}, {"rank": 6, "score": 6.5, "title": "Agentic AI 突破臨床試驗設計瓶頸，有望大幅縮短方案修訂週期", "summary": "MedCity News 刊登深度分析指出，臨床試驗中頻繁的方案修訂（Protocol Amendment）是造成試驗延遲的主要原因之一，平均每項三期試驗需歷經 2.3 次重大修訂，嚴重拖累新藥上市時程。新興的 Agentic AI（自主代理型 AI）技術透過整合歷史試驗資料、法規要求及患者招募模式，能在試驗設計階段提前識別潛在方案缺陷並提出優化建議，從而減少事後修訂的需求。此外，Agentic AI 亦可協助即時監控試驗執行進度、自動偵測異常資料模式，進一步提升試驗品質與效率。文章強調，加速臨床試驗不僅是商業利益考量，更直接關係到患者能否更早獲得安全有效的治療選項，具有明確的公衛意義。", "tags": ["臨床試驗AI", "Agentic AI", "藥物開發", "試驗設計"], "author": "未標示（MedCity News｜2026-09-01）", "source_url": "https://medcitynews.com/2026/09/breaking-the-amendment-cycle-how-agentic-ai-enables-smarter-clinical-trial-design-and-operations/"}, {"rank": 7, "score": 6.5, "title": "AI 正在改寫醫療專業：從知識解離到建構生命趨勢線的典範轉移", "summary": "工商時報刊載深度分析，探討 AI 如何從根本上重塑醫療專業的知識架構與實踐模式。文章指出，傳統醫療知識建立在醫師個人學習與臨床經驗積累上，而 AI 的介入使得「知識」與「判斷」開始解離——AI 能透過大規模資料分析建構個別患者的生命趨勢線，提供超越單一醫師認知範疇的縱向預測能力。此一轉變正促使醫療專業重新定義醫師的核心角色：從資訊提供者轉向決策詮釋者與患者關係管理者。文章同時指出，台灣醫療體系在 AI 導入過程中，需正視醫師角色轉型帶來的心理適應與培訓需求，以及如何在技術賦能與醫師自主性之間取得平衡，對醫院領導層的組織文化管理具有重要參考價值。", "tags": ["醫療AI趨勢", "醫師角色轉型", "台灣醫療", "AI倫理"], "author": "未標示（工商時報｜2026-09-02）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1xSlRYdktfRXUweG9ZZDdiZ2VwRVJ6aEZtaENJbVI0UGhFckJjbGpEWFUwZUJXd3pfb2NVZ3duMDJWdkcxNnI2UzJQYk0yVERmaFROQUtvOGx3VUVIWDNV"}, {"rank": 8, "score": 6.0, "title": "AI 模型突變全基因組實驗揭示預測極限：頂尖 AI 無法準確預測病毒 DNA 全面改寫的生物效應", "summary": "Nature 最新報告指出，研究人員對一種病毒的整個 DNA 序列進行系統性單點突變實驗，並以此測試多個頂尖 AI 模型的生物功能預測能力。結果顯示，即使是當前最先進的基因體 AI 模型，在面對全基因組規模的突變組合時，預測準確率仍顯著低於預期，暴露出現行 AI 在理解複雜生物系統交互作用方面的根本性限制。此發現對於依賴 AI 進行基因體功能預測的精準醫療研究具有重要警示意義，提醒研究者不應過度仰賴模型輸出而忽略實驗驗證。對醫院資訊與研究部門而言，此研究提供了評估 AI 在基因體醫學應用場景中可靠性邊界的重要參考依據。", "tags": ["基因體AI", "AI極限", "精準醫療", "AI可靠性"], "author": "未標示（Nature｜2026-09-01）", "source_url": "https://www.nature.com/articles/d41586-026-02609-y"}]}, "2026-09-01": {"date_str": "2026年09月01日", "weekday": "星期二", "items": [{"rank": 1, "score": 8.5, "title": "AI 引導出院規劃革新：HonorHealth 的實戰經驗全面解析", "summary": "美國 HonorHealth 醫療體系正式導入 AI 輔助出院規劃系統，透過即時分析患者臨床數據、社會決定因素及床位使用狀況，協助臨床團隊在住院期間即提前啟動出院安排。此舉旨在縮短平均住院天數、降低非計畫再入院率，並改善後急性照護的銜接效率。HonorHealth 的案例顯示，AI 工具能協助護理師及個案管理師更早識別出院阻礙因素，如交通、居家照護資源不足等社會問題，使多專科團隊得以提前介入。此模式對醫院床位周轉管理與營運效益具有直接影響，亦為 AI 應用從純診斷支援擴展至流程管理的具體實證。對於正在評估 AI 整合策略的醫院領導層與資訊部門，此案例提供了可參考的實際落地路徑與效益評估架構。", "tags": ["出院規劃", "AI臨床應用", "病床管理", "醫院營運"], "author": "未標示（Becker's Hospital Review｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxNUV9BNmpOajhJMFNMOUhoNW5HYWhlMVg3S203Wm5HQkh6azZNUWlYVFVNMWM4SjVOQ20wRlZVTGl4aTdlVzV5OHlTcGJmSmVsSkEtZ0thbllYMGhEYUM4WHdNSHEyQW9WRFlEZXVTVWFfOHhnNF80UzBVQjlKd0w5VTIxNEJJaHNaRlZXVHA3REhFbVloSW1IMW5fWDZhWkpzckVyTlVaSnJTcl9rZEIxZjBOU2pmWEJjR0VNSFhHMHZHaHc?oc=5"}, {"rank": 2, "score": 8.0, "title": "醫療 AI 轉型非工具問題而是領導問題：驅動醫療體系 AI 落地的六大核心原則", "summary": "MedCity News 刊載一篇針對醫院領導層的深度觀點文章，主張醫療 AI 轉型的成敗關鍵不在技術本身，而在於執行長（CEO）能否將 AI 列為機構最優先的前三大策略目標。文章提出六項核心原則：包括建立明確的 AI 治理架構、將 AI 效益納入財務問責機制、跨部門整合數位轉型文化、確保臨床與資訊部門協同領導、持續追蹤 AI 部署後的實際成效，以及建立快速學習與迭代的組織能力。作者警告，若 CEO 缺乏直接推動力，機構將停留在概念驗證（PoC）與簡報階段，而競爭對手則持續拉大差距，最終侵蝕機構服務使命的能力。此框架對正在規劃 AI 路徑圖的醫療管理層具有直接參考價值。", "tags": ["AI治理", "醫院領導力", "數位轉型", "策略管理"], "author": "未標示（MedCity News｜2026-08-31）", "source_url": "https://medcitynews.com/2026/08/ai-wont-transform-health-systems-ceos-will-six-principles-to-drive-the-transformation/"}, {"rank": 3, "score": 7.5, "title": "AI 放射科分流系統實戰：如何協助值班醫師應對週末龐大影像工作量", "summary": "Diagnostic Imaging 報導 AI 輔助影像分流技術在放射科值班情境的實際應用。週末與假日期間，放射科人力精簡，但急診影像量不減，AI 分流系統能自動依據病灶嚴重程度對影像進行優先排序，確保顱內出血、大血管阻塞等時間敏感案例優先被判讀，有效降低因工作量堆積造成的判讀延誤風險。文章指出，AI 分流不僅改善影像判讀的時效性，亦減輕值班醫師的認知負擔，使其能將有限注意力集中於最緊急案例。此類工具已逐漸成為多家醫院放射科的標準配備，對於正在評估影像 AI 導入的機構，此文提供了具體的工作流程整合視角與效益說明。", "tags": ["放射科AI", "影像分流", "值班管理", "急診影像"], "author": "未標示（Diagnostic Imaging｜2026-09-01）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxNQ3dKeG9XWkJLNFpKbW5UTG9tcGpqRVRlVUhlQUl6Y1 "date_str": "2026年08月31日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "Medicare 正式為 CT 分流 AI 每案設定最高 137.53 美元附加給付上限", "summary": "美國聯邦醫療保險 Medicare 宣布，針對符合資格的住院病患使用 CT 分流人工智慧工具，每案最高可獲 137.53 美元的附加給付（add-on payment）。此舉標誌著 AI 輔助影像診斷進入正式醫療給付框架，對全美醫院導入放射科 AI 工具具有重大政策信號意義。明確的給付上限一方面確立 AI 工具的合法收費機制，另一方面也可能影響廠商訂價策略與醫院採購決策。對於正在評估或已部署 CT 急診分流 AI 的醫療體系而言，此項規定直接關係到 AI 應用的財務可行性與回收模型，預期將帶動更多醫院在成本效益評估後加速導入相關工具，並促使政策制定者進一步研議其他影像 AI 類別的給付標準。", "tags": ["醫療給付政策", "放射科AI", "CT分流", "Medicare"], "author": "未標示（MarketScale｜2026-08-31）", "source_url": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxPeG1xWGdUZy1vRzhEOEFwS2oyYlVGZXppS1hnajFhMGh1TlZMbGlfblRGbk1EZ1REcklQNnRmREpLNE51NDlObF9MODFJRFVYenVOYzhYZUF2N2d2ZUVQVHBnU01LdDhSTzlpNmZ0OUhCZ0xYakJnSUQ1MlZ3enI3dHRXUi1ldjdPeEhOUVZuVDBWbkJ4T19zTjZrTFdTZXJxclA4bDZXTVhIS3NCSWJPODhTVXBfT0p6M21EZ2RaOVNEVGdlUnBwSEM1Y25PTlo3Q2NJ?oc=5"}, {"rank": 2, "score": 8.0, "title": "逾九成醫院已部署第三方 AI 工具，但測試與監管機制嚴重落後", "summary": "MedCity News 引述一份最新報告指出，超過 90% 的醫療體系已導入第三方 AI 工具，然而不足半數具備在工具嵌入臨床照護流程前進行適當測試與驗證的基礎設施。報告以 UPMC 等大型醫院為案例，揭示 AI 採購速度遠超治理能力的普遍現象。這項落差意味著許多機構在缺乏有效評估機制的情況下，即讓 AI 工具影響實際患者照護決策，潛藏安全性與責任歸屬風險。報告強調，醫院需要建立系統性的 AI 測試框架、持續監控機制及跨部門治理委員會，以確保 AI 工具的有效性與安全性符合臨床標準，這對醫院資訊部門與數位轉型團隊在 AI 採購與部署流程設計上具有直接的參考價值。", "tags": ["AI治理", "醫院AI部署", "臨床安全", "數位轉型"], "author": "未標示（MedCity News｜2026-08-30）", "source_url": "https://medcitynews.com/2026/08/upmc-ai-testing-hospital-tech/"}, {"rank": 3, "score": 7.5, "title": "AI 模型用於追蹤人畜共通傳染病，能否阻止下一場大流行？", "summary": "Nature 發表專題報導，探討 AI 模型在監測人畜共通傳染病（zoonotic diseases）方面的應用現況與潛力。隨著氣候變遷與人類活動範圍擴張，人畜共通病原體跨物種傳播的頻率持續升高，傳統流行病學監測方法難以即時掌握疫情動態。多個國際研究團隊正利用機器學習與大數據分析，整合野生動物族群監測、環境感測及人類病例資料，建構早期預警模型。文章指出，AI 模型在偵測異常傳播模式、預測高風險區域方面展現出優於傳統方法的能力，但資料品質不均、跨國資料共享障礙及模型可解釋性仍是主要挑戰。對公共衛生政策制定者與感染管制團隊而言，此類 AI 工具的成熟將對大流行病防範策略產生深遠影響。", "tags": ["人畜共通傳染病", "公共衛生AI", "疫情預警", "流行病學"], "author": "未標示（Nature｜2026-08-30）", "source_url": "https://www.nature.com/articles/d41586-026-02684-1"}, {"rank": 4, "score": 6.5, "title": "數位病理是否已準備好 // ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
