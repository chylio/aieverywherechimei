<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年07月18日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

score": 7.3, "title": "加拿大 AI 藥物警示系統將院內藥物警報減少 94%，正式進軍美國市場", "summary": "加拿大醫療 AI 公司（TSXV: SEGN）宣布其臨床藥物警示輔助系統在加拿大醫院試驗中成功將無效警報（alert fatigue）減少高達 94%，顯著降低臨床藥師與護理師因過多警示而產生的認知疲勞。Benzinga 報導指出，該系統採用機器學習技術分析藥物交互作用、病患過敏史及臨床情境，精準篩選出真正需要人工介入的警示，其餘低風險提醒則自動過濾。目前該公司正式啟動美國市場拓展計畫，此案例為全球醫療機構提供了具體的警示疲勞解決方案參考，對醫院藥劑部門、資訊系統團隊及病安委員會均具高度實務參考價值。", "tags": ["藥物安全AI", "警示疲勞", "臨床決策支援", "病患安全"], "author": "未標示（Benzinga｜2026-07-16）", "source_url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxOMGUtdzNWaFZBRDhlc3h4RzVzbjNub09TWE1zTTRxZWJSSll0anI5cGhUQUtQaFl0d0VNd0cxOEN5SnhiOWRacjMzSEJDMDJ4OGpPUDZMWHJ1QTJoUlRwWnREMTYycWR2OUI1NHdjbVhvSFRMcVpyTG02RmtJUFZKRFlRSFJHOExoNW5zbGJXUmVEc3hGU1JYb1JZSy1fVXpzd0J0WUlhU2h6MC1PREF1OGxIak1OSkxqa0ZjU1Z0UQ?oc=5"}, {"rank": 9, "score": 7.0, "title": "從監測到行動：醫療 AI 下一階段的核心轉變是主動介入而非被動警示", "summary": "The AI Journal 發表分析文章，探討醫療 AI 正從被動式監測（monitoring）演進為主動式行動（active intervention）的關鍵趨勢。作者指出，第一代醫療 AI 工具主要功能是蒐集數據、發出警示，將判讀與決策完全交由臨床人員處理；而新一代系統則開始具備情境感知能力，能在適當時機主動建議或觸發臨床流程，例如自動通知照護團隊、調整監測頻率或啟動轉診流程。文章同時討論此轉變帶來的責任歸屬挑戰：當 AI 主動介入時，醫療機構需要更清晰的治理框架界定系統與醫師的決策邊界，以確保病患安全並符合法規要求。此觀點對醫院數位轉型團隊規劃下一階段 AI 整合策略具有重要參考價值。", "tags": ["主動式AI", "臨床決策", "AI治理", "數位轉型"], "author": "未標示（The AI Journal｜2026-07-16）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQNGVmZGN6aDVDUGNRcktkQVVYNjJoODJ5XzlKZS1oSllPLUFtMFVpWGhpN3ZwbkhYdGNZXzlkWFF0ejhmSkZUUERJeE8yX0IyWktzOXIwbDI1a3NZcEZYaUJ0MEJ0ekpGd3pCSkdFSmMzMEo3RjNmcUR0bl8wVWJkUUJjbXk2dV90akhWY0UxZFZ2Zw?oc=5"}, {"rank": 10, "score": 6.8, "title": "歐盟首例：葡萄牙加入 HealthAI 網絡，強化跨國醫療 AI 監管合作", "summary": "民視新聞網報導，葡萄牙正式成為歐盟首個加入 HealthAI 國際醫療 AI 監管網絡的成員國，此舉被視為歐洲推動跨國醫療 AI 治理標準化的重要里程碑。HealthAI 網絡旨在建立成員國間的醫療 AI 監管資訊共享機制、評估方法對齊與跨境數據合規框架，協助各國監管機構在核准醫療 AI 產品時採用更一致的安全與效益標準。葡萄牙的加入預計將為其他歐盟成員國設立示範效應，加速歐洲整體醫療 AI 監管生態系的成熟。對台灣醫療機構及數位健康產業而言，此一動態顯示國際醫療 AI 監管正朝向多邊協作方向演進，值得持續追蹤其對未來出口認證與跨境醫療數據合作的影響。", "tags": ["醫療AI監管", "歐盟政策", "國際合作", "HealthAI"], "author": "未標示（民視新聞網｜2026-07-16）", "source_url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTFBxamFudkh5bVFkcC0yZXdOMUp5MFl6Q3p6azlCUWVUWUx0ZWtnRmtYMTYxaGJiQ0xIZ1I4cUlCTEVxTFBFQnBRTHhTdU9lek9wUExCaHVEWVhyTlR4cTJXeg?oc=5"}]}, "2026-07-16": {"date_str": "2026年07月16日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.0, "title": "Mayo AI 吹哨者、Sutter Health 起訴 Abridge：醫療 AI 治理危機持續延燒", "summary": "STAT News《AI Prognosis》本期彙整兩大醫療 AI 治理事件。其一，Mayo Clinic AI 吹哨者案持續發酵，前主管指控內部對 AI 安全疑慮遭到壓制，相關訴訟牽動醫療機構如何建立 AI 異議與問責機制。其二，Sutter Health 因導入 AI 醫療記錄工具 Abridge 而遭到訴訟，院方已公開回應，此案涉及 AI 輔助書記工具的知情同意、資料使用與責任歸屬等核心議題。兩起事件均顯示，醫療 AI 快速落地的同時，內部治理、員工保護與法律責任框架尚未健全，對已導入或正評估 AI 書記／臨床決策工具的醫院領導層而言，具有重要的合規參考價值。", "tags": ["AI治理", "醫療法律", "AI書記工具", "患者安全"], "author": "未標示（STAT News｜2026-07-16）", "source_url": "https://www.statnews.com/2026/07/15/mayo-whistleblower-sutter-abridge-lawsuit-news-ai-prognosis/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "兩黨議員施壓 Medicare Advantage 保險商：AI 拒保行為引發國會調查", "summary": "美國參議員 Blumenthal 與 Hawley 以跨黨派之姿，要求 UnitedHealth、Humana、CVS 等主要 Medicare Advantage 保險商提交內部文件，說明其如何運用 AI 系統拒絕或延遲醫療照護授權。此舉標誌著美國國會對保險業 AI 應用的監管力道明顯升級。調查聚焦於 AI 演算法是否系統性地干預臨床決策、剝奪患者應得的醫療服務。對醫療院所而言，此案不僅影響事前授權流程，亦凸顯 AI 輔助核保的透明度與問責機制已成監管焦點。相關立法動向值得密切追蹤，尤其對依賴保險給付的臨床科室與財務規劃團隊影響深遠。", "tags": ["AI監管", "醫療保險", "事前授權", "美國政策"], "author": "未標示（STAT News｜2026-07-15）", "source_url": "https://www.statnews.com/2026/07/15/medicare-advantage-ai-care-denials-probe-blumenthal-hawley/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "MGH 與 Dana-Farber 聯手發布 AI 風險預測工具，可同時預測逾 300 種疾病", "summary": "麻薩諸塞州總醫院（MGH）與 Dana-Farber 癌症研究所共同開發一款 AI 風險預測工具，能根據個人健康資料同時預測心臟病、乳癌等逾 300 種疾病的罹患風險。此工具整合多維度臨床與基因組資料，突破傳統單一疾病風險模型的侷限，為個人化預防醫學開創新路徑。相較於現行各疾病獨立評估的做法，此一多疾病整合預測架構有望協助臨床醫師更有效識別高風險族群、提前介入。對醫院預防醫學部門、健康管理計畫及資訊系統整合而言，此類工具的臨床導入可行性與資料治理需求值得進一步評估。", "tags": ["疾病風險預測", "精準預防醫學", "AI臨床應用", "大型語言模型"], "author": "未標示（The Boston Globe｜2026-07-16）", "source_url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxNYUVoTmhJMXpoNXFWb1VXWlpnZXlPb1o2aVFrcmNqcmZqRjhOeGFTZDJDR214ZllmdGg3QktZU2lDR2VzRllNYlBZSXpIcDhzUm4tR0FLN05lelhhZlVsUEVZWjVGSEtEVWxJZ2tmS29DMlNMb3k3YTFHVkt3RGhBZWxJSWpJcVNpT2c"}, {"rank": 4, "score": 7.5, "title": "Nature 發表貝葉斯框架整合縱向電子病歷與基因體資料，識別潛在疾病特徵", "summary": "Nature 最新研究提出一套貝葉斯生成式框架，能同時整合縱向電子病歷（EHR）與基因體資料，從中識別潛在疾病特徵（latent disease signatures）。此方法突破傳統分析僅能處理單一資料來源的限制，透過機率模型捕捉疾病在時間維度上的動態演變，並與遺傳變異進行關聯分析。研究成果對多重共病管理、新型生物標記發掘及藥物開發具有直接應用潛力。對醫院資料科學團隊與臨床研究部門而言，此框架提供了將龐大 EHR 資料轉化為疾病洞察的嶄新方法論，亦呼應精準醫療對多模態資料整合的長期需求。", "tags": ["電子病歷", "基因體學", "機器學習", "精準醫療"], "author": "未標示（Nature｜2026-07-15）", "source_url": "https://www.nature.com/articles/s41586-026-10780-5"}, {"rank": 5, "score": 7.5, "title": "醫療 AI 技術護城河消失：2026 上半年數位健康募資報告顯示領域專業才是真正差異化關鍵", "summary": "根據 MedCity News 對 2026 年上半年數位健康募資趨勢的分析，整體融資規模達 74 億美元，其中大型交易（megadeals）吸收近半數資金。報告指出，隨著 AI 技術快速普及化，「技術本身」已不再是新創公司的競爭護城河，投資人與創辦人一致認為，「領域專業知識」——即對特定醫療場景的深度理解——才是真正的差異化優勢。此一趨勢對醫院數位轉型策略具有重要意涵：評估 AI 解決方案時，應優先考量廠商在特定臨床場景的實務經驗，而非單純的技術規格。", "tags": ["數位健康", "醫療AI投資", "產業趨勢", "新創生態"], "author": "未標示（MedCity News｜2026-07-16）", "source_url": "https://medcitynews.com/2026/07/digital-health-capital-fundraise-startups/"}, {"rank": 6, "score": 7.0, "title": "未受管控的影子 AI 正成為醫療機構網路安全的隱形炸彈", "summary": "MedCity News 分析指出，醫療機構內部員工自行使用未經 IT 核准的 AI 工具（即「影子 AI」），正在快速累積難以追蹤的網路安全風險。由於醫療資料的高度敏感性，一旦未授權工具發生資料外洩或模型偏誤，將對患者隱私與醫療品質造成嚴重衝擊。文章強調「看不見的就無法保護」，呼籲醫療組織建立 AI 工具盤點與核准機制，並制定明確的使用政策。此議題對資訊安全、法遵與數位轉型團隊均高度相關，尤其在各科室 AI 工具使用日趨普遍的現況下，治理框架的建立刻不容緩。", "tags": ["網路安全", "AI治理", "資訊安全", "醫療法遵"], "author": "未標示（MedCity News｜2026-07-15）", "source_url": "https://medcitynews.com/2026/07/off-the-radar-how-unapproved-ai-is-complicating-healthcare-cyber-risk/"}, {"rank": 7, "score": 6.5, "title": "AI 進診間：台灣醫療現場導入 AI 輔助，讓醫護有更多時間陪伴患者", "summary": "鏡週刊報導台灣醫療院所導入 AI 工具的實務經驗，聚焦於 AI 如何協助醫護人員處理行政與記錄工作，進而釋放更多時間專注於患者照護與醫病溝通。報導呈現第一線醫護對 AI 輔助工具的實際感受，包括門診記錄自動化、病歷摘要生成等應用場景，並探討人機協作如何在不取代醫護專業判斷的前提下提升服務品質。此報導貼近台灣本土醫療現場脈絡，對正在評估或已導入 AI 書記、語音轉文字等工具的醫院管理層，提供了難得的使用者視角參考。", "tags": ["台灣醫療AI", "人機協作", "AI書記工具", "醫護體驗"], "author": "未標示（鏡週刊Mirror Media｜2026-07-16）", "source_url": "https://news.google.com/rss/ const TODAY_ISO  = "2026-07-18";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
