<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月25日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

XNXeUdhbFRVQkh2SjNhUEpYeFl0eUZmN2wyNEhmTUEybkFTNzBadnNDejlVN2M?oc=5"}, {"rank": 5, "score": 7.8, "title": "醫療 AI 以光速前進：Fast Company 深度解析產業現況與挑戰", "summary": "Fast Company 發表深度報導，全面剖析醫療 AI 目前以「超高速」推進的產業現況。文章涵蓋診斷影像、臨床決策支援、行政自動化與藥物研發等多個應用場域，並探討在技術快速迭代下，醫療機構面臨的採購決策壓力、臨床驗證不足以及監管滯後等隱憂。報導指出，雖然醫療 AI 市場規模持續擴張，但許多系統仍缺乏嚴格的真實世界臨床試驗支撐，醫院若在評估不充分的情況下倉促導入，可能面臨效益落差與法律風險。文章同時引述多位臨床與資訊主管的觀點，強調「採購速度」與「負責任的 AI 導入」之間的平衡至關重要，為醫院數位轉型決策者提供重要的策略參考視角。", "tags": ["醫療AI產業", "數位轉型", "臨床驗證", "AI採購"], "author": "未標示（Fast Company｜2026-10-24）", "source_url": "https://news.google.com/rss/articles/CBMif0FVX3lxTFBCNENYbXhfMVpHMUEzM1R6Z0QzeHdTWnpSbTBvZ092OFFLb1pIdlhOcVBUVXFUbXdqNjIybUY0YU94VjZTX252enoxTVFHelVCMUxfb0h4VHo2eXA1NkxrOHVOdHptZXpXamNJS2JEZFRNbXh0YWdIV2tMZGpiTWc?oc=5"}, {"rank": 6, "score": 7.5, "title": "病理學數位革命：AI 如何從根本改變疾病診斷流程", "summary": "Medscape 深度報導數位病理學的快速崛起，說明 AI 影像分析工具如何在組織切片判讀、罕見病診斷及腫瘤分型等領域顛覆傳統病理醫師的工作模式。文章指出，全玻片數位掃描（WSI）結合深度學習模型已在乳癌、肺癌等常見癌症的分期與預後預測上展現媲美或超越人類專家的表現。然而，數位病理導入仍面臨高昂的掃描設備成本、病理醫師再培訓需求，以及各院間資料格式不統一等挑戰。報導也觸及 AI 輔助病理報告在醫療法律責任歸屬上的模糊地帶，提醒醫療機構在規劃導入時須同步建立相應的治理框架與人員培訓計畫，以確保技術效益能真正轉化為臨床品質的提升。", "tags": ["數位病理", "AI影像分析", "腫瘤診斷", "病理醫學"], "author": "未標示（Medscape｜2026-10-23）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxNeG9Rc25GVXd0a0wtUVVweXV2N3RzOWJCNmpIUVdVYWF6aFh6Z05iSUwtUnlaVnBOWjYzRWN4Ynczalo4YlUyUmZidkVwTE5TRldCMTRnT0hjZHJwdU9NUnFxV2VTZ1lZY20yMEFTaXVDX2pHV0Z5dHo3X0s1cVYwZDk5aHBFUzlDZmszYjdyM2NXalpNdjZIWlVDXzhxU1JSazY0X0x3?oc=5"}, {"rank": 7, "score": 7.3, "title": "AI 藥物研發公司 Pathos 完成 2.37 億美元融資，整合 Tempus 資料集挑戰 BMS 合作模式", "summary": "AI 驅動藥物研發公司 Pathos 宣布完成 2.37 億美元融資，估值達 30 億美元，此輪融資同步確立了 Pathos、Tempus 與百時美施貴寶（BMS）三方合作架構。Tempus 提供龐大的多模態腫瘤學真實世界資料集，Pathos 負責 AI 分析與靶點發現，BMS 則主導後續藥物開發與臨床試驗。此交易模式代表大型製藥公司正透過策略投資，深度整合 AI 平台與資料資產，以加速新藥研發管線並降低研發失敗風險。Pathos 的崛起亦顯示 AI 藥物研發領域的資本集中趨勢持續強化，投資人願意給予具備獨特資料壁壘的 AI 公司更高估值溢價。此發展對醫療體系在精準醫療與臨床試驗合作模式的評估上具有參考意義。", "tags": ["AI藥物研發", "精準醫療", "融資", "腫瘤學"], "author": "未標示（STAT News｜2026-10-23）", "source_url": "https://www.statnews.com/2026/10/23/pathos-ai-bristol-myers-squibb-tempus-deal/?utm_campaign=rss"}, {"rank": 8, "score": 7.0, "title": "精神健康 AI 需要超越「安慰性對話」的實證支持：創新媒體深度評析", "summary": "Innovation News Network 發表評論指出，目前市場上大量精神健康 AI 聊天機器人與數位療法工具，普遍缺乏嚴格的臨床隨機對照試驗（RCT）支撐，多數產品僅依賴使用者滿意度或短期情緒自評作為有效性依據。文章呼籲監管機構、醫療保險給付單位及醫療提供者在評估採購精神健康 AI 工具時，應要求更高層級的實證標準，包括長期追蹤結果、自殺風險干預效果及對傳統心理治療的補充或替代效益。在全球精神健康資源嚴重不足的背景下，此議題的重要性與日俱增。文章同時提醒，AI 工具若在缺乏足夠實證的情況下被廣泛推廣，可能延誤病患接受有效治療，並引發數據隱私與倫理方面的額外風險。", "tags": ["精神健康AI", "實證醫學", "數位療法", "監管"], "author": "未標示（Innovation News Network｜2026-10-23）", "source_url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxOQ0liSkhsU1FIWGxldUpYQlo1TmFLVFJLT1hkRW5jWlYyOU9DMVRZOGFtUlFMb196aGlrREFwZWo3V0YzR3VVOXY4UkVUdXFCNGJiQXRsWWtrdkZ4VEx0SzB1UGJKNG04WXNaMC1GZkZjaVZFTlpESFJ3RnhLMnN0dk92RklQSlNVTjZidUNGc3ZMT0dTb2hpSnRR?oc=5"}]}, "2026-10-23": {"date_str": "2026年10月23日", "weekday": "星期五", "items": [{"rank": 1, "score": 8.5, "title": "台北榮總與威剛科技發表醫療 AI 消毒機器人，深化智慧病房應用", "summary": "台灣國立台北榮民總醫院（NTUH）與威剛科技（Adata Tech）聯合發表一款搭載醫療 AI 的消毒清潔機器人，為台灣醫療院所推動智慧化環境感控提供新方案。此機器人整合 AI 影像辨識與自動導航技術，能自主執行病房消毒作業，減少人力負荷並降低院內感染風險。此合作案展示醫學中心與科技業者跨域協作的模式，也呼應台灣衛福部近期推動醫療 AI 落地的政策方向。對於醫院感控部門與護理管理層而言，此類 AI 機器人方案在人力短缺背景下具高度參考價值，未來或可延伸至手術室、加護病房等高風險區域。此案也顯示台灣本土醫療 AI 硬體整合能力逐步成熟，有助於建構自主智慧醫療生態系。", "tags": ["智慧醫院", "AI機器人", "感控", "台灣醫療AI"], "author": "未標示（Taipei Times｜2026-10-23）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE14RjNnR01tUWlaODZlWXBJOXRPcG5sMzFhMk5CWmszR1g1N2wxNHhiRHhRRUYxcWZxRXBrUElvcEs5WjBzd2ltTXBaWG0xVWsxODNMMGE4dXlCOVVPMEg1NjRQb1pOYmtnOWZGOFJJODZndWVJUkI3Z3V3"}, {"rank": 2, "score": 8.2, "title": "BioStack 獲 950 萬美元融資，整合全球醫院資料建構醫療 AI 多模態訓練資料集", "summary": "醫療 AI 新創公司 BioStack 宣布完成 950 萬美元（約新台幣 3 億元）種子輪融資，計畫整合全球多家醫院的臨床資料，建立涵蓋影像、病歷文字、基因體等多模態訓練資料集，專供醫療 AI 模型開發使用。此舉直接回應業界長期面臨的 AI 訓練資料品質不足、資料孤島化等核心痛點。BioStack 的策略在於透過與醫院合作取得真實臨床資料授權，而非依賴公開資料集，有助於提升模型在真實場域的泛化能力。對於有意自行開發或評估 AI 工具的醫院資訊部門而言，此類資料基礎設施服務商的崛起，代表醫療 AI 供應鏈中「資料層」正逐步商業化與專業化，值得持續追蹤其資料治理與隱私保護機制。", "tags": ["醫療AI", "訓練資料", "多模態", "新創融資"], "author": "未標示（PR Newswire｜2026-10-23）", "source_url": "https://news.google.com/rss/articles/CBMi6gFBVV95cUxNTzMwU1A5NFRZR2VQQnlYR0pZUF9Iam96bmcyS3dNSTRxeGpVeDJ0Z055cUdfbV9CS29MM3ctOXZjRk5nN0NyM3hESVh5WEFGb1hxbXBRV2hGMDVXOGZIZ1NZOTR1MmpzRGxzX2VaUGJyeWZoU2p0YnpwVUt4NGNZcmVzWVQ3RTRfcktEVExwdExUeDlJTE94NXRXaTN0eF93Y3VoUHdLX1AtNUd1Y1pjMTRSVXBxb1ptc1Q2NnNVVElNZm5NVVZWUXFOVjRUMzBIT054TEJ2YTN5NzBmNE14ZndyRU82dTBCb3c"}, {"rank": 3, "score": 8.0, "title": "波蘭加入全球醫療 AI 網絡，成為歐盟第二個成員國", "summary": "據路透社報導，波蘭即將成為全球醫療 AI 國際網絡的第二個歐盟成員國，顯示歐洲各國政府積極推動跨國醫療 AI 合作的趨勢。此全球醫療 AI 網絡旨在促進成員國之間的 AI 工具評估標準、臨床驗證方法及資料共享框架互通，為各國醫院導入 AI 提供更具公信力的國際參照基準。波蘭的加入亦凸顯中東歐地區對醫療數位轉型的高度重視。對台灣醫院而言，觀察此類國際網絡的運作模式，包括如何在跨國環境下進行 AI 工具的真實場域評估與監管協作，具有重要的政策參考價值。此一發展也呼應近期 WHO 首爾宣言所揭示的全球負責任醫療 AI 應用趨勢。", "tags": ["醫療AI", "國際合作", "政策法規", "歐盟"], "author": "未標示（Reuters｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMiywFBVV95cUxPQm0wN2VGQnFGRURWQVB6dUlMTkxmdGZ5cW1ST0ZYY25hUzMwSkpWbkRndUtqc2hoRlR0bDFuUUhUdEk3bGNMU21hYS1ZUDFsZ0JZRHhfa3V6MVoxakZMRURzTTZrWXRubTRIaEpDNk50ZUc0NDZyWXZGcHowRnIxUFJpRms1SzFwTEdRRmE3UmduQVdVbk1rSnBrZU9PcVQ1WF9oOERmY3JLTzg0ek9Qdlc1cE0ySWNoMGlyTVM4eURJamh1NEdfaXpUNA"}, {"rank": 4, "score": 7.8, "title": "工研院「AI在宅醫療」計畫獲 APEC 基金支持，台灣唯一入選攜手四經濟體深化跨國合作", "summary": "工業技術研究院（工研院）宣布其「AI在宅醫療」計畫獲得 APEC 基金補助，成為本屆唯一獲選的台灣團隊。此計畫將攜手四個 APEC 經濟體，推動 AI 輔助居家醫療服務的跨國場域驗證與產業合作，涵蓋遠距監測、智慧照護及 AI 診斷輔助等應用。台灣在高齡化社會背景下，居家醫療需求日益迫切，此計畫的國際認可不僅有助於提升台灣醫療 AI 的國際能見度，亦可為本土廠商開拓亞太市場創造機會。對醫院領導層而言，AI 在宅醫療的跨國驗證成果將提供重要的落地參考，尤其在資源配置與遠距照護服務設計上具有直接參考意義。", "tags": ["AI在宅醫療", "台灣醫療AI", "APEC", "跨國合作"], "author": "未標示（中華新聞雲｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE1OamM3UW9oZG5UZUwzaklUQkk2a3E2Q2FnTXQweHZNcThyZEZIdjRYcXpkdGctTjVwdjR3U0prVU9jVlRYVlZGT0thSWZoaDZsNkE"}, {"rank": 5, "score": 7.5, "title": "放射科 AI 下一步：以資料協調取代資料碎片化", "summary": "《Diagnostic Imaging》刊出深度分析，探討放射科 AI 發展的下一個關鍵瓶頸——資料協調（data orchestration）。文章指出，目前醫院放射科導入 AI 工具的最大障礙並非演算法能力不足，而是影像資料分散於不同系統、格式不一，導致 AI 模型無法取得完整且高品質的輸入資料。作者呼籲業界應從「各自為政的資料孤島」轉向整合式資料協調平台，涵蓋 PACS、電子病歷及第三方 AI 工具之間的資料流通標準化。對醫院資訊部門與影像科主任而言，此議題直接關係到 AI 工具採購後的實際效能表現，亦是數位轉型路徑規劃中不可忽視的基礎建設挑戰。", "tags": ["放射科AI", "資料治理", "影像AI", "數位轉型"], "author": "未標示（Diagnostic Imaging｜2026-10-23）", "source_url": "https://news.google.com/rss/articles/CBMitwFBVV95cUxNbFBRSkZ6RVN6SlZfbElOczgtRTdXX00xVXl0UXlTTXgxczZiSF90ZUpjZ19jWGhqMld0OVV2Q29sc1M3TXJQd3cwLUZCcUVzdzVROUZ3aFp3RXpPMkRJSkVHZDcxNjhkRW13dndSRHB2NUd6QTFCRnYwaVRsMHZiMEl3V19vVDZMQU9famItaDUwMVRNLUJsano3MEVfNmRHcEVoOHJjZmNWNG5oRTBSUDU0WEhWSVE"}, {"rank": 6, "score": 7.3, "title": "亞洲醫療 AI 未來關鍵在資料治理：Healthcare IT News 深度分析", "summary": "《Healthcare IT News》發表深度分析，指出亞洲各國醫療 AI 的發展潛力雖大，但實現大規模落地的核心前提是「把資料做對」。文章梳理亞太地區在資料標準化、電子病歷互通性及個資法規等面向的現況與挑戰，並指出各國因法規環境與醫療體系結構差異，AI 模型的跨國泛化能力普遍不足。作者建議醫院在導入 AI 前，應優先建立完善的資料治理框架，包括資料品質稽核、標記流程標準化及跨部門資料存取授權機制。此文對正處於 AI 導入規劃階段的台灣醫院資訊部門具有直接參考價值，尤其在跨醫院資料共享與 AI 驗證機制設計上提供了亞太視角的實務洞察。", "tags": ["資料治理", "亞太醫療AI", "電子病歷", "互通性"], "author": "未標示（Healthcare IT News｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxPZ3RrT2pwNi1FVHdBa3RWQ0xSQml5M2tMVHdPWElOWk5QbUdVTElmb2pBRmNsSnA3RHVkMVM5VV9STGRsMFM3MDdudXUxajNyaEFNZjBfSG04RWp3M25DbnJ6a1pyVmpqemM0UTU5Qi1KUmFRd1VzSnowTWZCSFZZenpvZElYMlBfeGZDZUNpWXFzUXhiTGg5dFNlbw"}, {"rank": 7, "score": 7.0, "title": "台灣李建璋呼籲：政府應主導建立跨醫院、跨族群醫療 AI 把關機制", "summary": "台灣急診醫學專家李建璋於《環球生技》發表觀點，指出目前台灣醫療 AI 工具在臨床應用上的精準度仍有不足，主要原因在於訓練資料多來自單一醫院或特定族群，導致模型在不同族群、地區的表現出現落差。他呼籲政府應主動介入，建立跨醫院、跨族群的 AI 驗證與把關機制，確保 AI 工具在多元臨床情境下的安全性與有效性。此觀點與近期國際間對醫療 AI 公平性（AI fairness）議題的關注高度一致，也直接呼應台灣衛福部推動 AI 醫療監管框架的政策需求。對各臨床科主任而言，在評估或採購 AI 輔助工具時，族群代表性與模型外推能力應列為核心評估指標。", "tags": ["醫療AI公平性", "AI監管", "台灣政策", "跨族群驗證"], "author": "未標示（環球生技｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE1pWW5qMDFLbjVabEtfMFllcWc0LUR6MnNyV3U0SXEwTnJQVnVRS2o3R3NaMWxoQkFES0RpZVVKcVl0SU1hNUJCeHVoU2o2c1lOczFfSUh1c291dVRFSE55MEhWZlk1TmExOVVFU1BBZGlPSkdtb3V3"}, {"rank": 8, "score": 6.8, "title": "ESMO 2026：Lunit SCOPE 研究凸顯 AI 病理學在腫瘤免疫治療預測的臨床價值", "summary": "韓國醫療 AI 公司 Lunit 在 ESMO 2026 年度腫瘤學大會發表多項 SCOPE 系列研究成果，展示其 AI 病理分析平台在腫瘤免疫微環境評估與免疫治療療效預測方面的臨床效益。研究顯示，Lunit SCOPE 能從常規 H&E 染色切片中自動辨識腫瘤浸潤淋巴球（TIL）分布，協助臨床醫師預測患者對免疫檢查點抑制劑的反應，為個人化癌症治療決策提供客觀的 AI 輔助依據。此研究結果對腫瘤科、病理科及精準醫療推動團隊具有重要參考意義，代表 AI 數位病理正從研究工具邁向實際臨床整合應用的關鍵階段。", "tags": ["AI病理", "腫瘤學", "免疫治療", "數位病理"], "author": "未標示（Medical Device Network｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxPSjN1b194NHJXaHQxQmJQSnYwX1NBUVB5aHlDUTN1el9jY1d5elI4anhiNnBmNGRwV0tsQXVjY3N5NGhERzRaX2VuYXBKWHJEQUVOT0R5ckt4Y3BUX1htSkNEa1FnV2NEZkNJVEN0Qmp6eXliQ1N4RXdLSVNibE5Yb2tpZkoxNzZKay1oR3gyODJDSjRnTjZVSUhxdE5RRzYxNnl4R1J4VzZDMTg"}]}, "2026-10-22": {"date_str": "2026年10月22日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.0, "title": "AMA 呼籲 FDA 對生成式 AI 建立風險分級監管框架，明確責任歸屬", "summary": "美國醫學會（AMA）正式向 FDA 提交政策立場，要求針對生成式 AI 執行日益關鍵的臨床功能建立風險分級監管機制。AMA 核心訴求在於解決一個根本問題：當 AI 工具進入實際臨床場域後，誰應負責確保其持續安全性？目前監管架構對上市後 AI 工具的問責機制仍不明確，尤其在模型更新、資料漂移或使用情境擴展後，風險評估往往出現空白。AMA 指出，應依據 AI 工具的臨床決策影響程度進行差異化監管，高風險工具須有更嚴格的上市後監控與不良事件通報要求。此立場呼應近期 FDA 對醫療 AI 監管框架的持續討論，也是繼 FDA 官員公開表示須重新評估 AI 工具監管思維後，醫療主流組織的正式回應，對各醫院採購與部署生成式 AI 臨床工具的合規策略具有直接參考意義。", "tags": ["生成式AI監管", "政策法規", "臨床AI安全", "AMA"], "author": "未標示（MedCity News｜2026-10-22）", "source_url": "https://medcitynews.com/2026/10/ama-calls-for-risk-based-genai-oversight-to-protect-patients-and-support-responsible-innovation/"}, {"rank": 2, "score": 8.5, "title": "WHO 與韓國政府共同採納醫療 AI《首爾宣言》，推動全球負責任 AI 應用", "summary": "世界衛生組織（WHO）與韓國政府聯合發布醫療 AI《首爾宣言》，正式確立全球醫療 AI 應負責任、公平使用的國際框架。WHO 總幹事譚德塞表示，AI 監管與應用必須如刀之兩面並行推進，片面強調技術應用而忽視治理將帶來系統性風險。《首爾宣言》涵蓋醫療 AI 資料治理、演算法透明度、跨國互通性及弱勢族群保護等核心議題，並要求各國政府與產業界共同承諾，確保 AI 工具在低收入及中收入國家同樣可及。此宣言為繼 G7 廣島 AI 進程後，首個專門針對醫療領域的多邊 AI 治理宣言，將對各國衛生主管機關的 AI 政策制定產生實質影響，亦為台灣衛生福利部推動醫療 AI 三大布局提供了重要的國際政策參照座標。", "tags": ["全球AI治理", "WHO政策", "醫療AI宣言", "國際法規"], "author": "未標示（BigGo 財經｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE9jVTg1T3J2TElyQm95M1VKUW1ndWpkZzN1dFNLMkFQWEhKeXljRXQyMUJCOG9tcW90UVZ1cTh4UnMxTmYwQ3BYdll2Q3ByYU9QTGhvQTZrZFJhcUVFVzdJT0pOZFJRMG8xb2J4SlVIR2JmQnBhbGlPd05n"}, {"rank": 3, "score": 8.0, "title": "SickKids 與 Microsoft 簽署五年 AI 夥伴協議，加速兒科精準醫療落地", "summary": "加拿大多倫多病童醫院（SickKids）與 Microsoft Canada 宣布簽署為期五年的策略夥伴關係，共同推進 AI 驅動的兒科精準醫療。合作範疇涵蓋臨床決策支援、基因組資料分析、醫療影像 AI 判讀及院內工作流程自動化，並將整合 Microsoft Azure 雲端平台與 Copilot 系列工具。此合作的核心目標是縮短罕見病兒童的確診歷程，並透過 AI 協助個人化治療計畫制定。SickKids 為北美頂尖兒童研究型醫院，此次合作模式被視為大型學術醫院與科技巨頭深度整合的標誌性案例。值得注意的是，此協議明確設定五年期限與具體應用場景，相較過去雙方常見的概念性備忘錄，具有更高的落地約束力，對有意推動類似院企合作的醫療機構提供了可參考的合約架構與範疇設定。", "tags": ["兒科AI", "院企合作", "Microsoft", "精準醫療"], "author": "未標示（www.hospitalnews.com｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxQaGM1VEV2WGJRQzRsVURQUllUcXg4ZGJ4Vzg4d2tRR2RkeUlUS2cyZWctbnNwZGIzMHd0cnlydDF5ellYbW5LVWNWYzlzWWxZNFI3S2VrczFwQzJLMkQ1VnlRb0dQYzRmY3JNM3NuXy12TkdsSVA1dHNOY2l0N3VWX3c0WE1DRlM4azBpeUNEXzR1aHBiNXVPdjd2MUV2cHhVZklOck5CSnBocjNjWEtQQXhVYWxKZE9rSXh4OQ"}, {"rank": 4, "score": 7.5, "title": "NVIDIA 攜手華盛頓大學與西門子醫療，推出開放蛋白質設計模型並擴展醫療 AI 生態", "summary": "NVIDIA 在醫療 AI 領域宣布多項重大夥伴關係：與華盛頓大學合作推出開放原始碼蛋白質設計 AI 模型，目標加速藥物探索流程；同時與西門子醫療（Siemens Healthineers）合作開發放射治療規劃 AI 工具。蛋白質設計模型採開放授權，學術機構與生技公司均可免費取用，預期將顯著降低 AI 輔助新藥研發的門檻。西門子醫療合作方面，NVIDIA 的 GPU 加速運算將用於優化放射治療的劑量計算與靶區勾畫精度，有望縮短放療計畫制定時間並提升個人化治療品質。此次 NVIDIA 策略性擴張涵蓋基礎研究與臨床應用兩個層次，顯示科技平台廠商正從單純提供算力轉向深度整合醫療垂直場景，對醫院評估 AI 基礎設施採購策略具有重要參考價值。", "tags": ["NVIDIA", "蛋白質設計", "放射治療AI", "藥物探索"], "author": "未標示（Yahoo新聞｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMiqARBVV95cUxOYmkyUks1cFVzUk84ZWN2Y1I3NExwZG1nNGp0S3hoajR1N09faTNCYkV4WGlsOWs2MU44UlEwWlZhbklKUkcyNU9fNURqeTRRVGtsTnJ6Q1ZCVWFTVXdibDZZM29pbDVsdU96eGFOOVczRlg3UDVQOWFWMDVLX2dWZ3d1NWVGQVJLZVpYZFVPYnpmZEhUWXZjemZLYjVxYzJDQUhzMWNvbnBMbnBuTkE3bVJ3U3V6R1J5YlFSX1ZvdF82c2pjM2oxcFFVdEtPM1V5TWRneUhXRU1sakZlU01mMnUyUWdRSWRSZ3JGbFNrcHRBbWMydllXOFNreFZIQ0toanQtYU51SDVuWExGbEJ2M3NtaHdXR1R0X2tQMEtWSXd2c3ZCYXVNVVFVVnE1VzJaeGxfSDFSWnhlTEpoVU1xaVBxN2xtTHhnNTlQbEVJaHZtRVRxbTUzdUVpaXJLbmU5UElBVFktRTdvRHk0VWhPRU5ZNkNRQzh3eU13VmFHWnhFcW didWQ1dml6OUI2ZF9UbDNTZ0VJQllJb2tYOWpKNlAtU3d5dkRSUXFHcW5aYkhVQzk0ZUxMZERpSWYwU2hnbnJCQjFUNEVhRkU2ZnlYZ0NUcGY5eUo4d0tmcTVQRVdnQ3Bn"}, {"rank": 7, "score": 7.0, "title": "醫療 AI 雄心壯志撞上資料高牆：資料品質與互通性成最大瓶頸", "summary": "BioSpectrum Asia 分析指出，儘管醫療 AI 投資熱度持續攀升，業界正面臨一道難以迴避的「資料高牆」：電子病歷格式分歧、跨機構資料共享法規障礙、資料標註品質參差不齊，以及影像資料缺乏標準化標註等問題，導致 AI 模型訓練品質受限，泛化能力不足。報告特別點出，即便技術架構已趨成熟，許多醫療 AI 專案在進入真實場域後仍因資料可用性不足而功虧一簣。這一現象在亞太地區尤為顯著，各國健保資料庫的開放程度與隱私法規差異，形成 AI 跨境應用的重大障礙。對醫院資訊部門而言，此分析強調資料治理基礎建設的優先投資，應先於 AI 模型本身的採購與部署，否則即便引入先進工具，也難以發揮預期效能。", "tags": ["資料治理", "醫療AI瓶頸", "互通性", "亞太醫療AI"], "author": "未標示（BioSpectrum Asia｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxNYlZrOWRKSEpNZHlqQk9YbGR2cVcwWnVfVDVNbWtvTmJVZWZhM3c1RFNZaW4tOWhKOXZ1VkJ5RzVmOGc4VnFyYXYyNERUQU0yODloT2hHYVNwOFNDaG80OTJVcE5YdEx6M0ZrMG1rbDVoYmNjd2RtdDgtaUdLdmdQNjQ0aE8xU3lIUF9mZ3RuZ1p0N1BXSVF4ekpTTjYyRFlnTHc2RE50bDBTUQ"}, {"rank": 8, "score": 6.5, "title": "李綜合醫院導入 AI 語音技術，解鎖門診紀錄痛點", "summary": "台灣李綜合醫院宣布導入 AI 語音輔助系統，針對門診醫師在病歷記錄上耗費大量時間的痛點提供解決方案。AI 語音技術可即時將醫師與病人的對話轉換為結構化病歷草稿，大幅減少醫師於看診後的文書作業時間，讓醫師得以將更多精力投注於臨床溝通與診療判斷。此導入案例顯示，AI 語音記錄工具正從大型醫學中心逐漸擴散至區域型醫院，門檻持續降低。李綜合醫院表示，初步試用反饋顯示醫師滿意度明顯提升，並計畫進一步整合至電子病歷系統。此案例為台灣區域醫院推動 AI 輔助門診的具體實例，提供了從需求確認、試行到整合的實務參考，對有意評估類似語音 AI 解決方案的醫院具有借鑑意義。", "tags": ["AI語音記錄", "台灣醫院", "門診數位化", "電子病歷"], "author": "未標示（工商時報｜2026-10-22）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9pWlYxbVhnVWc2djBOOF9qX3RvOTF2d2REdmJjY2FnSWxRM0VXTjZLUFFPc3BXM2lVZUM2TDZBTGNQTVlYLUVoUi1TVGpCM1RTV1Jib1AtSEZUUmo1WFc4"}, {"rank": 9, "score": 6.5, "title": "Nature 深度評析：AI 個人化健康建議工具的前景與測試挑戰", "summary": "《Nature》刊登深度評析文章，探討 AI 工具提供個人化健康建議的應用前景與測試方法論挑戰。文章指出，隨著大型語言模型在醫療諮詢場景的應用日趨普及，如何系統性地驗證這類工具的建議品質、安全邊界與個人化適用性，成為亟待解決的核心問題。目前多數評估方法仍停留在靜態基準測試，難以捕捉動態對話中的潛在風險，例如對高風險族群提供不適切建議或忽略藥物交互作用等情境。文章呼籲建立動態、情境化的 AI 健康建議評估標準，並主張監管機構、臨床專家與技術開發者應共同參與測試框架設計。此評析對正在評估或已部署患者自助 AI 諮詢工具的醫院，提供了來自頂尖學術期刊的方法論警示與改進方向。", "tags": ["個人化健康AI", "AI評估方法", "Nature", "患者安全"], "author": "未標示（Nature｜2026-10-21）", "source_url": "https://www.nature.com/articles/d41586-026-03065-4"}]}, "2026-10-21": {"date_str": "2026年10月21日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.2, "title": "FDA 官員：生成式 AI 醫療工具應比照醫師進行評估，監管思維須全面翻新", "summary": "FDA 數位健康卓越中心主任 Rick Abramson（放射科醫師出身）在公開場合表示，生成式 AI 工具的行為模式已愈來愈接近醫師的臨床判斷，而非傳統醫療器材（如心臟瓣膜或去顫器）。他認為現行以「器材」為框架的審查制度難以完整評估此類工具的風險與效益，FDA 正研擬將 GenAI 工具比照「醫師」模式來評估其能力、侷限與錯誤率。此觀點對醫療 AI 產業具深遠影響：若 GenAI 工具須通過類似執業能力的審查標準，將大幅提高上市門檻，同時也意味著臨床部署的合規義務將更加嚴格。對醫院引進 AI 輔助決策工具的採購與風險管理流程而言，此監管思維轉變值得高度關注。", "tags": ["FDA監管", "生成式AI", "醫療器材法規", "臨床AI評估"], "author": "未標示（MedCity News｜2026-10-21）", "source_url": "https://medcitynews.com/2026/10/fda-official-believes-genai-enabled-tools-will-need-to-be-assessed-like-a-physician/"}, {"rank": 2, "score": 8.8, "title": "OpenAI 專家預言：AI 有望將醫療指引更新週期從 17 年壓縮至數小時", "summary": "OpenAI 相關專家公開預言，目前醫療臨床指引從新證據產出到正式更新平均需耗時 17 年，是造成「知識落差」的重大問題。藉由 AI 自動化文獻回顧、證據分級與指引草稿生成，這一週期有望大幅壓縮至數小時。這不僅對臨床決策支援系統（CDSS）的即時性具有革命性意涵，也對醫學教育、繼續教育及醫院品質管理流程帶來衝擊。若 AI 能實現指引的近即時更新，各科主任及品管委員會的知識維護責任與流程將面臨重塑。目前此技術仍處於概念與早期驗證階段，量產部署尚需克服資料品質、語言本地化及法規審查等挑戰，但其所描繪的未來圖景已引發醫療界廣泛討論。", "tags": ["臨床指引", "AI文獻回顧", "知識更新", "OpenAI"], "author": "未標示（商傳媒 SUN MEDIA｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiwwJBVV95cUxOc2pRQ1FIUWxCWVNQRzhzWlQzNVY2emIyYkdTYl9BUjlpR3Vod2dRdDhjdVVaQzZJYzdTdHNsSXhvMEk3V3k3VXdNYlVwR1haOFRiUk12TE1LOGMzSEI1TDBTeXdNV3BNMEdHNFhRN0dwVHowMVNZMkY4ZUxtTkdjSWpuTmJZQTI3YlZQbXVkVmVycHdqNWRkT1ZQTmUzSWNQVHh4UXpzTXVROWRoR1AtUS1FeXdpSFJFTndONWh4dmlZcC12dnlCZ25LQUQyWGR0dURwNTRsbkxsZmdZeEpYbEVoXzYyS2ktR2VzaGdlcUdtTHFCZUV3VHVGNE53ZXlMZGh5OEJUNFVtUS0walZVM1Z3TlRMc3dZN2YxS2FHbzJOWUhEQnJ1bktRclp2OUVnbHFpTWxyMFlxME1YbGdwTTY5TQ?oc=5"}, {"rank": 3, "score": 8.5, "title": "Doximity 將 UpToDate 整合進 AI 臨床支援工具，醫師查詢品質大幅提升", "summary": "Doximity 宣布將全球最廣泛使用的臨床決策資源 UpToDate 整合至其 AI 臨床支援工具中，使醫師在同一介面即可獲得 AI 生成回應並佐以 UpToDate 的循證醫學內容。此整合旨在解決純 AI 語言模型在臨床場景中可能產生的幻覺或證據品質不足問題，透過權威醫學資料庫的背書提升回應可信度。對醫院資訊部門而言，此模式代表「AI + 結構化知識庫」的混合架構正逐漸成為臨床輔助工具的新標準，既可提升使用者信任，也有助於符合醫療法規要求。Doximity 平台在美國擁有龐大醫師用戶群，此整合若推廣至台灣或亞太市場，將對本地電子病歷及臨床決策支援系統的整合策略提供重要參考。", "tags": ["臨床決策支援", "Doximity", "UpToDate", "AI整合"], "author": "未標示（MobiHealthNews｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxNZ1NSdi1ka2trb2gxeWVRMUJLZ3JUN3pzQlNhSmdZam1kRE1sT0tMWmkwY29yOEo0QVdzSS1XaHdfVTZVX0ozM0tDUmpvbUVhVURpNk5WOHV1b0NoeWVzVXNOczlNSWxIU2ZZaGp6M3J6bExQZVg5R2NnNDlCMmxqZ0ZLbWdXLXdqdFFMVFNDYmViVWM?oc=5"}, {"rank": 4, "score": 8.2, "title": "AI 分析照片預測癌症存活率：最新「看相」技術震撼醫界", "summary": "最新研究顯示，AI 技術已能透過分析患者照片（包括臉部影像特徵）預測癌症存活率，此一「視覺生物標記」方法在部分癌症類型中展現出與傳統臨床指標相當甚至更優的預測能力。研究人員認為，患者外觀特徵反映了年齡、營養狀態、免疫功能等多重生理資訊，AI 能從中擷取人類醫師難以量化的細微訊號。此技術若成熟應用，將為癌症分期、治療規劃及臨床試驗入組提供低成本、非侵入性的輔助評估工具。然而，其潛在的演算法偏見（如膚色、族裔差異）及隱私倫理問題，仍是臨床導入前須審慎評估的重要課題。目前研究成果尚待更大規模多中心驗證。", "tags": ["癌症預後", "視覺AI", "生物標記", "臨床AI應用"], "author": "未標示（鉅亨網｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE5vV2VZMDg4LVM2MGkwTHM2cGwtMl9GSVZ6UktoUVpiWTY2SXRlVGNYZE9EbHFxVVhXTmxMQlN4c0RYQUtLMTBWU1JMd2lPOFE?oc=5"}, {"rank": 5, "score": 7.8, "title": "醫療 AI 出版治理破碎化：系統性回顧揭示全球法規與發表標準嚴重分歧", "summary": "一項最新系統性回顧研究發現，全球醫療 AI 相關研究的出版治理框架高度分散，各國學術期刊、監管機構對 AI 演算法透明度、資料集揭露、臨床驗證標準等要求差異甚大，導致研究成果難以比較、複製及跨機構應用。研究指出，缺乏統一的報告標準（如演算法架構、訓練資料偏見評估、外部驗證方法）是當前醫療 AI 研究最大隱患之一，可能造成臨床決策者對 AI 工具能力的高估或誤解。報告呼籲國際學術組織、監管機構及期刊編輯委員會共同建立強制性的醫療 AI 研究發表規範，以確保 AI 工具進入臨床前有充分、可信的證據基礎。此議題對台灣醫療 AI 研究發表及審查制度具有直接的政策參考意義。", "tags": ["AI治理", "研究規範", "出版標準", "法規"], "author": "未標示（Bioengineer.org｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxQakdaWXJBNm5jTVFITXpfTVlMU1J2azZuWU53NVNMQjZVRU5EOFZmYm1pdm5ZRnRJT0NQdVloM1JjbkZZMVpKNHNqV09JUG5nOEVsejhIVlRuSTVncWhmeGlEdGFmbTBHcWRpQzhNTllEb2lVa1k4WWVYMDl5WjNidVdSalZkYTF6RTd1Z1ZETV9YR01KNnRwRmlZVDV4aE43YVo5bWJldw?oc=5"}, {"rank": 6, "score": 7.5, "title": "愛荷華醫院以 AI 技術擴大大腸癌篩檢覆蓋率，AHA 報導實地應用成效", "summary": "美國愛荷華州一家醫院透過部署 AI 輔助大腸鏡篩檢技術，成功擴大癌症早期偵測的覆蓋範圍，美國醫院協會（AHA）對此案例進行專題報導。該院導入 AI 影像分析系統後，大腸腺瘤及早期癌症的偵測率顯著提升，同時協助解決放射科與內視鏡醫師人力不足的問題，使偏遠或醫療資源較少的社區患者也能獲得高品質篩檢服務。此案例展示了 AI 在預防醫學與公衛篩 // ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
