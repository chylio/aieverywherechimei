<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年08月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

const ALL_DAYS   = {"2026-08-15": {"date_str": "2026年08月15日", "weekday": "星期六", "items": [{"rank": 1, "score": 7.5, "title": "醫療體系大量採購 AI 卻無人才支撐：醫療 AI 勞動力缺口危機浮現", "summary": "MedCity News 報導指出，醫療機構持續加碼投資 AI 技術，但同步建立能夠實際操作、維運與優化這些系統的專業人才管道的腳步卻嚴重落後。文章指出，多數進入職場的年輕專業人員對醫療互通性、數位健康基礎架構或醫療資料架構等領域幾乎毫無認識，也未將其視為職涯選項。這一結構性落差意味著醫院花費大量資源導入 AI 工具後，往往缺乏足夠人力進行日常管理、異常監控與持續改善。文章呼籲學術機構、醫院與政策制定者共同規劃系統性的醫療 AI 人才培育路徑，將資料架構、AI 治理與醫療資訊整合等能力納入正規教育與在職訓練課程，而非僅依賴少數跨域專才支撐整體數位轉型需求。此議題對正積極推動 AI 應用的醫療體系具高度警示意義，人才缺口若不及早補足，將成為 AI 落地成效的最大瓶頸。", "tags": ["醫療AI人才", "數位轉型", "勞動力缺口", "醫療資訊"], "author": "未標示（MedCity News｜2026-08-14）", "source_url": "https://medcitynews.com/2026/08/healthcare-keeps-buying-ai-but-nobodys-building-the-workforce-to-run-it/"}, {"rank": 2, "score": 6.5, "title": "Cotiviti 推出 AI 驅動給付協調解決方案，搶先理賠前揪出保險覆蓋缺口", "summary": "醫療資料分析公司 Cotiviti 宣布推出以 AI 驅動的「給付協調（Coordination of Benefits）」解決方案，透過整合保險投保資料，在理賠提交前即自動識別並解決保險覆蓋衝突或重複給付問題。此舉旨在減少因主次保險資訊不一致而導致的理賠拒付、延遲付款與行政人力耗損。傳統上，給付協調錯誤往往在理賠送出後才被發現，需要大量人工追蹤與補件，不僅增加醫院行政負擔，也影響現金流。Cotiviti 的 AI 工具將此流程前移至事前預防，可望大幅提升醫院收益循環效率。對於同時服務多元保險族群的大型醫療體系而言，此類主動式 AI 解決方案具備顯著的行政減負與財務改善潛力，值得資訊與財務部門關注其實際落地成效與整合可行性。", "tags": ["醫療AI", "收益循環管理", "給付協調", "保險理賠"], "author": "未標示（MedCity News｜2026-08-14）", "source_url": "https://medcitynews.com/2026/08/cotiviti-launches-ai-solution-to-address-coordination-of-benefits-issues/"}, {"rank": 3, "score": 6.0, "title": "Anthropic 推出 AI 內容浮水印機制，學術與研究誠信面臨新一輪討論", "summary": "Nature 刊出簡報討論 Anthropic 最新發布的 AI 生成內容浮水印技術，探討此機制對研究誠信的潛在影響。Anthropic 表示，該浮水印旨在協助辨識由 AI 產生的文字內容，提高內容來源透明度。Nature 編輯與研究人員針對此舉是否能真正有效標記 AI 內容、是否容易被規避，以及對學術發表與同儕審查流程的影響展開討論。在醫療領域，AI 生成的臨床文件、研究摘要與病歷內容日益增加，如何確保 AI 輔助撰寫內容的透明揭露已成為醫學期刊與醫院治理的重要課題。此技術若能廣泛應用，有助於建立醫療 AI 內容的可追溯性與問責機制，但其技術可靠性與實際偵測率仍有待獨立驗證，醫療體系資訊治理團隊應持續追蹤相關發展。", "tags": ["AI內容辨識", "研究誠信", "AI治理", "Anthropic"], "author": "未標示（Nature｜2026-08-14）", "source_url": "https://www.nature.com/articles/d41586-026-02562-w"}, {"rank": 4, "score": 5.5, "title": "AI 應用於行星健康科學：突破複雜系統分析的不可能任務", "summary": "《刺胳針》刊出讀者投書，探討 AI 技術在行星健康（Planetary Health）領域的應用潛力。投書指出，行星健康系統涵蓋人類社群、野生物種、自然生態系統與多元社會因素，其複雜程度遠超傳統分析工具所能處理的範疇。在 AI 技術介入前，全面追蹤與模擬人類集體環境足跡對星球邊界的衝擊幾乎是不可能的任務。投書呼籲將 AI 整合進跨學科的環境健康研究，以加速解碼生態與公共衛生之間的複雜交互作用。雖然此議題目前較偏向學術與政策討論，但對於關注氣候變遷對疾病流行、公共衛生基礎建設影響的醫療領導層而言，此類 AI 應用前景提供了一個理解 AI 超越臨床場域、跨足整體健康治理的重要視角。", "tags": ["行星健康", "AI應用", "公共衛生", "生態健康"], "author": "未標示（The Lancet｜2026-08-15）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01368-1/fulltext?rss=yes"}, {"rank": 5, "score": 5.0, "title": "Epic 系統遭聯邦與州調查人員審查涉嫌反競爭行為，醫療 IT 市場秩序受矚目", "summary": "STAT News 報導，美國聯邦貿易委員會（FTC）調查人員已接觸相關人士，對 Epic Systems 的商業行為展開廣泛調查，部分州級調查人員也同步介入。Epic 是美國最主要的電子病歷（EHR）系統供應商，其市佔率與系統整合能力在醫療資訊市場具主導地位。此次調查聚焦於 Epic 是否藉由合約條款（包括保密協議等）限制競爭，影響其他醫療 AI 與數位健康公司進入市場的機會。此案對整體醫療 AI 生態系具有重要意涵：若 Epic 被認定存在反競爭行為，可能促使監管機構要求其開放更多 API 介面與資料互通，進而影響醫院在選擇 AI 解決方案時的自主性與市場選擇空間。醫療體系資訊長與採購決策者應密切追蹤此案後續發展。", "tags": ["Epic", "電子病歷", "反競爭調查", "醫療IT市場"], "author": "未標示（STAT News｜2026-08-15）", "source_url": "https://www.statnews.com/2026/08/14/epic-systems-ftc-review-nda-use-possible-anticompetitive-practices/?utm_campaign=rss"}]}, "2026-08-14": {"date_str": "2026年08月14日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "Medicare AI 醫材給付新規深度解析：激勵過度使用疑慮浮現，醫院與科技業的利益拉鋸", "summary": "STAT News 深度報導 Medicare 針對新授權 AI 醫療器材所推行的給付激勵機制（NTAP），分析其對醫院採購決策與科技公司商業模式的雙重影響。研究人員指出，當醫院使用特定 AI 裝置即可獲得額外給付時，可能促使臨床端在尚未充分評估臨床效益的情況下優先採用新技術，進而引發過度使用疑慮。報導同時點出，此機制雖有助於加速 AI 醫材進入醫療實務、縮短「給付煉獄」困境，但如何在鼓勵創新與防範不當誘因之間取得平衡，仍是政策設計的核心挑戰。對於正在評估引進 AI 醫材的醫院領導層而言，理解給付結構背後的誘因邏輯，有助於制定更審慎的採購與臨床導入標準，避免因給付誘因而扭曲臨床判斷。", "tags": ["醫療AI給付政策", "Medicare", "AI醫材監管", "產業影響"], "author": "未標示（STAT News｜2026-08-13）", "source_url": "https://www.statnews.com/2026/08/13/how-medicare-cms-pays-ntap-for-new-ai-medical-devices/"}, {"rank": 2, "score": 8.5, "title": "美國放射科學會對 AI 採保守立場：審慎把關認證標準，避免技術超前治理", "summary": "美國放射科學會（American Board of Radiology，ABR）明確表態對放射科 AI 工具採取審慎保守的監管與認證態度，強調在 AI 應用快速擴張的背景下，應優先確保放射科醫師具備評估與監督 AI 系統的能力，而非一味跟進技術浪潮。ABR 指出，目前市面上眾多 AI 影像分析工具的臨床 ": ["環境感知AI", "醫病溝通", "照護轉銜", "新創醫療"], "author": "未標示（MedCity News｜2026-08-13）", "source_url": "https://medcitynews.com/2026/08/suvi-health-patient-handoff/"}, {"rank": 5, "score": 7.5, "title": "Nature 提出 AI 代理人治理四維框架，為醫療 AI 自主化風險管控提供學術基礎", "summary": "頂尖學術期刊 Nature 刊載一篇 AI 治理框架論文，提出以「自主性、效能、目標複雜度、通用性」四個維度評估 AI 代理人（AI agent）特性，並據此建構「代理人畫像（agentic profile）」作為不同情境下 AI 系統有效治理的依據。此框架適用範圍廣泛，在醫療領域尤具意義：隨著代理型 AI 逐步滲入臨床決策支援、自動化病歷摘要與行政流程，醫院治理委員會亟需系統性方法評估各類 AI 工具的風險層級與監管需求。本框架為醫院 AI 委員會制定分級監管政策、建立 AI 上線審查標準提供了可操作的學術參照，值得資訊部與臨床倫理委員會共同研究。", "tags": ["AI治理", "代理型AI", "醫療倫理", "風險管控"], "author": "未標示（Nature｜2026-08-12）", "source_url": "https://www.nature.com/articles/s41586-026-10805-z"}, {"rank": 6, "score": 7.0, "title": "放射科醫師實測：乳房影像 AI 實際臨床效益有限，與預期落差顯著", "summary": "Radiology Business 報導一項針對放射科醫師的調查研究，結果顯示在實際臨床環境中，多數放射科醫師認為目前乳房影像 AI 工具所帶來的「具意義性效益」相當有限，與廠商宣稱的診斷提升效果存在明顯落差。醫師反映，部分工具的假陽性率偏高、系統整合不順暢、以及缺乏針對本地族群的驗證資料，是主要痛點。此調查提醒醫院在評估採購乳房影像 AI 時，應要求廠商提供真實世界（real-world）臨床驗證數據，並優先考量與在地病患族群特性相符的解決方案，避免過度依賴行銷數據而忽略實際應用成效的落差。", "tags": ["乳房影像AI", "放射科", "臨床評估", "真實世界數據"], "author": "未標示（Radiology Business｜2026-08-12）", "source_url": "https://news.google.com/rss/articles/CBMizgFBVV95cUxOeXNhV2g0clo2WG9JMFA5N0FIOGJkX1hROWhTNmt6REVnNU5faWU4Nk1CWmhxMDhsOThsTnM3MnlLb2JVajBvcFFZbDBHUmo4YlFncVJURENLVzcyeGI2OG5ualR6YmFQZXQ3cmVQbnh3LUJ0UjhncWV4ZzJ1Q29OQjB0U3hBODd5VlBlN2hldUk2elQ5dkxMcU1pSlF6V3k4SlRXTUgwUWtONTFZN3VpNHdpX2NkOUFtVHNiWWoyNVJ6UzdMUnVuLWJDYjdyQQ"}, {"rank": 7, "score": 7.0, "title": "新竹台大分院 AI 減工成效顯著，護理留任率逾 95%，健康台灣計畫首階段成果出爐", "summary": "新竹台大分院公布「健康台灣深耕計畫」第一階段執行成果，其中導入 AI 工具協助護理人員減少行政作業負擔為重要亮點。透過 AI 自動化處理護理記錄、排班輔助及常規文書工作，護理人員得以將更多時間投入直接照護，院方統計護理人員留任率已突破 95%，達到近年新高。此成果在台灣護理人力短缺的背景下格外具參考意義，顯示 AI 工具若能精準切入護理流程痛點，不僅可提升工作效率，更可能成為改善護理人員留任的重要槓桿。此案例為各醫療機構在 AI 策略規劃中納入「護理人力穩定」指標提供了具體數據支撐。", "tags": ["台灣醫療AI", "護理人力", "AI減工", "智慧醫院"], "author": "未標示（UDN｜2026-08-12）", "source_url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1ZLVhsQkVIUEJaa0hLamJjakh0TWlaWDNHczM1am84LWJLaHp1N2JBWllERXVzVzRIUTVyaDJpdnFQWFdyRjVLeVk0dGVndy11eDVOSEhB0gFWQVVfeXFMTVktWGxCRUhQQlprSEtqYmNqSHRNaVpYM0dzMzVqbzgtYktoenU3YkFaWURFdXNXNEhRNXJoMml2cVBYV3JGNUt5WTR0ZWd3LXV4NU5ISEE"}, {"rank": 8, "score": 6.5, "title": "醫療 AI 通過測試卻仍可能傷害病患：評測框架與真實世界落差的深度警示", "summary": "Eurasiareviw 刊載深度評論，指出當前醫療 AI 評測體系存在根本性盲點：許多工具在標準化測試數據集上表現優異，卻在真實臨床環境中因資料分布偏移、病患族群差異、臨床情境複雜性等因素導致效能大幅下降，甚至對特定族群（如少數族裔、老年患者）造成系統性偏差傷害。文章主張現行 FDA 等監管機構的核准標準過度依賴靜態數據集表現，未能充分要求廠商提交上市後持續監測（post-market surveillance）的真實世界數據。此評論對醫院採購委員會具警示意義，提醒在評估 AI 工具時應設立上線後定期稽核機制，而非僅依賴採購前的廠商驗證報告。", "tags": ["醫療AI安全", "演算法偏差", "AI評測", "病患安全"], "author": "未標示（eurasiareview.com｜2026-08-13）", "source_url": "https://news.google.com/rss/articles/CBMingFBVV95cUxOLUpwaEhXRjNjdUdkal9nWGR2bm5aR2laRzA5VGlLMXZDMENoUjRXVXd1MUdqcDdrTkdESjRSUVNnaHp4MEV5elg3Z09JN3g1cE9JVmNRVzdCUlpmcE1RZURUZld0T1BUSzVTQnhJLXFCRmdKcDZEaGozMmlraGxocTBhbjFTZjV3WlRtdTVFVUlMbDFxVG1TanRMcmQtUQ"}]}, "2026-08-12": {"date_str": "2026年08月12日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.2, "title": "Google AMIE 醫療 AI 完成首項即時臨床視訊問診研究，展現診療對話新里程", "summary": "Google 旗下研究級醫療 AI 系統 AMIE（Articulate Medical Intelligence Explorer）發布首項即時臨床視訊問診能力研究成果。此項研究為全球首創，AMIE 能在視訊諮詢情境中與模擬病患進行即時對話，執行問診、鑑別診斷與臨床溝通等任務，性能表現在多項指標上達到或超越受測醫師水準。這項突破標誌著醫療 AI 從文字問答跨越至多模態即時互動的新階段，對遠距醫療、初級照護可近性及 AI 輔助問診系統的設計具有深遠意義。研究結果發布於 Google 官方部落格，預期將引發學術界與醫療業界對 AI 臨床角色邊界與倫理規範的廣泛討論，同時也為各醫療機構評估導入對話式 AI 問診系統提供重要實證參考基礎。", "tags": ["臨床AI", "遠距醫療", "大型語言模型", "Google"], "author": "未標示（blog.google｜2026-08-12）", "source_url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxNaWVfcTVPRW1DclVwZ2hjNXFQYVVrRUpHVjk5MVphcGY3VHRHQmtla285dDg5MmlFVTJHcFZXUjAzbUVKNmtjY1RycE5FUk9nYnhwV3RTZzRTbmg0VUJMSFJVd1d0bENsd2JPOEZ3dTJoZ1hNWnIyWWhGVHphLXM2ZGJBZC0tTnVFak5oR0V4SGFLLV90RWFPMFgzSU92LWtK?oc=5"}, {"rank": 2, "score": 8.8, "title": "Leica Biosystems 獲 FDA 多項數位病理掃描儀與業界首創 AI 輔助品管軟體認證", "summary": "Leica Biosystems 宣布獲得 FDA 多項數位病理掃描儀認證，並取得業界首創的 AI 輔助品質控制（QC）軟體清除許可。此 AI-QC 系統能自動偵測數位病理切片影像中的品質缺陷，包括對焦模糊、染色不均及組織折疊等問題，大幅縮短人工審核時間並降低判讀誤差。這項認證對病理科數位化轉型具有標誌性 function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],

  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
