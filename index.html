<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年09月18日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

險（Medicare）推行的 AI 事前授權（Prior Authorization）試點計畫，因倉促上路導致多項執行缺失，新取得的內部文件顯示，部分患者因此遭遇照護延誤。該試點採用 AI 工具審核醫療服務申請，旨在加速核准流程並降低行政負擔，但文件揭示系統設計不完善、人員培訓不足及監管機制欠缺等問題。此案例凸顯醫療 AI 快速部署時的治理風險，尤其在涉及給付決策的高風險場景中，充分的臨床驗證與監理框架不可或缺。對於同樣評估導入 AI 輔助行政審核的醫院體系而言，此案例提供了重要的前車之鑑，提示在政策驅動下快速部署 AI 可能引發的患者安全隱憂，以及建立完善人機協作機制的必要性。", "tags": ["AI事前授權", "醫療政策", "患者安全", "醫療AI治理"], "author": "未標示（STAT News｜2026-09-15）", "source_url": "https://www.statnews.com/2026/09/15/medicare-wiser-ai-prior-authorization-pilot-rushed-launch-delayed-care/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "真實世界研究：AI 輔助放射師偵測更多腦動脈瘤", "summary": "一項真實世界臨床研究顯示，AI 輔助工具可顯著提升放射師對腦動脈瘤的偵測率，降低漏診風險。研究在實際臨床環境中評估 AI 輔助閱片系統的表現，而非僅限於受控實驗室條件，結果發現放射師在 AI 協助下識別出更多傳統影像判讀中可能被忽略的動脈瘤病灶。腦動脈瘤若未及時診斷，破裂後將引發致命性蜘蛛膜下腔出血，早期偵測對預後至關重要。此研究為 AI 影像輔助診斷在神經放射科的臨床效益提供了真實世界證據，對正在評估或已部署放射 AI 工具的醫院體系而言，具有重要的臨床實踐參考價值，亦再次驗證 AI 作為放射師「第二雙眼睛」的輔助角色。", "tags": ["放射AI", "腦動脈瘤", "影像診斷", "真實世界研究"], "author": "未標示（Imaging Technology News｜2026-09-16）", "source_url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxNcENsNzZtNGtJYlV1Tm84LWRUUTIyNHpXOGktTkdiS1pYT2RGSDlQZ1NVTWVoRmhBRHFkMW5fWW1GcFc5dUdQblZMNlVYUXhIcmJBa2tqRVlkdTVmcEtFckE3NkF3NTR0NXYwUHQxUDhLSXQ0WGN4VXp1bGl0NmtueHRTVURMMnloUXNkT21LdUY1dVJNSWtKUmh3dzN3bkxkdnc"}, {"rank": 3, "score": 8.0, "title": "GE HealthCare 推出 AI 工具預測醫院容量瓶頸，強化床位與流程管理", "summary": "GE HealthCare 正式發布新款 AI 應用程式，可即時預測醫院床位容量瓶頸與病患流量壅塞點，協助管理層提前進行資源調配。該工具透過整合電子病歷、入出院數據及歷史流量模式，以預測性分析識別可能發生壅塞的科室與時段，並提供視覺化儀表板供行政與臨床管理人員決策。此解決方案直接呼應全球醫院普遍面臨的床位短缺與急診壅塞問題，可望減少不必要的病患等待時間、提升手術排程效率並優化護理人力配置。對正面臨高齡化社會帶來龐大照護需求的醫院體系而言，AI 驅動的醫院容量管理工具代表智慧醫院營運的重要方向，具有實質的效率提升潛力。", "tags": ["醫院營運AI", "容量管理", "GE HealthCare", "智慧醫院"], "author": "未標示（Healthcare Finance News｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQSWQxblJUMkRmWUxqcFBCMGMxZm9WMkRjdHZ0cjd6ZlUwSERmc2d3YUZUdWhnak5wN1Z6ejJDMk9ZUnhPSzFzLWp1QTlrQUt2TDRjY2ZUeWxhVjhHaTd5VEpEWjZEUFd1Y1V1RlFWS1BoZDRVWDNIMGlzOThTUnpTMDJsQTQ3OUMzYUJORmRSN19JUXE1TEtydnVMclR5bFFnU0ROSFphcjg"}, {"rank": 4, "score": 7.5, "title": "Nature 研究：本地部署醫療 AI 代理人可提升臨床決策可靠性", "summary": "《Nature》發表研究探討在院內本地端（On-Premise）部署醫療 AI 代理人（AI Agents）的架構設計與可靠性表現。有別於依賴雲端推論的模式，本地部署方案可確保患者資料不離院、降低網路延遲，並符合醫療資料保護法規要求。研究顯示，經過適當設計的本地 AI 代理人在臨床決策支援場景中，能提供穩定且可重複驗證的診斷建議，並透過回答一致性機制讓臨床醫師識別可信賴的 AI 輸出。此研究對醫院資訊部門在評估 AI 部署架構時提供重要依據，尤其在資安合規、資料主權與系統穩定性三者兼顧的前提下，本地部署模式的可行性值得醫療機構深入評估。", "tags": ["本地部署AI", "臨床決策支援", "AI代理人", "資料隱私"], "author": "未標示（Nature｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5VanUybXZENTJjdXN1V1FRTFlfZU9Dblo2WWpuMXljeHIwaEdlTUgzc2F1V2YySWhYd2ZnSFFnRXV5TkdOanVvTFJ2NEdDQV9qWUpzODBHRXhXN2QxTzQ0"}, {"rank": 5, "score": 7.5, "title": "台灣天下雜誌：醫療 AI 從單點應用邁向全院智慧營運新局", "summary": "《天下雜誌》刊載深度分析，探討台灣醫療體系如何將 AI 應用從單一科別或功能性工具，擴展至涵蓋全院層級的智慧營運整合模式。文章指出，早期醫療 AI 多聚焦於影像判讀、病理分析等單點突破，而新興趨勢則是跨科整合、涵蓋行政排程、病患流量管理、藥品庫存及臨床決策支援的全院級 AI 平台。台灣醫院在政府推動數位健康政策及健保資料庫的利基下，具備發展全院智慧營運的獨特條件。文章亦提及跨部門資料整合、變革管理及 AI 倫理治理為推動全院智慧化的三大關鍵挑戰，對正規劃或深化 AI 策略的醫院領導層具有重要的策略參考意義。", "tags": ["全院智慧營運", "台灣醫療AI", "數位轉型", "AI策略"], "author": "未標示（天下雜誌｜2026-09-16）", "source_url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTE1SdDJCMzI3dE05X3REc2xkeF9zbzdnOXdPd3dkUkJKd2drVS1Jc25OaWNwa25zUWVUR3BHSmdtTXpncVRkMkU0aE8xZTlQQVZPUFk5dWd6UUo"}, {"rank": 6, "score": 7.0, "title": "OpenAI 資助建立生醫訓練資料集，以強化醫療 AI 模型的生物學理解能力", "summary": "MIT Technology Review 報導，OpenAI 正積極資助生物醫學訓練資料的生產計畫，以解決醫療 AI 模型在生物學知識深度上的根本瓶頸。報導引述政策分析師的提案，建議透過競標破產生技公司的方式，取得通常屬於商業機密的詳細法規申報資料、製造策略及安全性數據，作為模型訓練的高品質原料。此舉反映大型語言模型在醫療生物科學應用上，高品質、具結構性的領域數據仍是核心挑戰。對醫療 AI 產業而言，訓練資料的來源多元性與品質標準，將直接決定未來臨床 AI 工具的可信度與泛化能力，此議題同樣涉及資料倫理與智財法規的複雜面向。", "tags": ["醫療AI訓練資料", "OpenAI", "生醫AI", "資料策略"], "author": "未標示（MIT Technology Review｜2026-09-15）", "source_url": "https://www.technologyreview.com/2026/09/15/1144129/ai-models-need-more-data-about-biology-and-openai-is-paying-to-create-it/"}, {"rank": 7, "score": 7.0, "title": "Merge 推出 MergeIQ AI 層，整合放射科工作流程自動化協調", "summary": "醫療影像資訊系統大廠 Merge 正式發布 MergeIQ，這是一套專為放射科設計的 AI 工作流程協調層（Orchestration Layer），旨在統一管理多個 AI 應用程式的輸出結果並 : 6.0, "title": "醫療 AI 採用加速但落差擴大：資源不足的醫院恐遭數位鴻溝邊緣化", "summary": "news-medical.net 報導，全球醫院採用 AI 的速度持續加快，但資源充足與資源不足醫院之間的 AI 近用落差（Access Gap）正在擴大而非縮小。大型學術醫療中心與資金雄厚的私立醫院已廣泛部署影像 AI、臨床決策支援及行政自動化工具；然而，社區醫院、偏鄉醫療機構及中低收入國家的醫療體系，因基礎建設、技術人才及採購預算限制，面臨被排除在 AI 紅利之外的風險。報告呼籲政府、學術機構及 AI 廠商共同制定策略，包括開放資料共享、補貼採購及建立跨院 AI 協作聯盟，以確保醫療 AI 的效益能更公平地惠及不同規模與地區的醫療機構，避免加劇既有的醫療不平等現象。", "tags": ["醫療AI近用落差", "數位醫療平等", "醫院資訊化", "AI政策"], "author": "未標示（news-medical.net｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxQbzFUaDViUGFMcUZHRHlTRGo0SERjZE1sLUR0WEMzam1kQUJNTmNnV3NKOXI4d21kT0o3RjNiX1VhdnB6TWVzQy1zNG9OTVR4Y2RzRUtpVE1SazRhM0FjelBOWW5YRTVONi1MdksxdjJwV1lvYk1SR3I1YVJtOW1IWVhJNE5PVC03UnpnTmhpcXVTa29UeUpXQ0VKNGU1NVV5aHprV2xvQVBfbXVsOWpHRHBKNEdCRnBXMkZIVXdjSQ"}]}, "2026-09-15": {"date_str": "2026年09月15日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "英國委員會提出醫療 AI 分階段審批與持續監管新框架", "summary": "英國一獨立委員會發布報告，呼籲對醫療 AI 採行全新監管方式，核心主張包括：以「分階段審批」取代一次性上市許可、要求廠商在產品全生命週期內提供持續安全有效性證據，並設立獨立監督機制定期重審已核准系統。委員會指出，現行法規框架設計之初並未考慮 AI 演算法可自我更新、持續演化的特性，導致核准後的臨床風險難以追蹤。報告亦強調，醫院部署 AI 時應建立透明的事故通報與問責機制，並要求廠商提供真實世界效能數據。此一監管思路與歐盟 AI Act 及美國 FDA 的演進方向一致，可能成為全球醫療 AI 監理改革的重要參考依據，對有意進行跨國市場布局的醫療機構與科技廠商具有直接政策意涵。", "tags": ["醫療AI監管", "政策法規", "英國", "AI治理"], "author": "未標示（MobiHealthNews｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQblVZM1N5U3lzLUJMQjJ3M3VnUFVYT21RZGc0RmJPcHVVRVpNNkF0UjVlNmFtMEYzanUtZ01JM2I0OGlBTFR4QWRIZlpaWlFRdzJnUERWYzkzcUZXOS1fa25YcUNyakl4M090UFMtbUF4R0NHQk1ZYzFnMjFHdDdQTGFxZXEwNG9iWG9qZVNKVTNxUQ?oc=5"}, {"rank": 2, "score": 8.5, "title": "川普政府力推醫療 AI 整合，安全與成效疑慮同步升溫", "summary": "《紐約時報》報導，川普政府正積極推動人工智慧融入美國醫療體系，包括加速 FDA 審批流程、鼓勵醫院採用 AI 診斷與行政工具，並考慮將 AI 應用列入聯邦醫療採購優先項目。然而，臨床醫師與研究人員對此提出警告，認為部分 AI 工具尚缺乏足夠的前瞻性臨床試驗驗證，存在偏見、誤診及資料隱私等潛在風險。批評者擔憂政策推進速度超前於安全評估機制的建立，可能在弱勢族群或複雜病症族群中產生系統性危害。此議題凸顯醫療 AI 快速部署與嚴謹監管之間的張力，對各國醫院領導層在採購決策與臨床導入策略上具有重要的參考價值。", "tags": ["醫療AI政策", "FDA", "臨床安全", "美國"], "author": "未標示（The New York Times｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFAtWHhOYkNKZXNHYlRzRThHNDVCc29vZXMyeG52blhXWXJnc3ZpU21SNk9CVVV5ZjN0RWpqa1RjV0lQM1FnWGFrczZfSk5yQ3NPRkRDN1ptbGZRMVNlUXV3RFFCRUJRYW5JWEZJbFhsd1p6bXhVSUhsVmt3?oc=5"}, {"rank": 3, "score": 8.0, "title": "美國退伍軍人事務部成功試點後逐步擴大 AI 醫療抄錄員部署", "summary": "美國退伍軍人事務部（VA）宣布，在多個試點機構完成醫療 AI 抄錄員（AI medical scribe）的評估後，將分階段向更多 VA 醫療中心推廣。該系統能夠即時將醫病對話轉錄並自動生成結構化病歷，大幅減少醫師的文書負擔，試點數據顯示臨床人員每診次可節省數分鐘至十餘分鐘不等的記錄時間。VA 表示，導入過程將同步建立品質稽核機制，確保 AI 生成病歷的準確性與合規性。此案例為大規模公立醫療體系導入 AI 抄錄工具提供了具參考性的實施路徑，亦顯示聯邦醫療機構對 AI 文書自動化的接受度正在提升，對正在評估類似工具的醫院資訊與臨床管理團隊具有直接借鑒意義。", "tags": ["AI抄錄員", "病歷自動化", "退伍軍人事務部", "臨床效率"], "author": "未標示（Nextgov/FCW｜2026-09-15）", "source_url": "https://news.google.com/rss/articles/CBMiyAFBVV95cUxQeEdvVGp3ektNc1BlSF9SdlVDN01hdWtjS2p4V0puMnkyZjhXZGhkRjdiSV9YcmtWbEFCWUpYaWxCbHY5MXpkalJMMkpoaFRGR2lLMTE4cHV1akZudVIwdGNTSTVMc3BBSktZSFdZd0VVNUJ4cS1PeWNVd0pncnVvZzJDTVRYc0JRa2VLVFo4QzQyYXFIUlU1ZUZFemdaUHp3UXFFR1NfcW5SRXFsaXhQM1JwYVVIcmtOLXB4QzNtMWF6dkhoVkVtUQ?oc=5"}, {"rank": 4, "score": 7.5, "title": "對話式醫療 AI 須有前瞻性臨床證據，Nature 社論表態不可妥協", "summary": "《Nature》發表評論，強調對話式醫療 AI（conversational medical AI）在正式臨床部署前，必須提供嚴謹的前瞻性研究證據，而非僅憑回顧性數據或小規模試驗即推廣應用。文章指出，目前大多數對話型醫療 AI（如 AI 問診助理、症狀評估機器人）的臨床驗證多依賴觀察性研究，缺乏隨機對照試驗支持，難以排除選擇偏差。作者呼籲監管機構、醫療機構與開發商共同建立前瞻性評估標準，並在導入後持續追蹤患者安全指標。此觀點為醫院在採購與試驗對話型 AI 工具時，提供了重要的實證要求框架，亦呼應全球對醫療 AI 監管標準提升的廣泛討論。", "tags": ["對話式AI", "臨床驗證", "實證醫學", "醫療AI標準"], "author": "未標示（Nature｜2026-09-14）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE94U05YMG9MOU5GRGxHZUlyYmgzZUk1WUUyTE9HYVp6VGtrSG82TmlLakdDaHg0R3YzQmhKeFRpZGJrRExNa045aE5KSlg4NzhxLXJnbU80SVgzYy1UQlVz?oc=5"}, {"rank": 5, "score": 7.5, "title": "彰化基督教醫院啟用 NVIDIA B200 醫療 AI 超級電腦，布局代理式 AI", "summary": "彰化基督教醫院（彰基）宣布正式啟用搭載 NVIDIA B200 GPU 的醫療 AI 高效能運算中心，成為台灣醫療院所中首批採用最新世代 AI 算力基礎設施的機構之一。院方表示，此高效能運算平台將支援影像辨識、基因組學分析、臨床決策支援等多項智慧醫療應用，並計畫進一步導入「代理式 AI」（Agentic AI）架構，使 AI 系統能自主執行複雜的多步驟醫療流程任務。此舉象徵台灣醫療院所對 AI 基礎建設的投資進入新階段，也反映出醫院對自主性 AI 代理應用的積極布局意圖，對正在規劃 AI 算力升級的醫療機構具有重要的參考價值。", "tags": [" Qk5NekMwMi02TXFNUXJZZzRWQmFKaFoxaWpwQkNIeHJwamNoT2xhSkR3YU9IanpwbWdrYmRscDk4N3NVTS04SFB0dGtIVGtvdGhlQU1ydW0xdUZOUGZCRnVPRTNIblNaR1RfQkFFZV9KUlMwcjVfOE1acTlpdDZVTUFnZ2dXSTc?oc=5"}, {"rank": 3, "score": 7.5, "title": "「影子 AI」悄然入侵病歷系統，醫療機構面臨隱形資安危機", "summary": "TechNews 科技新報報導，醫療機構內部員工未經授權私自使用未受管控的 AI 工具（即「影子 AI」）處理病歷資料的現象日趨普遍，已形成不容忽視的資安與隱私風險。此類工具往往未經醫院 IT 稽核，資料傳輸路徑不透明，可能導致病患個人健康資訊（PHI）外洩，甚至違反健保相關法規與個資保護規定。報導援引資安專家指出，醫療機構的資安防線往往聚焦於外部攻擊，卻忽略內部人員自行引入未授權工具的風險。建議醫院資訊部門建立完整的 AI 工具白名單制度、員工使用稽核機制，以及清晰的 AI 使用政策，方能有效降低因影子 AI 引發的合規與資安危機，保障機構與患者的數位安全。", "tags": ["資訊安全", "影子AI", "病歷隱私", "AI治理"], "author": "未標示（TechNews 科技新報 via GNews-台灣醫療AI｜2026-09-13）", "source_url": "https://news.google.com/rss/articles/CBMidEFVX3lxTE9JLTk5bFRRNW1qYmp2RjlCSXh2SC1hQjRraGlvSWY4VlpxU2tQZnRQSkdKOV90MWMzQV83dllrcVVyUHVlTmd1ZHRaV1loaUtDaDJ6UTBiU3NOdGZZTk9ybW9CYmlsLUR3cV91czJERTFidWxi?oc=5"}, {"rank": 4, "score": 7.0, "title": "AI 助攻醫療前景：專家認為臨床人力需求將擴大而非被取代", "summary": "商傳媒報導，多位醫療與 AI 領域專家在近期論壇中一致表示，AI 技術導入醫療體系的長遠效應並非取代臨床人員，而是有望擴大整體醫療服務量能，進而帶動人力需求的增加。專家指出，AI 在影像判讀、文書記錄、藥物警示等重複性任務上的自動化，能讓醫師、護理師及醫技人員將時間與精力投注於更需人文判斷的高複雜度臨床工作，提升服務品質與患者安全。同時，隨著 AI 輔助篩檢工具降低就醫門檻、促使更多民眾接受預防性健康管理，醫療需求總量也將隨之上升。專家呼籲醫療機構應及早規劃 AI 時代的人才培育策略，讓臨床人員具備與 AI 協作的能力，以因應未來醫療環境的結構性轉變。", "tags": ["醫療人力", "AI協作", "臨床轉型", "台灣醫療AI"], "author": "未標示（商傳媒 via GNews-台灣醫療AI｜2026-09-13）", "source_url": "https://news.google.com/rss/articles/CBMi7AJBVV95cUxORXVGbHdmMnowQXNkNS1mMHlTdVFzeWJkbzJnem5nUjBET0lIUVpMS25objZ6OTh6dVhUYjAtTWJEc1Q0bWZDeHpzMnJQdnhHdDZMSkdtcGp0OFVrUG8xcEg3Q3FrWTJ0VjJ0RktTYWxWMjdWNGh4RF9JMi1kS19jb3g1ZFNndjNOejJNeGc0WGphWVdvekJ6X2FpMWZjTDBDZVpqcWxLYkhMRUZVaEFxUG9ObnlGSVlNQVgtc2J0ZnI1cS1GY1Etd1hUVnIwMEo5VFRqOHRSYW1BWXp4UnpYRzF4TW9sYlhkN0hoY1hkNHB2NXh1ZXlEeVNxaTRQQ2hCdnRCeC1iUjdoeU1vYUJoUGpyN3Zub20yNmprU0xJSDVDLUU3Y1hEekNPTGQtX1JlN3RSU0RFX3ZhX0lYNkFsZjU1S2MtajZMN0NTQkhpejF1LWd4V19sVDh1U25OTHQtc2xzWXJ3cjJLWkF2?oc=5"}, {"rank": 5, "score": 6.5, "title": "Inspiren 募資 7,000 萬美元，以 AI 環境感測擴大銀髮照護平台規模", "summary": "MedCity News 報導，AI 銀髮照護平台新創公司 Inspiren 完成 7,000 萬美元 C 輪募資，由 NewView Capital 領投。Inspiren 的核心技術為結合環境感測器與電腦視覺的 AI 平台，能在不侵犯住民隱私的前提下持續監測生活狀態，並在跌倒事件發生前預測風險、提早發出警示。跌倒是銀髮族住院的主要原因之一，也是長照機構的重大安全課題，AI 預測性介入有望顯著降低相關傷害與醫療成本。本輪資金將用於擴大平台在銀髮住宅與長照機構的部署規模。此案例對台灣積極推動的長照 2.0 與智慧長照政策具有參考意義，顯示以非接觸式 AI 感測技術強化老人照護安全已成全球新興趨勢，值得醫療體系與長照機構關注。", "tags": ["銀髮照護", "跌倒預防", "電腦視覺", "長照科技"], "author": "未標示（MedCity News｜2026-09-13）", "source_url": "https://medcitynews.com/2026/09/inspiren-senior-living-ai/"}]}, "2026-09-13": {"date_str": "2026年09月13日", "weekday": "星期日", "items": [{"rank": 1, "score": 8.5, "title": "AI 病理助手可閱讀完整病理切片並跨 31 種癌症回答臨床問題", "summary": "一項最新研究發布了能夠閱讀全張病理切片（Whole Slide Image）的 AI 助手，可針對 31 種癌症類型回應臨床醫師的自然語言提問。此系統整合了大型語言模型與視覺分析能力，能從高解析度組織切片中擷取關鍵特徵，並以對話形式輸出診斷相關資訊，大幅降低病理科醫師人工判讀負擔。此技術突破意義在於：過往 AI 病理工具多為單一任務設計，例如僅偵測腫瘤或分類亞型；而此系統支援開放式問答，具備更高臨床彈性。隨著數位病理基礎設施逐步普及，此類工具有望縮短跨院診斷報告時間，並輔助資源有限地區的腫瘤科決策。目前該工具仍處於研究階段，尚待大規模臨床驗證與監管審查，但其多癌種覆蓋能力展現了強大的擴展潛力。", "tags": ["AI 病理", "數位病理", "腫瘤診斷", "臨床輔助"], "author": "未標示（Bioengineer.org｜2026-09-13）", "source_url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxQbE1oVEhYTWx0SHNCUHdPYmgyODhyb1VlamdCQmozMUZxU3JGWVFRbWd6M0wyRFcza0lOVG00UzhvOEVlclRjSU5PYlBZTVhhdC1oYkt1cDVMbEF0MUl4WlJQbTBWaUpaaU8zcjh5b1VnUGpsR2p0VGJCcEZPWndQT2VVVkVpMHFTR2MwakdYakp2UVNVQ2Z4Y2dLZllvdUZOV2JuZUxrbzNkVEVNSXhHTnNOUE1XRUZMNWdJM1lHX1hUbms?oc=5"}, {"rank": 2, "score": 7.5, "title": "AI 學習解讀模糊骨骼掃描影像並自動生成放射科報告", "summary": "最新研究顯示，AI 系統已能有效解讀過往因影像品質不佳而難以判讀的骨骼掃描影像，並自動產出結構化放射科報告。該模型透過大量訓練資料學習識別低解析度或噪點較多的骨掃描影像中的病灶特徵，在偵測骨轉移與骨質異常方面展現出接近專科醫師的表現。研究指出，此技術對基層或偏遠醫院尤具意義——這些機構常因設備較舊導致影像品質受限，卻同時缺乏足夠的放射科人力。自動報告生成功能可縮短報告回報時間，減輕放射師工作負荷，並提供更一致的判讀標準。目前研究團隊正推進多中心驗證，以確認模型在不同設備與患者族群間的泛化能力，未來有望整合進現有 PACS 系統作為臨床輔助工具。", "tags": ["放射科 AI", "骨骼影像", "自動報告生成", "影像診斷"], "author": "未標示（Bioengineer.org｜2026-09-12）", "source_url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxPMVowbmtZcERFWGRyZXVtajNKdU9hWDdYZzVHM1lfNkk0clpTT1F5RkVjYWNsQlZuMlJ4VzVGMUxEMU9CMVJPU2taQW9HYzktYlA3UWN1bWRkcFV6clVINUFQUktKbENTMS0tZms5bE5NZUxUUGVLRlhDTXVycXhIY1hhTWdvVjduSFVVLUdGOGI?oc=5"}, {"rank": 3, "score": 6.5, "title": "俄羅斯 Sberbank Medical AI 啟動亞洲臉部 AI 診斷部署計畫", "summary": "俄羅斯金融巨頭 Sberbank 旗下醫療 AI 部門宣布將其臉部特徵診斷 AI 系統推展至亞洲市場。該系統透過分析面部影像特徵，輔助偵測特定疾病的潛在生理指標，屬於非接觸式、低成本的初步篩查工具。此舉被視為俄羅斯在西方制裁壓力下積極向亞洲市場轉軸戰略的一部分，目標鎖定醫療資源相對欠缺的新興市場。然而，臉部診斷 AI 在學術界仍存在較大爭議，其臨床有效性、種族多樣性偏差及隱私合規問題均受到廣泛關注。對亞洲醫療體系而言，在評估採用此類工具時，應審慎考量其監管認證狀態、訓練資料代表性及數據主權風險。目前尚無明確資訊說明該系統是否已取得任何市場的正式醫療器材認證。", "tags": ["臉部診斷 AI", "醫療 AI 國際擴張", "AI 監管", "篩查工具"], "author": "未標示（russia's pivot to asia｜2026-09-12）", "source_url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxQUk1JRWNlZ2lUOWYzOW45ZHpxZHh0UEdJRnB1NXRYbFRpcGFYeDhUd3BFb25Ha0lPRlhqa19wWkdEeTkwZ015eGFrd2drNDdpNmNUUVhnQ2w5QzBiMTlQdWlXUkdMN1pFMEJza1FwMmRNYjI3cGdQZG9tTDlOTGRrYjBCcnRlTzlCdzVvam1fNkV0U2xha3c?oc=5"}, {"rank": 4, "score": 6.0, "title": "AI 化身教學助手：東區醫事種子教師計畫導入 AI 強化醫療韌性", "summary": "台灣東區醫事種子教師培訓計畫引入 AI 教學助手工具，協助醫事人員提升應對突發公衛事件的能力與醫療韌性。此計畫透過 AI 輔助教學模組，讓種子教師得以更有效地進行知識傳遞與情境模擬演練，強化基層醫療體系在緊急情況下的應變能力。AI 工具的引入不僅提升了培訓效率，也讓教學內容更具互動性與個人化，有助於縮短不同地區醫事人員的知識落差。此計畫反映台灣在醫療人才培育中積極整合數位工具的趨勢，具體展示了 AI 在醫學教育場域的實際應用潛力。對醫院管理層而言，此類 AI 教學工具的導入模式可作為內部繼續教育與災害應變訓練的參考案例。", "tags": ["AI 醫學教育", "台灣醫療", "醫療韌性", "種子教師"], "author": "未標示（TCnews慈善新聞網｜2026-09-12）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5sbVpLdFN0bGRQYVZnci1QZHpLWHFGY0RVNjd4eTBzWE5oUlRwa2FOaVR1akJBLWVMWFlWSGk2Y3dDdEdfSzdQZXdqZDFsNmpGVFd0Y0Mzb005SHUtZ1RV?oc=5"}, {"rank": 5, "score": 5.5, "title": "Nutromics 可穿戴抗生素監測貼片獲 FDA 突破性器械認定", "summary": "澳洲醫療科技公司 Nutromics 宣布其可穿戴式抗生素監測貼片獲得 FDA 突破性器械認定（Breakthrough Device Designation）。該貼片能夠即時連續追蹤萬古黴素（Vancomycin）的血中濃度，取代目前臨床上需定期抽血的傳統監測方式。萬古黴素是治療嚴重革蘭氏陽性菌感染（包括 MRSA）的關鍵抗生素，但其治療窗口狹窄，濃度過低易導致治療失敗，過高則可能引發腎毒性。現行監測依賴間歇性靜脈採血，不僅增加護理工作量，也可能錯過濃度波動的關鍵時間點。此穿戴裝置若成功通過後續臨床驗證並獲得正式批准，將可顯著改善抗生素個人化給藥精準度，對加護病房及感染科有直接臨床應用價值，同時呼應全球抗生素管理（Antimicrobial Stewardship）的政策方向。", "tags": ["可穿戴裝置", "抗生素監測", "FDA 認定", "感染管控"], "author": "未標示（MedCity News｜2026-09-12）", "source_url": "https://medcitynews.com/2026/09/nutromics-fda-antibiotic/"}]}, "2026-09-12": {"date_str": "2026年09月12日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.0, "title": "AI 心電圖工具獲 FDA 批准，可偵測更難辨識的心肌梗塞型態", "summary": "一款名為「Queen of Hearts」的 AI 工具近日獲得 FDA 核准，可自動掃描心電圖（EKG）以偵測嚴重心臟病發作，並進一步識別較罕見的冠狀動脈阻塞模式。傳統心電圖判讀需依賴臨床醫師經驗，對部分非典型心肌梗塞型態（如 STEMI 等同型）容易漏判，而此 AI 工具可在第一線快速篩查，降低誤判風險。開發商表示，該工具設計目的在於輔助急診與心臟科醫師，尤其適用於人力較吃緊的夜間值班或偏鄉醫療場景。此次 FDA 批准代表 AI 輔助心臟診斷進入實際臨床部署階段，也為醫療院所在急性心血管事件處理流程中提供新的數位輔助手段。對於有大量急診心電圖判讀需求的醫院而言，此類工具的引入可望縮短診斷到治療的黃金時間。", "tags": ["心電圖AI", "FDA核准", "急性心肌梗塞", "心臟診斷"], "author": "未標示（STAT News｜2026-09-11）", "source_url": "https://www.statnews.com/2026/09/11/fda-new-ekg-heart-attack-detection-algo-queen-of-hearts/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "GenHealth.ai 募資 1,650 萬美元，以 AI 自動化醫療行政作業", "summary": "醫療 AI 新創公司 GenHealth.ai 宣布完成 1,650 萬美元 A 輪融資，由 Flare Capital Partners 領投，Craft、Obvious Ventures、Eniac Ventures、InHealth Ventures 等機構跟投。該公司主要聚焦於醫療行政流程的 AI 自動化，包括預授權申請、保險申報、病歷摘要生成等高度重複性行政任務。醫院行政作業耗時龐大，長期壓縮臨床人員的核心工作時間，GenHealth.ai 的解決方案旨在透過大型語言模型與結構化工作流程，大幅降低人工作業成本並提升流程效率。此輪融資顯示投資方對醫療行政自動化市場的高度信心，也反映出醫療機構對「減輕行政負擔、讓醫護回歸照護」的迫切需求。此類工具若能與電子病歷系統深度整合，將對醫院的數位轉型策略產生顯著影響。", "tags": ["醫療行政自動化", "AI新創", "大型語言模型", "數位轉型"], "author": "未標示（MedCity News｜2026-09-12）", "source_url": "https://medcitynews.com/2026/09/genhealth-ai-raises-16-5m-to-automate-healthcare-administrative-tasks/"}, {"rank": 3, "score": 8.0, "title": "專家呼籲強化醫療 AI 監管，現行治理機制不足以因應快速部署風險", "summary": "多位醫療 AI 領域專家公開呼籲，各國政府與醫療機構應加速建立更具強制力的 AI 監管架構，以應對 AI 工具在臨床環境中快速擴散所帶來的安全隱患。報告指出，目前醫療 AI 產品的上市速度遠超主管機關的審查能量，部分工具在缺乏嚴格臨床驗證的情況下即投入使用，恐對病患安全造成威脅。專家建議應建立跨機構的 AI 產品持續監測機制、強制要求透明度與可解釋性報告，並明確規範 AI 輔助決策在臨床上的責任歸屬。此議題與各大醫療體系的數位治理策略高度相關，特別是在醫院加速導入 AI 影像判讀、AI 病歷摘要等工具的當下，如何建立院內的 AI 審查委員會與上線前評估流程，已成為醫療機構不可迴避的課題。", "tags": ["醫療AI監管", "AI治理", "病患安全", "法規政策"], "author": "未標示（Specialty Pharmacy Continuum｜2026-09-12）", "source_url": "https://news.google.com/rss/articles/CBMi1gFBVV95cUxNWmN1MVpMUXRpSkp6UktSc05zQ0FmN2hUdDNBUEtaVzJWeHJLZHRxRkNkWE44bm43U21VM3p6Q3hOSUUwWXN4MXRTMEM3cjc2NTktV2dXVl const TODAY_ISO  = "2026-09-18";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
