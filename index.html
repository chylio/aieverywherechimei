<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年11月08日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

 7.0, "title": "八成美國民眾要求醫療 AI 透明化，逾六成盼保有醫療決策主導權", "summary": "TechNews 科技新報引述最新美國民調結果，顯示約八成受訪者認為醫療機構使用 AI 工具時應主動告知病患，並清楚說明 AI 在診療流程中所扮演的角色。逾六成受訪者表示，即便 AI 提供了建議，他們仍希望保有最終醫療決策的主導權，不願將決定權完全交由系統判斷。民調亦揭示，民眾對 AI 用於保險給付審核的接受度遠低於診斷輔助應用，顯示信任落差在不同使用情境間存在明顯差異。此調查結果對醫療機構在推動 AI 導入時的病患溝通策略、知情同意設計以及 AI 透明度政策制定，具有重要的實務參考價值，亦可作為院內 AI 治理框架中病患權益保障設計的依據。", "tags": ["醫療AI透明度", "病患權益", "民調", "AI信任"], "author": "未標示（TechNews 科技新報｜2026-11-07）", "source_url": "https://news.google.com/rss/articles/CBMickFVX3lxTE5vMVBpS3BhNG8wSGhjUlRjT3dUUkJFbEowMmYwWndkdjV4ZFNwYnBTdEJkZVhRcDV4RFJmSUQyYWo0OHBBY09fQTdSNFpMQkNNVUxYTlU3Q0JQU0p4dUFmenJ2ZlBZYWFqVTNqZDJUQ2Q2QQ?oc=5"}, {"rank": 7, "score": 6.5, "title": "醫療 AI 的 ROI 迷思：Bessemer 報告揭示真實投資回報現況", "summary": "MedCity News Debunked 播客節目引述 Bessemer Venture Partners 最新發布的醫療 AI 投資回報評估報告，深入探討目前業界對 AI ROI 的普遍高估現象。報告指出，多數醫院在導入 AI 工具後，實際可量化的財務與效率回報遠低於採購前的預期，主因包括整合成本低估、工作流程改造阻力以及效益歸因困難等。節目同時討論 FTC 近期向醫療機構發出的警告函，針對誇大 AI 效益的行銷宣稱提出監管關切。對於正在評估 AI 投資決策或進行效益驗證的醫院資訊部與財務長而言，此報告提供了較為客觀的市場校準參考，有助於建立更實際的 AI 導入效益評估框架。", "tags": ["AI投資回報", "醫療AI採購", "FTC監管", "數位轉型"], "author": "未標示（MedCity News｜2026-11-06）", "source_url": "https://medcitynews.com/2026/11/debunked-episode-31-cvs-health-restructure-ai-roi-report-findings-ftc-warning-letters/"}, {"rank": 8, "score": 6.5, "title": "女性病歷資料偏誤將削弱醫療 AI 診斷效能：專家呼籲改革", "summary": "STAT News 刊出專家意見文章，指出女性在就醫過程中長期面臨疼痛被低估、心理健康症狀被忽視等現象，導致電子病歷中的女性健康資料系統性不完整。作者警告，當醫療 AI 以此類存在偏誤的歷史資料進行訓練時，模型將延續並可能放大既有的性別診斷落差，進一步損害女性在疼痛管理、心血管疾病及精神健康等領域的診斷準確度。文章呼籲醫療機構在導入 AI 診斷工具前，應針對訓練資料集的性別代表性進行審查，並在模型驗證階段加入性別分層分析，以確保 AI 工具在不同病患族群中維持公平的效能表現。此議題對正在建立 AI 資料治理標準的醫療機構具有政策制定參考價值。", "tags": ["AI偏誤", "女性健康", "資料品質", "公平性"], "author": "未標示（STAT News｜2026-11-06）", "source_url": "https://www.statnews.com/2026/11/06/women-medical-records-artificial-intelligence-diagnosis-mental-health-pain/?utm_campaign=rss"}, {"rank": 9, "score": 6.0, "title": "台東基督教醫院導入 AI 輔助影像判讀，縮短癌症篩檢時間", "summary": "台東基督教醫院積極推動智慧醫療轉型，已正式導入 AI 輔助影像判讀系統，應用於癌症篩檢相關的醫療影像分析作業。根據報導，系統上線後癌症影像判讀所需時間顯著縮短，篩檢敏感度亦有所提升，有助於減輕偏鄉地區放射科人力不足的壓力。東馬醫院（台東馬偕）同步導入語音導航系統，提升就醫友善度。此案例代表台灣東部偏鄉醫療機構在資源相對有限的條件下，透過 AI 工具縮短城鄉醫療落差的具體實踐。對於同樣面臨人力吃緊、服務偏遠族群的醫療機構而言，此案例在技術選型、導入模式及效益評估方面均具有在地參考價值。", "tags": ["台灣醫療AI", "AI影像判讀", "偏鄉醫療", "癌症篩檢"], "author": "未標示（UDN｜2026-11-06）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE9QeG0wR01fZmZYTFd6bUtzMkNxR3dKM3pVTXdpTmVLMmFTWnIzZ3h0VUNqOTZKcG5qWGMwOF92Y3U1WFR6bUJOR0xhV1M0eUFx0gFWQVVfeXFMT0lRVDBtQkpEX0dFLXdtWmQzR3NaOF9ubWthMnN2TXJrWHlQdFNyclVpSGpmUEFnUVZHYVFubDNoM092a0hsZU95RjRuZDhHNDJQZVhTeFE?oc=5"}, {"rank": 10, "score": 5.5, "title": "西門子醫療攜手阿里達摩院：單次 CT 掃描同步偵測癌症與心血管疾病", "summary": "西門子醫療（Siemens Healthineers）宣布與阿里巴巴達摩院合作，共同推廣一項創新 AI 應用：透過單次 CT 掃描，同時分析並偵測癌症病灶與心血管疾病風險指標。此技術整合了影像重建 AI 與多病種並行分析模型，旨在降低病患重複受輻射曝露的風險，並提升放射科工作效率。合作方表示，此方案已在部分醫療機構進行初步臨床驗證，現階段以推廣至大型醫療機構為主要目標。對於放射科工作量持續增加且需兼顧多科別篩檢需求的醫療中心而言，此類多工 AI 影像分析方案在提升設備使用效益與降低單次檢查成本方面具有潛在優勢，值得後續追蹤其臨床驗證成果與監管進展。", "tags": ["AI影像", "CT多病種偵測", "西門子醫療", "阿里達摩院"], "author": "未標示（香港經濟日報HKET｜2026-11-06）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE9oSU12d3dWbEdETGVWNy13emNyYjB0a3J5M0dMb3U2TnVia1hWRnJFWHhNN3RsbTdwWXlPTm5fbk9BOUcwTC1DaThPNExSMkhE?oc=5"}]}, "2026-11-06": {"date_str": "2026年11月06日", "weekday": "星期五", "items": [{"rank": 1, "score": 8.5, "title": "美國民眾對醫療 AI 用於診斷與保險審核仍持審慎態度——最新民調揭示", "summary": "根據 CBS News 報導的最新民調，美國民眾對於將 AI 應用於醫療診斷及保險理賠審核普遍抱持疑慮。調查顯示，受訪者擔憂 AI 在高風險醫療決策中的可靠性、透明度及潛在偏差，尤其對保險公司運用 AI 自動化拒絕理賠感到不安。這項民調結果與當前醫療 AI 快速擴張的趨勢形成對比，凸顯出技術落地與公眾信任之間仍存在明顯落差。對醫院領導層而言，了解患者與社會對 AI 的態度至關重要，有助於在推動智慧醫療轉型時制定適當的溝通策略與治理框架，避免因信任危機影響 AI 工具的接受度與實際效益。", "tags": ["公眾信任", "醫療AI政策", "保險審核", "AI治理"], "author": "未標示（CBS News｜2026-11-06）", "source_url": "https://news.google.com/rss/articles/CBMickFVX3lxTE9CVWV0aXFiQnJWbVAtY3hwVnRrSXdocTdBaVZqdHVpcUVVYWVMaXVCa0c3QWRaM3B4VzJoWVRqY09DU2lZUzJYSjJXRzcwU01uSmE5bE9TeHkxd1JvVzhrRlZ6ejYyMnV4RHU5MFBVXzU4QQ?oc=5"}, {"rank": 2, "score": 8.2, "title": "期中選舉後醫療 AI 立法走向：負面民意將如何重塑 FDA 監管格局", "summary": "STAT News 分析指出，2026 年美國期中選舉結果顯示民眾對 AI 的負面情緒已逐漸蔓延至醫療領域，民主黨重掌國會兩院後，預計將對醫療 AI 採取更嚴格的監管立場。報導探討選後政治生態將如何影響 FDA 對醫療 AI 產品的審查標準、國會是否加快推動醫療 AI 專項立法，以及醫療保險給付政策的調整方向。對於醫院資訊部門及數位轉型團隊而言，這波政治轉向意味著未來採購與部署 AI 工具時，合規審查的壓力將顯著上升，需提前評估手中 AI 解決方案的監管風險與證據要求，並密切關注 FDA 新規的動態發展。", "tags": ["醫療AI監管", "FDA政策", "美國立法", "數位轉型"], "author": "未標示（STAT News｜2026-11-05）", "source_url": "https://www.statnews.com/2026/11/05/midterms-shape-future-ai-in-health-care-fda/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "Microsoft 醫療 AI 診斷準確率超越醫師兩倍以上——最新研究結果引發業界關注", "summary": "SingularityHub 報導，Microsoft 最新發布的醫療 AI 研究顯示，其模型在疾病診斷準確率上達到受測醫師的兩倍以上，涵蓋多個臨床場景的測試。研究結果引發醫療界廣泛討論：AI 輔助診斷工具是否已達到足以改變臨床工作流程的成熟度？業界人士指出，此類研究雖具里程碑意義，但必須謹慎解讀——實驗室環境下的基準測試與真實臨床部署之間存在顯著差異，包括病患多樣性、資料品質及醫師與 AI 協作模式等因素均影響實際成效。此結果對臨床科主任及醫院領導層具有重要參考價值，同時也提示需進一步審視 AI 診斷工具的臨床驗證標準。", "tags": ["AI診斷", "Microsoft", "臨床準確率", "AI輔助決策"], "author": "未標示（SingularityHub｜2026-11-05）", "source_url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxOT1RneWZyTXdjVzBhN0owd3pqUGE0SFJIWlktVERseHo5SjhSVGF2cnNucEVJX1p6M0dScXkta3BUaWh1UzFsWTZqZWNESV9mUFBobWZyLS02X0NWSnJ5S2hYSWV4WFhmaWJsX25ocXhRaGZVd1RFMm9NSUxYUm9ucklUbXgwcUJmQkJ1TFJrbkdRSkZfeXNKdWMtY0JTVXhVbWpZdDVKNnB5TnBNU0duTEhKOA?oc=5"}, {"rank": 4, "score": 7.8, "title": "醫療 AI 治理盲點：醫院無法管控尚未被發現的 AI 工具", "summary": "Help Net Security 報導指出，醫療機構面臨一項嚴峻的 AI 治理挑戰：臨床人員在未經官方批准的情況下自行採用各類 AI 工具（即「影子 AI」），使醫院資訊安全與隱私保護部門根本無從監管。報導強調，現有醫療機構的 AI 盤點與治理機制往往僅針對已知、已採購的系統，對於醫師、護理師私下使用的消費級 AI 聊天機器人或協作工具卻缺乏有效追蹤手段。這一現象不僅帶來 HIPAA 合規風險，更可能影響病患資料安全與醫療決策品質。醫院領導層及資訊部門應建立全面的 AI 工具盤點機制，並制定明確的員工使用政策以降低潛在風險。", "tags": ["AI治理", "資訊安全", "影子AI", "HIPAA合規"], "author": "未標示（Help Net Security｜2026-11-05）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxOWVpVaTB4Ykc4bHFpbUkyTklYLVJmOVU1VFJoOWxVYXpiNWhaZTU1NmNUNTNJMEZuMUJLbGREYVlzaHFWVmhobVhycW9acFo5U3VlTm1xMzdqZUhtMk9QbUdUbFYxTGNmR29SM2R2UE85WVQzZU5kaWNPRXI2YThCNmNEYTBsZ0hs?oc=5"}, {"rank": 5, "score": 7.5, "title": "AI 並未減輕臨床人員負擔——只是將負擔轉移到別處", "summary": "MedCity News 刊登評論指出，目前醫療機構廣泛採用的 AI 文件記錄工具（如環境式聆聽、自動病歷摘要等）雖然解決了部分顯而易見的痛點，但並未從根本上降低臨床人員的整體工作負荷，而是將負擔從一個環節轉移至另一個環節。例如，AI 生成的病歷仍需醫師花時間審閱與修正，或者節省下的時間被額外的行政任務填滿。文章呼籲醫療機構在評估 AI 工具效益時，應超越單一流程的效率指標，從整體工作流程與臨床人員實際體驗的角度進行評估，才能確保 AI 投資真正帶來有意義的改變，而非只是將問題換個面貌重新呈現。", "tags": ["臨床工作流程", "AI導入", "醫師負擔", "AI效益評估"], "author": "未標示（MedCity News｜2026-11-05）", "source_url": "https://medcitynews.com/2026/11/ai-didnt-reduce-clinician-burden-it-just-moved-it/"}, {"rank": 6, "score": 7.3, "title": "加州醫療 AI 監管方向建言：州政府如何有效監督醫療 AI", "summary": "Capitol Weekly 刊登政策分析文章，針對加州應如何建立醫療 AI 監管機制提出具體建議。文章指出，隨著 AI 工具在臨床決策、保險審核及行政管理等領域快速滲透，加州州政府需要在聯邦監管框架之外建立更具針對性的地方法規，包括強制透明度要求、演算法審計機制、以及當 AI 決策導致患者傷害時的問責機制。該報導對美國各州醫療 AI 監管立法的走向具有指標意義，也提示台灣及各國衛生主管機關在制定相關政策時可供參考的思路。", "tags": ["醫療AI監管", "加州政策", "AI問責", "地方立法"], "author": "未標示（Capitol Weekly｜2026-11-06）", "source_url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE9STHFmU2UxdVFfTG8ybmR6aExQNF9xY3V5cEdjLTJ6TUQzY3Qyb0U4TklfTGwzTVVCZ2F5WTVzQWlSdzlEcFdxVGlfaWgya2ZhLUR3MEZjUDdUNXNwTnoxNnZkZHAwMTJ1MFlxMVU4c0dQMDA?oc=5"}, {"rank": 7, "score": 7.0, "title": "「兩週 AI 專家」的危險幻象：醫學教育對 AI 素養的嚴重忽視", "summary": "MedCity News 刊登評論警告，目前部分醫學院與醫院採用短期密集課程試圖培養「AI 能力」的臨床人員，卻未紮實建立統計學、演算法原理及批判性評估能力等基礎知識。作者指出，當一位僅受過兩週 AI 訓練的醫師在臨床上過度信任黑盒子模型的輸出結果，一旦演算法出現偏差導致診斷錯誤，責任不在於 AI 系統本身，而在於容許這種淺薄教育的醫療體制。文章呼籲醫學教育界正視問題，將 AI 素養納入正規課程並設立嚴格能力標準，以確保未來臨床醫師能夠真正有效且安全地運用 AI 工具。", "tags": ["醫學教育", "AI素養", "臨床訓練", "AI安全"], "author": "未標示（MedCity News｜2026-11-05）", "source_url": "https://medcitynews.com/2026/11/the-dangerous-illusion-of-the-two-week-ai-expert-a-call-to-action-against-superficial-medical-education/"}, {"rank": 8, "score": 6.8, "title": "Nature 研究：消費者智慧手錶可機會性偵測高血壓徵兆", "summary": "頂尖期刊 Nature 刊登最新研究，顯示消費級智慧手錶能夠透過持續穿戴期間所蒐集的被動感測數據（如光學心率、加速度計等），以機器學習模型辨識高血壓潛在徵兆，無需使用者主動量測血壓。研究團隊將此稱為「機會性偵測」，強調這種方式可在日常生活中大規模篩查潛在高血壓族群，有望補充現有定期門診量測的不足。此研究對預防醫學、慢性病管理及遠距照護具有重要意涵，也開啟穿戴式裝置結合 AI 用於心血管風險早期介入的新可能，對醫院慢病管理計畫具有參考價值。", "tags": ["穿戴式裝置", "高血壓偵測", "預防醫學", "AI慢病管理"], "author": "未標示（Nature｜2026-11-05）", "source_url": "https://www.nature.com/articles/s41586-026-11336-3"}, {"rank": 9, "score": 6.5, "title": "Rhapsody 推進醫療 AI 治理與病患身分識別管理新方案", "summary": "Healthcare IT Today 報導，醫療資料整合平台 Rhapsody 宣布推出針對醫療 AI 治理與病患身分識別管理的整合解決方案。該方案旨在協助醫療機構在導入多元 AI 工具的同時，確保跨系統資料的一致性與病患身分的準確比對，降低因資料錯誤導致 AI 決策偏差的風險。Rhapsody 強調，隨著醫療機構同時運行多個 AI 模型，建立統一的 AI 治理層與資料品質管控機制已成為當務之急。此報導對醫院資訊部門在規劃 AI 基礎架構、推動院內多系統整合時具有實際參考意義。", "tags": ["AI治理", "病患身分識別", "醫療資料整合", "醫院資訊系統"], "author": "未標示（Healthcare IT Today｜2026-11-06）", "source_url": "https://news.google.com/rss/articles/CBMixwFBVV95cUxPT2FSSEpvbk5vbHdycjZ6YVVXOXdzaGxnSGxMWlhMcUZqNG5QaVVmQTZkRmxVMUFFUGxleXpaSlQzcGFGQ2lpZ0F3TWVSWDg3STBYc2EzUE9Va1FUM1J0Y0lYSmdsemRXVnV4dEtoVVFqdDNjRnZPdEh4MkJtdk44QTNSUzhxMGxOV19mNFd0NXU1bEdhRG9qX3FjaFJ0SUFyMWV2MFpoSVMyRThlTnhROVBxOTJ3Y1hBLWMxYVNjTEVnNWRhcHZn?oc=5"}]}, "2026-11-05": {"date_str": "2026年11月05日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.2, "title": "Google 發布醫療 AI 開發安全框架：涵蓋設計、驗證與部署全流程", "summary": "Google 正式公開一套專為醫療 AI 開發設計的安全框架，系統性地涵蓋模型設計、臨床驗證與部署監控等各階段要求。此框架旨在協助醫療機構與 AI 開發者在導入人工智慧工具時，能有所依據地管理偏誤風險、確保模型可解釋性，並建立持續監測機制。隨著生成式 AI 在臨床場域的應用日益普及，業界對統一安全標準的需求愈加迫切。Google 此舉被視為回應 FDA 監管壓力、強化產業自律的具體行動，對於正規劃引進 AI 輔助診斷或臨床決策工具的醫療機構而言，此框架可作為內部治理與採購評估的重要參考依據。預計將對全球醫院資訊部門及數位轉型團隊在制定 AI 採購標準與風險管理規範時產生直接影響。", "tags": ["AI安全框架", "醫療AI治理", "Google", "臨床部署"], "author": "未標示（The Tech Buzz｜2026-11-04）", "source_url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxOZXQ4ZmFWanJuRzJ3N2pRMWZpc1U3QU1FaTJ0QmlIdm1TYXp1bjE3eXh1RVVrQTBWa2lxMXZoclE2LW8tZTRCMExjMjJ1TS10M2E1M2FnOW1NYzRFamhIZmlOX0Q4azgzOU9DeFlQbXgzZEdkYUdkT25Eb0FBM1dQTmUxLWR6US16R0tUMWVXdHViNTkwUWc?oc=5"}, {"rank": 2, "score": 9.0, "title": "AMA 提出醫療 AI 責任共擔框架：開發商、醫院與醫師三方分責", "summary": "美國醫師協會（AMA）發布政策立場，主張醫療 AI 相關法律責任應由 AI 開發商、醫療機構與臨床醫師依角色共同承擔，而非由單一方全面負責。AMA 認為，開發商須確保產品設計安全、充分揭露模型局限；醫院有義務對所採購的 AI 工具進行適當評估與監督；醫師則在臨床應用時仍負最終診療判斷之責。此框架的提出背景，是當前各州法規對 AI 醫療責任認定標準不一、相關訴訟案例持續增加，業界急需清晰的責任歸屬準則。對醫院領導層與法務部門而言，此一框架直接涉及採購合約設計、醫師培訓規範與機構風險管理策略，具有高度實務參考價值。", "tags": ["醫療AI責任", "AMA", "法規政策", "臨床治理"], "author": "未標示（헬스조선｜2026-11-04）", "source_url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxQSDZQYzVoWHlNN2xCbTBFTWdabjdVS0hHYXRieF9KeTZJaHRDQi1CSzFvQ2JFS011aGt6c3ZnRDhKRHBRelRzc1pFZ1lXempTaGJpVW9LSEs4TGFLSnJ1OUtwT0ZWXzNDM0F4TXEzSkdaUGI1VFRhRUtuYlBMd0VlM1hiclZXVWNlcGc?oc=5"}, {"rank": 3, "score": 8.8, "title": "台北醫院自建急性腎損傷風險 AI 預測模型：手術前個人化預防照護新里程", "summary": "台灣台北某醫院宣布成功建立一套急性腎損傷（AKI）風險 AI 預測系統，可在外科手術前評估個別病患的腎損傷風險，進而提供個人化預防處置建議。急性腎損傷是常見且有時嚴重的手術併發症，傳統上缺乏有效的術前風險預測工具。該院團隊運用電子病歷與術前生理參數訓練模型，預測精準度達到臨床實用標準。此一在地開發成果，不僅呼應美國 Mount Sinai 健康體系同步進行的 NIH 資助研究，更展現台灣醫療機構具備自主研發 AI 臨床工具的能力。對於手術量大的醫學中心而言，此類 AI 工具有助於降低術後腎損傷發生率、縮短住院天數，具備直接落地應用的潛力。", "tags": ["急性腎損傷", "手術AI", "台灣醫療", "預測模型"], "author": "未標示（Healthcare IT News｜2026-11-05）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQWFNyaTYzU1I5SWV4TW9xWExqSV8xN3lXeDNXM3lnbnpwVGxMM1FvT0hlSXo1aFNKb1FGSHJQaENvOXUwaFhfX2UwM2M3UUJ1djdSUG0wNF9nbEhMWjExREEyenBkNE4zMGNxYjAzYU5naWtVdFlGbnVtMVZ4TkFkQlBuejR0dFJZd0dwbG1nTWdfdw?oc=5"}, {"rank": 4, "score": 8.5, "title": "NIH 撥款 400 萬美元：Mount Sinai 建構 AI 模型預防急性腎損傷", "summary": "美國紐約 Mount Sinai 健康體系獲得美國國家衛生研究院（NIH）400 萬美元研究資助，用於開發以 AI 為核心的急性腎損傷（AKI）風險預測模型。急性腎損傷是外科手術後最常見的嚴重併發症之一，發生後不僅提高死亡風險，亦大幅延長住院時間與醫療費用。研究團隊計劃整合術前電子病歷、術中生理監測數據與術後追蹤指標，訓練具備個人化風險分層能力的預測模型，使臨床醫師能在手術前提前介入、降低 AKI 發生率。此項研究代表 AI 在外科照護預防醫學應用的重大推進，亦顯示 NIH 對臨床 AI 研究的持續投入意願。對於麻醉科、外科及腎臟科主任而言，本計畫提供具參考性的研究架構。", "tags": ["急性腎損傷", "NIH", "預測AI", "外科照護"], "author": "未標示（MedCity News｜2026-11-05）", "source_url": "https://medcitynews.com/2026/11/researchers-receive-4m-nih-grant-to-build-ai-model-to-prevent-kidney-injury/"}, {"rank": 5, "score": 8.3, "title": "AI 代理人進駐濕式實驗室：中國自動化生物實驗室可全流程執行 DNA 實驗", "summary": "《Nature》報導，中國一座由 AI 代理人驅動的全自動生物實驗室已能執行複雜的多步驟分子生物學實驗，包括 DNA 合成與定序，僅需人工輸入簡單文字指令即可啟動全流程。該系統整合多種實驗室儀器，由 AI 自主協調各步驟的操作順序與品質管控，大幅減少人力介入。研究人員指出，此「自驅動實驗室」（self-driving lab）模式不僅能加速基礎研究效率，更可降低人為操作誤差。從醫療 AI 發展角度來看，此類技術有潛力延伸應用至臨床基因檢測、病理分析自動化及新藥開發流程，代表實驗室自動化與 AI 整合的重要技術里程碑，值得醫院病理科及精準醫療部門密切關注。", "tags": ["AI實驗室自動化", "DNA定序", "生物技術", "Nature"], "author": "未標示（Nature｜2026-11  "author": "未標示（優分析UAnalyze｜2026-11-03）", "source_url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE02OGFNTWk3ZnlpeUlzWjhCd1VYVmtOUE5MSGlaaURHMzVNNkE5NDR6ei1UZVlQMXhMSVl6ZUlJSWQ4cks5YksySzJCc3d3c0V6b3Rrc3NB?oc=5"}, {"rank": 8, "score": 5.5, "title": "心理健康照護從未為所有人設計——AI 也無法解決根本問題", "summary": "MedCity News 刊出評論指出，心理健康照護體系長期存在系統性排除邊緣族群的問題，而當前業界在尚未充分評估 AI 是否準備就緒的情況下，便已競相將 AI 整合進心理健康服務。文章警告，若開發者未能正視現有體系中對特定族群的結構性偏見，AI 工具將可能將這些偏見以更高效率複製並固化。心理健康 AI 面臨的獨特挑戰包括：情緒評估的文化差異性、語言理解的細微性，以及過去被邊緣化族群對數位健康工具的信任缺失。此評論呼籲產業在部署心理健康 AI 前，必須進行嚴格的族群代表性測試與倫理審查，為醫療機構在選擇相關工具時提供重要的批判性視角。", "tags": ["心理健康AI", "AI倫理", "健康不平等", "邊緣族群"], "author": "未標示（MedCity News｜2026-11-02）", "source_url": "https://medcitynews.com/2026/11/mental-health-care-was-never-built-for-everyone-ai-wont-fix-that/"}]}, "2026-11-02": {"date_str": "2026年11月02日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "AI 診斷放射科影像：系統性回顧比較 AI 與人工判讀之準確度與效率", "summary": "一篇發表於 Cureus 的系統性文獻回顧，全面比較人工智慧與放射科醫師在影像診斷上的準確度及作業效率。研究匯整多項臨床試驗與觀察性研究，評估 AI 在胸部 X 光、CT、MRI 等多種影像模態中的表現。結果顯示，AI 在特定疾病篩檢任務（如肺結節、骨折偵測）上可達到與專科醫師相當甚至更高的敏感度，同時大幅縮短報告出具時間。然而，研究亦指出 AI 在複雜病例、罕見疾病及跨院所資料集的泛化能力仍有侷限，強調人機協作模式為現階段最佳實踐方向。此回顧為醫院評估放射科 AI 導入提供了重要的實證基礎，並點出現行研究方法學的不均一性問題，呼籲業界建立統一評估標準以利未來比較分析。", "tags": ["放射科AI", "影像診斷", "系統性回顧", "人機協作"], "author": "未標示（GNews-AI radiology｜2026-11-02）", "source_url": "https://news.google.com/rss/articles/CBMikgJBVV95cUxPXzRWdm1ncnFCckFlWUh2dUllbTFaeXJEYzUxcEl1VkJWSXo3Rk1kZ1daQU9xUWp5Y2dySzdqSDh2bGJEVzJfdTd4N0pzcFF3dHAySzJYTTh4MUtDNnRDRnhFaXZnMVFtYUxOenJUQzN3ejlMU19sTExQQk8wT2xsMUM2SzVCcHVCWG1ZZXM0MGJ5d3F3bFZGZmV5WTBQbWM3RUFzWHQ1UzNDcUtQRTZ6c1phbmNHRTA0WDV0cS0tMVVTb19SUXpLTmpCZWpzc0NLcW9qRnhoSldoYmV0YTZGYll0bUFUb2puX0VuQ2pobFowNzE5a0VSWktKTGhVVjhKSk02aG16UjlhTGw0c1kyM3dR"}, {"rank": 2, "score": 8.0, "title": "Microsoft AI 診斷模擬測試勝過醫師：準確率近乎 100%", "summary": "Microsoft 發表最新醫療 AI 模型，在模擬診斷測試中展現出超越醫師的表現，準確率據稱接近 100%。該模型能分析複雜的多維度醫療問題，整合病史、影像、檢驗數據等多元資訊進行綜合研判，在多個專科領域的模擬案例中均優於臨床醫師對照組。Fox News 等國際媒體廣泛報導此一突破，引發醫界對 AI 輔助診斷可行性的高度關注。台灣媒體   const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
