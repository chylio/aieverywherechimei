<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

/PIIS0140-6736(26)01906-9/fulltext?rss=yes"}]}, "2026-10-09": {"date_str": "2026年10月09日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.2, "title": "Google AMIE 醫療 AI 於《刺胳針》研究中展現臨床問診潛力", "summary": "Google 開發的對話式醫療 AI 系統 AMIE（Articulate Medical Intelligence Explorer）最新研究成果發表於《刺胳針》期刊，展示其在模擬臨床問診情境中的表現。研究顯示 AMIE 在病史採集、鑑別診斷推理及溝通品質等面向達到接近或超越部分全科醫師的水準，引發醫學界對 AI 輔助診療應用的高度關注。《刺胳針》作為國際頂尖醫學期刊，其刊登代表此研究具備嚴格同儕審查背書，對於醫院評估 AI 輔助臨床決策工具的科學依據具重要參考價值。此研究亦引發關於 AI 問診系統在真實臨床場域部署的倫理、準確性及法規監管討論，為醫院資訊與臨床部門評估導入對話式 AI 提供重要學術基礎。", "tags": ["臨床決策支援", "對話式AI", "刺胳針研究", "Google AMIE"], "author": "未標示（The Tech Buzz｜2026-10-09）", "source_url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxOQ1laNzU5SzJnQWdrRFp1NzNOUFZNS1FhQTQyX05uRjVISkRrcWRlcWdSZ1FXcnVwcmNWb0lHaDFiSGJzNGoxZGJzRVpINndZLTFqczdmSjFhTHpVNVFiTHdEal9aaXJ3bkNiQmYyQUlCNW91WWFqRVBmZHdmQnhxR0lDdDBXZ0J0TWR2aEYxQWY"}, {"rank": 2, "score": 8.8, "title": "FDA 研擬「醫師啟發」監管方案，強化醫療 AI 安全治理框架", "summary": "美國食品藥物管理局（FDA）針對醫療 AI 安全疑慮，正積極研擬以「醫師臨床判斷模式」為參照基礎的新型監管方案。此方案旨在建立更貼近臨床實務的 AI 器材審查標準，要求 AI 系統在做出診療建議時須具備可解釋性與可問責性，類似醫師須對診斷結果負責的機制。此監管思路的提出，反映 FDA 對現行 AI 醫材審查框架不足以因應快速演進的臨床 AI 應用之體認。對於醫院採購或自行開發 AI 診療工具的決策者而言，此方向意味著未來送審標準將更嚴格要求臨床證據與透明度，相關資訊部門與法規遵循團隊應提前掌握此政策走向，調整產品開發與採購評估策略。", "tags": ["FDA監管", "醫療AI治理", "法規政策", "臨床AI安全"], "author": "未標示（蕃新聞｜2026-10-09）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFAtQ0JleDZLd2VsLWxycjdfeUcwRFM2VmJJUXBhTmczYkdhTzlnRjJMclpIb2x0RXlMVjFOSURhaUxkZ1paSVUxSE9BbDZwV0F6UQ"}, {"rank": 3, "score": 8.5, "title": "醫療 AI 治理存在可視性盲點：風險管理機制亟需補強", "summary": "BankInfoSecurity 報導指出，醫療機構在導入 AI 系統後，普遍面臨「治理可視性不足」的核心問題——即醫院管理層往往無法即時掌握 AI 工具的實際運作狀況、決策邏輯及潛在風險。報告指出，許多醫院在未建立完整 AI 監控架構的情況下即完成部署，導致模型偏移、資料品質異常等問題難以被及早發現。此現象在臨床決策輔助、影像判讀及行政流程自動化等應用場景尤為突出。專家建議醫療機構建立跨部門 AI 稽核委員會，並要求供應商提供持續性效能報告，以確保 AI 治理不僅停留於採購階段，而能貫穿整個 AI 生命週期。此議題對正推動數位轉型的醫療體系具重要警示意義。", "tags": ["AI治理", "醫療資安", "風險管理", "數位轉型"], "author": "未標示（BankInfoSecurity｜2026-10-09）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOSllid0dfRkxPR1MxcEk2WDEtYnRDRmJOTzlKN0pGSTItamxYVnd1UkcxeC1ONnAwUWhMeVA3OWlFMGNlWU92MXhFeFBMRXBQUFhJTGwwZV9KVllmd0wybnpEUmFkZ2JoSFN4a3o0SHI3eDlqOVVuLW8xeTJRSTFybkFPVGEyQTNCczAzSm9XT0lkUQ"}, {"rank": 4, "score": 8.3, "title": "Suki 整合 UpToDate AI API，將臨床決策支援直接嵌入診療工作流程", "summary": "AI 醫療文件記錄平台 Suki 宣布推出全新「Ask」功能，透過整合 Wolters Kluwer UpToDate 的 AI API，讓醫師在使用 Suki Ambient AI 進行病歷書寫的同時，可即時查詢具循證依據的臨床建議，無需切換系統。此整合將原本分散的 Ambient 病歷書寫與臨床決策查詢兩大功能合而為一，大幅降低工作流程中斷的頻率。UpToDate 是全球醫師最廣泛使用的臨床參考資料庫之一，此次與 Suki 的 API 整合代表醫療 AI 正從單點工具走向系統性嵌入臨床場景的新階段。對於正在評估 Ambient AI 或臨床決策輔助工具的醫療機構，此案例提供了整合型解決方案的具體參考範本，亦顯示醫療 AI 生態系整合趨勢持續加速。", "tags": ["Ambient AI", "臨床決策支援", "UpToDate", "工作流程整合"], "author": "未標示（Fierce Healthcare｜2026-10-08）", "source_url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxNOUVTT1luY212Y2EyY2pTT0UwMFFMSkRqZWVVR1NxM05Xd1Q3cldmU083LWJjQUpDT3VRWGd1V0pZVmpTR0NwblViNFR3Q2N4a3ZMNnYycElrWmEydTA3a1lvQzJoXzlPeUdYaG0ydWt6TF92RVN3S0ZHWlZucm40SXo5T1FHMElqZGJ3NENfR2RkZWh4cDlkUVhLT3pTLTFlSFZLUXdDdVhPblJ6NXVENGJCOHlXN01wYjkta19uQkVQblhxNHpOeEhn"}, {"rank": 5, "score": 8.0, "title": "AI 可提早偵測認知衰退，但後續臨床責任仍須醫療體系承擔", "summary": "MedCity News 發表分析文章，探討 AI 工具在早期偵測認知功能衰退方面的潛力與限制。文章指出，當 AI 系統在電子病歷中發出認知衰退風險警示後，若醫療機構未預先建立明確的臨床處置路徑，此警示訊號將形同虛設，甚至可能增加醫療人員的認知負擔。作者強調，AI 的早期偵測能力固然有價值，但關鍵在於醫療體系須事先設計好「風險訊號如何轉化為可執行臨床路徑」的完整機制，包括後續評估、轉介及照護追蹤流程。這一觀點對正在或計劃導入 AI 預警系統的醫院具有重要警示：技術工具的部署必須搭配組織流程再造，才能真正產生臨床價值，而非僅停留於系統警示層面。", "tags": ["認知衰退偵測", "臨床責任", "AI預警系統", "電子病歷"], "author": "未標示（MedCity News｜2026-10-08）", "source_url": "https://medcitynews.com/2026/10/ai-can-flag-cognitive-decline-earlier-health-systems-still-own-what-happens-next/"}, {"rank": 6, "score": 7.8, "title": "FDA 核准 AI 工具，可從標準 MRI 自動生成 3D 骨骼視覺化影像", "summary": "FDA 最新核准一款 AI 工具，能夠從常規 MRI 掃描影像自動建構高精度 3D 骨骼視覺化模型，無需額外進行 CT 掃描或特殊影像程序。此技術突破對骨科、脊椎外科及關節置換手術規劃具重要臨床意義——既可減少患者接受額外輻射暴露的風險，也能縮短術前評估時間，同時降低影像採集成本。此工具的核准延續了近期 FDA 在放射科 AI 醫材審查的積極態勢，也再次印證影像 AI 仍是目前獲批臨床 AI 工具的最主要應用領域。對醫院放射科及外科部門而言，此類從現有影像基礎上擴展診斷維度的工具，代表在不增加採購大型設備前提下提升影像診斷能力的可行路徑。", "tags": ["FDA核准", "放射科AI" 床證據，方能確保工具落地後真正有益於病患安全。", "tags": ["FDA監管", "臨床驗證", "AI醫療器材", "病患安全"], "author": "未標示（Yahoo｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOaHkzYVh2WmRVTVNWNTRRRGNUb0NwVEFZMTFOa2ZuaW9MeS13bFNrOXpudnlqZ0ZxX28yQlozYTlXMi1haERWQ0dRb1VkVkw5YnZjaUJXVEJMZzA3TlpwTlEtUnBDQXYybU12ZHRTZHBXa2RiWVNzbGtwZjVwNFpzblJGb2FoLTg"}, {"rank": 2, "score": 8.5, "title": "英國推行新制：持續監測 AI 醫療設備，確保安全與創新並行", "summary": "英國政府宣布採行新的 AI 醫療設備監管框架，核心理念從「一次性上市審查」轉向「持續上市後監測」機制。新制要求 AI 醫療器材製造商在產品獲批後，持續蒐集真實世界使用數據，定期向主管機關報告效能與安全狀況，一旦發現模型效能下滑或出現新風險，須即時進行調整或下架。此舉被視為全球 AI 醫療器材監管的重要參考標竿，尤其針對 AI 模型因數據分布漂移導致效能退化的問題，提供了制度性的應對機制。對照台灣目前醫療 AI 上市後管理規範仍在發展階段，英國此舉對台灣衛福部及醫療機構如何建立內部 AI 上線後風險控管流程，具有高度參考價值。", "tags": ["AI醫療監管", "上市後監測", "英國政策", "法規治理"], "author": "未標示（商傳媒｜2026-10-07）", "source_url": "https://news.google.com/rss/articles/CBMiqwJBVV95cUxNaVlsdHF5ei1POUVfUk8wb3l3RGE0S3M0bXZpOTRHVTRRZjdkZzUyTHNtbXV2dXlrVWNpRTZtNnBITU9DMk1fTWVlaW90dHVZeEFVMGtfSXJvQ1pVdkNfNWFOaVZYeE5mZUFDQTBXXzh5Q21qWHlPTWtZZnp1X2hZVGU1NTFHX2dVbGlPYzNhdFI5ZUplUy1VeXpTVnJuOVpXQWRyUF9NVGd4ajA1ZzdiVjJHZ3RfclllWjhpRWJnV0xyM3RVV0tpcEhQSGRjZlREV1VoOG1HRG5ETWFobDlmVUJVRWJiZUNRUEJPbU1UQUFnUGNEZjhkM0Z3cXBaUzUxWWhIVWF1al9aSDVTNDJZd2NLbXlTRHhFdmI4Z3JtWW4zXzIzelJMeVBTRQ"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 導入速度超越價值驗證：ScienceSoft 報告揭示採購與成效脫節警訊", "summary": "ScienceSoft 最新發布的醫療 AI 採用報告指出，全球醫療機構部署 AI 工具的速度已明顯超越其驗證實際價值的能力，形成「採購先行、驗證滯後」的結構性風險。報告顯示，許多醫院在缺乏完整 ROI 分析或臨床效益數據的情況下，即大規模引入 AI 輔助診斷、自動化行政或預測分析工具。這種現象雖短期內可展現數位轉型動能，但長期恐造成資源浪費、員工信任危機及病患安全隱患。報告建議醫療機構應建立標準化的 AI 價值評估框架，包含導入前的基準設定、導入後的持續績效追蹤，以及跨科室的使用者回饋機制，才能確保 AI 投資真正轉化為醫療品質提升。", "tags": ["AI採購治理", "價值驗證", "數位轉型", "醫療機構管理"], "author": "未標示（Rutland Herald｜2026-10-07）", "source_url": "https://news.google.com/rss/articles/CBMiggJBVV95cUxQd1lwQjVZZkNLbTVOX2RWUDBGckVMaVp0QjJSZTQzaGdoWVpoeFBjcG1hbGRCVkQySnlkMEFNM2wzcEJNRlhpYUR6WE8xeTU4em9Oc1ZaNjd6T1FWS3I5anJkcDRkdXhadlZoUkoxTVQ5MnF0cUdLaEpGZVdCQWdIZWxscmFzS3FabjNaY3NWd1JiR2JEZWRhSjREWFJXcXdWNmV6YUtaMFhCUHRXSVU0SEdpZXQwSW1YVEpfZ2xOaGEzVWNidW8wT0NyT1Z5cEdwSVZIZVdaZkJtT0NCWGEzSmRnTTh1ZkFwRkNycVFVSjFYekJJWVVmSktFQ1E5bF9lWFE"}, {"rank": 4, "score": 7.5, "title": "醫療 AI 投資報酬比預期更快實現：最新調查帶來正向訊號", "summary": "Endpoints News 引述一份針對醫療機構的最新調查顯示，AI 投資在醫療照護領域的回報速度正快於業界原先預期。受訪的醫院與醫療系統主管表示，AI 應用於行政流程自動化（如病歷摘要、帳務核對）、臨床決策支援及排班優化等面向，均出現比預期更早的效率提升與成本節省成果。調查指出，成功案例的共同特徵是：導入前有清楚的問題定義、設定可量測的 KPI，以及跨部門的協作推動機制。此報告為醫療機構的 AI 投資決策提供了正面佐證，但研究者也提醒，部分效益來自流程再造而非 AI 本身，需謹慎歸因，避免誇大 AI 的單獨貢獻。", "tags": ["AI投資報酬", "醫療效益", "數位轉型", "醫院營運"], "author": "未標示（Endpoints News｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxObFVvejJPLVBKZ2Z0Q3FrcmY0eVBhZTFwODlnSkk3NU9JRDlQanp6OWduRW9kUUktZjhWbWN5S3pCRHA5dWpwSEdYWXcteFRJTGlOQ0RtSTVCVHBETWY3TzN2blZHQXhCcm55MmtvQ205M2xHN0pab1d2NmtmTUlPY1A1UDVfV0hFVy1FRW1ZWWNiMVlpMl9MMkRyNGswcnJQeW9F"}, {"rank": 5, "score": 7.5, "title": "三分之四 FDA 批准的 AI 醫療器材集中於放射科，研究揭示領域高度集中現象", "summary": "由 GigHz 創辦人主導的最新研究分析 FDA 歷年 AI 醫療器材授權數據後發現，在所有獲批的 AI 醫療設備中，高達四分之三屬於放射科應用，包括 CT、MRI、X 光等影像辨識與分析工具。此一高度集中現象反映出 AI 在影像判讀領域具備較清晰的技術成熟度與可驗證性，相對容易達到監管標準。然而，研究同時指出，其他臨床科別如病理、心臟科、急診及初級照護等領域的 AI 工具核准數量仍相對稀少，顯示 AI 醫療應用的發展仍存在明顯科別落差。此研究對醫院規劃 AI 導入策略時具有重要參考意義，說明放射科是目前最成熟且監管驗證最完備的 AI 切入點。", "tags": ["放射科AI", "FDA核准", "AI醫療器材", "影像診斷"], "author": "未標示（PR Newswire｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxQdFZfT1NVcVR1MU41QlJxc1Vhd0hSOTVRNWdYeUcxZVlJbXpnWWhVQ1BTQjFzSjl3UDhmZGU3SlZvMDJva0JrZVUtazFRZ1lGeHJUQllUYzJ5alRRb1hxcXNkZ1YwMzNZTndsdkhuMHZNRk9SNjZORjIweF9hTXVPbGxmZ0szNVBpZG95YkdwYU4wZUxsUUtwU2JvMVpBeWtmWGMzMGxpVHBRTzRCbW4xZnptMUFta0xYTUktSWtoZlpOTl8zSWI0S0pWYktDS193bjdWQnRWcUhkdW94UHJnUFZjMTh4NUVWWlVjdm1Hem1nNjA"}, {"rank": 6, "score": 7.5, "title": "醫療 AI 為何會出事？從模型變更、PCCP 到上線後風險控管的完整解析", "summary": "國家新創獎平台發布一篇深度解析文章，系統性探討醫療 AI 工具在臨床落地後可能引發安全事故的核心成因。文章指出，AI 模型的風險不只發生在研發階段，更常見於上線後的三大情境：一是未預告的模型版本更新導致效能改變；二是未依據 FDA 的預定變更控制計畫（PCCP）進行合規管理；三是缺乏系統性的上線後監測機制，無法及時偵測模型漂移或異常輸出。文章以具體案例說明各情境的風險型態，並提出醫院應建立的內部風控流程建議，包含版本控管、定期效能稽核與異常通報機制，對正在或計畫導入 AI 工具的醫療機構具有極高的實務參考價值。" ）", "source_url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFBIdk5SQVpKMk9Jc3Z2ME1TU0NOV01JOUI5Q3I4OXQzSWFiZHpIaXltbl9USEVnVjdoVmtFSUg0eHNsa1EtZVRacUlvX0I"}, {"rank": 10, "score": 6.0, "title": "Vitalize 獲 3,100 萬美元融資，以 AI 驅動醫院人力排班作業系統規模化擴展", "summary": "醫療人力管理新創公司 Vitalize 宣布完成 3,100 萬美元新一輪融資，將用於擴大其 AI 驅動的醫院人員排班與人力調度作業系統。該平台運用機器學習分析歷史排班數據、臨床需求預測與員工偏好，自動生成最優化排班方案，並能即時因應緊急人力缺口進行動態調整。醫護人員短缺已成為全球醫療體系的共同挑戰，自動化排班不僅能降低行政負擔，更有助於減少人力分配不均所導致的醫護過勞與照護品質下滑問題。Vitalize 表示，使用其系統的醫院平均可節省 15–20% 的排班管理時間，並顯著提升護理師的班表滿意度，此次融資將加速其在美國各大醫療系統的商業部署。", "tags": ["AI排班", "醫護人力管理", "醫院營運", "新創融資"], "author": "未標示（Fierce Healthcare｜2026-10-07）", "source_url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxOTW9DNEs2TUNlUDhSREVNaDYyZjRtS2Vyc1RwMy1GejF2T2Q0QjRiUktFeHhWancxWTZ4elpFcW0xOTROY3U1WUFfVjdPaXZYd1dkcUk0VXFXbDd4WHIyLUtzOXdzTV9SRWFmWGRRTDlMdGdDNEwyci1teGtVYnZmQmZMWDdDTERUR1Nrckh0bGdTUTJCVFh0MDg4Y183NW5ZRlpMbE1BU044d1pFOFg2V0lKdk1MUGJ2VlVmbTMteWozM3N1YlBjMS0ycWU"}]}, "2026-10-06": {"date_str": "2026年10月06日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "FDA 核准 AIRS Medical AI MRI 體組成分析工具，精準影像診斷再添利器", "summary": "FDA 於 2026 年 10 月 6 日正式核准韓國醫療 AI 公司 AIRS Medical 開發的 MRI 體組成分析 AI 工具，可自動從 MRI 影像中量化肌肉、脂肪等身體組成成分，為臨床提供客觀且可重複的量測數據。體組成分析在腫瘤學、代謝疾病、老年醫學及術前評估等領域具重要參考價值，過去需仰賴人工標註或專用 CT 掃描，耗時且輻射劑量較高。此工具整合至 MRI 流程後，可在不增加輻射暴露的前提下同步取得體組成資訊，有助於提升診斷效率並支援個人化治療決策。FDA 的核准代表該工具通過安全性與有效性審查，對醫院放射科及相關臨床科別導入 AI 影像分析具重要政策信號意義，亦顯示 MRI 輔助 AI 工具的監管路徑日趨明確。", "tags": ["FDA核准", "MRI影像AI", "體組成分析", "放射科"], "author": "未標示（Unite.AI｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxNaUR2Sm1fQWpYcmFmaU9NLVlURjVNRElZNi0xTHRXN0Z3dm13SE15Ql9GVG1XQlNrandEZ2FBZHRVOHY4S3VmblJMNzhlOVVzd2xtdVFDU1FJZm9FUEI3SDBxUUZWVGNBQ0FzNWFQVmhDcUtWVzhPd2l4SmVZZ3pfd1ZJcnZHU3Bmb05wMFFZUWM2dw?oc=5"}, {"rank": 2, "score": 8.5, "title": "猶他州擴大醫療 AI 沙盒計畫：AI 可直接評估病患並開立處方，無需人工事前審核", "summary": "美國猶他州宣布擴展其醫療 AI 監管沙盒計畫，新增處方開立與女性健康兩大應用領域。最受矚目的是，此次計畫允許特定 AI 產品在無需醫師事前審核的情況下，自主評估病患狀況並開立新藥處方，打破現行醫療 AI 輔助決策的常規框架。猶他州同時宣布引入第三方稽核機制，以確保 AI 工具的安全性與合規性。此舉是美國州級醫療 AI 監管實驗的重要里程碑，意味著部分臨床決策權正式向 AI 系統開放，在提升醫療可近性的同時，也引發醫療責任歸屬、患者安全與監管充分性的高度爭議。這一政策走向對各國醫療主管機關與醫院法遵團隊具有重要的參考與警示價值，值得持續追蹤後續影響。", "tags": ["醫療AI監管", "AI處方開立", "沙盒計畫", "政策法規"], "author": "未標示（STAT News｜2026-10-06）", "source_url": "https://www.statnews.com/2026/10/05/utah-expands-health-ai-sandbox-picks-third-party-auditors/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "德州大學啟動 2,500 萬美元醫療 AI 治理計畫，建構負責任 AI 應用框架", "summary": "德州大學宣布啟動一項規模達 2,500 萬美元的醫療 AI 治理倡議，旨在建立系統性的 AI 責任框架、評估標準與最佳實踐準則，以支持醫療機構負責任地部署人工智慧工具。此計畫將聚焦於 AI 系統的透明度、可解釋性、公平性及臨床安全性等核心議題，並計劃與醫院、政策制定者及技術開發商協作，共同制定適用於醫療場域的 AI 治理規範。在醫療 AI 快速擴張、監管框架尚未完備的當下，此類大型學術機構主導的治理研究計畫具重要意義，其研究成果有望成為醫院 AI 導入評估與風險管理的重要參考依據，對醫院領導層及數位轉型團隊的政策制訂具直接參考價值。", "tags": ["AI治理", "醫療AI責任框架", "學術研究", "政策法規"], "author": "未標示（distilledpost.com｜2026-10-05）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQX2FJQ2RoWU9RTXJ6eTZCbWR6U2lobDN2aGx4T0V0U3BnZ2JDMzNNc05qU3ZOTUFfb3dmcjNCTjY5VWMzUjlxWXBvZTJ3M2dMTTc5MFlpZjVPRXZyRzJMWVdSdzc4YU1fV1YzemlaTDdDZ1NvSHlLb3pWZWJVX3FiQXhyMWJiU3lQSjlQVG5BZlp3RS0tUG1IOE5RVzlUbUJmT2J6WmNB?oc=5"}, {"rank": 4, "score": 7.5, "title": "AI 皮膚病灶分類工具整合至醫院臨床工作流程，從設計到落地的實踐經驗", "summary": "最新研究報告描述一套專為醫院臨床環境設計的 AI 皮膚病灶分類工具，該工具從開發之初即與臨床工作流程深度整合，而非事後加裝。研究團隊針對皮膚科實際診療流程進行分析，確保 AI 輸出結果能無縫嵌入現有電子病歷與診療決策環節，降低臨床使用摩擦。此案例呈現了醫療 AI 工具「以使用者為中心」的設計理念，強調技術開發與臨床需求同步對齊的重要性。皮膚病灶分類為 AI 影像辨識的重要應用場域，此工具的整合策略與實際部署經驗，對計劃引入皮膚科或其他影像輔助診斷 AI 的醫院資訊與臨床團隊具備直接參考價值，亦提供了一個從需求分析到工作流程落地的可複製模型。", "tags": ["皮膚科AI", "臨床工作流程整合", "影像辨識", "AI落地實踐"], "author": "未標示（medicalxpress.com｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMigAFBVV95cUxOWGlNZndhSElEUTF3bGJCeTBlWWdVVGd0MFdWMUJOV3k5azRHdmZIdWdReUozT2lsekNGVEFsa2NtSl8ySVRHeTg4clI5YnBvMXluLThEUzBzemdCQWJFQWVGNWZSemVtZ2tqNHpqSDNOT093NG9jZVExb29CWFZfNQ?oc=5"}, {"rank": 5, "score": 7.0, "title": "海鞘仿生 AI 突破聯邦學習瓶頸：醫院模型訓練不再洩露患者資料", "summary": "研究人員受海鞘（Tunicate）群體協作機制啟發，開發出一種新型聯邦學習演算法，可在多家醫院協同訓練 AI 模型時，有效防止患者個人健康資料外洩。傳統聯邦學習雖已能在不集中 const TODAY_ISO  = "2026-10-10";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
