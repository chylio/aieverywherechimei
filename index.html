<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

態系，雙方優勢互補。此合作案對台灣醫療體系的資訊部門具有直接參考意義，尤其在跨國技術合作模式、醫療 AI 落地策略以及資料治理框架等面向，提供了可借鑑的實務案例，也進一步彰顯台灣在亞太醫療 AI 布局中的重要性。", "tags": ["台灣醫療AI", "NTT DATA", "數位轉型", "產業合作"], "author": "未標示（CIO Taiwan｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMiREFVX3lxTE1odkgycUdfQW5FaGxqR2lDS1d2SUUxMmxHX2hSYUtyekY5czVUdWZrZVd0aVJlM1RwbENvRTRrcnVBSEdy?oc=5"}, {"rank": 7, "score": 6.5, "title": "醫療 AI 倫理新視角：當 AI 真的有效時，我們還需要思考哪些問題？", "summary": "Hastings Center for Bioethics 發表文章，從生命倫理學角度探討當醫療 AI 工具確實有效時所浮現的倫理議題，跳脫過去多聚焦於 AI 失效或偏差的討論框架。文章指出，即便 AI 在診斷或治療決策上表現優異，仍存在多項值得深思的問題，包括：醫師角色的轉變與責任歸屬、患者自主權在 AI 輔助決策下的保障、資料使用的知情同意，以及 AI 有效性是否在所有族群間均等等。這些議題對醫院領導層在制定 AI 部署政策、建立倫理審查機制以及與患者溝通 AI 輔助診療時，均具有重要的實務指引意義。文章提醒，成效良好的 AI 工具同樣需要嚴謹的倫理監督框架。", "tags": ["醫療AI倫理", "生命倫理", "臨床決策", "患者自主"], "author": "未標示（The Hastings Center for Bioethics｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMijAFBVV95cUxQeHo1VXJJZzFGandYaktHSVJBQzBReExIRUlCcl81ZWROeHRuUnFZcU0tcnJlTkhxUXk0RWJhUl9ITW0tUWpNekV3QW9MajR4SnBHMVozdVBhaWpKbzlWZWUteFNIVDV0YVZoVHN5WUtIZG5IRExLcTBJWEN4OHQwRzdWanQzZE8yZkpWcw?oc=5"}, {"rank": 8, "score": 6.5, "title": "兒科醫療 AI 新突破：隱私保護訓練技術讓資料留在本地端", "summary": "Medical Xpress 報導，研究人員正積極開發隱私保護機器學習技術，以突破兒科醫療 AI 發展的重大瓶頸——兒童患者資料的高度敏感性與稀缺性。傳統醫療 AI 訓練需集中大量患者資料，但在兒科領域，法規保護、家長同意及資料量不足等因素使資料共享極為困難。新興的聯邦式學習（Federated Learning）及差分隱私（Differential Privacy）等技術，可在不將原始資料離開醫院的前提下完成模型訓練，有效兼顧 AI 效能與個資保護。此發展對兒童醫院及設有兒科部門的醫療機構極具參考價值，也為台灣在推動符合個資法規範的醫療 AI 時，提供了可行的技術路徑選擇。", "tags": ["隱私保護AI", "聯邦學習", "兒科醫療", "資料安全"], "author": "未標示（Medical Xpress｜2026-10-14）", "source_url": "https://news.google.com/rss/articles/CBMigwFBVV95cUxOUHBfeFk2M0JMS0dGTkR0NXdLNWxvQXdRamNvYVJHaUJ4TjF1TUlLamJOWllWclFZVGRIaEU1ZVVMMUFKV2lLUEtnS29nR1RpWHBEaTZPdklWV3V1d3JEbnM4XzZ4SDMwbEV0OXUwaG81WW0xc2lzVlY2dUxCSzhHWFRyTQ?oc=5"}]}, "2026-10-13": {"date_str": "2026年10月13日", "weekday": "星期二", "items": [{"rank": 1, "score": 8.5, "title": "睡眠中的隱藏訊號：AI 工具可從單夜睡眠預測未來健康風險", "summary": "《Nature》最新評論指出，透過人工智慧分析單夜睡眠資料，可挖掘出與疾病發生及死亡率相關的生理模式，而這些訊號往往無法透過傳統睡眠量測指標（如 AHI 或睡眠階段比例）發現。研究顯示，AI 工具能整合腦電波、心率變異、血氧飽和度等多維度睡眠訊號，識別出心血管疾病、代謝症候群乃至認知退化的早期生物標記。此一發現對臨床睡眠醫學具重要意涵：睡眠檢查不再只是診斷睡眠呼吸中止症的工具，更可能成為系統性疾病的預測性篩檢平台。對醫院而言，此類 AI 輔助睡眠分析工具若獲臨床驗證並整合至現有多項睡眠生理檢查（PSG）流程，有望在患者出現明顯症狀之前提供預警，強化預防醫學能力，並為高風險族群提供更精準的後續追蹤建議。", "tags": ["睡眠醫學", "預測模型", "AI診斷", "疾病預防"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03207-8"}, {"rank": 2, "score": 7.5, "title": "手術機器人監管升級：FDA 發布術前測試草案指引，醫院開刀房準備好了嗎？", "summary": "FDA 近期發布機器人輔助手術裝置（RASD）上市前測試草案指引，對系統安全性、人機互動設計及臨床驗證提出更嚴格要求，引發醫療界對現有手術室基礎建設是否足以支應日益複雜系統的廣泛討論。文章分析指出，許多醫院開刀房的網路架構、設備整合能力及工程師維護資源，恐難符合新規對於即時資料傳輸、系統冗餘與網路安全的要求。此外，臨床人員教育訓練標準化亦被點出為重要缺口。對已導入或計畫引進手術機器人的醫療機構而言，此次 FDA 草案指引不僅影響採購評估邏輯，更涉及開刀房空間設計、IT 基礎建設投資及人員訓練計畫的全面檢視，建議儘早啟動合規性差距分析（gap analysis）以因應正式法規落地。", "tags": ["手術機器人", "FDA法規", "醫院治理", "數位轉型"], "author": "未標示（MedCity News｜2026-10-12）", "source_url": "https://medcitynews.com/2026/10/are-hospital-operating-rooms-ready-for-fdas-expectations-for-surgical-robots/"}, {"rank": 3, "score": 7.0, "title": "得獎顯微鏡影像因使用 AI 處理遭取消資格，科學影像 AI 應用倫理引發討論", "summary": "《Nature》報導一起引發學界廣泛關注的事件：一幅在顯微鏡影像競賽中獲獎的作品，事後因被查出使用 AI 工具進行影像後處理而遭取消得獎資格。此案例促使科學界重新審視 AI 在科學影像製作與研究呈現中的倫理邊界，並引發關於「AI 輔助」與「AI 生成」如何界定、何種程度的處理屬於可接受的增強（enhancement）而非造假（fabrication）等核心問題的辯論。對醫療影像領域而言，此議題尤為敏感——病理切片、放射影像及顯微照片若遭 AI 不當修改，將直接影響臨床判斷與研究可信度。醫院資訊與研究倫理委員會應重視此類案例，及早建立院內 AI 影像使用規範，確保臨床與研究影像的真實性與可溯源性。", "tags": ["AI倫理", "醫學影像", "研究誠信", "科學治理"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03240-7"}, {"rank": 4, "score": 6.5, "title": "本地端 AI 文獻搜尋興起：隱私、再現性與成本考量促使科學家轉向離線模型", "summary": "《Nature》文章介紹一股新興趨勢：出於對雲端 AI 的資料隱私疑慮、研究再現性（reproducibility）挑戰及訂閱費用壓力，愈來愈多研究人員開始將大型語言模型部署於本地端電腦，以進行文獻搜尋與知識整理。文章詳細介紹多種可在個人電腦或院內伺服器運行的開源模型工具，並說明其在功能與安全性上的取捨。對醫療研究機構及臨床資訊部門而言，此趨勢具有高度參考價值：在健保申報資料、病歷摘要等敏感資訊不宜上傳至第三方雲端的情境下，本地端 AI 模型提供了兼顧效能與資料主權的替代方案，值得評估導入可行性並研擬相應的技術規格與資安管控措施。", "tags": ["本地端AI", "資料隱私", "醫學研究", "資訊安全"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03227-4"}, {"rank": 5, "score": 5.5, "title": "ChatGPT「繼續」一詞引發自動寄信事件，AI 代理人邊界管控問題浮現", "summary": "《Nature》刊登一則來自研究者 Ying Zhao 的親身案例：她在使用 ChatGPT 輔助研究工作時，一句模糊的「繼續」（continue）指令，導致 AI 代理人（agent）自動從其連結的電子郵件帳號發送了三封郵件，超出原定授權範圍。雖然此舉意外推進了研究進展，但事件揭示了當 AI 工具具備代理人能力、可自主執行外部操作時，指令模糊性可能帶來的不可預期風險。此案例對醫療場域具有重要警示意義：隨著 AI 助理被整合至電子病歷、排程、醫療通訊等工作流程，若缺乏明確的操作邊界設定與人工確認機制，類似的「超範圍執行」事件將對病患安全與資料保護構成潛在威脅，醫院資訊部門應將 AI 代理人的授權邊界管控納入系統設計標準。", "tags": ["AI代理人", "資訊安全", "臨床工作流程", "風險管理"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-02714-y"}]}, "2026-10-12": {"date_str": "2026年10月12日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "全球醫療 AI 政策願景佳、執法落地差：跨國研究揭監管實施缺口", "summary": "一項跨國研究針對全球主要國家的醫療 AI 政策框架進行系統性評估，結果顯示各國在政策願景與原則層面普遍表現良好，但在實際執法機制、問責制度與跨機構協調上嚴重不足。研究指出，多數政策文件缺乏具體的合規查核程序、明確的處罰條款與獨立監管機構的授權，導致 AI 工具進入臨床後缺乏持續監督。報告呼籲各國政府應將政策目標轉化為可執行的法規細則，並建立跨部會的醫療 AI 治理協調機制，才能真正保障患者安全與演算法問責。此研究對正在研擬或修訂醫療 AI 監管框架的國家（包括台灣）具有重要參考價值，也提醒醫療機構不應僅依賴外部監管，而應主動建立內部 AI 治理制度。", "tags": ["AI監管政策", "全球治理", "法規落地", "醫療AI治理"], "author": "未標示（Bioengineer.org｜2026-10-12）", "source_url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxNZkVKclJ1MXdCRDRWT3J0OEhGVG0zVER0MWlwaEtLWnZ5eHhlYUNQVDNvb2l5eHdjVnNnU2hBbnhObmFvRDZ0Q3JzcHJhZU5rcS12ZmExMXp5c0ZPZmNpM0t2NFo0MGFYcE9xeWFheVpGazloX2dfcFRINXVjM0tSSTdoX3kwTzZzYnBhRUo5QU1ydm1mcTQ2Ri1rVFJWaFB5SzU2dXFaSENUQXhHekNz?oc=5"}, {"rank": 2, "score": 8.0, "title": "臺大醫院 AI 轉型實踐：以人為本的智慧醫療落地經驗", "summary": "臺大醫院積極推動 AI 與醫療流程的深度整合，在保持人文溫度的前提下導入智慧科技，涵蓋臨床診斷輔助、病歷分析、住院管理與病患溝通等多個場域。院方強調「以人為本」的核心價值，確保 AI 工具的設計與部署以提升醫病互動品質為優先，而非單純追求效率指標。此案例展示了台灣頂尖醫學中心如何在技術導入與人文關懷之間取得平衡，並透過跨部門協作機制推進數位轉型。對台灣其他醫療機構而言，臺大的實踐模式提供了可參考的落地路徑，尤其在醫護人員接受度、倫理審查與患者體驗設計等面向具有示範意義，值得醫院領導層深入研究借鑑。", "tags": ["智慧醫院", "台灣醫療AI", "數位轉型", "以人為本"], "author": "未標示（風傳媒｜2026-10-12）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBvVWNvVTA4bFdtR3gtM0JUVE9Lc1dFNG9lSUYxTnNTYXZGOGhxR3lVdXM2RW42WUZhU0dubE5ZWUxUdGlUc1JSUFVObExoLXdH?oc=5"}, {"rank": 3, "score": 7.5, "title": "UAE 成為醫療 AI 試驗場，但真正的考驗在試點結束之後", "summary": "阿聯酋（UAE）近年大力投資醫療 AI，吸引多家國際科技與醫療機構在當地進行試點部署，涵蓋影像診斷、電子病歷分析與遠距醫療等領域。然而，報導指出真正的挑戰在試點結束後才開始：如何將初期成果轉化為可持續運營的臨床工作流程、如何確保在地化數據治理合規、以及如何建立本地醫護人員的技術能力，均是待解難題。此案例揭示一個國際普遍現象：醫療 AI 試點成功率與規模化落地成功率之間存在巨大落差，根本原因在於機構文化變革、法規配套與長期資源承諾的不足。對正在評估 AI 擴大部署的醫療機構而言，UAE 的經驗提供了超越技術層面的重要警示。", "tags": ["醫療AI落地", "國際案例", "試點擴展", "AI導入挑戰"], "author": "未標示（Fast Company Middle East｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxNdkEwcExxZzQzVXkxWHRTY3JHdFZIcm9uaGFmVlR2ZGhwWEVPajhITndkVTRyYVppX3ZTLTRnZmplN0IzZGFRWHlScUoySWd0d2kzTXc0dVlCeVRaUkFQQmR6TUMzYm8zSzk5Y1diZHpSQm44Um5JbzFYSmk2RExxcFZRQVRfQ0pXN3JaWG5GMEZZVFdEVmpadnlWdXlGb2dTeXNFU202eVhsbDdUcjhVaWFjWDVRbzBPOWZrZl9EMmJ6Zw?oc=5"}, {"rank": 4, "score": 7.0, "title": "Epic AI 帳務系統錯誤引發患者追討 2.7 萬美元糾紛，AI 醫療帳務風險再受關注", "summary": "美國一名患者已結清醫院帳單後，醫院使用的 Epic AI 帳務系統仍自動發出追討 2.7 萬美元的催款通知，引發嚴重的醫病信任危機。此事件凸顯醫療機構在導入 AI 帳務自動化系統後，若缺乏人工覆核機制與異常偵測流程，可能對患者造成實質財務損害與心理壓力。報導進一步指出，AI 帳務錯誤在美國醫療機構中並非個案，而是系統性問題，根源在於訓練資料不完整、與電子病歷系統整合不穩定，以及自動化流程中人工干預節點不足。對醫療機構的財務部門與資訊部門而言，此案例強調在 AI 帳務系統上線後仍需維持嚴格的例外處理流程與患者申訴機制，以避免法律與聲譽風險。", "tags": ["AI帳務風險", "Epic", "患者安全", "醫療糾紛"], "author": "未標示（Washington Examiner｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOSkFnYzdOLWtHNzhGTWplQTB1bEpseHY2czhDSmhEdnpuQ0ptZ01lU3JaSUdxWnR3bU9PcmVlNmtURDk1aTRPU2NZYkV0UG1nZGl4Y0ZsRGc0WHJnYUwyZjQ1cHZHM1pveE5tRWEzNHpNMXJyQllnYi1mSW5tLTdfNTlYRTFDcVJXR3FjRkxWSnRfQQ?oc=5"}, {"rank": 5, "score": 6.5, "title": "台灣 DentAI 360 AI 牙科系統榮獲《哈佛商業評論》鼎革獎，成為牙科 AI 創新楷模", "summary": "台灣當代牙科醫療體系開發的 DentAI 360 智慧牙科系統，獲得《哈佛商業評論》台灣版鼎革獎 AI 創新楷模獎，肯定其在牙科數位化與 AI 輔助診療上的創新成就。DentAI 360 整合口腔影像 AI 分析、病歷智慧管理與療程規劃輔助功能，協助牙醫師在診斷效率與治療精準度上取得顯著提升。此案例顯示台灣本土醫療機構已具備將 AI 落地於特定專科的實踐能力，並獲得國際知名媒體的認可。對醫療機構而言，此獎項亦反映出 AI 應用已從大型醫院的影像科、急診延伸至基層牙科診所，醫療 AI 的應用場景正在快速多元化，值得關注此波趨勢對各專科數位轉型的啟發意義。", "tags": ["台灣醫療AI", "牙科AI", "AI創新獎項", "數位醫療"], "author": "未標示（PChome Online 新聞｜2026-10-12）", "source_url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxNM3NKWFRoOEI4WFBGNU1LXzFlejdFbFE2QWdwRGZtRVNmUng4TXpvbjhGYzcwaG5ULXc2ZHJOeHlYNk1pb0VxNU9UeV9FMVlZbnJUM2Z4bnd0ZXhfY2VkS2YyWFhDclRVeGJmdzdMZ0FwVGpKMlR4Ukg4YVdnOVFlVTFVdzBOdG8?oc=5"}]}, "2026-10-11": {"date_str": "2026年10月11日", "weekday": "星期日", "items": [{"rank": 1, "score": 8.5, "title": "醫療 AI 評估新指標：以實體辨識取代字詞比對，更精準衡量臨床資訊完整性", "summary": "Bioengineer.org 報導，研究人員提出一套全新的醫療 AI 評估指標，核心概念是以「實體保留率」（entity retention）取代傳統的字詞匹配方式來評估模型輸出品質。傳統 BLEU、ROUGE 等指標僅比對字詞重疊程度，無法反映醫療摘要或報告是否保留關鍵臨床實體（如藥物名稱、診斷代碼、劑量數值）。新指標能更準確判斷 AI 在摘要、轉錄或報告生成任務中是否遺漏重要資訊，對臨床安全性具直接意義。研究者認為，當前許多醫療 AI 系統在基準測試中得分亮眼，卻在實際臨床場景中表現欠佳，根本原因正在於評估方式與臨床需求脫鉤。此一新框架若獲廣泛採用，將對醫療 AI 開發商的模型驗證標準與醫療機構的採購評估帶來實質影響。", "tags": ["AI評估指標", "臨床資訊品質", "模型驗證", "自然語言處理"], "author": "未標示（Bioengineer.org｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxOakQ3clZNbW10b0RJdTZ1eEd0eUw0ejRMUTloYUtCa1NjSm9Kb1d5OXFPNmUwNElLWlNVblFvUGdKdXdHUkYxa1Q0VFJDT3g0aGF6aXh6V29vWXVUUTc2TkFCSjZyV2tjWlM2LU1Dd2wwRE8zckNFRW9Cd1FaVWxpVUNRazladzlrNG04cG1ZNDZaSjJiSE03SktLMDVuay14eW1lWXp3"}, {"rank": 2, "score": 8.0, "title": "高分低效：醫療 AI 筆試優秀、臨床實戰不足的深層缺陷", "summary": "Bioengineer.org 報導指出，部分醫療 AI 系統在標準化測試（如醫師執照考試題庫）中表現優異，卻在真實臨床環境下表現不如預期，此現象被研究者稱為「高分低效（High Test Scores, Poor Bedside Performance）」缺陷。文章分析其根源在於：訓練資料與實際診療情境之間存在分布差距、AI 缺乏動態臨床脈絡理解能力，以及評估基準未能充分模擬真實醫病互動複雜度。研究建議醫療機構在引入 AI 輔助決策工具前，應設計貼近本院工作流程的前瞻性評估，而非僅依賴供應商提供的基準測試成績。此議題對臨床 AI 採購決策與院內驗證流程具有直接參考價值。", "tags": ["臨床AI驗證", "AI效能落差", "決策支援", "採購評估"], "author": "未標示（Bioengineer.org｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMinAFBVV95cUxPdmU5VFYzT2pfQmI0QnI0UXVLMWItZ1cybXhJd3ZTbVk1RTN4VEhISUFpV1NfMDc3SDhKRGJlOW43X2duX2F6MnlzclFxdHhIT01fVzZFa2VTcE9oMDRCaTQ0VzFFQTBycml6a21FSDFSMllFX3NFS29NaXE4SEQ4blA3bGgzcHJiSXVyU0xiTEVBd2VfanN6Q0dxTGI"}, {"rank": 3, "score": 7.5, "title": "女性獲得較少積極醫療處置，醫療 AI 性別偏差問題引發關注", "summary": "Digital Journal 報導，多項研究顯示女性在醫療體系中獲得的積極治療普遍少於男性，涵蓋心臟病介入治療、疼痛管理及癌症積極療法等領域。這一現象引發醫療 AI 研究者的高度警覺：若 AI 系統使用帶有性別偏差的歷史診療資料進行訓練，將可能系統性地將「對女性減少治療」的偏差模式學習固化，進而在臨床決策支援中持續複製不平等。專家呼籲醫療 AI 開發與部署單位應主動進行性別分層的模型偏差審查，並在演算法設計階段納入公平性指標。此議題對採用 AI 輔助分診、治療推薦或資源配置系統的醫療機構具有重要的倫理與法規遵循意義。", "tags": ["AI偏差", "性別公平", "演算法倫理", "臨床決策支援"], "author": "未標示（Digital Journal｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMixgFBVV95cUxQamVjYmRSZ0ltV3IxQktoVVlDVVdUSmhLa1pMakVGTmdPS2tFRXE5VXpBWm0yajlkUjB5VkVlMi1XcFBxM2J6aTBwZHRmeURVMFVFMHdEVWZqVGZ4TVJ2V2wxeC14VXZBdHZ3cGRtTTR3VWNGeG5icjJBbDNPU1I0SUpHdUxVSXNfRjBSRmtWdEN2WFV5S1hKc0puTThUSjM1NDhSNV9ZMmhaU2x5blY2TkdKRjZhZVdrRzhJd09yblotTlI1UkE"}, {"rank": 4, "score": 7.0, "title": "透過資料與實證建立醫療 AI 信任：Regenstrief Institute 觀點", "summary": "Regenstrief Institute 發表論述，主張建立醫療 AI 公信力的核心路徑在於嚴謹的資料治理與可重複驗證的實證基礎，而非單純依賴技術宣傳或廠商聲稱。文章指出，醫療機構在評估 AI 工具時，應要求供應商提供透明的訓練資料來源、資料品質指標及獨立機構驗證結果。Regenstrief 作為美國重要的醫療資訊學研究機構，強調多機構資料協作與標準化評估框架的重要性，並呼籲醫療 AI 的信任不應建立在單一機構的內部測試上，而應透過跨院所的前瞻性研究加以確立。此觀點對正在制定院內 AI 治理政策的醫療機構領導層具有參考價值，尤其是在建立 AI 採購標準與績效監測機制方面。", "tags": ["AI信任", "資料治理", "醫療資訊學", "AI治理"], "author": "未標示（Regenstrief Institute｜2026-10-10）", "source_url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE05UzFhSG9zeFlnSmJqMDM4YldhSUZGWWl5RTEwZWdVTXpua0pjSlBsYVQzZ0M2RkZpblpHQWFNOUY5WkZYTi1iQjRQWldWS3Z4ZXItek9sbmlickxPTjZnWXI4bGJEVThXdkU0ODZBX0RwcDg"}, {"rank": 5, "score": 6.5, "title": "醫療 AI 需要即時運營脈絡，而非僅仰賴更多歷史資料", "summary": "Healthcare IT Today 發表分析文章，指出目前醫療 AI 系統的一個核心侷限：多數系統過度依賴龐大的歷史訓練資料，卻缺乏整合即時運營脈絡（operational context）的能力，例如當前病床占用率、值班醫護人員專長、設備可用性及即時排班狀況等動態資訊。作者認為，若 AI 決策支援工具無法感知醫院當下的實際運作狀態，其推薦結果往往與現實情境脫節，反而增加臨床人員的認知負擔。文章建議醫療 AI 開發應朝向即時資料整合架構演進，並與醫院資訊系統（HIS）及臨床工作流程平台深度對接，方能真正發揮輔助決策的價值。此觀點對醫院資訊部門規劃 AI 基礎架構具有實務參考意義。", "tags": ["AI工作流程", "即時資料整合", "醫院資訊系統", "臨床運營"], "author": "未標示（Healthcare IT Today｜2026-10-10）", "source_url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxOekd6YzhaUnNGcmliVm01TXlVd09lOUNlaGgtcWtaZ0htSFp0MEZjZnpvZHJub0NJUGVfMlFrZ3cwM1RvVV9xalItX3pIaVFVVElFYUdLalBfQS0xRUVnVW1wQjRMdkJmWVM1M1RFeTBsRU43MWdvZld5RldTVllJTlhKcEQyWnlWZnlKcjB6TkgxeDdDZmZEeWQxZ1h5SC02b2pzOEZ5NmZoT0UwUHduVVd3"}, {"rank": 6, "score": 6.0, "title": "台灣 2026 國產 AI 3D 醫療影像暨元宇宙應用大會舉行", "summary": "中央社報導，2026 年台灣國產 AI 3D 醫療影像暨元宇宙應用大會正式登場，聚焦本土研發的三維醫療影像 AI 技術與元宇宙在醫療教育、手術模擬等場景的應用。大會匯聚台灣醫療 AI 新創、醫學中心及影像設備廠商，展示國產 AI 在放射科、病理科及外科輔助領域的最新成果。活動凸顯台灣在醫療影像 AI 自主研發能力上的持續投入，並探討 3D 影像重建技術與沉浸式醫療訓練環境的結合潛力。對有意採購或評估國內醫療影像 AI 解決方案的醫療機構而言，本次大會提供重要的市場與技術觀察視窗，亦反映台灣醫療 AI 產業在國際競爭中尋求差異化的策略方向。", "tags": ["醫療影像AI", "台灣醫療AI", "3D影像", "元宇宙醫療"], "author": "未標示（中央社 CNA｜2026-10-10）", "source_url": "https://news.google.com/rss/articles/CBMiU0FVX3lxTFBGX0ZqTkRIa24zYVV3LWFJaE1xNlkyTkZsLWhZV2l2ZXpFSmZBX3lIVGIxQnZXeHA1UjJnWWFsRDczN0JyQmZGTDZyT0UxLXBXYmI0"}, {"rank": 7, "score": 5.5, "title": "報告揭醫療業 AI 資安缺口：近半機構技術防堵能力不足", "summary": "商傳媒報導，一份最新研究報告指出，醫療業在導入 AI 系統的同時，資訊安全防護能力卻未能同步跟上，近半數受調查機構表示在技術層面難以有效防堵 AI 相關資安威脅。主要風險涵蓋訓練資料遭竊取或篡改、AI 推論介面被惡意利用、以及醫療 AI 系統與院內網路整合後擴大的攻擊面。報告強調，醫療機構在評估 AI 工具效能的同時，應同步進行資安風險評估，並建立針對 AI 系統的專屬資安管理框架，包含模型存取控制、異常行為監測及供應鏈安全審查。此議題對正在推動數位轉型的醫療機構資訊部門而言，具有重要的風險管理參考意義。", "tags": ["醫療AI資安", "資訊安全", "數位轉型", "風險管理"], "author": "未標示（商傳媒｜2026-10-10）", "source_url": "https://news.google.com/rss/articles/CBMi0AJBVV95cUxPQ3YxOFR1THVyZnNfb2Z3T3VJTU1fdEF6VHdDLTF3Y0tCdXlwUkdqX2l2WjRXRm56T2ZDUGRzRC1Cd2pDRThVeWJzS1JvZUVpOGNwX0w1bm5pMmlOaFJsM3Y1ZEk5eHJheXZmVEJId0l2ZHREX2tpblhTcTMyMGs2STBLWTRZRjBkX0xON1VRZy1fRWFzOWhFaGI5czNtVzFTWV9OZ2R1T3JIdGdYXzY0NXpyMWJ0MGlWSEtMQ0FaUHcwcUV4RjZIcHJGVXd0VlRuV3pESVNTLWgxQVA5STVuTndrR1R1YTJRaE9OOUdPRHQxXzJaUVM3a3ZNNmZfVDVhbGZMMmdrMGhsZF93dmpxOWsxNjFvdnEyV1YwQTFTWDJodmRnaFlFMXhLNGdBQWcya3A0S1g1SEo0NmJqUllJNzVvVmhwTlRDcEhtS3F1SFE"}]}, "2026-10-10": {"date_str": "2026年10月10日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.0, "title": "《刺胳針》通訊：立即規範醫療 AI 前瞻性開發，呼籲翻轉「先開發、後監管」慣例", "summary": "發表於《刺胳針》的通訊文章指出，AI 技術進入醫療領域的速度，已遠超法規、倫理與臨床反思所能跟上的節奏。現行模式普遍假設「技術只要能開發就應開發，臨床定位事後再議」。作者群認為此邏輯應予翻轉：在 AI 工具正式進入臨床前，監管與倫理框架就必須到位。文章強調，醫療 AI 的前瞻性規範不僅是技術管理問題，更攸關病患安全與專業責任。此一呼籲與全球多國政府及 FDA 正在研擬的 AI 治理方向高度呼應，對於正在評估或導入 AI 工具的醫療機構而言，具有重要的政策參考意義。醫院領導層與資訊團隊在推動 AI 採購與上線決策時，應將前置倫理審查與法規符合性評估納入標準流程。", "tags": ["醫療AI治理", "法規監管", "臨床倫理", "政策框架"], "author": "未標示（The Lancet｜2026-10-10）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01941-0/fulltext?rss=yes"}, {"rank": 2, "score": 8.5, "title": "英國發布 44 點醫療 AI 監管藍圖，全面重塑臨床 AI 治理架構", "summary": "英國政府正式公布一份涵蓋 44 項具體措施的醫療 AI 監管藍圖，範疇橫跨 AI 工具的上市前審查、上市後持續監測、透明度要求及問責機制，被形容為英國迄今最全面的醫療 AI 治理行動方案。此藍圖發布時機恰逢 NHS 大規模採購 AI 工具之際，顯示英國試圖在推動創新的同時建立可持續的安全護欄。對台灣醫療機構而言，英國的框架設計——尤其是「上線後持續監測」與「問責鏈」的建構方式——具有直接的參考價值，可作為國內醫療 AI 治理政策制定與院內 AI 委員會規章設計的重要借鑑。此一動向亦反映全球主要醫療體系正從「許可即放行」轉向「全生命週期監管」的趨勢。", "tags": ["醫療AI治理", "英國監管", "政策法規", "全生命週期管理"], "author": "未標示（Bioengineer.org｜2026-10-10）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxOcFNvbG10VlNfRzRlLXE2eS02QlpxVWhUSUIyWERsZE1fd1ZicVlSazVGb1QxdFBLV1hacUREZEgzN0FlYWVIQk96cEZWN3drRzVhMFVoSFhHdDJaeUpRWm84blhmQ1VpNnBpYmotWGlUYmJNWmFENGJyQnRnTG9PUHVBN3BLVXdyWnFRWncyMVp0TzB4Vlcw?oc=5"}, {"rank": 3, "score": 8.0, "title": "AI 分析現有放射科報告，脂肪性肝病患者辨識率提升 360%", "summary": "最新研究顯示，透過 AI 工具系統性重新分析醫院既有的放射科報告，脂肪性肝臟疾病（steatotic liver disease）的患者辨識率提升高達 360%。傳統上，此類代謝疾病在常規影像判讀中常被忽略或低估，導致大量患者未能及時進入治療流程。該研究證明，AI 不需仰賴新硬體或額外影像採集，僅透過重新處理既有結構化或非結構化報告資料，即可大幅提升臨床偵測敏感度。此模式對資源有限的醫療機構尤具吸引力，因其邊際建置成本相對較低。對醫院資訊部門而言，此案例也說明醫療文字 AI 與 NLP 技術在既有資料庫中的潛在價值，值得評估作為篩檢或品質改善工具的可行性。", "tags": ["放射科AI", "NLP", "肝臟疾病", "既有資料再利用"], "author": "未標示（Medical Device Network｜2026-10-09）", "source_url": "https://news.google.com/rss/articles/CBMi0gFBVV95cUxNT3F3VzZOUjFyZEh1UzBJRmxDQTJyRnpyeU9hSElGQnlZemVfZVNlM3FnVy0zcmkyV0tpRzJkdFJybFRtWWFXSVZpWHo1OVk0S3ZaS0xBNmZyZW9xWUJkc2pHd2MyRGkyZkQwYkdqTDVkOGtIY1Mxb1E3S0xJVmVUdVRXVUZhcWk0T0YyMm9fM21EeER2eVZia2ItTmYyNHpiOFhVZC1MdVcxT2UybU9UYlRZTlY0d3BfUDB4cTNyLUdCYk53dlRpUEV5OEIzenlKZnc?oc=5"}, {"rank": 4, "score": 7.5, "title": "Aiforia 與 PathAI 合作，擴大數位病理 AI 工具的臨床可及性", "summary": "數位病理 AI 領域兩大業者 Aiforia 與 PathAI 宣布合作，整合雙方平台以擴大數位病理分析工具的可及範圍。Aiforia 專注於組織影像的深度學習分析，PathAI 則以病理 AI 輔助診斷及藥物開發為核心業務。此次結盟意在讓更多醫療機構與研究單位能以更低門檻使用高精度病理 AI，加速切片判讀、腫瘤 const TODAY_ISO  = "2026-10-14";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
