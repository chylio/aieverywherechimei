<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年05月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }

  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }

  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }

  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }

  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }

  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  

  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }

  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }

  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }

  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }

  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }

  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

最受矚目的發展方向之一，此次獲得突破性認定不僅代表技術層級獲FDA肯定，也為醫院影像科提供了明確的監管進展訊號。對於正在評估AI輔助影像診斷導入的醫療機構而言，此案例顯示監管路徑已逐步明朗，相關解讀效率與報告品質的提升具備更強的政策背書基礎。", "tags": ["放射影像AI", "FDA認證", "生成式AI", "突破性器材"], "author": "未標示（Medical Product Outsourcing｜2026-05-12）", "source_url": "https://news.google.com/rss/articles/CBMitwFBVV95cUxQNEJja0hIOEZiR2NmX1VBZ2pBSFFadm9SYW95QUZERktsMFZIZDB0OVN2QThSOHhEemFfdUVvUnlMckpZWHlOa1lQMm10V1hzcnliV2tjY3F4NUhqYXhxVGtCaU0xbXpjcFNIVkRnTHk1ZEhIWnBQSU4ySUJ5bGI1TXBWYlNZOFBjeGFvcGhWSHljS0g1S0gtT2hpeU9TVjNEdTFZY0lwMzFNbEJqMFpqeFBKY0Z1U2c"}, {"rank": 2, "score": 8.5, "title": "AI賦予病理科醫師「空間超視力」，可偵測傳統檢查難以發現的隱藏癌症", "summary": "一項發表於Technology Networks的研究報告指出，最新AI工具能為病理科醫師提供所謂「空間超視力」（Spatial Super Vision），透過整合空間轉錄組學（spatial transcriptomics）與影像深度學習，使病理醫師得以在組織切片中識別傳統H&E染色無法輕易辨別的隱藏癌細胞及微環境特徵。此技術突破傳統病理判讀的解析度限制，能在細胞層級甚至次細胞層級揭示腫瘤異質性與侵犯邊界，對於早期癌症偵測及治療計劃制定具有高度臨床價值。該工具不僅提升診斷精準度，也有助於減少因閱片主觀差異造成的誤診。對癌症中心、病理科及數位病理推動團隊而言，此類AI工具代表數位病理進入新的功能維度，值得密切追蹤其臨床驗證與導入可行性。", "tags": ["數位病理", "癌症偵測", "空間轉錄組學", "臨床AI"], "author": "未標示（Technology Networks｜2026-05-11）", "source_url": "https://news.google.com/rss/articles/CBMivgFBVV95cUxOaEV3TVJpempqZ0hHaTlVTjFlcWNMSnE2dVp4dGtPcllibEFnNXBXc01NRTZnZHhncllVY3NLWUdBeHY3SzhjdUVaOHU1QkMzVW4xOUFxNThxZFI5a1l0VU04eFBxTm05T3U2TGx3dFlqaUNaalBZemQzend1QjlkdW9fSjl1c2JIWmRuSFZZVVlreFpXN2N2QURGeEpQYUZ6S2RGYk9ocDhtMHY3N0UxT0FPUWJ1ZlFNbnR5TnRB"}, {"rank": 3, "score": 8.0, "title": "醫療AI品質治理新動向：農村醫療、AI代理品管與合規平台集體發力", "summary": "Healthcare IT News報導，為提升醫療AI的臨床安全性與法規合規性，多項集體治理與平台升級方案同步推出。全國農村健康協會（National Rural Health Association）聯合Viz.AI與InterSystems，針對農村醫療協調不足的問題，推動AI治理框架與工作流程自動化，期望縮小城鄉數位醫療落差。與此同時，Credo AI發布新版AI治理平台，強化對AI代理（Agentic AI）的行為監控與品質評估能力；Zyter｜TruCare及Infinitus Systems亦各自宣布強化agentic AI品質保證的新工具。這些進展反映出醫療AI生態系正從「導入期」邁向「治理期」，重點已從功能展示轉向可解釋性、偏見監測與持續合規管理。對醫院資訊部與數位轉型團隊而言，建立AI生命週期監控機制的急迫性正在上升。", "tags": ["醫療AI治理", "農村醫療", "AI合規", "工作流程自動化"], "author": "未標示（Healthcare IT News｜2026-05-12）", "source_url": "https://www.healthcareitnews.com/news/vendor-notebook-health-ai-bolstered-co cFFMOFNiSmJneTI1NzlJWDd3bnJmY3A3ZGpPbFJ5akFhWVJkeS1XWlBfaWdmZmlIVjFhZWpFZEJ6SjJlS1A2OFRoYWNub3RRVlIzckxEZFVVTm1VNHc"}, {"rank": 2, "score": 8.0, "title": "數位病理與AI時代正式來臨：專家解析臨床導入的機遇與挑戰", "summary": "資深病理專家Jayesh Deshmukh於Oncodaily發表深度評析，指出數位病理結合AI的時代已全面到來。他強調，AI輔助病理診斷不再僅是研究工具，而是正在改變日常病理判讀流程的實用技術，包括腫瘤分型、生物標記評估與預後預測等應用已日趨成熟。文章同時探討醫療機構在導入數位病理平台時面臨的挑戰，涵蓋硬體基礎設施建置、病理師再培訓、法規核准以及數據安全等面向。對於醫院領導層而言，此評析提供了評估數位病理投資優先序的重要視角，亦呼應近期Roche收購PathAI等產業整合趨勢，顯示數位病理已成為全球醫療AI發展的核心戰場之一。", "tags": ["數位病理", "AI診斷", "病理科", "臨床導入"], "author": "未標示（Oncodaily｜2026-05-10）", "source_url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE1UUFFSS1dfMi1Ka0dQLWpLUkVOMTF2cVliUGlhNjF3Z3VXdi1CTl9PcUdpb2ZIRkEwampQazIwZ3ptYWswcG93bllpdXYxcEdUMGlkTFNfMWJHZ1RfZ21OVw"}, {"rank": 3, "score": 7.5, "title": "醫院能否信任AI處理數字運算？臨床應用中的數值推理風險探討", "summary": "《The Daily Star》刊載一篇針對醫院使用AI進行數字相關任務的深度分析，核心問題是：AI在醫療環境中處理數值計算、劑量換算、檢驗數值解讀等任務時，可靠性究竟有多高？文章援引多項近期研究，指出目前主流大型語言模型在數學推理與精確數值計算上仍存在顯著缺陷，可能在臨床決策支援中產生誤導。報導強調，醫院在部署AI工具前必須嚴格評估其數值處理能力，並建立人工複核機制，以避免因AI計算錯誤造成的醫療傷害。此議題對醫院資訊部、藥劑科及臨床決策支援系統建置團隊具有直接的政策與操作意涵。", "tags": ["臨床AI安全", "大型語言模型", "醫療決策支援", "風險管理"], "author": "未標示（The Daily Star｜2026-05-10）", "source_url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNQ09GcFo3RlZ0djdRUV9NRGZ4dDVucGJMTllvUHU0VUgyZzZJN1JTemFoaFN6bEk2aTVBS3hnclNyd0hBMGpqY2F6MVVfNG5uRHJOd2M2MHdQMF9LWkpHTzV6Nno4c3RWWVR5OXc5NGtvd0prQllRUEhFYUc2TExnSndoMVpKUQ"}, {"rank": 4, "score": 7.0, "title": "AI精準診斷對抗抗生素抗藥性危機，醫界面臨百年最大轉折", "summary": "TechNews科技新報報導，AI技術正快速應用於對抗全球抗生素抗藥性（AMR）危機。透過機器學習分析病原菌基因組數據與臨床表現，AI模型能在數小時內預測特定細菌的抗藥性譜，大幅縮短傳統藥敏試驗所需的數天等待時間，協助醫師更早啟動精準抗菌治療。報導指出，WHO已將AMR列為全球公共衛生頭號威脅之一，而AI輔助的快速抗藥性鑑定有望改變感染科的治療典範。對於設有感染管制中心與微生物實驗室的醫院而言，評估導入AI輔助細菌抗藥性偵測系統的時機已日趨成熟，此類技術亦與健保抗生素管理政策方向高度契合。", "tags": ["抗生素抗藥性", "感染管制", "AI診斷", "精準醫療"], "author": "未標示（TechNews科技新報｜2026-05-09）", "source_url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxOLXFiN0lRaGdSbEFuOUxYSDg2VDVQX28zZVR1a18tWmhnLUY2VmlaZzlOOThKWkp6dXhUQUd4MVZ0Z1lEdlNXbXBUeHFXS2xEanR6T2lZdlpzWnBzLWNZZHdY     `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');

  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];

  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;

  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;

  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');

  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));

  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');

  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');

  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });

  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}

// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');

  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;

  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}

// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>

</body>
</html>
