<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年08月11日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

海此模式提供了產業合作的可借鑑樣板，同時也凸顯臨床需求訪談與使用者研究在AI專案中的關鍵地位。", "tags": ["醫療AI落地", "流程自動化", "產業合作", "臨床共創"], "author": "未標示（元氣網｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5MbldaYUVncmxmY0p3cDBhck1raHMyYWtfM0JLOHA3OUd1SmhIcGRZOWN3clFHT2hLb2NVWS05aXcyUy15TFdtRi01dVZrVWZJdDdiRjhQZkdZUXZiRGxr0gFkQVVfeXFMT0xPNERMaFU4TVVLWXZSbFhFa2h0T0VvY3JmVHBxMnRPMkZXQWhMQWttRjZaRHlWRWRaWHc2SDBLUDAwN2JBN1JaeFdzMmhYTjlJQXgwZUh4VWJXOXFMZkZMV3dEUA"}, {"rank": 5, "score": 7.0, "title": "台北AI醫療生態系對接日本關西，15家企業展示台日智慧醫療創新成果", "summary": "台北醫療AI生態系與日本關西地區展開正式對接，共有15家台日企業共同展示智慧醫療創新成果，涵蓋診斷輔助、遠距照護及醫療數據應用等多元場景。此次交流標誌台灣醫療AI產業在東亞市場的國際化布局再邁一步，顯示台日雙方在法規環境、技術互補與市場拓展上存在合作空間。對台灣醫療機構而言，國際對接活動有助引進日本成熟的醫療AI監管經驗及使用案例，同時也為本土廠商提供進入日本醫療市場的可能路徑。隨著亞太地區智慧醫療競爭加劇，此類具體的台日創新聯動，對於建立台灣醫療AI的國際品牌形象具有積極意義。", "tags": ["台日合作", "醫療AI生態系", "國際化", "智慧醫療"], "author": "未標示（TechNews 科技新報｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxNeGg1ZEZsNzlBX1Jrb1F1Zkx1MHlHRHJabnhXdXhKMkQyUmFNbzBnc1ZqYU1TNXd3emY4UnNGenh3VW9lZFNMUVotQi1yVS1RQm1xZE1OMFR6NGtESW9BMVRmd1hXLWdRTS0xWngxQ0RtQ0NBMldzSDFCZVdmbWVPQl9oa2RlTGxVYV9FMXZPSDhtZG9wVWdUaVZoVXlBaEU0MXNWSkkwZDYtTWRtc1B0OTZhYk8zcW9FUUI0SmR3SnUwdUlkTmt1alBFa3BuNWxOMm52ZzVCd3JYYnpqV3pXLVdJRGV2TmVQVmxabGM2ZjVtQms"}, {"rank": 6, "score": 6.5, "title": "外科與放射科合作評估AI聊天機器人輔助腎上腺結節病患諮詢", "summary": "美國威斯康辛大學麥迪遜分校外科與放射科聯合研究團隊，針對腎上腺結節病患導入AI聊天機器人工具，評估其在病患教育、諮詢解說與就醫導引上的實際效益。腎上腺結節是影像檢查中的常見偶發發現，病患往往對後續追蹤流程感到困惑，此AI工具旨在填補醫病溝通缺口，降低不必要的焦慮並提升就醫效率。此研究的特殊之處在於跨科室的聯合評估設計，由外科與放射科共同主導，兼顧臨床與影像診斷視角。對放射科及相關臨床科主任而言，此案例展示AI輔助病患溝通工具在偶發影像發現管理中的潛在應用，值得關注其後續臨床驗證結果。", "tags": ["AI聊天機器人", "病患溝通", "放射科", "跨科合作"], "author": "未標示（University of Wisconsin–Madison｜2026-08-08）", "source_url": "https://news.google.com/rss/articles/CBMixgFBVV95cUxNekF1VDUwWXlDV3k5SWQtU0RfMWp3NGxqV184amdIMjROZFpKRW1ydTdvbk52ZW1HVVRrVE9pZ205RUJBSzJZaEZXdFZEVks0bWhrWlZHMnAxOURhLWQ4SndWOEx6QXEtWGIzN2JRZmRGRENWWG8yMmhLRHlYSXpPa3VkRm5CQ285bEhpcGo3X1VFcmkxbWtpTTgwUGQ5cmlKXy1kb1RKUWQtc0NiRl95eGRyYmdDOW82YWdhNWlLMHNhcXRpekE"}, {"rank": 7, "score": 6.5, "title": "Doximity股價暴漲50%：醫療AI商業潛力引爆市場熱情", "summary": "美國醫師社群平台Doximity股價單日飆升逾50%，主要驅動力來自市場對其醫療AI功能商業化前景的高度期待。Doximity近期持續強化平台內的AI輔助工具，包括臨床文件生成、病患溝通摘要等功能，吸引大量醫師用戶採用，進而帶動廣告與訂閱收入成長預期。此波漲幅反映資本市場對「已有大規模臨床用戶基礎的醫療AI平台」給予高度估值溢價，顯示醫療AI商業模式正在從「概念驗證」走向「獲利兌現」階段。對醫療機構數位轉型團隊而言，Doximity案例揭示醫師日常溝通平台作為AI應用切入點的商業可行性，也提供評估類似工具採購時的市場參考座標。", "tags": ["醫療AI商業化", "Doximity", "臨床文件AI", "數位健康投資"], "author": "未標示（marketwatch.com｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMitwFBVV95cUxQaUNlRVM0ajBkbEtrRlh4bTdpZDRNZjBhM29FMDlkQ1h0TTNueTJDSHBOZ2FpbDJYeFhjdFJYYVlZYTBCY1lrdXRhaE1nQ096ZGNiemswVW1INHBlU3V1RGFKNEJ3VGcycDRNYVUtc0F4STdjVTUtelJxTVkxU3JUVUluQWZYemt5UE1QY055MkZSVEdFaDNnNnkzeDhiX092Si1OQU5hMU45cThMbHZFSzc3N0hjUEk"}, {"rank": 8, "score": 6.0, "title": "La Trobe大學AI工具：精準標記大腸癌復發風險，助力術後監測", "summary": "澳洲拉籌伯大學（La Trobe University）研究團隊開發的AI工具，可分析大腸癌患者的腫瘤病理特徵，精準預測術後復發風險，為臨床醫師提供個人化的術後監測建議。此工具的核心優勢在於能從現有病理切片中萃取復發風險訊號，無需額外昂貴的分子檢測，具備較高的臨床可近性。大腸癌是台灣發生率最高的癌症之一，術後追蹤強度與頻率的個人化調整，對資源配置效率影響顯著。此類AI風險分層工具若能通過前瞻性臨床驗證，有望納入外科與腫瘤科的術後照護標準流程，值得相關科室持續追蹤研究進展。", "tags": ["大腸癌AI", "復發風險預測", "病理AI", "腫瘤學"], "author": "未標示（MobiHealthNews｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxNNHhyeWh0Vi02MGtFNjNudnV6OUlKT0lua2FRWVlwWDkzN1RUeWc5NFhkQlUyTWlHLTJ3V0hSQWNpdjRPZjM1XzlWYUJ4ZkRfYW93VnVVME1aWHFWczluSFFUV04za2NhLXI3cGdRRWhDNENXbUdQTzYzU210WmJjdTBqSWEzNEUyVGo1N2h0SQ"}, {"rank": 9, "score": 5.5, "title": "觀點：AI不會強化醫師自主性，反而將進一步削弱臨床判斷空間", "summary": "前外科醫師Frances Mei Hardin於《STAT》發表評論，指出醫療AI的廣泛應用並非強化醫師自主判斷的工具，反而可能加速臨床決策權的移轉——從個別醫師手中轉向演算法、醫院管理層與保險給付邏輯。作者認為AI「是一面鏡子」，映照出醫師自主性長期被體制侵蝕的現實，而AI只是讓這一趨勢加速顯現。文章強調，問題的根源不在技術本身，而在於醫療體系如何部署與詮釋AI輸出結果。此觀點對醫院領導層具有警示意義：在推動AI臨床應用時，需同步思考如何在效率優化與保護臨床專業判斷空間之間取得平衡，避免AI成為進一步壓縮醫師自主性的制度工具。", "tags": ["醫師自主性", "AI倫理", "臨床決策", "醫療AI治理"], "author": "Frances Mei Hardin（STAT News｜2026-08-07）", "source_url": "https://www.statnews.com/2026/08/07/medical-ai-doctors-autonomy/?utm_campaign=rss"}]}, "2026-08-07": {"date_str": "2026年08月07日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "台灣立法院厚生會成立智慧醫療委員會，衛福部擬提 AI 醫療細則草案", "summary": "台灣立法院厚生會正式成立智慧醫療委員會，目標是建立「可用、可信、可追責」的 AI 醫療制度框架。與此同時，衛福部亦著手研擬 AI 醫療細則草案，預計針對 AI 輔助診斷、臨床決策支援等應用訂定具體規範。此舉標誌著台灣醫療 AI 監理進入制度化新階段：從過去各醫院自行摸索，逐步走向有法規依據的系統性治理。委員會的成立不僅有助於凝聚朝野對 AI 醫療發展的共識，更可為醫院導入 AI 工具提供明確的合規路徑。對醫療體系而言，此政策動向意味著未來 AI 系統的採購、部署與績效追蹤，將需符合更嚴格的透明度與責任規範，醫院資訊部門與法遵單位應提前掌握草案走向，及早進行內部盤點與準備。", "tags": ["台灣政策", "AI法規", "智慧醫療", "衛福部"], "author": "未標示（自由健康網｜2026-08-06）", "source_url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE1UMkNXbjBzX20xRDVWZzNqZmxtRmswX0I1SkRtTEpHNUF6bUU5S09sLVFFdE5QTXhiZ05CbWxZcmtrSHRYY0hxam5WUDJ5akxBQzlCTVhXOWw3ZVY5cXR1VlBmOGk"}, {"rank": 2, "score": 8.5, "title": "USC Viterbi 工程學院研究：提升醫療 AI 可靠性的新方法", "summary": "南加州大學 Viterbi 工程學院發布最新研究成果，聚焦於如何提升醫療 AI 模型的可靠性與穩健性。研究團隊針對臨床 AI 系統常見的偏差問題、模型泛化能力不足以及黑箱決策等挑戰，提出新的技術路徑，旨在讓 AI 輔助診斷與臨床決策工具在真實醫療場景中更具一致性與可信度。此研究指出，目前許多醫療 AI 工具在研究環境中表現優異，但部署至不同醫院或族群時往往出現準確率下降的問題，因此需要更嚴格的可靠性測試框架。對醫院資訊與數位轉型團隊而言，此研究所提出的方法論有助於評估現有 AI 工具的穩健程度，也為採購新系統時制定驗收標準提供參考依據，是推動負責任 AI 落地的重要學術基礎。", "tags": ["AI可靠性", "臨床AI", "模型穩健性", "學術研究"], "author": "未標示（USC Viterbi School of Engineering｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMigAFBVV95cUxORlFLMElNQk1YMDEtQ2hnZGdjNFFvUU1CaHlCbkdfVHhEakZYbmlVQkNWcnpfaE1ZMkNvWldYd1F3MTkwdnVjRWFISHhTLWNMbUJ2a2QtdlhjMmZ6MTVhcjZwWTNDQ0FucF9ORnByZHNpSDNGek0xQ21mcVJZSzhfcA"}, {"rank": 3, "score": 8.0, "title": "Atropos Health 與 Health Universe 合作推出 AI 臨床決策支援平台", "summary": "Atropos Health 宣布與 Health Universe 建立合作夥伴關係，共同推出整合性 AI 臨床決策支援解決方案。Atropos Health 擅長利用真實世界數據（real-world data）即時生成證據，Health Universe 則提供雲端 AI 應用部署基礎設施。雙方合作旨在讓臨床醫師能在診療過程中直接獲取由真實病患數據驅動的個人化證據支援，縮短「研究發表」到「臨床應用」之間的落差。此一模式對於缺乏大型研究中心資源的區域型醫院尤具意義，醫師可透過平台查詢特定治療方案在類似患者族群中的實際療效數據，輔助臨床判斷。對台灣醫療體系而言，此類結合真實世界證據與 AI 的決策支援工具，代表臨床 AI 從「影像辨識」向「治療決策」延伸的重要趨勢，值得持續追蹤。", "tags": ["臨床決策支援", "真實世界數據", "AI平台", "數位轉型"], "author": "未標示（MobiHealthNews｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxOUmdPdmZQUGkzLW11VFBPaG5PeERoMzZwcU9CYjh1TTM4Z1V5bmFvY0Rvb0pwanpLQnVGS2ZVeWxGUmt6cjF6enBUdjhGM2hYeTA0TVZDVEhWaUp5cEt6VHdITVg1RExxTUdXbGNjWW51eDE0Tl80M2hRVHROVVZSM25VSnpKTUhVVGF1VzB0MklNME90WDh4MXZHNlFaamd4RnpCcE1vOA"}, {"rank": 4, "score": 7.5, "title": "RSNA 發起 2026 年膝關節異常偵測 AI 挑戰賽，推動放射科 AI 標竿建立", "summary": "北美放射學會（RSNA）正式啟動 2026 年膝關節異常偵測 AI 挑戰賽，邀請全球研究團隊開發並競逐最佳膝關節 MRI 自動化分析模型。此挑戰賽延續 RSNA 多年來透過公開競賽推動醫療影像 AI 標準化的傳統，除有助於催生高效能偵測演算法外，也藉由統一的測試資料集與評分機制，建立客觀的 AI 性能比較基準。對放射科與骨科而言，膝關節病變（如半月板撕裂、前十字韌帶損傷、軟骨缺損）的 AI 自動偵測若能達到臨床可用水準，將大幅提升高量影像判讀效率並降低漏診風險。此挑戰賽的結果亦可作為醫院評估或採購膝關節 AI 輔助診斷工具時的外部驗證參考指標，具有直接的臨床採購參考價值。", "tags": ["放射科AI", "RSNA", "影像辨識", "骨科"], "author": "未標示（AuntMinnie｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxPMzl5Q3ZuOFlwZ19rZW9EajJHaDk5N3JqTks2bHR6RzgxOG1ENjJrRXZQVGc0VmQ1UnhQZG9SdlpKUTUwUTczWWZwaDRMRWplVEQ3YzJlLTV5bm1HOXQ4UTYya1d6dWExdmxlLUFaVzN2eGhWWnhWV1FqejdXQU1VTUFnaERBWU51ekdTMnQxa1ZyQUNrYWhyNHo2SHlWbXczUGFkSkhlaU1KU0lXeXdhWWRDbFlhSlRkcm1NRE1hUk5pbGxTUi1YNHpXMmJkV25weWtDc0FSeER0X1k"}, {"rank": 5, "score": 7.0, "title": "AI 應用於糖尿病腎病數位病理學：精準診斷新契機", "summary": "最新研究探討 AI 技術在糖尿病腎病（Diabetic Kidney Disease, DKD）數位病理診斷中的應用潛力。研究顯示，AI 模型能夠自動分析腎臟活體切片的組織影像，精確識別腎小球硬化、間質纖維化等病理特徵，並量化疾病嚴重程度，有望提供比傳統人工判讀更具一致性的診斷結果。糖尿病腎病是全球最主要的末期腎病病因，台灣亦面臨高盛行率壓力，其病理切片的判讀傳統上高度依賴病理科醫師的主觀經驗，具有相當的觀察者間差異。AI 輔助病理分析若能標準化，將有助於提升診斷速度、減少判讀差異，並支援腎臟科醫師的治療決策。此趨勢也呼應數位病理整合 AI 的全球浪潮，對病理科與腎臟科均具直接參考意義。", "tags": ["數位病理", "糖尿病腎病", "AI輔助診斷", "腎臟科"], "author": "未標示（Diabetes In Control｜2026-08-07）", "source_url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxOTjd4SWZWQW5XMXR1d29uemNtbkY2djlvY0tCWHF3UWpWS0FOU3I1WHNYbGt5bWVFYnVfWFY0RDh5LVA0TlhpX3FlejNXaWRLc3dLdVZBcWItcHNsTGdnM3ZCNHMwcXNyaVRPVEpmTk0tTjIyOXM0eEczSktWNWNUZnBBZ244OEJqbW9GNy1kUFYzN00"}, {"rank": 6, "score": 6.5, "title": "AI 代理人自動檢核科學文獻，成功揭露數十年舊論文錯誤", "summary": "Nature 報導指出，AI 代理人（AI agents）正被用於系統性審查科學文獻，並已成功偵測出多篇數十年前發表論文及參考資料庫中的錯誤。此類工具能夠自動比對數據、識別統計矛盾，以及標記可疑的圖表或數值，效率遠超人工查核。在醫學研究領域，文獻錯誤可能對臨床實踐產生深遠影響，特別是被廣泛引用的舊版臨床指引若含有根本性錯誤，可能造成治療決策的系統性偏差。AI 代理人應用於文獻品質管控，有望成為醫學知識庫維護的重要工具，也對醫院研究部門及系統性文獻回顧工作流程具有直接的應用潛力。隨著此類工具逐漸成熟，未來有可能整合進期刊投稿審查及醫院研究倫理委員會的評估流程之中。", "tags": ["AI代理人", "科學文獻審查", "研究品質", "醫學知識庫"], "author": "未標示（Nature｜2026-08-06）", "source_url": "https://www.nature.com/articles/d41586-026-02235-8"}, {"rank": 7, "score": 6.0, "title": "SAS 分析：醫療 AI 仍面臨實證證據不足與資料缺口的核心挑戰", "summary": "SAS 在 Tech Wire Asia 的報導中指出，儘管醫療 AI 的應用場景持續擴增，但整體產業仍面臨兩大根本性挑戰：一是缺乏足夠嚴謹的臨床實證研究支撐 AI 工具的有效性聲稱；二是訓練與驗證資料存在系統性缺口，包括族群代表性不足、資料品質參差不齊及跨機構資料不一致等問題。SAS 強調，在這些基礎問題未解決前，醫療機構若倉促大規模部署 AI，將承擔難以量化的臨床風險。此觀點呼應國際間對醫療 AI「過度承諾、驗證不足」的普遍憂慮，也與近期 FDA 及各國監管機構加強要求 AI 工具上市後監測的政策方向一致。對醫院採購與評估 AI 工具的決策者而言，建立嚴格的內部驗證機制與持續監測流程，是當前最關鍵的風險管理措施。", "tags": ["醫療AI挑戰", "臨床實證", "資料品質", "AI風險管理"], "author": "未標示（Tech Wire Asia｜2026-08-06）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE9LdHZiaGd2d3lJRmVVSmZrb18wc1M1cGVBa05GYUZISjBXWUotZm5pSDQ3ZGdUMGlUSkZHdmNaZjFfM18xMEVEdFVKb0RTVlB1eVlTTXJCWTMzWUtpeWFfN29NUTBLZGNaNkJJOGhMenpDMmdUOGx5eXZ3"}, {"rank": 8, "score": 5.5, "title": "《STAT》觀點：停止問「AI 對醫療好不好」，應聚焦具體工具的具體效益", "summary": "STAT News 刊登觀點文章，作者批評當前醫療界對 AI 的討論過度依賴「AI 整體是否有益」的二元框架，認為此種過度概括化的思維反而阻礙了真正有效的 AI 工具被及時採用。文章舉例，AI 抄寫工具已有充分證據顯示可減輕醫師文書負擔，AI 敗血症預警工具亦有多項研究支持其臨床價值，但因為「AI 整體爭議」的噪音，這些工具的導入速度遠落後於其實證基礎。作者主張，醫院與臨床科室應針對個別工具、個別應用場景進行獨立評估，而非受整體 AI 輿論左右。此觀點對醫院領導層尤具參考意義：建立工具層級的評估機制，比等待「AI 整體共識」形成更具實際效益，也更符合負責任的數位轉型策略。", "tags": ["醫療AI採用", "臨床決策", "AI評估框架", "觀點"], "author": "未標示（STAT News｜2026-08-06）", "source_url": "https://www.statnews.com/2026/08/06/ai-health-care-skepticism-advances-nature-medicine-scribe-sepsis/?utm_campaign=rss"}]}, "2026-08-06": {"date_str": "2026年08月06日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.0, "title": "美國聯邦監管機構召開閉門會議，邀請產業界共商臨床 AI 採用策略", "summary": "美國聯邦衛生官員近期召集科技公司、研究人員及遊說團體，舉行一系列閉門會議，核心議題為如何加速臨床 AI 工具的採用與部署。此舉顯示監管機構正從被動審查轉向主動引導，試圖在政策框架成熟前，透過非公開對話凝聚產業共識。此類閉門機制引發外界對透明度的關切，批評者認為在醫療 AI 監管規則仍不明確的情況下，過度依賴業界意見可能影響政策中立性。對醫院領導層而言，此次會議意味著臨床 AI 的監管走向正在加速形成，相關採購與部署決策所面臨的法規環境可能在短期內出現重大變化，值得持續追蹤美國 FDA 及衛生部門後續的政策動向與指引文件。", "tags": ["臨床AI監管", "政策法規", "產業對話", "FDA"], "author": "未標示（STAT News｜2026-08-06）", "source_url": "https://www.statnews.com/2026/08/05/federal-regulators-invite-industry-closed-door-meetings-clinical-ai/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "醫療 AI 策略的核心瓶頸：資料問題即互通性問題", "summary": "HIT Consultant 一篇分析文章指出，許多醫療機構在推動 AI 策略時面臨的最大挑戰，並非演算法本身的優劣，而是底層資料的互通性不足。不同系統間資料格式不一致、缺乏標準化介面，導致 AI 模型無法取得完整、可信賴的訓練與推論資料，進而限制臨床決策支援工具的實際效能。文章強調，若醫院未能優先解決 EHR 與各類臨床資訊系統的互通性問題，AI 投資的回報將大打折扣。這對正在規劃或已部署醫療 AI 的機構而言，意味著資料治理與系統整合能力應被視為 AI 轉型的前置基礎建設，而非事後補救的技術細節。", "tags": ["資料互通性", "醫療AI策略", "EHR整合", "數位轉型"], "author": "未標示（HIT Consultant｜2026-08-06）", "source_url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxPRW50a2VMbmZtRHBHSnM5MDZZNXJXUnY1cVRwMk5CRkxKZkt5ZWRKbTFFUm5OMHhPUUY4WWF5bGFDWk9Ub3A0d2VGcTdCeEl5NGg2RnVrSVZWNGx1U0xNdWphX1pDRG1OTFJRLTNkTG5VSThxN08xSXZYbHVXdHFGTmR3d2JsakRrOXdaVnNyWE1tUDFTTi1BT3ZzbnYtNENHbnc?oc=5"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 透明度不足將帶來風險：為何公開揭露刻不容緩", "summary": "BankInfoSecurity 報導指出，隨著醫療機構大量導入 AI 工具，透明度不足已成為資安與合規的重大隱患。文章分析，當臨床 AI 系統的運作邏輯、訓練資料來源及決策依據無法對外清楚說明時，不僅增加病患資料遭到不當使用的風險，也使醫院難以對 AI 輔助決策的錯誤進行問責與改正。尤其在 Anthropic 等大型 AI 公司近期發生相關事件後，業界對醫療場景中 AI 治理機制的關注顯著升高。報導建議醫療機構建立明確的 AI 使用揭露政策，包含演算法稽核機制與患者知情同意流程，以符合日趨嚴格的監管預期，並維護機構信譽與病患信任。", "tags": ["AI透明度", "資安合規", "AI治理", "風險管理"], "author": "未標示（BankInfoSecurity｜2026-08-06）", "source_url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxPc2FkcGVGbEo5UGUwRWRlSzdqNE44WnRHdjFCRnNLbG5EQUpmTjNLUmRKT2hKbnBVRkxDNU1TUzZsSDlTdkFLdndPX1hCenFEQ0N2Y2E0TDJqc05qbnB1TFJxc0VYWmdULXR4VUFieXZJRG92SGdKZ3Rqb3dtRVljakhPcnZIa1c2bXdXNzk1UjdCX0dobHJGQ1VWcw?oc=5"}, {"rank": 4, "score": 7.5, "title": "UnityPoint Health 六大 AI 應用實例：減輕臨床行政負擔、讓醫師回歸病人照護", "summary": "UnityPoint Health 醫療體系的首席醫療官 Gregory Johnson 分享該系統目前運用 AI 減輕醫師行政負擔的六項具體做法，涵蓋環境式語音抄寫（ambient scribing）、即時床位容量追蹤、AI 輔助病歷審閱等。這些工具的共同目標是讓臨床人員從繁瑣的文書與行政作業中解放出來，將更多時間投入直接的病患照護。報導特別指出，環境式抄寫已被該系統視為提升醫師工作滿意度的關鍵工具，而即時容量追蹤則有助於病房調度決策。此案例提供了大型醫療體系在 AI 工具組合策略上的參考藍本，展示如何從多個行政與臨床流程切入，逐步建立系統性的 AI 輔助生態。", "tags": ["臨床AI應用", "環境式抄寫", "行政減負", "醫療體系"], "author": "未標示（MedCity News｜2026-08-06）", "source_url": "https://medcitynews.com/2026/08/unitypoint-health-artificial-intelligence/"}, {"rank": 5, "score": 7.5, "title": "耶魯紐黑文健康系統重塑放射科，以 AI 為核心迎接新世代影像醫學", "summary": "據 HCI Innovation Group 報導，耶魯紐黑文健康系統（Yale New Haven Health）正全面重新設計其放射科工作流程，以 AI 為核心驅動力，應對影像量持續增長、放射科醫師人力不足等結構性挑戰。該系統正導入 AI 輔助影像判讀工具，以提升診斷效率與準確率，同時探索如何將 AI 分析結果有效整合至臨床決策流程。此外，系統也著手評估 AI 工具在品質管理與優先排序上的應用，以確保急重症影像獲得及時判讀。此案例代表大型學術醫療中心在放射科 AI 轉型上的系統性布局，對規劃影像醫學數位升級的醫療機構具有重要的參考價值。", "tags": ["放射科AI", "影像判讀", "學術醫療中心", "工作流程優化"], "author": "未標示（HCI Innovation Group｜2026-08-06）", "source_url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxOOWFUcGdfWDJVeF9XMTFQWnd0TWh4amhHaG9JTHhtZl8yVWwzU1huVVBzR0dpWEdfY3JOZkYwRzkyVjljb2N6c210SHVIc1RETzlqeDIyd0pXT1dzSGhZMTAxbE84Z1NtU2dzRHhUUkxvT3RLNDltQ3lzaURMUkJJYi1ZaW1xVTJBTExXNFExbDJhWk14b2I5ZkR3RlR4SDM5N2NUakVVTVlqb216YjM1TW9GMlpiOVZsUUNLWGV4VjhUNTB1LWxpQklR?oc=5"}, {"rank": 6, "score": 7.5, "title": "Microsoft 與 Paige 發布以 230 萬張病理切片訓練的病理 AI 模型", "summary": "Microsoft 與數位病理 AI 公司 Paige 聯手發布一款以超過 230 萬張病理切片訓練的大型病理基礎模型，為目前規模最大的病理 AI 之一。此模型採用多尺度組織影像學習架構，能辨識從細胞層級到組織層級的複雜形態特徵，適用於癌症偵測、分期輔助及生物標誌物預測等多種臨床任務。Microsoft 透過 Azure 雲端平台部署，使更多醫療機構得以存取此能力。此次合作標誌著科技巨頭與專業醫療 AI 公司在病理領域的深度整合，也顯示大型語言模型的訓練方法正被延伸至多模態醫學影像領域，對未來病理科 AI 工具的部署模式將產生深遠影響。", "tags": ["病理AI", "基礎模型", "Microsoft", "數位病理"], "author": "未標示（Digital Watch Observatory｜2026-08-05）", "source_url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE8tdFBKY01jRHdkczhvYmV3Z2RkUjhZZmViYjJWeDNMMzJNYkMwZkJoTGRUbWI3NGZFTUV1TnVxTHZrU1NXTGFESVk4a1BDeFhqRXhNSDlRVVBZb091bkEzUFdiVFc1RnpCTmc?oc=5"}, {"rank": 7, "score": 7.0, "title": "HIMSS 擴大全球醫療 AI 研究範疇，深化國際實證基礎", "summary": "全球最大醫療資訊與資訊科技組織 HIMSS 宣布擴大其針對醫療 AI 的全球研究計畫，旨在蒐集更廣泛的跨國實證資料，以評估 AI 工具在不同醫療體系與文化背景下的實際效益與挑戰。此舉被視為回應全球醫療機構對 AI 應用標準化指引的迫切需求。HIMSS 的研究結果預計將用於協助各國醫療政策制定者和醫院領導層在採購、部署與評估 AI 工具時有所依循。對於正處於 AI 戰略規劃階段的醫療機構而言，HIMSS 的研究方向代表國際主流的評估框架正在成形，未來 AI 工具的選型與績效指標設計，可能將與此類國際研究標準逐漸接軌。", "tags": ["HIMSS", "醫療AI研究", "全球標準", "實證醫學"], "author": "未標示（Healthcare IT News｜2026-08-05）", "source_url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxOMkw4YTZsRjVIU1ZickdvR1l2S1hRdXZKVWV4T1lqMUJSakZkMDRMRzdGZ0lfMzZPQi1XWUV2V01ycTdTa01RUkUyM0VZX2E4dGZJV3ZtM0RQWmw2VXdjckhMS281ejczSWgxTTFPREJfV1RVMGdfQmxmNWJFTmJnb1VrYVNyTmI1T2c?oc=5"}, {"rank": 8, "score": 7.0, "title": "ACR 發布資源指引，協助病患解讀 AI 生成的放射科報告摘要", "summary": "美國放射學院（ACR）發布新版資源指引，專門協助病患理解 AI 自動生成的放射科報告摘要。隨著越來越多醫療機構採用 AI 工具，自動將放射科技術報告轉化為患者可讀的簡化摘要，如何確保病患正確理解這些 AI 生成內容、避免誤讀或不必要的焦慮，成為新興的臨床溝通挑戰。ACR 的指引提供了溝通框架建議，涵蓋如何設計 AI 摘要的措辭方式、醫師在審閱後如何向病患說明，以及機構應建立哪些配套的病患教育資源。此舉反映放射學界正積極面對 AI 工具普及後的病患溝通責任，對推動以病患為中心的 AI 應用具有重要的實踐意義。", "tags": ["放射科AI", "病患溝通", "ACR", "AI報告摘要"], "author": "未標示（Radiology Business｜2026-08-05）", "source_url": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxOZlhGdVhaa0VrQ08xS2ZGTGQ0bUFlaGo0RVRTVTFwNm51ODJLSVVzcHhzbDQtT2ZIVVU2Nzd0NUdtUllWXzB5ZWo0VUhqT0U4bktkenlScUpMZnNyR3pIWFZCb3JlcXEtQ3o2TXg5TUtMSWtxZHFFZUhYRnJqTEFWX1MyZDR3MWlUTi1jSUh2a0lYZXBYYmE0UVEtenJ3ekg1eTlhcWNJTjhOSEVwVWVNNnQwNnhfYk11MjkxeDlkLWZhTnNmcVc4d0lOS3Z0eEhGM1pxU2VTX18?oc=5"}, {"rank": 9, "score": 6.5, "title": "VirTues 空間蛋白質組學基礎模型：跨尺度解析組織結構，支援精準腫瘤學", "summary": "Nature 期刊發表名為「Virtual Tissues（VirTues）」的空間蛋白質組學基礎模型，能夠跨越細胞、組織微環境到器官等多個尺度，整合空間蛋白質表達資訊，支援細胞分割分型、生態位標注、空間生物標誌物發現及病患分層等多項任務。此模型的突破在於可跨異質性染色面板與資料集進行泛化，克服以往空間組學工具高度依賴特定抗體組合的限制。對臨床病理與腫瘤學領域而言，VirTues 為整合多中心、多平台的腫瘤組織資料提供了新的 AI 基礎架構，有望在未來加速癌症亞型鑑別與治療反應預測的研究進展，是 AI 在精準醫療應用上的重要技術里程碑。", "tags": ["空間蛋白質組學", "基礎模型", "精準腫瘤學", "Nature"], "author": "未標示（Nature｜2026-08-05）", "source_url": "https://www.nature.com/articles/s41586-026-10884-y"}, {"rank": 10, "score": 6.5, "title": "AI 在 23 秒內完成個人化放射性藥物治療劑量計算，大幅提升核醫效率", "summary": "Radiology Business 報導一項最新研究成果，顯示 AI 系統能在 23 秒內為接受放射性藥物治療（radiopharmaceutical therapy）的患者完成個人化劑量計算，遠快於傳統手動計算所需數小時的作業時間。個人化劑量計算在核醫治療中至關重要，能在確保療效的同時降低正常組織輻射曝露風險，但傳統方法耗時費力，限制了其在臨床的廣泛應用。此 AI 工具的高速計算能力有望打 const TODAY_ISO  = "2026-08-11";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
