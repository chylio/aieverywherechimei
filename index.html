<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年11月26日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

www.statnews.com/2026/11/24/alaskan-hospitals-artificial-intelligence-bet-improve-stroke-care/"}, {"rank": 2, "score": 8.5, "title": "RSNA 2026前夕：AI自動草擬放射科報告能否真正提升醫療品質與安全？", "summary": "北美放射學會年會（RSNA 2026）即將在芝加哥登場，業界熱議焦點之一為AI輔助放射科報告草擬功能——系統自動分析X光片與CT影像後產出初稿，供放射科醫師審閱修改。支持者認為此舉可大幅縮短報告完成時間、降低遺漏率；批評者則擔憂醫師對AI草稿產生過度依賴，反而弱化獨立判讀能力，甚至在系統錯誤時未能及時修正。STAT記者訪談多位業界人士，呈現雙方觀點，並指出目前臨床證據仍不足以明確回答此問題。如何設計人機協作流程、建立品質監控機制，將是各醫院導入前需審慎評估的核心議題。此議題預計在RSNA 2026成為重要辯論主題。", "tags": ["放射科AI", "RSNA 2026", "AI報告草擬", "臨床品質"], "author": "未標示（STAT News｜2026-11-24）", "source_url": "https://www.statnews.com/2026/11/24/does-radiology-ai-draft-reports-make-care-better-safer-rsna/"}, {"rank": 3, "score": 8.5, "title": "韓國建立公共醫療AI網絡，推動全國醫院AI基礎設施共享", "summary": "南韓政府宣布正式啟動「公共醫療AI網絡」（Public Healthcare AI Network），旨在為全國公立醫院提供共用AI運算資源與模型平台，降低各醫院自建AI基礎設施的門檻與成本。該網絡將整合醫療影像判讀、電子病歷分析及臨床決策支援等功能模組，並建立統一的資料標準與隱私保護機制。此舉被視為韓國繼推動醫院資訊化後，在國家層級主導AI醫療落地的重要政策里程碑。相較於各醫院各自為政的採購模式，聯邦式公共平台有助於縮小大型醫學中心與地區醫院之間的AI能力落差，並為政府統一監管AI醫療工具品質提供制度基礎。此一國家級AI醫療網絡模式值得台灣衛生主管機關參考。", "tags": ["國家醫療AI政策", "韓國", "公共醫療平台", "AI基礎設施"], "author": "未標示（Healthcare IT News｜2026-11-25）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxNUkI5Y01mVzgta1N5OHo1T1VVc0ZKM040YnVPWmJfUnBxQURhdTFnbHZDYzNaTjhUNE1yZW5kUDF0RTJ4dlBMZFNJNE5xV1BTQ0ctWGdVRmo2dGhOdEtPQ29aNm4zMXAybl9xQ3FGa1N5T0g0aUZfeTFfb3JDTEc2TWJFM3hEczBfY0hLUjVOMU1LUnczcVhB?oc=5"}, {"rank": 4, "score": 8.0, "title": "倫敦大奧蒙德街兒童醫院啟動NHS首個Agentic AI計畫，聯手Hyland與AWS", "summary": "英國倫敦大奧蒙德街兒童醫院（Great Ormond Street Hospital，GOSH）宣布與Hyland及Amazon Web Services合作，在NHS體系內率先啟動「Agentic Hospital AI」計畫。此系統不同於傳統被動式AI工具，而是採用可自主執行多步驟任務的代理式AI架構，能跨系統擷取病患資料、協調臨床工作流程並主動提出行動建議。初期應用聚焦於病患出院準備度評估與臨床文件自動化。GOSH表示，此計畫標誌著醫院AI從「輔助查詢」進化為「主動協作」的新階段。此一Agentic AI模式在複雜兒科照護場域的落地實踐，為各大醫學中心評估下一代臨床AI系統提供重要參考依據。", "tags": ["Agentic AI", "NHS", "兒科醫療", "醫院數位轉型"], "author": "未標示（PR Newswire｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMirgJBVV95cUxPTXh2cTZjT2xpWHJRNHA1TUpPdDl1NXJ2R0VtRkJtU295eEE0TUFkeVAyd21ab 負責評估生命徵象穩定性、藥物安全性、社會支持條件及後續照護計畫可行性，各代理相互交叉驗證後輸出綜合建議。研究結果顯示，此架構較單一模型輸出具備更高的一致性與可解釋性，並能減少因資訊遺漏導致的不當提前出院。此一設計方向對於高病床周轉壓力的醫院尤具實務意義，同時呼應近年醫療AI從單點功能走向多任務協作系統的整體趨勢。", "tags": ["出院決策AI", "多代理系統", "病患安全", "臨床決策支援"], "author": "未標示（Bioengineer.org｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxQUXBDYXcyTHJEclZxYTd4S2x5MEh1WXRGNjkwUDA2OXFBdS01RjBabjUyZGZCc2UtVVo5SHlEUFpwSjIwVUdqRldXc05KY0F1bzQtRlU4VVJUU05MT3JqWTRmZUVCaFBtUDNCX0tyWnJZQnlKa1JCYVRYMjdFTzFnOWlfV2VHbGQ3a05kdXlpRW80YUJTQVR4OUQ3ZWpBa1ZQMHZUbXNHZmJyd2FlcHlYR3hURzNKTjJB?oc=5"}, {"rank": 8, "score": 7.0, "title": "AI協助醫院降低出院後再入院率與死亡率，MedPage Today報導實證成果", "summary": "MedPage Today報導一項醫院實際導入AI臨床決策支援系統後的成效研究，結果顯示該系統能有效識別出院後高風險病患，並觸發主動追蹤介入，進而降低30天再入院率與出院後死亡率。系統透過整合電子病歷、生命徵象趨勢及社會決定因素等多維度資料，建立個人化風險預測模型，並在出院規劃階段即產生警示供照護團隊參考。此研究強調，AI工具必須與既有臨床工作流程深度整合，才能發揮實質效益，單純部署模型而缺乏配套流程設計，成效將大打折扣。此一結論對正在評估或試行出院後管理AI工具的醫院具有重要的執行層面啟示。", "tags": ["再入院預防", "出院後管理", "臨床AI成效", "風險預測"], "author": "未標示（MedPage Today｜2026-11-25）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPRGJnY2NGZkpEeTJ1NTNselpabVA1a1d1Z3U0Tm5ySjZDZWNTSzlTRGg1cjE5ZGpZb0VmUTZSSEhwLWlDWGhwczd2NTlkWkpxOUc5QldDZ3Q4aTVFOVBhR0g1cmVTTmxqLVNfNzlFc3M5bC1ReXRWN2FPUURBR0lYbW14T3BoWXUy?oc=5"}, {"rank": 9, "score": 7.0, "title": "2026總統盃黑客松揭曉：AI應用於高齡醫療與防詐雙雙獲獎", "summary": "2026年台灣總統盃黑客松競賽結果正式揭曉，本屆獲獎團隊中有兩項以AI為核心的解決方案備受矚目：一項聚焦AI輔助高齡醫療照護，透過智慧感測與大數據分析提升長照服務效率與個案風險預警；另一項則運用AI技術防範針對高齡族群的詐騙行為。總統盃黑客松是台灣政府層級最重要的創新競賽之一，獲獎方案具有納入政策試辦與跨部會推廣的潛力。此次結果顯示台灣社會創新能量已明確聚焦於AI在高齡照護與社會安全網的應用，呼應政府推動健康台灣與超高齡社會準備的政策方向。", "tags": ["台灣醫療AI", "高齡照護", "黑客松", "AI政策"], "author": "未標示（青年日報｜2026-11-25）", "source_url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5MNmYzUzIwY0F0aFNHSUF4dDNSSVhaMFBCRURGMzJaMFhQa1hlblZJZ0N2OUNRdVA4ck50QmIzUVh5c2xjYWlwTWNlRTNwc2UtM2ZFek1R?oc=5"}, {"rank": 10, "score": 6.5, "title": "放射科AI採用率領先全醫療業，MobiHealthNews分析關鍵驅動因素", "summary": "MobiHealthNews最新報導指出，在所有臨床專科中，放射科的AI採用率目前居於領先地位，遠超過其他科別。報導分析主要驅動因素包括：影像資料具備高度標準化特性、FDA已核准多項放射AI產品、工作流程瓶頸明確且AI介入效益可量化，以及RSNA等學術社群長期積累的共識基礎。然而報導也指出，市場上放射AI產品數量龐雜，醫院在選型時面臨評估標準不一的挑戰，真實世界效能監控機制尚未成熟。此分析與ACR Data Science Institute在RSNA 2026展示的AI績效監控框架互相呼應，顯示放射科AI正從導入期進入品質管理與標準化的新階段。", "tags": ["放射科AI", "AI採用率", "RSNA 2026", "醫療AI市場"], "author": "未標示（MobiHealthNews｜2026-11-25）", "source_url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxNRzVmaWJXb204S2FRN0Q5ZEpqZW5Ba09HN09aM3BRM3RTX0dVemc1aHBLMWpSSFdwbmt0aUJsdVY4R2pYLVhvemJGMEllZzdwc1dLZk91bDRuZ2ZzUS0tV2lpOU5FUm56Vk5KY2U4NUQzSWJmNUxpSnI2OVA4UE95QkR3?oc=5"}]}, "2026-11-24": {"date_str": "2026年11月24日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "Ant Group 開源 LingSante 醫療 AI 模型，採 MIT 授權免費釋出", "summary": "螞蟻集團（Ant Group）旗下 Afu 應用程式正式以 MIT 授權條款開源釋出其 LingSante 醫療 AI 模型系列，允許任何組織免費取用、修改與部署。LingSante 模型涵蓋多項臨床語言理解與醫療知識推理能力，此舉被視為繼 Meta 開源 LLaMA 系列後，規模最大的醫療垂直領域開源行動之一。MIT 授權意味著醫療機構、學術單位乃至商業開發者均可在幾乎無限制的條件下整合這些模型至自身系統。分析師指出，此一開源策略可能大幅壓縮現有醫療 AI 商業解決方案的定價空間，同時加速各醫院資訊部門建立本地部署之臨床輔助工具。開源模型的可稽核性亦有助於滿足醫療法規對透明度的要求，但臨床驗證與在地化調適仍是導入前不可迴避的課題。", "tags": ["開源醫療AI", "大型語言模型", "臨床決策支援", "產業動態"], "author": "未標示（Startup Fortune｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxOS0JpSFpMS3R6a0NMZGt5Z3Z0R1IwSENZQ3huckUzWHQ0WVpsUjYtLXA3cnRqMFV3NjRocDR3Q1hiUVNCZVlHS0J3elctYlg0d2NnSC01X01nQ1VWdWZxdUc0b3RCX3U4Ui1nbkJmN2REdk9NSVlmTlNvQkR2OHdMS0NFUk9uNnNQZUxTMVY2TW4xZUJnX2hzQ0NPTFEwa1d1SXZvS0VsZXJ2OVNVQ3BpZmVmX0w?oc=5"}, {"rank": 2, "score": 8.5, "title": "AI 泡沫若破裂，恐對醫療體系造成嚴重衝擊——STAT 分析", "summary": "STAT News 評論員 David Adler 撰文警示，醫療 AI 公司的市值與其技術實際產生的醫療價值之間存在根本性落差。當前醫療 AI 市場高度依賴投資人信心與未來獲利預期，一旦科技泡沫破裂，大量尚未商業化的臨床 AI 工具將面臨資金斷鏈危機，可能在缺乏妥善交接計畫的情況下突然中止服務，直接衝擊已部署這些系統的醫院與患者。文章指出，醫院在採購 AI 工具時往往未充分評估廠商財務穩健度與退場機制，一旦廠商倒閉，數據遷移、系統替換與臨床流程重建所需成本極為可觀。作者呼籲醫療機構建立採購盡職調查標準，以及針對關鍵臨床 AI 系統制定停服應急計畫，監管機構亦應考量將財務永續性納入醫療 AI 審查框架。", "tags": ["醫療AI風險", "投資泡沫", "醫院採購治理", "產業警示"], "author": "未標示（STAT News｜2026-11-23）", "source_url": "https://www.statnews.com/2026/11/23/ai-bubble-medical-artificial-intelligence-health/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "AI 加速醫療影像判讀：信任與準確度是關鍵門檻", "summary": "EurekAlert! 報導最新研究成果指出，AI 技術確實能夠顯著縮短醫療影像判讀時間，但前提是臨床人員與監管機構對 AI 輸出結果具備足夠信任基礎。研究團隊針對多種影像模態（包括 CT、MRI 及 X 光）評估 AI 輔助判讀的速度與準確度，發現 AI 在特定場景下可將報告周轉時間縮短 30% 至 50%，但系統性偏差與影像品質問題仍會導致不可預期的假陽性或假陰性。研究強調，建立可解釋性機制（explainability）與持續性真實世界監測，是讓放射科醫師願意依賴 AI 輸出的核心條件；若欠缺此機制，速度優勢反而可能演變為診斷風險。文章同時呼籲業界建立統一的信任評估框架，以便跨院所比較不同 AI 系統的可靠性。", "tags": ["醫療影像AI", "放射科", "臨床信任", "可解釋性AI"], "author": "未標示（EurekAlert!｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTFBGVmhVTmRHOGFxR0hGZmhOaE1VYjh0OE9uSDdXcWdYcEp5VmNMZmNzR3ZMZkRlckZ1STE5RUx4RDJfUG9MUU43NHRVZVBkcS11bzNfWDZDSzRxcjVO?oc=5"}, {"rank": 4, "score": 7.5, "title": "AI 臨床決策支援需要系統框架，而非僅靠單一提示詞", "summary": "Medical Economics 刊文指出，隨著 AI 臨床決策支援工具在醫院中快速擴散，許多機構僅依賴非結構化提示詞（prompt）驅動 AI 輸出，缺乏完整的治理框架，導致臨床建議的一致性與可靠性參差不齊。文章倡議醫療機構應建立涵蓋數據來源、模型更新週期、異常警示處理流程與人機協作邊界等要素的系統性框架，而非將 AI 工具視為黑盒子直接嵌入臨床流程。作者強調，框架的核心目的在於確保 AI 建議符合最新臨床指引，並在模型出現漂移（model drift）時能即時偵測與修正。此議題對於已導入或計畫導入 AI 輔助診療的醫院資訊部與臨床科主任而言，具有直接的制度設計參考價值。", "tags": ["臨床決策支援", "AI治理框架", "醫院資訊化", "醫療AI安全"], "author": "未標示（Medical Economics｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMinAFBVV95cUxNNzIwTTR3Z0xZY2NjOGlfck5uSVpaaEdZN3BvMTNpMTA5dktyZTdmNEVrWUg0bWFZc2s2dk9iNUZySEVPTV95VEVBNEdKYmZPaDNOV3pRRVh5WlRIM012c2YxQldNUDMxZkNUM1Eya3BuUGhVVnh4eENKS2x5T1hJR0xPbG9ZUG1hUE56cDVtM1oteU9TU1VRSlNOdHg?oc=5"}, {"rank": 5, "score": 7.0, "title": "醫療體系從批評保險業者演算法，轉向自建 AI 系統", "summary": "Modern Healthcare 報導，美國各大醫療體系長期以來將給付拒絕歸咎於保險業者所使用的 AI 演算法審核機制；然而，越來越多醫療機構正主動建構自有 AI 工具，以在申請核准、術前授權乃至收入循環管理等環節取得主動權。這一轉變反映出醫院對於 AI 在醫療行政流程中角色的根本性態度轉變——從被動抵抗外部演算法，到積極掌握資料與模型主導權。報導中援引多家大型醫療體系案例，顯示自建 AI 在降低拒付率與縮短給付周期方面已展現初步成效，但同時也引發關於醫療資源分配公平性與透明度的新一輪倫理討論，監管機構正密切關注此一趨勢。", "tags": ["醫療行政AI", "給付審核", "收入循環管理", "醫院AI策略"], "author": "未標示（Modern Healthcare｜2026-11-23）", "source_url": "https://news.google.com/rss/articles/CBMi6AFBVV95cUxNVkZRX2U1QTBCcVhndmNfalBVVUNwUGtDZ3IxQkRBQ3dsZkw2SHNoN3NtWERQZmQ3SElKVWpzSW1hdFU2VXVxNzlzTTluSFpZT2FVZ3JMLVhuN3ZxejEzcHhadDY3WFRZM01OallwWTNKRmNGMGQ2cDI3NlhrOF9VcVdQLWs1NmhPUG1pUXJPS211TmJMQXdOV2FxY1dJSW1ZNk01bzZZNW9KV1E0bUZRYjFrdkZSWGNZWHBmTktRU0dPZndkSExtVWd0eUM1b000bndfbmNCMWJ1V3htX1pMbFJ3UHQ3eUlP?oc=5"}, {"rank": 6, "score": 6.5, "title": "生殖醫學 AI 模型技術表現亮眼，但缺乏前瞻性臨床驗證", "summary": "Bioengineer.org 報導一項系統性回顧研究，分析當前生殖醫學領域（包括胚胎評級、IVF 結果預測、多囊卵巢症候群診斷等）所開發的 AI 模型，發現多數模型在技術效能指標（如 AUC、準確率）上表現優異，但絕大多數僅完成回溯性驗證，缺乏前瞻性臨床試驗支持。研究指出，此一缺口使得 AI 模型在真實臨床場景中的可靠性存疑，模型訓練數據的來源偏差亦可能影響不同族群患者的適用性。作者呼籲生殖醫學 AI 開發者應優先規劃多中心前瞻性驗證研究，並建議監管機構在審查生殖醫學 AI 產品時，將前瞻性臨床證據列為必要條件，以保障患者安全與生殖決策的倫理正當性。", "tags": ["生殖醫學AI", "臨床驗證", "模型偏差", "AI監管"], "author": "未標示（Bioengineer.org｜2026-11-24）", "source_url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxORlhFV2NHV3BwSnFudWZEZWw0LXZ6Y1ZaOEJyQk96cWNhdGRSNHhpQi1lYlotYVBMUjd6ZlZBeXc0WVNUTVppZGtBV3RRd1Bhay0wa29QR19lZTBmd1ViV1JWdFpfS1lVVy0xNndiNldRS3JlUkhWREpTSUdiQnJxVjJObG9ScjdxcTRxZ0E2TVRVTVVkLUlFZ0xfZm1raF95aHQteGo4Slh4dDYxMWlkVkJaZ08?oc=5"}, {"rank": 7, "score": 6.0, "title": "Mach7 Technologies 與 Rad AI 合作，打通影像判讀到報告全流程", "summary": "Mach7 Technologies 與 Rad AI 宣布策略合作，將兩家公司的技術整合以實現從醫學影像擷取到結構化放射科報告生成的端對端自動化流程。Mach7 專精於企業級影像管理與 VNA（Vendor Neutral Archive）平台，Rad AI 則以 AI 自動化報告草稿與放射科工作流程優化見長；雙方整合後，放射科醫師可在同一工作站完成影像閱覽、AI 輔助標註與報告草稿審核，預計可顯著縮短報告出具時間並減少重複性操作。此合作案反映出醫療影像 AI 市場正從單點工具走向整合型平台的趨勢，對正在評估放射科數位化升級的醫療機構具有採購參考意義。", "tags": ["放射科AI", "醫療影像管理", "工作流程整合", "AI報告自動化"], "author": "未標示（Financial Times｜2026-11-23）", "source_url": "https://news.google.com/rss/articles/CBMimAFBVV95cUxNOGZYM2FuZEFSU1YzaTcwd1NfOFFwNUJpVWpsNXFHcFhBVFlEcmF6QWhXQXFUWWR1X0tQRmRSTzd0RVVYZW9ObnNVMkJkMDZKd2ZuSno1MDcyTWVmbW9lVXR0N3FhRjBaVEFKUHh4bzRwNWtVczdNT2EzZmYxaXhOU0xoTGxQNE1CVk0tRkVyNG1ZZlV0VTdBOA?oc=5"}, {"rank": 8, "score": 5.5, "title": "護理 AI 的未來應以可量測的臨床與人力成效為起點", "summary": "MedCity News 刊出觀點文章，主張護理領域導入 AI 的核心價值判準，不應僅停留於技術能力展示或效率提升的抽象承諾，而必須回歸到具體、可量測的臨床成效與護理人力指標。文章指出，當前護理 AI 工具多聚焦於文書減量與排班優化，但缺乏對患者安全事件、護理師留任率及照護品質等關鍵指標的系統性追蹤與評估。作者建議醫療機構在導入護理 AI 前，應預先定義成功指標，並建立持續監測機制，確保 AI 工具的投資回報能以護理品質語言呈現，而非僅以技術採用率衡量。此論點對面臨護理人力短缺的臺灣醫療體系尤具參考價值。", "tags": ["護理AI", "臨床成效評估", "醫護人力", "數位轉型"], "author": "未標示（MedCity News｜2026-11-24）", "source_url": "https://medcitynews.com/2026/11/the-future-of-ai-in-nursing-must-begin-with-the-outcomes-we-intend-to-achieve/"}]}, "2026-11-23": {"date_str": "2026年11月23日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "釜山退伍軍人醫院導入AI心律監測，急診漏診心律不整於3小時內成功攔截", "summary": "韓國釜山退伍軍人醫院透過AI持續心律監測系統，成功偵測一名急診室初診時未被發現的心律不整病患。該系統在3小時內發出警示，使醫療團隊得以即時介入處置，避免病情惡化。此案例顯示，AI即時生理監測不僅能彌補傳統急診流程的診斷盲點，更可在患者離開急診觀察範圍前完成風險攔截。心律不整因症狀多變且易被忽略，常造成嚴重心血管事件，AI持續監測技術的引入有助提升急診診斷完整性。此類應用對退伍軍人族群尤其重要，因其往往伴隨複雜共病。此案例對台灣醫院急診部門及心臟科具有直接臨床參考價值，可評估導入類似連續心電監測AI警示機制的可行性。", "tags": ["AI心律監測", "急診醫療", "心律不整", "臨床警示系統"], "author": "未標示（MEDI:GATE NEWS｜2026-11-22）", "source_url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE01aW9HZWpWRFNNdER3SHM2cElVNDVrRGN0a0FObjlsajhnQ0FoYU9HQ2dOdWdjR2pBakdCVHc4Mjg0VHBCQ3ZRamFJLXNyYVpKNTNTRS1tNA"}, {"rank": 2, "score": 8.0, "title": "自主式醫療AI MIRA診斷準確率超越專科醫師，虛擬醫療新里程碑", "summary": "韓國醫療媒體MEDI:GATE NEWS報導，自主式醫療AI系統MIRA在虛擬照護情境下的診斷準確率已超越專科醫師，創下重要里程碑。MIRA定位為能夠獨立執行病患評估與診斷建議的AI代理人，不依賴人工覆核即可提供臨床判斷輸出。此一突破引發業界對AI自主診斷邊界的廣泛討論，包括法規監管、醫師責任歸屬及患者安全保障等議題。就臨床意義而言，若此類系統經嚴格驗證後獲得主管機關核准，可大幅提升偏遠地區或醫療資源不足地區的診斷可及性，並緩解專科醫師人力短缺壓力。然而，自主AI診斷的倫理框架與監管配套仍須完善，醫院領導層應密切追蹤此領域的法規動態。", "tags": ["自主AI診斷", "虛擬醫療", "AI準確率", "臨床決策"], "author": "未標示（MEDI:GATE NEWS｜2026-11-22）", "source_url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBXQVMycV9WcUFQeXl5aURlOFhYMElRTlFabGxxZnFpVjhHNVNfanU5V0RtY3BBSlFYdnZ3bVFYTllRLVlvZ2RHLVI5TW9UYm1DcEFoTVhwOA"}, {"rank": 3, "score": 7.5, "title": "美國雪杉西奈醫療中心聯手nference，建構聯邦學習AI研究平台", "summary": "美國雪杉西奈醫療中心（Cedars-Sinai）宣布與AI醫療研究公司nference合作，共同打造以聯邦學習（federated learning）為核心的AI研究平台。此架構允許多個醫療機構在不共享原始病患資料的前提下，協同訓練AI模型，兼顧資料隱私與模型效能提升。聯邦學習被視為解決醫療AI資料孤島問題的關鍵技術路徑，能讓各醫院在符合隱私法規的條件下貢獻本地資料，共同強化跨機構模型泛化能力。此合作模式對台灣醫療體系具有高度參考意義，尤其在健保資料庫整合、跨院AI研究協作及個資保護合規方面，提供了可行的技術框架範例，值得資訊部及數位轉型團隊深入研究。", "tags": ["聯邦學習", "AI研究平台", "醫療資料隱私", "跨院合作"], "author"  "summary": "商傳媒報導，國際專家齊聚VinFuture研討會，深入探討AI在醫療場域中的輔助角色邊界，以及如何將AI醫療技術延伸應用至醫療資源匱乏的偏鄉地區。與會專家討論AI診斷輔助在基層醫療的落地模式，包括遠端問診、AI分診與影像判讀等應用，以及在資訊基礎建設薄弱地區的部署挑戰。同時，會議也觸及AI輔助與醫師主導之間的角色定位，強調臨床最終決策應由醫師負責，AI扮演輔助而非替代角色。此一論壇視角對台灣山地離島醫療、在宅醫療及偏鄉衛生所數位化政策具有參考價值，與工研院等單位推動的智慧偏鄉醫療方向相互呼應。", "tags": ["偏鄉醫療", "AI輔助邊界", "國際研討", "基層醫療"], "author": "未標示（商傳媒｜2026-11-23）", "source_url": "https://news.google.com/rss/articles/CBMiwwJBVV95cUxOMWo4QTZ1OFpCZnpvRkJKZDhpOVc0X1VrcTUtcXpXYkNLLXNSYTlqa29wTmQ5blAyMlVrdkxMNnR4SVNPRmd0ekVPXzdIOExoOHRNVXJSb29vbmV0U3lCWkZ2YzdaYXdnQ1MyNUttdG93NU5hbjhYOU5BRlRab3ZmX0hnYjRoZzFkSnZZQmxRZzBGQWFuSkU5bS1ydTRkQ0F2bEM2bXhWUEc3eWlzYy1xOWdzOE9oWFhQZVM2ZmdUWGZ2SnVKQjFZNE5SZTVsNDdDakZUbjBpUDhwdkxJaTc5Z3JpcGxXdlUxTnozWVpqMndrTS1pQ0R4OHdybmF6WlRTUURTckxQdTc1UkRSUkVPX3JoQmxuR0xhUk50aUo0OVFxWW1RaVZVOVRESXFvaFJHYTJSTkxBdWJaNzVhTV9EZWZ4MA"}, {"rank": 7, "score": 5.5, "title": "吉爾醫療中心培育360名AX導入推手，醫院AI策略從試驗轉向整合與營運", "summary": "韓國吉爾醫療中心（Gil Medical Center）宣布已培養360名「AX Champions」（AI轉型推動者），標誌著該院AI戰略從早期試點進入全面整合與日常營運階段。AX Champion計畫旨在於各科室培育具備AI素養的醫護人員，作為AI工具落地的內部推廣者與使用者回饋橋梁。此一人才培育模式顯示，醫院AI導入的成功不僅取決於技術選型，更仰賴組織文化變革與跨科室人才生態系的建立。吉爾醫療中心的經驗可供台灣醫院在規劃AI推廣策略時借鏡，特別是如何透過院內種子人才計畫，降低一線醫護對AI工具的抗拒，並加速臨床應用的實質滲透率。", "tags": ["AI人才培育", "醫院數位轉型", "組織文化", "AI整合"], "author": "未標示（MEDI:GATE NEWS｜2026-11-22）", "source_url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFA0SENNUVNRNUNvTTE5WTRnSl9aVUVwa1YxMU1yeTdKSXdyZHFGS0JqSHdncGV0M0xrZnVHMmkydmZZalNwYzNyVWtUTjA2LWpPUWVtWXZsaw"}]}, "2026-11-22": {"date_str": "2026年11月22日", "weekday": "星期日", "items": [{"rank": 1, "score": 8.5, "title": "AI醫療影像整合算力中心，推動精準健康從被動診斷到主動預防", "summary": "台灣正積極將AI醫療影像技術導入算力中心，推動精準健康從被動式疾病診斷轉型為主動式健康管理。此一發展方向結合高效能運算資源與AI影像判讀能力，有望大幅提升早期疾病偵測率與個人化醫療服務品質。算力中心作為AI模型訓練與推論的核心基礎設施，能加速影像辨識演算法的優化，並支援多科別臨床應用落地。對醫療體系而言，此趨勢意味著未來院所在數位轉型過程中，需同步規劃算力資源佈局與AI影像應用路徑，以實現從健康監測到疾病預警的全程智慧化管理，為民眾提供更具前瞻性的醫療照護服務。", "tags": ["醫療影像AI", "算力中心", "精準健康", "台灣醫療"], "author": "未標示（newsworld.com.tw｜2026-11-22）", "source_url": "https://news.google.com/rss/articles/CBMiWkF const TODAY_ISO  = "2026-11-26";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
