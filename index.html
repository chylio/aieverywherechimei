<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年11月17日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

同步建立責任鏈與人機協作規範，以防止 AI 自動化侵蝕醫師的核心判斷角色。", "tags": ["臨床治理", "AI監管", "病人安全", "醫師監督"], "author": "未標示（The Next Web｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE5jSzRucWowUmdpZlJBVDFPZTU1UlkzdE5iQnBSUDdkQzhxUHR0TkZ2RVVfb2xoZVNncDFsOFJmZk13T3lIV2ZFTlZ6R1ltZXIwUXg4T1hPcVFXN3Zjcmt5R3czN3lJSjdmTllaWjZET1hpMFR0RjBTWWtIWHc?oc=5"}, {"rank": 4, "score": 7.5, "title": "AI 輔助臨床決策可提升醫師判斷得分：三國跨國試驗結果出爐", "summary": "一項橫跨三個國家的隨機對照試驗結果顯示，醫師在使用 AI 輔助工具後，臨床決策評分顯著提升。試驗比較了有無 AI 輔助情況下醫師對複雜病例的診斷與治療決策品質，結果顯示 AI 輔助組在診斷準確率、治療選擇合理性及文件完整性等面向均有改善。此研究意義在於以嚴謹的 RCT 設計驗證了 AI 對醫師決策的正向影響，而非僅依賴觀察性數據。研究同時指出，AI 輔助效益在資源有限的醫療環境中更為顯著，顯示其在縮短醫療能力落差方面具潛力。這項跨國試驗結果為醫療機構評估 AI 臨床工具的投資效益提供重要循證依據。", "tags": ["臨床決策", "隨機對照試驗", "AI輔助診斷", "醫療品質"], "author": "未標示（Telehealth.org｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxNQldWRW9pRkZMQmQ4aVFGVmRkakVmMFB4UFluTzhjUjhIdXp4cWZxVjRnNHpqeDBWQWZtTWlxZFpXaV9jOVhHYldMMkd1V1FvMnRHN1RFYThqbWtUOWZFY3pRbGJnb3dNTjZWQl9IQ1lkVTZzWERFaC1lc0dGRTZiVFZrRS1OemxmeHFBU0FyTmtvQzUzSnItejRKZ3VLaHZFSDA0bzB4X0U4b0hBUHRLQ0p3My1CY2E2?oc=5"}, {"rank": 5, "score": 7.5, "title": "醫療 AI 如何從概念驗證跨越到臨床實踐：Fierce Healthcare 深度分析落地關鍵", "summary": "Fierce Healthcare 發表深度分析，聚焦醫療 AI 從試驗性概念驗證（pilot）過渡到正式臨床實踐的核心挑戰與成功要素。報告指出，許多醫療機構在小規模試驗中獲得良好成效，卻在全院規模部署時面臨組織文化阻力、工作流程整合困難、資料品質不均及維運資源不足等多重障礙。文章歸納出成功落地的共同特徵，包括：具備明確臨床問題定義、取得臨床領導層背書、設計配套的人員培訓計畫，以及建立持續監測 AI 表現的回饋機制。此分析對正在規劃醫療 AI 擴大部署的醫療機構具有直接參考價值，尤其提醒勿將試驗成功誤判為全面推行的充分條件。", "tags": ["AI落地", "數位轉型", "臨床實踐", "組織變革"], "author": "未標示（Fierce Healthcare｜2026-11-14）", "source_url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxNbk9BVUpNeFZ1YTRyWVpYc1I1OTVfWHNHcWxIdjJJU3ZVRjN5M0ZQdUZyNmNLYXZuV1d3T1drUlF0YnRoTDdHeHZPX01pQ3NPRWpzNW9TZ3JCUHIwN2k3cG5aUnhyZzdYdWoxUmxiNFFndjkzcVlkdTgtNkJjUUw2VWRFeGw?oc=5"}, {"rank": 6, "score": 7.0, "title": "AI 病理生物標記在攝護腺癌治療決策的角色：從診斷到跨疾病期的臨床應用", "summary": "UroToday 刊載 Phuoc Tran 與 Zachary Klaassen 的深度分析，探討以 AI 為基礎的病理生物標記（AI-based pathology biomarker）如何在攝護腺癌不同疾病期輔助治療決策。該生物標記透過深度學習分析病理切片影像，能預測疾病進展風險、輔助分層治療選擇，並在手術、放射治療與荷爾蒙治療之間的決策中提供額外的預後資訊。文章強調，傳統 Gleason 評分系統存在觀察者間差異，AI 量化分析可望提升病理判讀的一致性與客觀性。此類 AI 病理工具正逐步走向泌尿腫瘤科臨床整合，代表 AI 從影像科延伸至病理科的重要趨勢，對癌症診療中心的檢驗流程規劃具參考意義。", "tags": ["AI病理", "攝護腺癌", "精準醫療", "生物標記"], "author": "未標示（UroToday｜2026-11-14）", "source_url": "https://news.google.com/rss/articles/CBMitgJBVV95cUxQUHkzTEI5UTFQenpRSl9xX0xvLTFTRlYwRXJPanMzMHAyZVZyY28yRzRlYlNiU3BscnFkMDFTVi1GWnhZTjk3bEx1bW53bkd3RG9ldlBGOERSV2NqU2MyY3M0dUdoRUVnb043MG9wYXFCSFRUZGc5ZS1aQ2JFTFgtdjFFc3FJblRQRXdTOTBFQVpGTUV6MUZrbnM5eDg1Ym9Ba1NPS3VuenA2U1dDbm51dHltbzVLUlpFLUd1N3kwcnhucFZtVjdnbHZ4bmVRU28zY2pwanJQM1lLay1pQTR6SzMxTjctS2dtcV9nbEI5NWN5OF9tTUxNWENQdzRVR1h3alpMSFJMRWFkcGY4WHJPcm5DYmNrVmRpdEh5RzJmQUtHaE5raWZnR19mQlVXeWNPeEJUTFdn?oc=5"}, {"rank": 7, "score": 7.0, "title": "甲狀腺病理 AI 模型存在隱藏特徵劫持與空間偏差風險，研究提出新警示", "summary": "Bioengineer.org 報導最新研究發現，用於甲狀腺病理切片分析的 AI 模型可能存在兩項潛在缺陷：一是「隱藏特徵劫持」（hidden feature hijacking），即模型在學習過程中意外抓取與目標無關的特徵作為分類依據；二是「空間偏差」（spatial bias），即模型對切片影像特定區域過度敏感，導致分類結果受到切片製備方式影響。這兩項問題在模型驗證集上可能不易察覺，但在臨床實際應用時卻可能造成誤判。研究強調，病理 AI 模型在臨床部署前需進行更嚴謹的可解釋性測試（XAI）與跨機構驗證，以確保模型學到的是真正具臨床意義的特徵，而非人工偽影。此研究對正在評估病理 AI 採購的醫院具重要參考價值。", "tags": ["AI病理", "模型偏差", "可解釋性AI", "甲狀腺"], "author": "未標示（Bioengineer.org｜2026-11-14）", "source_url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPekR3dENxVEZ5RVJFSWNpUzZOWTRBSVlFRXZ2eEhhTjVUOTFOemRhV2lubFNhMVd3NktqR2ktQTBlTDg1aXY2R1padnd0VDFHSUVvVXM5emwxN1h0TkxSS3pNQWtaY0RXTFREbFJWVWtTVGtKZ3lYVENNTlFLZU1EdHBiQk1WV1JJWVZ4b2ljSXUyY1BCZFZSYUpqTnktUElYZ1A3SDhLSHJqQQ?oc=5"}, {"rank": 8, "score": 6.5, "title": "烏克蘭衛生部著手制定醫療 AI 法規，逾八成受訪臨床醫師已實際使用 AI", "summary": "烏克蘭衛生部宣布正式啟動醫療 AI 監管框架的制定工作。背景數據顯示，調查中已有 80.5% 的受訪臨床醫師表示在工作中使用 AI 工具，使得法規制定的迫切性顯著上升。規範草案預計涵蓋 AI 醫療器材的認證流程、臨床驗證要求、責任歸屬界定及上市後監測機制。烏克蘭的案例反映一個全球普遍現象：AI 實際採用速度遠超監管框架建立速度，各國衛生主管機關正競相追趕。此一發展對台灣醫療 AI 政策制定者具參考意義，尤其在比較各國如何在加速創新與保障安全之間取得平衡方面，提供具體的政策思考路徑。", "tags": ["醫療AI法規", "政策治理", "國際比較", "臨床採用率"], "author": "未標示（Mezha.net｜2026-11-14）", "source_url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE95TF9DNXpzOU9BYlhXU2d1dHJmOWg3Y3BwREtaUUNveldCWS1ZNk0zcDBaRkdUdWtWWnpMMVJnd3o0aEtkSUJqRXZpVlFJVnItMGNhbm00a2RISVJPa2xpSENtbG1FeWhPaHBXN3lkM0VXLXV6RHd5VkF6QQ?oc=5"}, {"rank": 9, "score": 6.5, "title": "台北醫學大學舉辦數位健康峰會，產官學共議 AI 醫療臨床落地挑戰", "summary": "台北醫學大學主辦數位健康峰會，邀集產業界、政府機關與學術單位代表，共同討論 AI 醫療技術的臨床應用現況與推進策略。與會者聚焦於 AI 工具在台灣醫療機構的實際落地經驗，包括資料標準化、跨院資料共享機制、AI 模型臨床驗證流程，以及醫療人員訓練與接受度等議題。峰會亦探討健保資料庫在 AI 研發中的戰略價值，以及如何在保障隱私的前提下促進數據流通。此次峰會匯聚台灣智慧醫療生態系多方聲音，呈現台灣在 AI 醫療產業化路徑上的現階段進展與挑戰，對正在規劃智慧醫院策略的機構具有政策脈絡參考價值。", "tags": ["台灣醫療AI", "數位健康", "產學合作", "智慧醫院"], "author": "未標示（中央社 CNA｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9jLUFqX21PMzFWLXFPS0JfNnZ5dGR6OGRHZUJpUEZZMExNUVAzX2szUmo5MWFfbWxMVURldlpsRy0zdkxzdWllSWZHTEI1MWNqYmNqTHRlTnRmN0ZHZHdV?oc=5"}]}, "2026-11-13": {"date_str": "2026年11月13日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "AI 生成照護計畫費用恐高於醫師處方？《新英格蘭醫學期刊》最新研究引發質疑", "summary": "醫療機構近年積極投資 AI 以精簡工作流程、降低成本，但《新英格蘭醫學期刊》最新刊出的研究卻顯示，AI 自動生成的照護計畫，其實際醫療花費可能遠高於醫師親自開立的處方。研究挑戰了業界普遍預設的「AI 導入必然節省成本」假設，指出 AI 建議若缺乏適當的臨床篩濾機制，反而可能推升不必要的檢查或治療支出。此一發現對正在評估或已部署 AI 臨床決策輔助系統的醫療機構具有重要參考意義，同時也提示醫院領導層在計算 AI 投資回報率時，需將潛在的照護成本增幅納入考量。研究結果亦凸顯 AI 工具的輸出品質監測與療效審查機制的必要性，促使各界重新審視醫療 AI 商業模式與實際落地效益之間的落差。", "tags": ["AI照護成本", "臨床決策支援", "醫療AI效益", "實證研究"], "author": "未標示（MedCity News｜2026-11-13）", "source_url": "https://medcitynews.com/2026/11/is-ai-really-saving-hospitals-money-a-new-study-raises-questions-about-the-cost-of-ai-driven-care/"}, {"rank": 2, "score": 8.5, "title": "2027年醫療 AI 趨勢預測：七大方向將重塑健康資訊科技策略", "summary": "Healthcare IT News 彙整分析指出，2027年將深刻影響醫療機構 IT 策略的 AI 趨勢包含：自主式 AI Agent 全面滲透臨床工作流程、基礎模型在放射科與病理科的落地應用擴大、生成式 AI 與電子病歷系統整合加速、AI 資安威脅同步升溫、醫療 AI 監管框架逐步成形、跨院資料共享基礎設施需求急增，以及 AI 偏見與健康公平性議題受到更嚴格審視。報導指出，醫療機構若未能在 2026 年底前建立完整的 AI 治理機制，將在合規與競爭力上面臨雙重風險。對於正規劃中長期數位轉型路線的醫院資訊部門與領導層而言，此份前瞻分析具有策略性參考價值，可作為 AI 優先佈局與資源配置的重要參照依據。", "tags": ["醫療AI趨勢", "健康資訊科技", "AI治理", "數位轉型"], "author": "未標示（Healthcare IT News｜2026-11-12）", "source_url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxQNlFXTml6WGtsbjJGWlhDLWRkdFRMY1c4c3lfMFJVbEZRRFZ2UWlzaktreU5pcU5XMFJiT3hjYkxHdXRqeTJYaHNJU0Y0OGtSRmw3QVFEcUVzczIwYjhKZVhPNzVGYUpORWNlVkdRYlpoTFJDUnc1cFozNjc3ZFl2MUowR2JlVTcxN3kwbW1kNA?oc=5"}, {"rank": 3, "score": 8.0, "title": "Medicare AI 預授權實驗再生疑雲：新文件揭露更多治理隱憂", "summary": "STAT News 報導指出，美國聯邦醫療保險（Medicare）推動以 AI 輔助事前授權審查的實驗計畫，近期遭新釋出文件進一步質疑其透明度與公正性。文件顯示，AI 系統在審查醫療服務給付申請時，部分決策依據不明，且對不同群體的核准率存在潛在差異，外界擔憂演算法可能系統性地不利於特定患者群體。此案已引發國會議員、患者權益倡議團體及學術界的廣泛關注，要求主管機關公開演算法審計報告。此一議題不僅涉及 AI 在保險理賠核准的倫理邊界，亦對全球正在探索 AI 預授權應用的醫療付款方與醫院提供重要的政策警示，凸顯 AI 決策透明度與問責機制的迫切性。", "tags": ["Medicare", "AI預授權", "演算法倫理", "醫療AI政策"], "author": "未標示（STAT News｜2026-11-12）", "source_url": "https://www.statnews.com/2026/11/12/new-documents-raise-more-questions-about-medicares-ai-prior-authorization-experiment/?utm_campaign=rss"}, {"rank": 4, "score": 7.5, "title": "放射科醫師每日使用 AI 比例攀升，研究顯示有助精進專業技能", "summary": "AuntMinnie 最新報導引述調查數據指出，放射科醫師每日使用 AI 輔助判讀的比例持續上升，且部分研究顯示長期使用 AI 工具有助於醫師提升影像判讀技能，而非如部分人士所憂慮的造成技術退化。研究發現，AI 作為「第二雙眼睛」在偵測細微病灶方面表現突出，讓放射科醫師得以將更多注意力投注於複雜病例的整體判斷。然而，報告也提醒需持續監測醫師對 AI 的過度依賴傾向。此份調查對於放射科主任評估 AI 工具的採購策略、訓練計畫設計及技能維護機制，提供了具體的實證基礎，也呼應了放射科 AI 整合進入「常態化應用」新階段的全球趨勢。", "tags": ["放射科AI", "影像判讀", "臨床技能", "AI使用率"], "author": "未標示（AuntMinnie｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMi3gFBVV95cUxPVUJ3WFJHMWxIVmVmSEFqMHJRd0Y5cWRFNnhpMmhJOVJuZFRGOFpBZldDeEtlandzRERzMThIeE1jdVk3NU9BVWZZaHdHNnAzMHB1cGtjdEhvOFpGU0tfVkIxWFFCTExONlhoLTRyRjE0UmZmZ2pvSlNRSFRla19pWWUwUnZXM2RTRHBVWExtY01NenNVQjRSSXV6WEx6WkI2YTJnZXUtY3RvN2N6MXVTdTExQnU3NEdlN2ZMM1RXWTJ4b3R1MW9Ea0NkNXg1akJDLVR3S0Y1QWRhRTk2MEE?oc=5"}, {"rank": 5, "score": 7.5, "title": "基礎模型在放射科報告撰寫的潛力：作為輔助起草工具的新應用", "summary": "AuntMinnie 報導分析大型基礎語言模型（Foundation Models）在放射科報告撰寫上的最新應用進展，研究顯示此類模型作為「起草輔助工具」時，能有效加速報告產出並降低措辭錯誤，特別在標準化描述詞彙與結構化報告格式方面表現良好。然而，研究同步指出模型在罕見病灶描述及跨語言應用上仍有明顯侷限，且需要放射科醫師進行嚴謹的最終審核以確保臨床準確性。報告也探討基礎模型與現有放射科資訊系統（RIS）整合的技術挑戰，以及如何在提升效率的同時維護報告品質。此研究對於評估引進 AI 報告輔助系統的放射科及資訊部門，提供了平衡且務實的參考觀點。", "tags": ["放射科AI", "基礎模型", "報告自動化", "臨床工作流程"], "author": "未標示（AuntMinnie｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMi6gFBVV95cUxQX0N3MVptYURib0t3aUxHeFdUOEhISG5VYXl5RXZpSHUyNmRNd0hjS29SSXA1SlJIWVBMdEpmN2ktOFVjcUlVamFRQ0d2dE1LbEtJQjA4Wi1Sd29IaXE0eUFSbl8xSFJUMWp5b3FFSTJTd2xNd0xGS0RQMlVoOFZDSUh5N19rWEc1aE8wd3VqaEoxUUJTM1NOLWJjVE9COHhMWVkwUWpzdDd4WEhuMldDbEVnNHU4TksxRWJKbVlaT3lSTDZLTXdzVFg0anV3bVNGQmVRRW1qcS0xOEw3cWg4TGlpQUt4MF82eUE?oc=5"}, {"rank": 6, "score": 7.0, "title": "Zus Health 獲 3,300 萬美元融資，打造 AI 驅動臨床工作流程基礎設施", "summary": "醫療資料基礎設施新創公司 Zus Health 宣布完成 3,300 萬美元新一輪融資，資金將用於擴展其以 AI 為核心的臨床工作流程基礎設施平台。Zus Health 的核心產品是一套整合式患者資料層，能將分散於不同醫療機構的健康資料即時彙整，供 AI 應用直接調用，以解決醫療 AI 落地時普遍面臨的「資料碎片化」問題。此次融資反映市場對醫療 AI 基礎設施層的高度關注，投資方認為，決定 AI 臨床應用成敗的關鍵往往不在於模型本身，而在於資料存取的完整性與即時性。Zus Health 的商業模式對於正在評估如何強化 AI 資料準備度的醫療機構具有參考意義，也呼應近期業界對患者資料品質的廣泛討論。", "tags": ["醫療AI基礎設施", "臨床工作流程", "資料整合", "新創融資"], "author": "未標示（Fierce Healthcare｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxOUjZORTJVZzI2LVJwVXplRVB4Z3VqSEMyNFcwQU9IRnQySE5XMlA3a3p2a1ZEbEVrRHJWQmJSZWM0a19MTkRjZ2d5eEJqd21WZ1JGVXBXYU51TTQ1ZEZpNXJlMmNiVVk0NDI1WksxM01ucnZNMkdWM2FqdEhkRk9jZlZBM2VDZE5Ed2RxR1k3Z0Z4aFJrdXAzdlVRVnoyV0RwbnhBWU9raXdPZXZ1Z05idnJiWUplNm9nclE?oc=5"}, {"rank": 7, "score": 7.0, "title": "阿布達比攜手 Isomorphic Labs 與 AstraZeneca，2030 年前規劃最多 30 項 AI 醫療臨床試驗", "summary": "阿布達比宣布擴大 AI 醫療研究投資，與 DeepMind 旗下 Isomorphic Labs 及英國藥廠 AstraZeneca 建立合作夥伴關係，計畫在 2030 年前主導或參與最多 30 項以 AI 加速設計的臨床試驗。合作重點涵蓋 AI 驅動的藥物分子設計、蛋白質結構預測應用於新藥開發，以及利用真實世界資料加快臨床試驗招募效率。阿布達比此舉被視為中東地區積極搶佔全球醫療 AI 樞紐地位的戰略布局，同時展現主權財富資本對生技 AI 長期投入的決心。此一跨國 AI 藥物研發聯盟模式，對於正在探索 AI 加速新藥研發路徑的製藥業與學術醫院研究團隊，提供了重要的國際趨勢參照。", "tags": ["AI藥物研發", "臨床試驗", "國際合作", "Isomorphic Labs"], "author": "未標示（三嘻行動哇 Yipee!｜2026-11-13）", "source_url": "https://news.google.com/rss/articles/CBMiygJBVV95cUxPTWNuZk9qdDRjSjNWUVBSZGdfSnUxNndqbGlFTWpvXzlrbC13dDVfbjZMNXd5dDFqWjAtdTZISE1waHcxcmdZc09JMUhaOEU0QnowdjNDbzVySkNWZFJYUld3aTQ0cFdsQXI2NkNDVlZoYlJlRTZ3bjdneWpkU3FDc2VTbHhRVENSeUNsa2xLUU9XUUhOejZiaXh5dWNyWVNlY1ZubGxKOEZ3LTRfZWEwdXRGNUhhQ0RUT2p6emVOWXh1czY4ZFBTRU1teUhvdDlLMHZmVHlGVDlUNXN4YWQ1d1R1T3FuZkFJWWdZMDlkVDJiNzNNMlJicG5CMEZ5WUFNNlZsS3hrMkNhNUk1TE1QNE9TTDA3bkllZXM1eFM1b21ENEVZMEZqQjhMbDVoR1F0c3pfTzZ4ZkhiZVlOb3ZuVXVpOEF4QTFEVnc?oc=5"}, {"rank": 8, "score": 6.5, "title": "a2z Radiology AI 獲歐盟 MDR 認證，單一系統可偵測頭頸胸腹骨盆 CT 共 182 項發現", "summary": "a2z Radiology AI 宣布獲得歐盟醫療器材法規（EU MDR）認證，其 AI 系統能在頭部、胸部、腹部及骨盆 CT 影像中自動偵測多達 182 項放射科發現，涵蓋範圍之廣在業界屬領先水準。此認證代表該產品已通過歐盟嚴格的臨床安全性與效能審查，可在歐盟成員國醫療機構合法上市部署。該系統以單一模型涵蓋多部位多發現的設計，有別於傳統以單一疾病為目標的放射科 AI 工具，可望降低醫院導入多套系統的管理複雜度。對於正評估放射科 AI 解決方案的採購決策者而言，此認證進展提供了重要的監管合規參考，也顯示放射科 AI 產品的法規路徑在歐盟已逐漸成熟。", "tags": ["放射科AI", "EU MDR認證", "CT影像", "醫療器材法規"], "author": "未標示（Business Wire｜2026-11-12）", "source_url": "https://news.google.com/rss/articles/CBMihwJBVV95cUxNdk1NQVI2aFZicktYWTFsMGkxbkVTcUVVRDF4RjVDVjF0WXVaS2dtVjJLSEtHbHdzY2tIQ3Rral9pU2tkbUFHWGhqbUJHYXpPUER4Vld2ZUhMQjY3NWhzWnp0d1ZTRG9VbmJRQ0tKNV9Xb0U0c0p2QUc2aUdrdHJEUVNyUFFuSWxaWm5QQmNhN3RYenl1UkxXWV9IWUVFVi1FQ2hGRkpEdGZsRE1KejdCLVVqMlpBZFRaRHZhUUZVMF9hbHpKNExiaVJiQV96VlYyM2hGNWhzNFVBRDAyNFg5Z0JhQ0xyZ0QxUnlqMVYzVnhHZDUyek04a25RUnc4TEZNR3NBdlJkWQ?oc=5"}, {"rank": 9, "score": 6.5, "title": "公眾更信任 AI 作為「解釋助手」而非「診斷工具」：研究揭示醫療 AI 信任分層現象", "summary": "Bioengineer.org 報導一項最新研究發現，一般民眾對醫療 AI 的信任程度因使用情境不同而呈現明顯分層：當 AI 被定位為輔助醫師向患者解釋病情的「說明工具」時，民眾接受度顯著高於將 AI 直接作為獨立診斷工具使用的情境。研究指出，患者對 AI 的疑慮主要來自對演算法黑箱決策的不安，以及對醫師角色被取代的憂慮。此一信任分層現象對醫院在設計 AI 應用的患者溝通策略時具有重要參考意義，同時也提示 AI 工具的介面設計與定位說明，將直接影響患者接受度與使用成效。研究建議醫療機構在導入 AI 時，應將「以醫師為中介的 AI 呈現方式」列為優先設計原則。", "tags": ["醫療AI信任", "患者接受度", "AI溝通策略", "診斷輔助"], "author": "未標示（Bioengineer.org｜2026-11-12）", "source_url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxNTlljSVhCWWZCQk52cFVvUEJhYnRSOGk0R3prQlBYMG1pdE9RZ2hYNlFPaS1raExBLWVMd3NIOFFRbzRsZkJ4aU1QazdZbUl5aWhDVElHcDdrWUw3U2luZlVjNlV4ZlZqY3VZeXJZRk9wemVJTzVubUVoNFAxbkJBUktraDVzZ2hsQlU4bUc1Wm1XOUlnakY1TUhzdHcxSVBDMEE?oc=5"}]}, "2026-11-12": {"date_str": "2026年11月12日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.2, "title": "DeepMind 發表 AlphaGenome 2：AI 解讀單細胞 DNA 變異，精準醫療再突破", "summary": "DeepMind 於 2026 年 11 月 11 日在 Nature 發表 AlphaGenome 2，這款超強基因體定序 AI 模型能夠預測特定 DNA 變異在哪種細胞類型中發揮作用，可識別的關鍵變異數量達前一代模型的近兩倍。AlphaGenome 2 透過深度學習整合單細胞基因體資訊，大幅提升科學家理解遺傳變異與疾病機制關聯的能力，對罕見疾病基因診斷、藥物靶點發現及精準治療策略制定均具重要意義。此技術突破被 Nature 專文報導，科學界高度關注其潛在應用場景，包括腫瘤基因體學、神經退化性疾病及遺傳性心血管疾病的分子機制解析。對醫院基因醫學中心及相關研究部門而言，AlphaGenome 2 代表 AI 輔助基因診斷進入新世代，未來有望加速從基因定序數據到臨床決策的轉譯應用。", "tags": ["基因體AI", "精準醫療", "DeepMind", "單細胞定序"], "author": "未標示（Nature｜2026-11-11）", "source_url": "https://www.nature.com/articles/d41586-026-03673-0"}, {"rank": 2, "score": 9.0, "title": "AMA 要求立法保障醫師使用 AI 的法律責任：無論遵從或推翻 AI 建議皆應獲免責保護", "summary": "美國醫師學會（AMA）正式要求國會立法，為醫師在臨床使用 AI 決策輔助工具時提供責任保護，無論醫師最終選擇遵從或推翻 AI 建議，均應受到法律保障。AMA 指出，目前法律框架對「AI 建議與醫師判斷不一致時責任歸屬」尚無明確規範，導致臨床端對採納 AI 工具存在顧慮，阻礙醫療 AI 合法落地。此一倡議直接回應了前線醫師的執業風險疑慮，也為各國醫療 AI 監管框架的制定提供重要參考。若相關立法成形，將深刻影響醫院採購 AI 工具的決策邏輯、使用政策設計，以及醫師教育訓練方向，對正在推動臨床 AI 導入的醫療機構而言，此一政策動向值得密切追蹤。", "tags": ["AI法律責任", "臨床AI政策", "醫師保護", "AMA"], "author": "未標示（Crain's Chicago Business｜2026-11-11）", "source_url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxPc1A1X3JsclJ3TFpYbU1UTVRoMVBqY3B0c3M5RGV5Z20zS0YxTVNlaWwzV04xTWhMVndZRXBtclBkM1hpMV9VNElLZnF6WXpIMGxGck9aenQ2Wm9oVTFjTER2ZFRUWE1zTmFveGJNV0JuWUk1Yzk3NGQyOEo3YlNpRk9R"}, {"rank": 3, "score": 8.8, "title": "台南市立醫院設定 90% AI 使用率目標，成為台灣智慧醫院推進標竿", "summary": "Healthcare IT News 報導，台南市立醫院正式設定院內 AI 工具使用率達 90% 的積極目標，涵蓋臨床輔助診斷、行政流程自動化及病患照護管理等多個應用場域。此一具體量化目標在台灣醫療機構中屬率先表態，顯示地方公立醫院在智慧醫療轉型上已從「試點導入」邁向「全面普及」的戰略思維轉變。報導指出，台南市立醫院的做法可為其他尚在規劃 AI 導入路徑的醫療機構提供參考，包括如何設定可衡量的 AI 採用指標、追蹤實際使用情形，以及建立配套的員工訓練與品質管控機制。對台灣整體醫療 AI 生態而言，此案例亦凸顯公立醫院在數位轉型政策推動中的示範角色。", "tags": ["智慧醫院", "AI導入", "台灣醫療", "數位轉型"], "author": "未標示（Healthcare IT News｜2026-11-12）", "source_url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxOTlgwbWt4NWNwWjJHVGZtMTlRSzZ4b0R2SXRnUUJtUGhpeVFfSVNieVk1XzM1YlZnYXNSN1VhczJScTlvOEtUNGtiU05QSzV6cXpFT2Z4cXc3VGlwTnJCMGJOdzZkUlFWLUczeHZ1NkxXU0Q5NFVoVkRXeV95TkJXX1QzZFZ2Y1prSXlZUjQw const TODAY_ISO  = "2026-11-17";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
