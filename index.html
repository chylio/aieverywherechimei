<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年06月30日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

urce_url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxNbTkzZHRRRWZqSHZXcFpyZ0lwS1NkTTNVdE8wTk53VEZBRExUbXdSQjFueVM2ekhpa29lZUR3SHBLekFXV192T0t4WGRGTDhoMFBkMU5yVDFYY1FySmdxckw4YnRRaWczbWowZ00xeGd6VDBSNVZxa0JwbDlwSUdXLUlqRTU4Z1RBTGJVV3RMdEZ2bnlLY21LUDNKcWJNTVNyUUpfVG8yVkJvM19KY3dmR0c0endRRVB0QmtGa3g2YTJGN0U?oc=5"}, {"rank": 3, "score": 7.0, "title": "放射 AI 每週 FDA 動態彙整：2026 年 6 月 21 日至 27 日", "summary": "Diagnostic Imaging 彙整本週放射科相關 FDA 動態，涵蓋 2026 年 6 月 21 日至 27 日期間核准、許可及突破性裝置認定等重要監管進展。本週 FDA 持續審核多項影像 AI 產品，顯示監管機構對放射科 AI 工具的審查節奏明顯加快。這份每週彙整對醫院放射科主任及資訊部門具有高度參考價值，可快速掌握市場上哪些 AI 影像工具已取得合規許可，從而評估導入時機與選型風險。值得注意的是，近期 FDA 對生成式 AI 放射科工具的突破性裝置認定數量持續增加，包括此前報導的 Aidoc 胸部 X 光報告草稿 AI，顯示監管環境正逐步為臨床級生成式影像 AI 鋪路。醫療機構在評估放射 AI 採購時，應定期追蹤此類 FDA 核准彙整，以確保所選工具符合最新監管要求。", "tags": ["放射科AI", "FDA監管", "影像AI", "醫療器材許可"], "author": "未標示（diagnosticimaging.com｜2026-06-28）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPV0tMZnJ5NEwwVWF6U19JS1Z5eUNOZGxhX25icHhTS2JWUjcxejhmMk5YN1lIc1hMZjJJbTFwcjlTcXdoODJyZzkwMS1idXk5MV9DVjBjRWZfN1JWQlJ6UUF0Q3FvNjRYa3NIVWQzTngxVTBPcS14bkhBUGtoMHJVRjZoeE82ZDdN?oc=5"}, {"rank": 4, "score": 6.5, "title": "DeepHealth 深度解析：RadNet 的 AI 策略如何重塑放射科商業模式", "summary": "Oncodaily 深入報導全美最大連鎖放射診斷機構 RadNet 旗下 AI 部門 DeepHealth 的發展路徑，分析其如何透過自建 AI 影像辨識平台，將 AI 能力系統性整合至放射科日常工作流程，進而重塑整體商業模式。RadNet 的策略重點在於垂直整合：不僅開發乳房攝影、肺結節偵測等專科 AI 工具，更透過資料飛輪效應持續優化模型精度，並以此為競爭壁壘吸引保險業者和醫院網路合作。此案例對台灣醫療院所具重要參考意義，顯示放射科 AI 的長期競爭優勢來自資料積累與工作流程深度整合，而非單一工具採購。醫療機構若計劃系統性導入放射 AI，應參考 RadNet 模式，評估建立院內資料治理架構與 AI 能力中心的可行性，以形成可持續的數位轉型動能。", "tags": ["放射科AI", "商業模式", "數位轉型", "影像AI"], "author": "未標示（Oncodaily｜2026-06-28）", "source_url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTE5yUTFOakF5OU5NTVRBalpWcENGYnllYVR5S3JiY3FDcWQ5b09YSkk4NmFPU2tmTU82T0ZJbS1OQUdOMTB5cndpdnUwYmNxWEtoQVpLaDRnRHlDbmdT?oc=5"}, {"rank": 5, "score": 6.0, "title": "策略框架助力臨床數位病理永續落地：實踐指引出爐", "summary": "News-Medical 報導一項針對臨床機構數位病理導入的策略框架研究，提出可操作的永續實施路徑，協助醫院從試點走向全面部署。研究指出，數位病理（digital pathology）結合 AI 影像分析雖已展現顯著的診斷效益，但多數機構在規模化推 cUxOZ0pyZll5b0tnM2YwQUFBODh2bl9vR3p3amQ1WkFHazRGT2VlVEVGYzRMMklEUUFvWnlPeXV2MkpRMjZjUzNsX0FhQ0FUWTROMF9RUjNtZjlyM18zWWtMMVpDWG1BeUxiblVWUEVQZW9DMXl2dEkwQ0JXUC1sNUZwXzZyb0s0Sm4ydGdOYWdR?oc=5"}, {"rank": 2, "score": 6.5, "title": "Radin Health 擴大在內華達州的放射科 AI 平台部署", "summary": "AuntMinnie 報導，Radin Health 宣布在美國內華達州擴大其放射科 AI 平台的部署規模。Radin Health 的平台整合 AI 輔助影像分析功能，旨在協助醫院與影像中心提升影像判讀效率、縮短報告回報時間，並支援偏遠或人力不足地區的遠端放射科服務需求。此次擴展顯示，社區醫院與區域醫療系統對 AI 放射科解決方案的採購意願持續提升，市場滲透已不侷限於大型學術醫療中心。對醫療資訊部門與數位轉型團隊而言，此案例提供了區域性 AI 放射科平台規模化落地的實際參考，亦凸顯放射科 AI 產業競爭加劇的市場趨勢。對醫院領導層而言，在評估影像科室 AI 採購策略時，此類平台的擴張速度與整合能力值得持續追蹤。", "tags": ["放射科AI", "平台部署", "影像診斷", "醫院數位轉型"], "author": "未標示（AuntMinnie｜2026-06-27）", "source_url": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxOeXM1NE1CWW9hTk9fVl9iMFJuekd0TE1tUUdZWGFPWURIeldITVRMYkpISndRUjVBNFBJWXZ3V3ZpWnFUR1NXU3pkZTdBMDllQ1VBUjM1b2VQTUZPS0Nrb1JaREpZNkN2aWthVXVWZkVzdGR6WWJyeTFXdDlxQ2I2bjRIbGZCRmVNU1N5c3NwVWJXSlpBUnVoVXBIbGhGOUIwSk41cVFudE5FT00xeVh1c3NHWXFVY1hkMFZ5YnlDd3pvRU9qOUhTWGZ4X2l1anpKZ3Rz?oc=5"}, {"rank": 3, "score": 5.5, "title": "The Lancet 刊載健康錯誤資訊委員會報告：AI 與社群媒體加劇全球健康資訊危機", "summary": "The Lancet 發表 Lancet Commission 評論，指出聯合國與世界經濟論壇已將錯誤資訊與不實資訊列為當前全球最高短期風險，其威脅程度甚至超越極端氣候與武裝衝突。委員會特別強調，快速演進的人工智慧技術正在加速健康錯誤資訊的傳播，使 COVID-19 疫情期間已顯現的資訊混亂問題更加複雜難解。報告呼籲各國政府、醫療機構與科技平台共同承擔責任，建立更完善的資訊可信度核查機制。對醫院領導層而言，此報告提示在推動 AI 應用時，亦需同步強化醫療資訊素養教育，防範 AI 生成內容被誤用為醫療建議的風險，尤其在患者自我照護與遠距醫療情境下，機構的公信力與資訊把關角色將愈發關鍵。", "tags": ["健康資訊", "錯誤資訊", "AI倫理", "政策"], "author": "未標示（The Lancet｜2026-06-27）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01128-1/fulltext?rss=yes"}]}, "2026-06-27": {"date_str": "2026年06月27日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.0, "title": "Nature 刊載 MASAI 試驗讀者回應：AI 輔助乳房攝影篩檢的效益衡量爭議與廣泛推行前的方法學警示", "summary": "《刺胳針》本期刊載三篇讀者來函及作者回應，聚焦 MASAI 試驗所提出「AI 輔助乳房攝影篩檢可提升篩檢效能、可考慮導入臨床」之建議。投書者分別指出：該試驗以中間績效指標（敏感度、間隔期癌症率）作為主要結論依據，卻未充分評估過度診斷風險；現行間隔期癌症率受腫瘤生物特性與可偵測前期長短影響，不足以單獨反映 AI 真實篩檢效益；此外，若在廣泛採用前未解決特異度與假陽性率問題，恐增加不必要的切片及患者焦慮。作者群在回應中釐清研究設計侷限，並強調於特定臨床情境下，AI 輔助閱片仍具有減少放射科醫師工作量的實際效益。此一學術論辯對計畫導入 AI 乳篩工具的醫院提供了重要的方法學參考框架，提示決策者在解讀臨床試驗結果時需審慎區辨中間指標與真實世界效益之差異。", "tags": ["乳房攝影篩檢", "AI輔助診斷", "臨床試驗方法學", "過度診斷"], "author": "未標示（The Lancet｜2026-06-27）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00698-7/fulltext?rss=yes"}, {"rank": 2, "score": 8.8, "title": "Nature 發表集群隨機對照試驗：生成式 AI 臨床決策支援系統在基層醫療的實戰成效", "summary": "一項發表於 Nature 的務實集群隨機對照試驗，於基層醫療環境中評估生成式 AI 臨床決策支援系統（CDS）的實際表現。試驗採集群隨機設計，比較導入生成式 AI-CDS 的診所與對照組在臨床決策品質、醫師工作流程效率及病患照護結果上的差異。此研究是目前少數以高嚴謹度 RCT 設計直接驗證生成式 AI 在第一線診療情境中效用的代表性研究，填補了過去多數研究僅依賴回顧性或觀察性資料的缺口。研究結果對於評估生成式 AI 是否適合大規模整合至門診工作流程具有直接政策參考價值，尤其在資源配置、臨床監督機制設計及後續效果追蹤等面向，可提供醫院管理層與資訊部門具體的部署依據。", "tags": ["生成式AI", "臨床決策支援", "基層醫療", "隨機對照試驗"], "author": "未標示（GNews-AI clinical｜2026-06-26）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5HTXAyQnI2S2NVb0hvYXR4eFdsZk1rOTZqSXJhbVlNdEIzYmhUMUV6QXFIN0phZFFjSXFGMkIzeEhfYmZKOTR4RlF1Tk5QcXNKeld1WTZYcWhQQXByTGxr?oc=5"}, {"rank": 3, "score": 8.5, "title": "HHS 各機構公布醫療 AI 施政優先項目，聯邦層級政策路線圖逐步成形", "summary": "美國衛生及公共服務部（HHS）旗下各機構近期陸續公開其醫療 AI 的優先推進領域，涵蓋 FDA、CMS、ONC 等單位在 AI 審查標準、資料互通性及臨床安全監管方面的具體方向。此舉標誌著聯邦政府對醫療 AI 的監管態度由觀望轉向積極建構政策框架，各機構將協調推進 AI 醫療器材審查流程的透明化、確保演算法在多元族群中的公平性，並強化上市後監測機制。對醫院而言，此一聯邦政策路線圖將直接影響 AI 產品採購合規要求、電子病歷系統整合標準以及臨床 AI 工具的責任歸屬認定。醫院領導層與法遵團隊宜密切追蹤 HHS 後續發布之細部規範，提前評估現行 AI 部署方案是否符合即將收緊的聯邦標準。", "tags": ["醫療AI政策", "HHS", "聯邦監管", "AI法規"], "author": "未標示（GNews-Medical AI｜2026-06-27）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxPQ2YxVHFNUnUzekUzNkROSnpZaHZRdl9UR3hSNjh3SktKZGRmWVEtRG9qeG5DN2NBMVVpcF9GWlV1WGRlTGF2RDdmQTU1MFo2c3FpbUd0MEF5ZlI2ZTVGRG8wLXRsalJXeGxqNEtDczVkaUtJUFI0MU9aeFZxaUhObFhQMWhrZGtGVWYtN3oxSS13SlZGMEtN?oc=5"}, {"rank": 4, "score": 8.2, "title": "AI 輔助文書紀錄工具不只為醫師設計：Reid Health 護理師導入 Abridge 後，下班後記錄時間減少 45 分鐘", "summary": "美國農村醫療體系 Reid Health 將 Abridge 的 AI 語音記錄技術擴展至護理師族群，成為少數將 AI 文書輔助工具系統性部署於護理工作流程的實際案例。根據該院護理長 Misti Foust-Cofield 的報告，導入後護理師下班後的補記時間最多縮短 45 分鐘，RN 空缺率亦下降逾半，顯示 AI 文書工具對緩解護理人力短缺具有直接成效。此結果對面臨護理師招募困難的醫院具有高度參考價值：AI 文書輔助不再只是放射科或門診醫師的生產力工具，而是可切入護理工作流程以降低行政負擔、提升人員留任率的系統性解方。醫院管理層可據此評估將現有 AI 文書工具的授權範圍擴展至護理部門的可行性與投資報酬率。", "tags": ["AI文書紀錄", "護理師", "工作負擔", "人力留任"], "author": "未標示（MedCity News｜2026-06-27）", "source_url": "https://medcitynews.com/2026/06/documentation-abridge-nurse-tech-hospital/"}, {"rank": 5, "score": 8.0, "title": "醫療 AI GPU 與記憶體成本急劇攀升，醫療 AI 領導者積極尋求因應策略", "summary": "Forbes 報導指出，醫療 AI 領域正面臨 GPU 與高頻寬記憶體成本急遽上漲的壓力，多家醫療 AI 公司及醫院資訊部門領導人正積極探索替代架構，包括模型輕量化、邊緣運算部署、多雲混合策略及硬體共享機制，以維持 AI 應用的商業可行性。這一趨勢反映出醫療 AI 從概念驗證走向規模化部署時，基礎設施成本已成為關鍵瓶頸。對醫院數位轉型團隊而言，採購 AI 解決方案時除評估演算法效能外，供應商的算力成本結構與長期定價穩定性亦應納入評估框架。資訊部門宜提前規劃 AI 基礎建設的彈性擴展方案，避免因算力成本波動而影響已上線系統的持續營運。", "tags": ["醫療AI成本", "GPU", "基礎設施", "數位轉型"], "author": "未標示（GNews-Medical AI｜2026-06-27）", "source_url": "https://news.google.com/rss/articles/CBMi1AFBVV95cUxQd0diNVBqYk9jbEd5WWJQWE90ek1ubm9zMTYzeUpWOUpIU00zdnYxY0lJUGRwUm9fTzBQX1E0UDQ2UFFkeVhVay1HakE0QU1mckQ4cWROZmhBT1hCNk42c3hVSFNBUjFhcDZsdEN2NFNYYUtCVDJFejR3SkhkQTVmT0thMjAwOEVFZmNwaXhsa3ItNFZueHcwWUJGNmZHOURxLW1FaGpZYkdxeU1rYlQzTE5XbGhvVEp5QXJVdV8zUFdoT056VlBIU19qeTAyZng2VmFzYQ?oc=5"}, {"rank": 6, "score": 7.8, "title": "以色列公立醫院全面封鎖外部 AI 工具，網路安全顧慮引發醫院 AI 治理新課題", "summary": "以色列政府決定封鎖公立醫院電腦網路中對外部 AI 工具（包括 ChatGPT 等生成式 AI 服務）的存取，理由為擔憂患者資料透過這些工具外洩至境外伺服器，引發資料主權與臨床隱私的雙重風險。此一政策決定反映出醫療機構在快速採用 AI 工具的同時，資安治理框架往往未能同步跟上的普遍困境。對醫院資訊安全長（CISO）及數位轉型團隊而言，此案例提供了一個重要的政策參考：在允許臨床人員使用外部 AI 工具之前，需建立明確的資料流向稽核機制、合規白名單制度及端點安全政策，以兼顧臨床效率提升與患者資料保護的雙重目標。", "tags": ["醫療AI資安", "資料隱私", "醫院治理", "外部AI工具"], "author": "未標示（GNews-AI clinical｜2026-06-27）", "source_url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxQRDlpanlLQlBwYTRlZ2JZM0taTVFKdFdnbHhYams1VU1feDk1UnB6ZDV1VHZfWkZqZmhRUGo2X2RKd2hRalgzV0JpWUFiQzl4NWlrQlFKRlRRRUxvT0ZSZ3dGS0NwRlVPekZXNGp5UFF2b0plSlJNTGtTcHNST1Zpc2cxU0F5OTlYcV9uRl9kSXZqS012RmdiT3I5a3g0SzhvVkR4VGU0SEx6RmRnbzFV0gG0AUFVX3lxTE9UOG5ZTmtPRllsbmVJWnVfRHhNZ29DWkoyZkNyc21iSnEtbFdnMnRpSGhKcmFKb1lnVUVickhGRFdzT1RZbkRmbW1oSmJpWVVZU1JveVZfWjNBOGZHeUhnblU2VGNOZ3hq GNews-AI clinical｜2026-06-27）", "source_url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxQcjljeWRUYnVHWkF3d1JlNmRrdVBSeVlnM0VaSloxcFhLbE81TUYyQXZWejFvbGZncmtZNkdwY3VJc2ZiOEVMTXdLRTBWWG8zaHA1RGViX1kwRjZVN0x3OVFOVUpCR216dnJ2c0hoMVp6LWlrTEVldkRKQ3diOWthZ2haUlFwX19zdFBTY3g3dHJBTE90a0V1dGFvTl9OSjdzd09rajFKaHlTQjItbm84a1R6VnfSAbQBQVVfeXFMUHI5Y3lkVGJ1R1pBd3dSZTZka3VQUnlZZzNFWkpaMXBYS2xPNU1GMkF2Vnoxb2xmZ3JrWTZHcGN1SXNmYjhFTE13S0UwVlhvM2hwNURlYl9ZMEY2VTdMdzlRTlVKQkdtenZydnNIaDFaei1pa0xFZXZESkN3YjlrYWdoWlJRcF9fc3RQU2N4N3RyQUxPdGtFdXRhb05fTko3c3dPa2oxSmh5U0IyLW5vOGtUelZ3?oc=5"}]}, "2026-06-26": {"date_str": "2026年06月26日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.2, "title": "FDA 授予生成式 AI 放射科工具「突破性裝置」認定：Aidoc 胸部 X 光報告草稿 AI 獲此殊榮", "summary": "FDA 已正式授予 Aidoc 開發的生成式 AI 工具「突破性裝置認定」（Breakthrough Device Designation），該工具能自動解讀胸部 X 光並草擬放射科報告。同一批次，另一家公司 Cognita 的類似產品亦獲相同認定，成為放射科生成式 AI 首度取得此等級監管肯定的里程碑。突破性認定意味著 FDA 將優先審查、加速溝通，有助縮短這類工具的上市時程。分析師指出，此舉標誌著 FDA 對生成式 AI 應用於臨床影像報告的態度從觀望轉向積極支持。放射科 AI 報告草稿工具可協助醫師減少繁瑣文書、降低漏診率，並可能改善報告一致性。對醫院資訊與放射科主任而言，此認定加速了此類工具的商業可行性，並為採購提供重要的監管依據。", "tags": ["放射科AI", "FDA監管", "生成式AI", "突破性裝置認定"], "author": "未標示（STAT News｜2026-06-25）", "source_url": "https://www.statnews.com/2026/06/25/radiology-generative-ai-cognita-aidoc-fda-breakthrough-designation/?utm_campaign=rss"}, {"rank": 2, "score": 8.8, "title": "FDA 突破性裝置認定湧入生成式 AI 產品：醫療 AI 監管加速新趨勢", "summary": "根據 STAT Health Tech 最新報導，FDA 目前突破性審查管線中生成式 AI 裝置數量顯著增加，顯示監管機構對此類工具的接受度大幅提升。報導同時指出，FDA 已對穿戴裝置廠商 Whoop 停止執法行動，並有更多 AI 裝置陸續獲得突破性標籤。此波趨勢對醫院數位轉型團隊意義重大：一方面，取得突破性認定的工具在商業化時程上具備競爭優勢；另一方面，快速核准周期也對醫院的採購評估、臨床驗證及上線後監控機制提出更高要求。法規環境的鬆動可能加速放射科、病理科、心臟科等影像 AI 工具大量進入市場，醫院治理框架須同步強化以因應此趨勢。", "tags": ["FDA監管", "生成式AI", "醫療裝置審查", "數位轉型"], "author": "未標示（STAT News｜2026-06-25）", "source_url": "https://www.statnews.com/2026/06/25/fda-breakthrough-generative-ai-devices-health-tech/?utm_campaign=rss"}, {"rank": 3, "score": 8.5, "title": "Cercare Medical 腦腫瘤自動分割 AI 獲 FDA 許可上市", "summary": "Cercare Medical 宣布其腦腫瘤分割 AI 工具正式獲得 FDA 許可（Clearance），可自動於 MRI 影像中辨識並勾勒腦腫瘤輪廓。自動分割技術長期以來是放射科與放射治療科的高人力耗損環節，手動勾勒腫瘤邊界不僅耗時，不同醫師間的一致性差異也影響治療精準度。此工具的核准為神經外科、放射腫瘤科及神經放射科帶來直接的工作流程改善機會。對醫院而言，此類工具有助於加快腦腫瘤放射治療規劃周期，並提升跨科別協作的一致性。此訊息發布於 AuntMinnie，為醫療影像領域核心媒體，可信度高。此次核准也呼應 FDA 近期積極推動 AI 影像工具監管審查的整體趨勢。", "tags": ["腦腫瘤AI", "FDA許可", "醫療影像", "放射腫瘤科"], "author": "未標示（AuntMinnie｜2026-06-26）", "source_url": "https://news.google.com/rss/articles/CBMi-wFBVV95cUxPVExKdDZpYVFDZnNwcTdNeDA3WVloRGlfOW1WN1hjanQybDd3YW9GQWgwaEtWc2dCSWJQTV9ocHR4RzJ4Wk1tZ1NSM3lXcW1hRlkyV0tqQllEcUpOTE9OZzVhT1QxLUJiMGZBNWtYVVF0c1ZIbDI4T0pXZy1pc292THNSd1NfUjBlR1hBcmlHbXI5QlM2Q2swUS1PZU81LUYtYm9vdC1GNlVLU09IZ1BES0prY0FHSi11X3JaUlQ1cTVKTFZrWEhSR05sbEFsYnVacUpJeFpSbXZDMVhvR3ZPb3FmWXpVOVZqMl9JREVieVVfU0VFeVhoN0kyMA"}, {"rank": 4, "score": 8.2, "title": "Cedars-Sinai 開發 AI 系統，即時偵測住院病患低血糖風險", "summary": "Cedars-Sinai 醫學中心研究團隊開發出一套 AI 系統，能透過分析電子病歷中的連續生理數據與用藥紀錄，即時識別住院病患發生低血糖（低血糖症）的風險。低血糖是住院期間常見但易被忽略的危險事件，特別常見於糖尿病患者、接受胰島素治療者以及術後病患，若未及時介入可能導致嚴重神經損傷甚至死亡。這套系統的臨床意義在於將被動監測轉為主動預警，協助護理師在症狀出現前採取預防行動。對醫院臨床資訊團隊而言，此類即時風險分層工具展示了 AI 整合進護理師工作流程的可行路徑，也為急性照護 AI 部署提供了具體的臨床效益參考案例。", "tags": ["住院安全AI", "低血糖預測", "臨床決策支援", "電子病歷整合"], "author": "未標示（Cedars-Sinai｜2026-06-25）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxOaHBINlNYb2tkeVdmZlY1dEVZZm13dHg2RUFFVHZzS1d1Ykh2UW1lTHRsbVBMdEhwTFNDLXM0bTNrNGtYeDVlQWt1anBnUzgtVmxtODJZZlZHY3RfNHBySTBXdm1oalZyMnZjQ1hRaW5OOVQ3empwZHItWjJFSWFBQnBBSjRYemVfTmlCbExMblRMQTExT29V"}, {"rank": 5, "score": 7.8, "title": "Houston Methodist 全院系統化導入 HealthLeap，主動偵測院內隱性威脅", "summary": "Houston Methodist 醫院宣布將 HealthLeap AI 平台全面推展至整個醫療體系，而非僅限於試點科別。HealthLeap 的核心功能是監測住院病患的細微生理變化，主動偵測敗血症、急性腎損傷等早期徵兆等「隱性威脅」，在臨床症狀明顯出現前即發出警示。此次全院系統化導入，代表 Houston Methodist 已通過試點驗證並進入規模化部署階段，對其他大型醫療體系具有重要的參考意義。報導強調，此類工具的成效關鍵在於與既有護理流程的無縫整合，以及臨床端對 AI 警示的信任度建立。對醫院領導層而言，此案例展示了 AI 從試驗走向全院治理的可行路徑與組織挑戰。", "tags": ["住院早期預警", "敗血症AI", "全院AI部署", "臨床工作流程"], "author": "未標示（The AI Journal｜2026-06-26）", "source_url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNdk1ibjRYVmViZW85UUFucWYzTTA5N2xpanJabHhzS20tVWtCcHYxems3RDREZ0MwZ0VJNlhvanNyUnN6WXBmMl9waXFWeUJnLV9sOGJtaXRWNjM0Z2dncFBTX3dpQnc2Tk1jc0RVbENfeDRtZzF2VGtTQy10S01ncm1Kd3lxRmhXWGhQUTc1THF2LTBQZ2RjN2YyS1FOcHo4TnBzMw"}, {"rank": 6, "score": 7.5, "title": "醫療 AI 為何在試點後大量失敗？決策觸達不足才是核心障礙", "summary": "MedCity News 深度分析指出，目前多數醫療 AI 工具並非因技術能力不足而失敗，而是因為無法在醫師或護理師實際做出決策的關鍵時刻持續提供有效資訊。文章點出三大常見失敗模式：工具未能整合進臨床工作流程的正確節點、警示設計與實際決策情境脫節、以及缺乏持續的使用者回饋機制。此分析對醫院數位轉型團隊極具參考價值，特別是在評估 AI 工具採購時，應將「決策觸達率」與「工作流程契合度」納入核心指標，而非僅以模型準確度作為選擇依據。文章也強調，試點成功不代表全院部署可行，組織文化與流程設計往往比技術本身更決定成敗。", "tags": ["醫療AI導入", "試點失敗", "工作流程整合", "臨床AI治理"], "author": "未標示（MedCity News｜2026-06-25）", "source_url": "https://medcitynews.com/2026/06/why-most-healthcare-ai-fails-after-the-pilot-phase/"}, {"rank": 7, "score": 7.3, "title": "台灣國際醫療展開幕：AI 智慧醫療與在宅照護成為最大亮點", "summary": "2026 年台灣國際醫療暨健康照護展（Medical Taiwan 2026）於台北世貿中心盛大開幕，AI 智慧醫療應用與在宅照護解決方案成為本屆最受矚目的焦點。貿協董事長表示，AI 加速導入醫療體系，有望引領台灣邁入下一個科技世代，並強調照護機器人將是下一個國際競爭新戰場。展覽中，佳世達旗下品牌展示涵蓋 AI 客製化復健、手術 AI 工具、抗癌新藥及高齡照護數位平台等多項台灣專利技術。遠傳電信亦展示以 5G 與 AI 賦能的智慧醫療解決方案。此展覽集中呈現台灣醫療 AI 生態系的最新發展，對醫院採購評估與產學合作布局具有重要的即時市場情報價值。", "tags": ["台灣醫療展", "智慧醫療", "在宅照護", "照護機器人"], "author": "未標示（墨新聞-MORE News｜2026-06-26）", "source_url": "https://news.google.com/rss/articles/CBMiQkFVX3lxTFA3T1AzY3c0WnhKTG1tVWdpa3NsMXlDRVB5aW4wZHhKMldHbl92MlJBMlk0ZEkyV0pjZVhkb3FjTUI3UQ"}, {"rank": 8, "score": 7.0, "title": "Infinitus 推出臨床升級機制，為醫療 AI 語音代理人加入即時臨床風險偵測", "summary": "Infinitus Systems 宣布為其醫療 AI 語音代理人平台推出「臨床升級」（Clinical Escalations）功能，使 AI 代理人在與患者或醫療相關人員對話過程中，能即時偵測潛在臨床風險信號，並自動將案例升級至真人醫療人員處理。此功能的設計目標是解決 AI 自動化對話中的安全漏洞——當患者透露症狀惡化、自傷風險或緊急情況時，AI 能主動識別並觸發人工介入流程。這項能力對於使用 AI 進行術前評估、出院後追蹤或慢性病管理電話的醫療機構尤為關鍵。此發展反映出醫療 AI 代理人正從單純的任務自動化，朝向具備臨床安全閾值判斷的智慧系統演進，對導入 AI Agent 的醫院提供了安全機制設計的重要參考。", "tags": ["AI代理人", "臨床安全", "語音AI", "風險偵測"], "author": "未標示（PR Newswire｜2026-06-25）", "source_url": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxPTnV4akYzNmVFYkExa3l2Zlg5ZXN4dE5IUDB0QnJGaExBSmphYlZ5Q1FYUFhEbDc2VlQ0UVJVZTdvd0tFZHFYTXhLelR5T3l6a2wyNndWelVXamM1c3AzdFkwQVI3VjZITHNyWVg2bElhOEpkTG5wU0dDYU9xTnZnZFY1R0RhSGZEYzJpQXNnUFMybmZZVURMSGxVbWI3LWV1aEg0alc5YWI1Zk1VSW1VLVE2YW9nN3NvMFNYSHM3c1E1bXRkU0VkTU5DbmwzaGlJOTdIRGFRTVRZSjc3YWtpeWh2ZXdFdHlGV0laOElnd1FCYjJBUmJJQ25VcUQzSVdRdEhLQ3FDRDA"}]}, "2026-06-25": {"date_str": "2026年06月25日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.2, "title": "深度學習發現心電圖猝死生物標記，預測準確度超越現行臨床標準", "summary": "發表於 Nature 的研究顯示，一個以心電圖（ECG）波形訓練的深度學習模型，成功識別出一個肉眼可辨識的生物標記，能比現行臨床最佳方法更精準地預測突發性心臟死亡（SCD）風險。研究團隊從大規模人群資料中訓練模型，找出的標記在傳統十二導聯心電圖上即可觀察，無需額外侵入性檢查，大幅降低應用門檻。突發性心臟死亡每年奪走全球數百萬人命，且多數患者在事前缺乏明確警訊，現有風險分層工具（如射出分率 EF）敏感度有限。此研究指出 AI 可從常規心電圖中挖掘人類難以感知的訊號模式，為高風險族群的早期篩檢與預防性介入提供新途徑，對心臟科、急重症及一般內科均具高度臨床意義。目前研究處於模型驗證階段，臨床轉譯與前瞻性試驗仍是後續重點。", "tags": ["心臟科", "深度學習", "猝死預測", "心電圖AI"], "author": "未標示（Nature｜2026-06-24）", "source_url": "https://www.nature.com/articles/s41586-026-10674-6"}, {"rank": 2, "score": 9.0, "title": "Nature 研究示警：醫療 AI 訓練資料存在隱私洩漏風險，少數族群受害最深", "summary": "Nature 刊出一篇重磅研究，指出用於醫療診斷的 AI 模型普遍存在「成員推斷攻擊」（membership inference attack）漏洞，攻擊者可藉此判斷特定患者的醫療紀錄是否曾被納入模型訓練集，進而間接推斷其疾病史等敏感資訊。研究特別強調，在訓練資料中屬於少數族群或代表性不足的群體，隱私風險顯著高於多數族群，形成不平等的安全暴露。隨著各大醫院積極採用 AI 輔助診斷工具，如何確保訓練資料不成為隱私洩漏的缺口，已成為資訊安全與醫療倫理的核心議題。該研究呼籲 AI 開發者與醫院在模型部署前，納入差異隱私（differential privacy）等防護機制，並進行族群差異化的安全評估，以避免醫療 AI 在賦能臨床的同時，衍生新型態的資料安全危機。", "tags": ["醫療AI隱私", "資料安全", "成員推斷攻擊", "AI倫理"], "author": "未標示（Nature｜2026-06-24）", "source_url": "https://www.nature.com/articles/s41586-026-10688-0"}, {"rank": 3, "score": 8.5, "title": "AI 篩選出可對抗耐藥性淋病的候選抗生素，機器學習開闢抗藥菌新戰線", "summary": "Nature 報導一項運用機器學習進行高通量藥物篩選的研究，針對已對多數抗生素產生抗藥性的淋病奈瑟菌（Neisseria gonorrhoeae），從龐大的化合物資料庫中找出具治療潛力的新型候選藥物。淋病是全球最常見的性傳播感染之一，近年因廣泛耐藥性導致可用抗生素選項日益稀缺，已被 WHO 列為優先威脅病原體。AI 驅動的藥物探索方法能在短時間內評估數百萬種化合物與靶標的結合特性，大幅縮短傳統篩選所需時程。此研究不僅為淋病治療提供新的候選分子，更示範了 AI 在抗菌素耐藥（AMR）領域的應用潛力，對感染科、公衛及藥物研發體系均具參考價值。後續仍需動物實驗與臨床試驗驗證安全性及有效性。", "tags": ["抗藥性細菌", "AI藥物探索", "機器學習", "感染科"], "author": "未標示（Nature｜2026-06-24）", "source_url": "https://www.nature.com/articles/d41586-026-01987-7"}, {"rank": 4, "score": 8.2, "title": "HOPPR 推出 Presto 放射科 AI 草稿報告代理人，無縫整合現有工作流程", "summary": "放射科 AI 新創公司 HOPPR 正式發布 Presto，定位為可嵌入現有放射科工作流程的 AI 草稿報告生成代理人（AI Reporting Agent）。Presto 採用與廠商無關（AI-agnostic）的開放架構，可與各主流 PACS 及報告系統整合，毋需替換既有基礎建設。系統會在放射科醫師讀片前自動生成結構化草稿報告，醫師僅需審閱與修改，而非從零開始撰寫，預期可大幅縮短報告回覆時間（TAT）並減輕文書負擔。此發布正值放射科人力短缺與影像量持續攀升的背景下，AI 輔助報告成為各醫院緩解瓶頸的重要工具。對正在評估放射科 AI 解決方案的醫院資訊與影像科團隊而言，Presto 提供了一個強調整合便利性與工作流程相容性的新選項，其去廠商綁定的設計策略值得關注。", "tags": ["放射科AI", "AI報告自動化", "工作流程整合", "影像醫學"], "author": "未標示（AuntMinnie｜2026-06-25）", "source_url": "https://news.google.com/rss/articles/CBMi1gFBVV95cUxNZzl5RGJmMFpnVWpGM0xJUTN4ZXNLX0Jxc0RPTHNYczE0MUFYTFRRTTFjZDc0NFljLTVnbzl3RE5kRFdoaWFXRHdzT0RHUnRsWW1PV3hCamV0aGdLSkZZWDFJaTlOSEZiVGdlbjhkS2lCaFpVcnJoNkF1Ukt6VlRJTXFUWXp2aWQ4SGZaQWhfY0JhNWxaRWl3TnpiTC05TV96LUdRZTY1SVFqaGxiNVU5LS10aFdtQk1ZR3pTWmhXOFhiVVc3RjRyS1dYRkhKdkpQaDRZbmRn?oc=5"}, {"rank": 5, "score": 7.8, "title": "AI 驅動生物標記評估將重塑病理科工作模式，數位病理進入實戰轉型期", "summary": "Technology Networks 報導指出，AI 驅動的生物標記自動評估技術正逐步改變傳統病理科的工作型態。透過深度學習對全切片影像（WSI）進行自動化分析，AI 系統可在數分鐘內完成 HER2、PD-L1、Ki-67 等腫瘤生物標記的量化評估，精準度媲美或超越人工判讀，並大幅降低觀察者間差異。Oncodaily 亦同步刊出病理學 AI 領域專家 Joe Lennerz 的專訪，強調病理 AI 必須通過嚴格臨床驗證、具備可靠性，且真正服務臨床需求，方能獲得病理科醫師信任並落地應用。數位病理 AI 的規模化部署不僅涉及技術選型，更需要整合至現有 LIS、PACS 及腫瘤治療決策流程，對醫院病理科與資訊部門均帶來系統性挑戰與機遇。", "tags": ["數位病理", "生物標記AI", "腫瘤診斷", "病理科"], "author": "未標示（Technology Networks｜2026-06-24）", "source_url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxOY2FxX0U5aUIxOEwzU05rNVhjUjdxV3BsUjEyVVN2N2VrMmxNa2lZd3hBVWtUNjQ4VlBDVVhDd1J2a3d6YndOWS1YVmdSTUxGeHRHdDFPUGZkeDF3U0pmLTBEcXpsOXF6WDNsZ0VLVlczME5fSDdWT3U2Y09GQ0Nob2puV0hEc1c5R21ONFpYLVNLRm90a2FLUmlHM2h1Vmdfa3M1eFVHOTVHSTBEUFBwRTQzYzg?oc=5"}, {"rank": 6, "score": 7.5, "title": "AI 乳房攝影風險評分動態變化可預測未來乳癌發生，研究為篩檢策略帶來新依據", "summary": "Imaging Technology News 報導一項最新研究發現，AI 乳房攝影（mammogram）風險評分的動態變化趨勢，比單次評分更能有效預測受試者未來罹患乳癌的機率。研究顯示，連續追蹤 AI 評分的變化量，可識別出雖然單次評分屬中等風險、但實際上正快速進展的高危族群，為個人化篩檢頻率調整與預防性介入提供科學依據。此發現對於優化現行乳癌篩檢計畫具有重要意義——醫院可考慮在既有 AI 輔助判讀架構上，加入縱向風險追蹤功能，以提升篩檢資源的精準分配效率。對放射科、乳房外科及預防醫學團隊而言，這項研究提示動態 AI 評估的臨床 const TODAY_ISO  = "2026-06-30";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
