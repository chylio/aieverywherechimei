<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年06月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

ore": 8.0, "title": "腫瘤科成為醫療AI最艱難戰場：複雜度、責任與數據挑戰全面解析", "summary": "Healthcare IT News刊出深度分析，指出腫瘤科（oncology）正成為整個醫療AI領域最嚴苛的應用考驗。腫瘤診療涉及多模態影像、基因組學、病理切片、治療反應追蹤等高度異質性數據，加上病患族群多樣、臨床路徑複雜，使得AI模型在訓練與部署上面臨前所未有的挑戰。文章指出，現有的通用型醫療AI工具往往難以直接移植至腫瘤場域，必須針對特定癌症類型、治療階段與機構數據環境進行客製化調整。此外，腫瘤AI的決策若出現錯誤，後果往往不可逆，因此對可解釋性與臨床醫師最終審查機制的要求遠高於其他科別。對正在評估或推動腫瘤科AI導入的醫院而言，此文提供了關於選型標準、驗證流程與治理架構的重要參考框架。", "tags": ["腫瘤科AI", "臨床AI挑戰", "模型驗證", "可解釋性"], "author": "未標示（Healthcare IT News｜2026-06-10）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQSjdnSktWU3lxWDJXY0JOR21iSk9WQVNxZXFSWi1WZXprRzg1S29QaG9XdW15bmZubFpUTFhvVHJVeFBSQ2hJSVAtY0c0ZlBwdEZNTnhoZVA2bUtkY0tlMjFma3pOQ19vWHpMY2FqM1E0Z2NtbkpjT2lOWTg2cXVMZDNsN1U3ZGJmQzBUMXVEeThjUQ?oc=5"}, {"rank": 4, "score": 7.5, "title": "OpenAI、Anthropic邁向IPO之際，醫療AI版圖同步擴張", "summary": "MobiHealthNews報導，OpenAI與Anthropic兩大AI領導企業在籌備首次公開募股（IPO）的同時，正積極擴大其在醫療健康領域的業務布局。兩家公司近期分別與多家醫療機構、健康系統及生技企業深化合作，涵蓋臨床文件自動化、醫療客服、藥物研發輔助等多個應用場景。IPO進程帶來的資金壓力與成長預期，促使兩家公司將醫療AI列為核心商業化方向之一。此一趨勢意味著未來醫療機構在採購AI工具時，將有更多來自大型基礎模型廠商的直接競爭選項，也預示著醫療AI市場的資本集中度將進一步提升。對醫院資訊部門與數位轉型團隊而言，了解主要AI平台的商業策略走向，有助於評估長期合作夥伴的穩定性與技術路線圖。", "tags": ["OpenAI", "Anthropic", "醫療AI商業化", "數位轉型"], "author": "未標示（MobiHealthNews｜2026-06-11）", "source_url": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxNLXdVcnpUMHNMQlJzM0ZwelN6ZTdINmVYZHJHRUhZcXBIM2R2ei00QUhoQ21xSzNsOXhrZExDalFEVXhfUnRhN05nUFJhcmd4TDYwMGg1X1IySmE1RjVmX1B6a1NYc1BzTElibkNCNFdGRjlhWTZjazB0c2Jqdm9kaDlHVTR1Rzh4dEdaZkJTU3BBRmZ4SWZ4dEViaFRKWjIwUjkyZTVFekhXU1E?oc=5"}, {"rank": 5, "score": 7.5, "title": "台灣行政院BTC預備會議聚焦AI生技與智慧醫療，FHIR Box病歷互通方案再受重視", "summary": "根據iThome報導，台灣行政院生技產業策略諮議委員會（BTC）預備會議將AI生技與智慧醫療列為核心議題，並再次提出建置「FHIR Box」基礎設施以實現全台病歷互通的構想。FHIR（Fast Healthcare Interoperability Resources）是國際通行的醫療數據交換標準，FHIR Box方案旨在打破各醫療機構間的數據孤島，使病患就醫紀錄能夠跨院安全共享，進而支持AI模型的訓練與臨床應用。此次會議顯示台灣政府在醫療AI基礎建設上的政策意圖持續強化，若FHIR Box方案落地，將對醫院資訊系統升級需求、數據治理規範以及跨院AI應用開發產生深遠影響，是各大醫療機構資訊部門需持續關注的政策動向。", "tags": ["台灣醫療AI", "FHIR", "病歷互通", "智慧醫療政策"], "author": "未標示（iThome｜2026-06-10）", "sourc 3JNTjNrMG5iSGRwby1HWGgwZWNCTzdsc2JsYndxSXBnVmxBYm00V0s0d2J4TU9lSQ?oc=5"}, {"rank": 7, "score": 6.5, "title": "田納西州醫院護理師盜竊芬太尼案件：AI監控系統未能及時示警", "summary": "美國田納西州一起護理師長期盜竊芬太尼的案件，揭露了醫院現行AI管制藥品監控系統存在的重大漏洞。根據州衛生記錄，該名護理師多次以不正常方式取用麻醉藥品，但院方部署的AI異常偵測系統未能在適當時機觸發警示，導致事件延遲被發現。此案引發醫療圈對於AI藥品管理工具「偽陽性率過低設定」與「監控邏輯盲點」的討論，亦凸顯單純依賴AI進行管制藥品稽核而缺乏人工複核機制的潛在風險。對於醫院藥事管理委員會及護理行政主管而言，此案例提示AI監控工具的效能評估不應僅看靈敏度指標，亦須審視其在真實操作情境下的漏報率與應變流程設計。", "tags": ["管制藥品監控", "AI安全漏洞", "藥事管理", "醫療安全"], "author": "未標示（Tennessee Lookout｜2026-06-08）", "source_url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxOaFU0NmZCek5CeWhBRTJaNTQ4Uk5hU3R1UkJWbGVoSjFBdlpJTW1ZSkRiUjR5ZTJ4MkRIMXRTWWJFenNUb0FrV3BwNFJIVjNsZkZwVFhheGFwSVJENElxSktFNy1mdHlNdDdxS3RQb2gyRFNPbDg4TFhCcWpzazFHUnY1R1hWSm52ZDV4UzBvMUlCZV9MZFpsQ3JhYVdRUHhBeGx0VXR0SG1LeUE2QnlaOFdhOEdMdzE0NDRmQmM3WQ?oc=5"}, {"rank": 8, "score": 6.5, "title": "台灣AI醫療落地卡關全解析：法規、資安到風險治理如何不踩雷", "summary": "《環球生技月刊》刊載深度報導，系統性梳理台灣醫療AI落地過程中最常遭遇的四大關卡：法規審查程序、產品安全認證、資訊安全要求與風險治理架構。文章指出，許多醫療機構在評估導入AI產品時，往往低估主管機關（食藥署、健保署）的審查複雜度，以及醫院自身在採購合約中需承擔的資安稽核義務。風險治理層面，文章強調AI工具上線後的持續監測機制（post-market surveillance）在台灣尚未形成標準作業規範，是當前最大的制度缺口。此報導對正在規劃或推進AI醫療器材採購的醫院資訊部與法遵團隊，提供了貼近本土監管環境的實務參考。", "tags": ["台灣醫療AI法規", "AI風險治理", "資訊安全", "醫療器材審查"], "author": "未標示（環球生技月刊｜2026-06-08）", "source_url": "https://news.google.com/rss/articles/CBMiaEFVX3lxTE5USVFJdHhobDg4djFTWGVMVmZ5RlpxVG1yTk41d0l3WWNOOEIzNkRSSm5aT2VmdkYtY2FuRGVXTTJxaWVVS3VBeDFWeWpRWEFwSjE0QWY1dXQzQ25UcmVnQ1Rxdm01LXJk?oc=5"}, {"rank": 9, "score": 6.0, "title": "邁阿密大學Miller醫學院推動病理科百日Agent AI挑戰計畫", "summary": "邁阿密大學Miller醫學院啟動為期100天的「Agentic AI挑戰計畫」，以病理科作為主要實驗場域，探索自主型AI代理（Agentic AI）在數位病理工作流程中的實際應用潛力。計畫聚焦於讓AI代理能夠自主執行多步驟任務，包括切片影像預處理、異常區域標記、報告初稿生成及品質控管等，而非僅作為單一預測工具。此種「任務自主化」的設計理念代表病理AI應用正從輔助判讀進化為流程自動化代理。計畫採用100天限定衝刺模式，目的在於快速驗證可行性並積累實證數據，為後續大規模部署提供依據。此模式對有意評估Agentic AI的醫院數位轉型團隊具有借鑑意義。", "tags": ["Agentic AI", "數位病理", "醫院AI試驗", "工作流程自動化"], "author": "未標示（University of Miami｜2026-06-08）", "source_url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE04WFJROE94bkl1el8zREk0TEdWSTF2YlJLV19qblg0OUQwNUNGeWJNYzBmV1FRdHBncmxILVRrcTVVcDV2QXdhb1ZOTUdaMWZJMUlYNWVQMWZFTG0xUkt1aHdwX0JLZTZrV28tTmU2ZEp4RW9EU3MtMUNxVEc?oc=5"}, {"rank": 10, "score": 5.5, "title": "Photocure與Artera攜手合作，推進膀胱癌數位病理AI檢測評估", "summary": "膀胱癌光動力療法領導廠商Photocure宣布與AI數位病理公司Artera展開合作，針對膀胱癌患者的數位病理切片進行AI檢測工具評估計畫。Artera以其在前列腺癌AI預後模型方面的成果聞名，此次跨疾病領域的擴展標誌著其技術平台正積極向其他泌尿系統腫瘤延伸。合作重點在於驗證AI模型能否從膀胱癌切片影像中萃取具預後意義的生物標記特徵，進而輔助臨床治療決策。若驗證成功，此類AI病理工具有望在不增加額外基因檢測成本的前提下，為泌尿腫瘤科提供更精準的個別化治療建議。此合作案反映出AI數位病理商業化正快速向多癌種擴展的產業趨勢。", "tags": ["膀胱癌", "數位病理AI", "泌尿腫瘤", "AI預後模型"], "author": "未標示（TradingView｜2026-06-09）", "source_url": "https://news.google.com/rss/articles/CBMi7AFBVV95cUxOZE9YZUhNYnpKWGhQNy0tYnQtQ29kcTJaOEpmb1gwQXV2czljNUN2bTFDTzViUE05SE5Ielh6bE41c1JCV0VEcTJZeE5hQ1BsSnliUFlESWNBcUFJdVRINTJQdmstQnZxZC04WmEwRzZ4MzhSWkZiLUxQWERsSmZxNnNpdkpjcHRUOTQxcks1em1wT1psWkc3LXM4VFdWMVh5ZXc3N19ZWm12X3BIQXEyS3hTZmFBLWRkM0pUeGYtaDNZZzlfMF9VN285VnJiSUtUNElkSkZLVFYxMzNUTGlBcHpjYUxwSlBoczZfSw?oc=5"}]}, "2026-06-08": {"date_str": "2026年06月08日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "AI預測腦膜瘤復發：常規病理切片即可完成風險判斷", "summary": "一項發表於 News-Medical 的最新研究顯示，AI 模型可直接分析常規病理切片影像，準確預測腦膜瘤（meningioma）術後復發風險，無須額外昂貴的分子檢測。腦膜瘤為最常見的顱內腫瘤之一，術後復發率因個體差異而顯著不同，現行分類標準對部分病患的風險預測仍不夠精確。此 AI 工具透過深度學習解讀蘇木精-伊紅染色切片中的組織形態特徵，提取肉眼難以辨識的複雜病理模式，進而生成個人化復發機率評分。研究人員指出，若此技術整合至病理科數位工作流程，可望在不增加額外成本的前提下協助神經外科與放射腫瘤科醫師制定術後追蹤與輔助治療決策，具備高度臨床轉化潛力。此研究方向呼應近年 AI 數位病理快速發展趨勢，對神經外科、病理科及腫瘤科均具重要參考價值。", "tags": ["AI病理", "腦膜瘤", "復發預測", "數位病理"], "author": "未標示（GNews-AI radiology｜2026-06-07）", "source_url": "https://news.google.com/rss/articles/CBMisAFBVV95cUxOQS1IY1dBT1JZeVZKbU50TldfaXlVNTRibmlaZjZKdmpmMUxZZWF1MC1zTmxsOEJuaHBDMk00cUY0TFhub0RrSTdCUXlUSjd4OVppYVJBYWc1Rm1GakRJUzBVX2NaRG1UM3g1dkRaZmdXSEc2Vmdua1AtRjVVRFhPWGJhOFNjbnNjd2hCUGExd00zZG9iaGNnQUdfSzUwQm1oX3cwZUlRX3ZZZVlSTGRueg?oc=5"}, {"rank": 2, "score": 8.0, "title": "Microsoft 加速醫療 AI 落地臨床實務，擴大醫療健康領域雄心", "summary": "Digital Journal 報導，Microsoft 正積極推動醫療 AI 從概念驗證邁向真實臨床應用，其醫療健康策略涵蓋 Azure AI 雲端平台、Nuance DAX 環境語音記錄、Dragon Ambient eXperience 等多項工具，並持續深化與醫療系統的整合夥伴關係。Microsoft 在醫療 AI 領域的布局已從行政文書自動化，擴展至臨床決策輔助、影像分析及患者溝通等核心場景。此波擴張不僅反映科技巨頭對醫療市場的高度重視，也代表醫院資訊部門在評估 AI 採購時，面臨更多來自主要雲端供應商的整合壓力與機會。對醫療機構領導層而言，Microsoft 的規模優勢、與 Epic 等電子病歷系統的深度整合能力，以及其在資料安全合規方面的投入，皆是評估長期數位轉型合作夥伴時的重要考量面向。", "tags": ["Microsoft", "臨床AI應用", "數位轉型", "醫療資訊系統"], "author": "未標示（GNews-Medical AI｜2026-06-08）", "source_url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxNLTR5SXdoOXJCZGpNaVFHVzBvNmlwa1FMU1Y1V2FwZk1Tb3VfeEJBb0NsWVhSbWtNRUNiXzBkMWpkdHRPYjJncVM5aXRTNUtNVXNCb2hUQTh2ODJDZXFiZGY3NzVpdlphUThZME1LSE5MMXJ2QWo5ZVVYRENmVFY1N0tPbmJrdDRJLTFvak9QbHFLYnQ2cll4Sng2SzM0dHNWSWx6S0lYcXI1NUZHcjVUZmtNS24?oc=5"}, {"rank": 3, "score": 7.0, "title": "保險業者搶先部署AI，醫院營收循環管理不能再被動應對", "summary": "MedCity News 刊出評論指出，美國健康保險業者已大規模導入 AI 工具，用於自動化理賠審核、偵測醫療必要性爭議，以及針對特定診療項目快速發出拒付決定，使醫院在申報核銷過程中處於愈來愈不利的地位。文章強調，若醫療機構的營收循環（Revenue Cycle Management）團隊持續採取被動因應策略——僅在遭拒付後才逐件申訴——將在時間與資源上持續失血。作者建議醫院領導層應主動投資 AI 輔助申報工具、強化事前授權自動化，並建立即時數據監測機制，以預測保險業者拒付模式，在索賠送出前即完成修正。此議題對醫院財務長、健保申報部門及資訊長均具直接影響，反映醫療 AI 的競技場已從臨床端延伸至財務管理核心，醫院若未及早布局，恐面臨系統性的財務侵蝕風險。", "tags": ["營收循環管理", "保險理賠AI", "醫院財務", "自動化申報"], "author": "未標示（MedCity News｜2026-06-07）", "source_url": "https://medcitynews.com/2026/06/when-ai-becomes-a-payer-advantage-hospitals-cannot-afford-to-stay-reactive/"}, {"rank": 4, "score": 6.0, "title": "地緣政治成為病患安全威脅：醫療機構如何應對定向網路攻擊新型態", "summary": "MedCity News 評論文章指出，針對醫療機構的網路攻擊動機已出現質變：攻擊者的目標不再僅是勒索贖金，而是以製造系統性混亂、癱瘓醫療服務為目的，背後往往涉及國家級駭客組織或地緣政治因素。作者警示，大多數醫療機構的資安防禦架構仍以傳統勒索軟體威脅為假設前提，對於以破壞關鍵基礎設施為目標的高階持續性威脅（APT）缺乏足夠準備。文章強調，當醫療 AI 系統、電子病歷、影像儲存與手術排程深度整合後，單一入侵點即可引發連鎖式服務中斷，患者安全將直接受到威脅。此觀點提醒醫院資安與資訊團隊，必須將地緣政治風險納入威脅模型，並重新評估 AI 相關系統的資安韌性設計，以因應更複雜的攻擊情境。", "tags": ["醫療資安", "網路攻擊", "患者安全", "關鍵基礎設施"], "author": "未標示（MedCity News｜2026-06-07）", "source_url": "https://medcitynews.com/2026/06/when-geopolitics-becomes-a-patient-safety-issue-protecting-healthcare-in-an-era-of-targeted-cyberattacks/"}, {"rank": 5, "score": 5.5, "title": "科技助力母嬰照護：從數據堆疊到早期風險辨識的系統轉型", "summary": "MedCity News 評論文章指出，改善母嬰安全的關鍵不在於蒐集更多數據或增設更多監測裝置，而在於建立能夠協助臨床人員「更早辨識風險、更有信心溝通與即時行動」的整合系統。作者批評目前許多醫院雖部署大量產科監測設備，但各系統之間缺乏整合，導致警示疲勞（alert fatigue）問題嚴重，反而分散護理師與醫師的注意力。文章呼籲引入 AI 驅動的早期預警系統，整合胎兒監護、產婦生命徵象與電子病歷數據，於危險情況出現前提供可行動的臨床警示。此議題對婦產科、護理部及醫療資訊團隊具有直接參考意義，也呼應全球對降低孕產婦死亡率與嬰兒不良結果的持續關注，是醫院落實以數據驅動照護品質改善的重要場域。", "tags": ["母嬰照護", "早期預警系統", "產科AI", "照護品質"], "author": "未標示（MedCity News｜2026-06-07）", "source_url": "https://medcitynews.com/2026/06/its-time-for-technology-to-lift-maternal-care/"}]}, "2026-06-07": {"date_str": "2026年06月07日", "weekday": "星期日", "items": [{"rank": 1, "score": 7.5, "title": "外科團隊分工細膩，AI智慧醫療深入手術室", "summary": "中時新聞網於2026年6月7日報導，台灣外科團隊正積極導入AI智慧醫療技術，藉由精細的分工模式與人工智慧工具的協同運作，提升手術室內的臨床效率與安全性。報導指出，AI在外科領域的應用已不僅限於影像辨識或術前規劃，而是逐步延伸至術中即時輔助與術後追蹤管理，體現醫療AI從單點工具走向整合性臨床解決方案的趨勢。此一發展對台灣各大醫療機構而言具有重要參考價值，尤其在醫師人力吃緊、手術量持續成長的背景下，如何透過AI強化外科團隊的協作能力，成為數位轉型的核心議題之一。台灣醫院在推動智慧手術室時，亦需同步考量臨床工作流程的重新設計、醫療人員的訓練需求及法規遵循等面向，方能確保AI工具真正發揮臨床效益。", "tags": ["智慧手術室", "外科AI", "台灣醫療AI", "臨床工作流程"], "author": "未標示（中時新聞網｜2026-06-07）", "source_url": "https://news.google.com/rss/articles/CBMia0FVX3lxTFA0Y3NBM3RaODF5VS1Scnk2RXc4QWhxX0VMY09Hc0ozZVJnY000ZHBrUjkwZHhYRHpMd0g4cTBzeFNub2Jlc1cxbUtfNWlWUGZZQzYzUWlrdVlOWnJIQUFMcGpwM2N1MUJQMFRn?oc=5"}, {"rank": 2, "score": 6.5, "title": "AI能幫人類活得更久嗎？從新藥研發到疾病預防看未來醫療想像", "summary": "健康醫療網於2026年6月6日刊出深度報導，探討人工智慧如何在延長人類壽命與提升健康品質方面扮演關鍵角色。文章聚焦於AI在新藥研發加速、疾病早期預測、個人化預防醫學三大面向的潛力，並引述多項國際研究成果，說明AI模型已能在癌症、心血管疾病、罕見疾病等領域協助科學家縮短研發週期、降低試驗失敗率。報導同時指出，AI驅動的健康管理平台正逐漸從實驗室走進一般民眾生活，透過穿戴裝置與數位生物標記進行持續性健康監控。然而，如何確保AI預測模型的準確性、跨族群的適用性，以及數據隱私保護，仍是當前醫療AI發展亟需克服的核心挑戰，對醫院領導層與政策制定者均具有重要的前瞻性參考意義。", "tags": ["新藥研發", "疾病預防", "精準醫療", "健康管理AI"], "author": "未標示（健康醫療網｜2026-06-06）", "source_url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1sUlR6RHZoUkZVSXRJWWJmOVZyRl9XVTZVWWFPSVM2V0pHaDVGemVmZzlWSGFpMlg3ZnZ0MWRUU05oYlRkWVhYZEpyRVZWMTdBTEllZzFR?oc=5"}, {"rank": 3, "score": 6.0, "title": "藥物諮詢找AI？藥師提醒：第二步把關不可少，自行停藥風險高", "summary": "健康醫療網於2026年6月6日報導，隨著民眾愈來愈習慣以AI工具進行用藥諮詢，台灣藥師公會提出警示，強調 const TODAY_ISO  = "2026-06-12";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
