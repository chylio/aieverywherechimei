<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年09月02日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

: 1, "score": 9.2, "title": "倫敦醫院完成全球首例 AI 輔助腦腫瘤切除手術，神經外科進入新里程", "summary": "英國倫敦一家醫院的神經外科團隊成功完成全球首例 AI 輔助腦腫瘤切除手術，此消息由《衛報》等多家國際媒體報導。術中 AI 系統即時提供影像引導與腫瘤邊界辨識，協助外科醫師更精準地切除腫瘤組織，同時降低對周邊正常腦組織的傷害風險。此次手術被視為 AI 從輔助診斷跨越至實際介入手術操作的重要里程碑，代表 AI 在神經外科的應用從術前規劃進一步延伸至術中即時決策支援。這項突破對醫院手術室 AI 整合策略具有高度參考價值，也預示著 AI 輔助外科技術的臨床驗證門檻將受到更廣泛關注，相關監管機構的審查標準與醫師培訓模式亦可能隨之調整。", "tags": ["神經外科", "AI 手術輔助", "臨床突破", "影像引導手術"], "author": "未標示（The Guardian｜2026-08-27）", "source_url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxNSldrM0lCSVVfODk2T091ekNBdGZ6Y2RJbWg0WW5aLW5hQ21pdWtzdnZRVlcwUVJua3FVdmVJMzliSUpQcHk0eXJ4S3RnRnhnZFRGWmxGdEJaajU1WjRmV0s1ajVIcWlPazBNY2gtSm8ya0NaNUV5WG82MHJNTENqbUhvb2c2bnUtTzNmNF9NNkVZY0NCSzJVUkdnTTBDb1YyNkpxLWdpM0pHZw?oc=5"}, {"rank": 2, "score": 8.8, "title": "AI 於乳房攝影中偵測血管鈣化以外的心血管風險，影像科擴大預防性應用", "summary": "根據 Radiology Business 報導，最新研究顯示 AI 模型在分析乳房攝影（mammogram）影像時，不僅能偵測傳統標記物乳房動脈鈣化（BAC），更能辨識出其他潛在心血管風險訊號。這項突破意味著女性接受常規乳房篩檢時，AI 可同步提供心血管健康的初步評估，實現「一次檢查、多重效益」的預防醫學模式。此研究對放射科與心臟科跨科整合具有重要啟示，也為 AI 影像分析從單一疾病偵測走向全身健康風險評估提供了實證依據。醫院在規劃乳房攝影 AI 工具採購或升級時，可將心血管風險評估能力納入功能評估指標之一。", "tags": ["放射影像 AI", "心血管預防", "乳房攝影", "多疾病偵測"], "author": "未標示（Radiology Business｜2026-08-28）", "source_url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxNcndNZ2s0Z2VabDlIM2ZtRzZUVFhvTTFENnVOQnpkMnhqOThISHV5d1I3LTNFVGpxQ3NvYks0MWxQbEljdDlYNXVyUjNDMGlkSVRkcU5QUkhtSmRjVWVnSlkyVEEyX1llSmJDdHNJemx3UWZzUUZuUGdjeXZzMEtad0pzTVlZaFJLNmNMTHRkeUJCUjVnZ2V4aXQ1emJ4MHVhbXBqTEhzekpzbjFpOG54N1I3S0xJQWE4MEtnYms2WEI?oc=5"}, {"rank": 3, "score": 8.5, "title": "AI 加速英國醫院深靜脈血栓診斷，DVT 偵測效率大幅提升", "summary": "英國 Chelsea and Westminster 醫院導入 AI 工具，顯著加速深靜脈血栓（DVT）的臨床診斷流程。據 The Engineer 報導，該系統透過整合影像與臨床資料，輔助醫師快速鎖定高風險患者，縮短從懷疑症狀到確診所需時間。DVT 若未能及時診斷，可能引發肺栓塞等致命併發症，因此縮短診斷延遲對改善患者預後具有直接臨床意義。此案例展示了 AI 在急症輔助診斷領域的實用價值，並說明臨床 AI 工具在提升緊急照護效率上的潛力。對於有意引入 AI 支援急診或血栓科業務的醫療機構，此案例提供了具體的臨床實證參考。", "tags": ["臨床決策支援", "深靜脈血栓", "急症診斷", "AI 輔助診斷"], "author": "未標示（The Engineer｜2026-08-27）", "source_url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxPTjlZcTF3ZzdKb3h0eklVOGZ1bHg0czM1dVA1QWM2QldQZU9IT3V0OHZFTmNsc3c2NlZ6T1dLSVFRcC1ZMllNLVZadnV2amQ2RERjdUhQc0JMZU5wcW5yaVpKemwxcU5xakRZa1hOVmd6Y0toQjlCV3Budmpaa0Z1X1Y5TF92X053aHh3MFNrckp6RXdEdUZsQXBVLUJOTzl5eDZGRA?oc=5"}, {"rank": 4, "score": 8.2, "title": "Imagenet 收購加州資料公司 Analytica，深化醫療 AI 資料布局", "summary": "影像網路公司 Imagenet 宣布收購加州資料分析公司 Analytica，以強化其在醫療 AI 領域的資料能量。據 Dealroom 報導，此次併購旨在整合 Analytica 的醫療資料處理與分析能力，加速 Imagenet 在醫療 AI 應用場景的落地與擴張。隨著醫療 AI 模型的性能日益依賴高品質、大規模的訓練資料，資料公司的戰略價值持續攀升，市場整合趨勢明顯。這項交易反映出醫療 AI 產業正從單純的演算法競爭，轉向資料資產的掌控與整合競賽。對醫療機構而言，了解資料供應鏈的產業重組動向，有助於評估未來 AI 合作夥伴的資料取用能力與資安風險。", "tags": ["醫療 AI 併購", "資料策略", "產業整合", "健康資料"], "author": "未標示（Dealroom｜2026-08-28）", "source_url": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxPeXBtMFJPOEFRa09DZDBOTVZPTDJPTEZIVHNWUVRZYUtWV3BnWGlwckVFVFk0VTFqbHRkajdkU0ZyVDBLMVd1ZHZQdUhvaDVUeDBDQVN4OUJCZEpmbTBsczNsYkhlNDNUOXc1dmp3ZXZ6OXhFdjVhck1jTElROGlGRHFNSnFDRld6Z0J0RGdobjRYVEJuck5jWlR6RXRiUEVILU9xLU9UQ1dRM1k?oc=5"}, {"rank": 5, "score": 8.0, "title": "台灣醫療 AI 領袖：AI 應使醫療更人性化而非取代醫病關係", "summary": "Healthcare IT News 報導一位台灣醫療健康領袖在國際場合的發言，強調 AI 在醫療體系的導入應以「使醫療更人性化」為核心目標，而非單純追求效率提升或成本壓縮。該領袖指出，AI 工具若能解放醫護人員的行政負擔，將有更多時間與病患建立真正的溝通與信任關係，這才是醫療 AI 的正確應用方向。此觀點在當前各界急於評估 AI 落地成效的氛圍中，提供了以病患為中心的價值框架，對醫院領導層在制定 AI 策略與溝通內外部利害關係人時具有重要參考意義，也呼應了國際間對醫療 AI 倫理與人文面向的持續關注。", "tags": ["醫療 AI 倫理", "台灣醫療", "以人為本", "數位轉型"], "author": "未標示（Healthcare IT News｜2026-08-27）", "source_url": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNYWxwdDN0WmxBQnE1bHJQTWR1M1BsLXdzaHJsZ3VMNWxMUnZUT194cjRuZjktZlFRRVk1OGJUVHlBbGtkR2FvdkVfM2pxS3BLcWlvUnpnUkNCNGxoT0ZnMk9NOEpmRnAtY2lvdGJ2SWRMYkdEbGxuejl4QkhZZlN3WF95bmRRNHZyMk01MUN1eFBZNjlXSFgxV0EySkpyc1FUNmRQYl9ZazhpeUhVaUE?oc=5"}, {"rank": 6, "score": 7.8, "title": "Elsevier ClinicalKey「Ask AI」功能上線逾 1,500 家美國醫院，臨床知識查詢跨入生成式 AI 時代", "summary": "知識出版巨頭 Elsevier 宣布將其臨床知識平台 ClinicalKey 的「Ask AI」功能向美國超過 1,500 家醫院網站開放。該功能允許臨床人員以自然語言提問，即時獲取由 AI 整合的醫學文獻答案，大幅降低查閱臨床指引與研究證據所需的時間成本。此舉標誌著生成式 AI 在臨床資訊支援的大規模落地，也對現有臨床決策支援工具市場形成新的競爭格局。對醫院資訊 aVDhmRlNIbW56c21tWXhROA?oc=5"}, {"rank": 9, "score": 7.2, "title": "馬偕 AI 新秀計畫結訓：跨域醫療創新人才培育成果亮眼", "summary": "馬偕醫院「AI 新秀計畫」完成結訓，學員展示多項跨域醫療 AI 創新成果。據蕃新聞及 Yahoo 新聞報導，此計畫旨在培養具備 AI 應用能力的醫療人才，學員橫跨不同臨床科別與行政領域，透過實作訓練開發出涵蓋臨床輔助、行政優化等多元應用場景的 AI 解決方案。此計畫展示台灣醫療機構在內部 AI 人才培育上的積極布局，也反映出醫療院所從採購 AI 工具轉向自主培養 AI 應用人才的策略轉變。對於有意建立院內 AI 創新能量的醫療機構，此案例提供了人才培育計畫設計的具體參考模式。", "tags": ["醫療 AI 人才培育", "台灣醫療", "院內創新", "馬偕醫院"], "author": "未標示（蕃新聞｜2026-08-28）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE03WEJVSzZwLV9rTVRxcldMS3N1aDYtLWg1c1ZWNGRsUFhpMEJ4aW1MRGc5cjdiVk5zTnZvdk1tUUVVZ2hBUFdZY3hLeUhwTGNLc0E?oc=5"}, {"rank": 10, "score": 7.0, "title": "Moderna 與 Merck 個人化癌症疫苗的秘密核心：一套改寫腫瘤免疫學的演算法", "summary": "STAT News 深度報導揭露，Moderna 與 Merck 合作開發的個人化癌症疫苗 mRNA-4157 背後，關鍵驅動力不僅來自免疫學突破，更在於一套精密的 AI 演算法。該演算法負責分析每位患者腫瘤的基因突變資料，預測最可能引發免疫反應的新生抗原（neoantigen），從而客製化生成每位患者專屬的疫苗序列。此案例具體呈現了 AI 演算法在精準腫瘤學臨床應用中的核心角色，代表 AI 驅動個人化醫療從概念走向大規模臨床驗證的重要進展，也為醫療機構評估 AI 在腫瘤科的應用潛力提供了最新實證參考。", "tags": ["癌症疫苗", "個人化醫療", "AI 演算法", "精準腫瘤學"], "author": "未標示（STAT News｜2026-08-27）", "source_url": "https://www.statnews.com/2026/08/27/moderna-merck-cancer-vaccine-secret-ingredient-an-algorithm/?utm_campaign=rss"}]}, "2026-08-27": {"date_str": "2026年08月27日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.0, "title": "AI 臨床決策支援軟體新監管現實：數位健康與生命科學法規解析（上）", "summary": "隨著 AI 驅動的臨床決策支援（CDS）工具在醫療機構快速普及，美國監管機構對此類軟體的法規定義與分類標準正在發生根本性變化。本文為系列報導第一部分，深入剖析 FDA 對 AI CDS 軟體的最新監管框架，包括哪些工具屬於醫療器材管制範疇、哪些可豁免，以及數位健康業者與醫院採購部門應如何因應新監管現實。文章指出，生成式 AI 工具的崛起使傳統「非器材性 CDS」豁免條款面臨挑戰，監管邊界日趨模糊。對於正積極評估或已導入 AI CDS 的醫療機構而言，理解合規義務、供應商資質審查及風險分配機制已成為當務之急。本報導為醫院法務、資訊與臨床治理團隊提供重要的政策背景參考。", "tags": ["臨床決策支援", "法規監管", "數位健康", "AI治理"], "author": "未標示（JD Supra｜2026-08-26）", "source_url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOeVAyM3huYzBXXzNES19faGdQcEFKNXVNaF82LVo4eGJ0VTFaR1BsY2J0UEZNOHdZLWt3NXhLYVl4cW0wTTRYT3VMUnkzUVcwcjBCeWlkb3AySUpMNHVhRFduMzB3cHdIUkR2WUpCQXRCQnZXUEJyd2QtZHEwXzZNdkppc0ZMbUU"}, {"rank": 2, "score": 8.5, "title": "打造台灣自主多模態醫療 AI 國 const TODAY_ISO  = "2026-09-02";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
