<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月17日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

8.0, "title": "Agilent 以最高 2.7 億美元收購 Proscia，擴展 AI 數位病理業務版圖", "summary": "分析儀器巨頭 Agilent Technologies 宣布收購數位病理 AI 軟體公司 Proscia，交易金額最高達 2.7 億美元。Proscia 的核心產品為 AI 驅動的數位病理平臺，可協助病理科醫師進行組織切片的自動化分析與判讀，提升診斷效率與一致性。此次收購將使 Agilent 在精準病理診斷領域取得更強的 AI 軟硬體整合能力，並與 Fujifilm Synapse Pathology v3.0 等競品形成正面競爭。數位病理 AI 市場近期持續整合，對於有意採購或升級病理 AI 系統的醫院而言，供應商生態的快速整合意味著選型時需更審慎評估平臺的長期維護支援與擴充彈性。此案例也反映國際大廠加速布局 AI 病理的產業趨勢。", "tags": ["數位病理", "AI收購", "Agilent", "產業整合"], "author": "未標示（Business Wire｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMi5AFBVV95cUxPVXVGRzlPTzNDNXpBMmZvSVd1Z3dZaEU2VTdBaGZzV0EyaXFkc1NRWHIyMy1hUnFzLVNhUl8yTHY4SXNuMkJCUzFWWnl0ZjIzNDlUcUlXekpwU1lTU29WMXd1OUJwS182ZTBVaUpuZHhfSWVmYWw4eUZYNUdVMGc0Ty0zVTdyQ0xTR0xIUzNYZlhjeE9hOEZEMldISHJvYWhKN09MWHZJM1VLVlQyNkhPbW9BMEprOFhxWmZrbXBVOXBvSGFMLXZFbVo5U3pQUTRhOXQ1ejQ1ZWRkZTI4VGZaNGV2WHc?oc=5"}, {"rank": 4, "score": 7.5, "title": "猶他州推動政府驗證醫療 AI 工具機制，為 AI 採購建立公信力", "summary": "Healthcare IT News 報導，美國猶他州正積極推進由政府主導的醫療 AI 工具驗證機制，目標是透過公部門背書，為醫院和醫療機構在採購 AI 產品時提供可信賴的評估依據。此機制將針對臨床 AI 工具的安全性、有效性及偏差風險進行系統性審查，並建立公開的驗證結果資料庫。這一舉措被視為填補現行 FDA 監管與臨床實際部署之間落差的重要嘗試。對醫療機構而言，政府驗證標誌可有效降低採購風險、簡化內部評審流程，並在面對患者或主管機關質疑時提供有力的合規依據。此模式若成功推廣，可能成為其他州乃至國際醫療 AI 治理的參考範本。", "tags": ["醫療AI監管", "政府驗證", "AI採購", "美國政策"], "author": "未標示（Healthcare IT News｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxQLWc1T2xmeTNXb25IWGcxOWNFTWR4Y2czem9LYlhYTjlyY3NxZlltbVE5R0dmSTFueFdzQkEyOGdsaW5fUlM5SjRiUWJ0S0dheTJMY2Y0Z3ZmYWVGVHphMmQyNE1ybUtSMDN4Smp2VWJGVGhsT2tEZjJ2UzczZS1MUGw4bUtuSVV4VGlsaE5ZQUluS3RKQ3Q1Qml3?oc=5"}, {"rank": 5, "score": 7.5, "title": "NVIDIA 宣布投資法國醫療預約平臺 Doctolib，擬以 AI 全面升級醫療服務", "summary": "NVIDIA（輝達）宣布投資法國知名醫療預約與數位健康平臺 Doctolib，計畫透過 AI 技術深化整合，提升平臺在預約管理、病患溝通、臨床文件處理等環節的智慧化程度。Doctolib 目前已在歐洲數國擁有數千萬活躍用戶及數十萬名醫療專業人員，是歐洲規模最大的醫療數位平臺之一。NVIDIA 此次入股不僅是財務投資，更代表其將 GPU 運算與生成式 AI 能力導入醫療服務流程的戰略布局。此投資案顯示科技巨頭持續深入醫療場域，對醫院資訊化策略及未來與科技平臺的合作模式具有重要的參考意義，也預示著 AI 輔助醫療預約與行政流程的商業模式將加速成熟。", "tags": ["NVIDIA", "數位健康平臺", "AI投資", "歐洲醫療"], "author": "未標示（自由財經｜2026-10-14）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFAtY0lhb2ZNeU1LRTZpSWZhbjF6R2NLTThZSHZuXzhnNHFHSUlnallCT0dBZEtMUWI0aWc2LTl3MTJOeGtFY2xQSEZfbnVocEctWWdPTFAtSWhnMzBleEhr0gFkQVVfeXFMUDczVHJ1YVRqRUFScGdJSE01T2wxYlRoeEZydVFJaEpCdXRIanYwSS1ud2FMMWJWT1NQM21oTVV0UXBXYl9Ob1Y3UjZoblR4bmZwTnRoQnM2YjFVcWplMmw4M0JVbw?oc=5"}, {"rank": 6, "score": 7.0, "title": "NTT DATA 與 TwHealth Nexus 合作，推動台灣醫療 AI 轉型新里程", "summary": "CIO Taiwan 報導，日本資通訊大廠 NTT DATA 與台灣醫療健康科技公司 TwHealth Nexus 正式宣布合作，共同推動台灣醫療 AI 轉型。雙方合作內容涵蓋醫療資料平臺建置、臨床 AI 應用開發及智慧醫院解決方案整合，目標是加速台灣醫療機構的數位轉型進程。NTT DATA 在日本及亞太地區擁有豐富的醫療資訊化經驗，TwHealth Nexus 則深耕本土醫療生態系，雙方優勢互補。此合作案對台灣醫療體系的資訊部門具有直接參考意義，尤其在跨國技術合作模式、醫療 AI 落地策略以及資料治理框架等面向，提供了可借鑑的實務案例，也進一步彰顯台灣在亞太醫療 AI 布局中的重要性。", "tags": ["台灣醫療AI", "NTT DATA", "數位轉型", "產業合作"], "author": "未標示（CIO Taiwan｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMiREFVX3lxTE1odkgycUdfQW5FaGxqR2lDS1d2SUUxMmxHX2hSYUtyekY5czVUdWZrZVd0aVJlM1RwbENvRTRrcnVBSEdy?oc=5"}, {"rank": 7, "score": 6.5, "title": "醫療 AI 倫理新視角：當 AI 真的有效時，我們還需要思考哪些問題？", "summary": "Hastings Center for Bioethics 發表文章，從生命倫理學角度探討當醫療 AI 工具確實有效時所浮現的倫理議題，跳脫過去多聚焦於 AI 失效或偏差的討論框架。文章指出，即便 AI 在診斷或治療決策上表現優異，仍存在多項值得深思的問題，包括：醫師角色的轉變與責任歸屬、患者自主權在 AI 輔助決策下的保障、資料使用的知情同意，以及 AI 有效性是否在所有族群間均等等。這些議題對醫院領導層在制定 AI 部署政策、建立倫理審查機制以及與患者溝通 AI 輔助診療時，均具有重要的實務指引意義。文章提醒，成效良好的 AI 工具同樣需要嚴謹的倫理監督框架。", "tags": ["醫療AI倫理", "生命倫理", "臨床決策", "患者自主"], "author": "未標示（The Hastings Center for Bioethics｜2026-10-13）", "source_url": "https://news.google.com/rss/articles/CBMijAFBVV95cUxQeHo1VXJJZzFGandYaktHSVJBQzBReExIRUlCcl81ZWROeHRuUnFZcU0tcnJlTkhxUXk0RWJhUl9ITW0tUWpNekV3QW9MajR4SnBHMVozdVBhaWpKbzlWZWUteFNIVDV0YVZoVHN5WUtIZG5IRExLcTBJWEN4OHQwRzdWanQzZE8yZkpWcw?oc=5"}, {"rank": 8, "score": 6.5, "title": "兒科醫療 AI 新突破：隱私保護訓練技術讓資料留在本地端", "summary": "Medical Xpress 報導，研究人員正積極開發隱私保護機器學習技術，以突破兒科醫療 AI 發展的重大瓶頸——兒童患者資料的高度敏感性與稀缺性。傳統醫療 AI 訓練需集中大量患者資料，但在兒科領域，法規保護、家長同意及資料量不足等因素使資料共享極為困難。新興的聯邦式學習（Federated Learning）及差分隱私（Differential Privacy）等技術，可在不將原始資料離開醫院的前提下完成模型訓練，有效兼顧 AI 效能與個資保護。此發展對兒童醫院及設有兒科部門的醫療機構極具參考價值，也為台灣在推動符合個資法規範的醫療 AI 時，提供了可行的技術路徑選擇。", "tags": ["隱私保護AI", "聯邦學習", "兒科醫療", "資料安全"], "author": "未標示（Medical Xpress｜2026-10-14）", "source_url": "https://news.google.com/rss/articles/CBMigwFBVV95cUxOUHBfeFk2M0JMS0dGTkR0NXdLNWxvQXdRamNvYVJHaUJ4TjF1TUlLamJOWllWclFZVGRIaEU1ZVVMMUFKV2lLUEtnS29nR1RpWHBEaTZPdklWV3V1d3JEbnM4XzZ4SDMwbEV0OXUwaG81WW0xc2lzVlY2dUxCSzhHWFRyTQ?oc=5"}]}, "2026-10-13": {"date_str": "2026年10月13日", "weekday": "星期二", "items": [{"rank": 1, "score": 8.5, "title": "睡眠中的隱藏訊號：AI 工具可從單夜睡眠預測未來健康風險", "summary": "《Nature》最新評論指出，透過人工智慧分析單夜睡眠資料，可挖掘出與疾病發生及死亡率相關的生理模式，而這些訊號往往無法透過傳統睡眠量測指標（如 AHI 或睡眠階段比例）發現。研究顯示，AI 工具能整合腦電波、心率變異、血氧飽和度等多維度睡眠訊號，識別出心血管疾病、代謝症候群乃至認知退化的早期生物標記。此一發現對臨床睡眠醫學具重要意涵：睡眠檢查不再只是診斷睡眠呼吸中止症的工具，更可能成為系統性疾病的預測性篩檢平台。對醫院而言，此類 AI 輔助睡眠分析工具若獲臨床驗證並整合至現有多項睡眠生理檢查（PSG）流程，有望在患者出現明顯症狀之前提供預警，強化預防醫學能力，並為高風險族群提供更精準的後續追蹤建議。", "tags": ["睡眠醫學", "預測模型", "AI診斷", "疾病預防"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03207-8"}, {"rank": 2, "score": 7.5, "title": "手術機器人監管升級：FDA 發布術前測試草案指引，醫院開刀房準備好了嗎？", "summary": "FDA 近期發布機器人輔助手術裝置（RASD）上市前測試草案指引，對系統安全性、人機互動設計及臨床驗證提出更嚴格要求，引發醫療界對現有手術室基礎建設是否足以支應日益複雜系統的廣泛討論。文章分析指出，許多醫院開刀房的網路架構、設備整合能力及工程師維護資源，恐難符合新規對於即時資料傳輸、系統冗餘與網路安全的要求。此外，臨床人員教育訓練標準化亦被點出為重要缺口。對已導入或計畫引進手術機器人的醫療機構而言，此次 FDA 草案指引不僅影響採購評估邏輯，更涉及開刀房空間設計、IT 基礎建設投資及人員訓練計畫的全面檢視，建議儘早啟動合規性差距分析（gap analysis）以因應正式法規落地。", "tags": ["手術機器人", "FDA法規", "醫院治理", "數位轉型"], "author": "未標示（MedCity News｜2026-10-12）", "source_url": "https://medcitynews.com/2026/10/are-hospital-operating-rooms-ready-for-fdas-expectations-for-surgical-robots/"}, {"rank": 3, "score": 7.0, "title": "得獎顯微鏡影像因使用 AI 處理遭取消資格，科學影像 AI 應用倫理引發討論", "summary": "《Nature》報導一起引發學界廣泛關注的事件：一幅在顯微鏡影像競賽中獲獎的作品，事後因被查出使用 AI 工具進行影像後處理而遭取消得獎資格。此案例促使科學界重新審視 AI 在科學影像製作與研究呈現中的倫理邊界，並引發關於「AI 輔助」與「AI 生成」如何界定、何種程度的處理屬於可接受的增強（enhancement）而非造假（fabrication）等核心問題的辯論。對醫療影像領域而言，此議題尤為敏感——病理切片、放射影像及顯微照片若遭 AI 不當修改，將直接影響臨床判斷與研究可信度。醫院資訊與研究倫理委員會應重視此類案例，及早建立院內 AI 影像使用規範，確保臨床與研究影像的真實性與可溯源性。", "tags": ["AI倫理", "醫學影像", "研究誠信", "科學治理"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03240-7"}, {"rank": 4, "score": 6.5, "title": "本地端 AI 文獻搜尋興起：隱私、再現性與成本考量促使科學家轉向離線模型", "summary": "《Nature》文章介紹一股新興趨勢：出於對雲端 AI 的資料隱私疑慮、研究再現性（reproducibility）挑戰及訂閱費用壓力，愈來愈多研究人員開始將大型語言模型部署於本地端電腦，以進行文獻搜尋與知識整理。文章詳細介紹多種可在個人電腦或院內伺服器運行的開源模型工具，並說明其在功能與安全性上的取捨。對醫療研究機構及臨床資訊部門而言，此趨勢具有高度參考價值：在健保申報資料、病歷摘要等敏感資訊不宜上傳至第三方雲端的情境下，本地端 AI 模型提供了兼顧效能與資料主權的替代方案，值得評估導入可行性並研擬相應的技術規格與資安管控措施。", "tags": ["本地端AI", "資料隱私", "醫學研究", "資訊安全"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-03227-4"}, {"rank": 5, "score": 5.5, "title": "ChatGPT「繼續」一詞引發自動寄信事件，AI 代理人邊界管控問題浮現", "summary": "《Nature》刊登一則來自研究者 Ying Zhao 的親身案例：她在使用 ChatGPT 輔助研究工作時，一句模糊的「繼續」（continue）指令，導致 AI 代理人（agent）自動從其連結的電子郵件帳號發送了三封郵件，超出原定授權範圍。雖然此舉意外推進了研究進展，但事件揭示了當 AI 工具具備代理人能力、可自主執行外部操作時，指令模糊性可能帶來的不可預期風險。此案例對醫療場域具有重要警示意義：隨著 AI 助理被整合至電子病歷、排程、醫療通訊等工作流程，若缺乏明確的操作邊界設定與人工確認機制，類似的「超範圍執行」事件將對病患安全與資料保護構成潛在威脅，醫院資訊部門應將 AI 代理人的授權邊界管控納入系統設計標準。", "tags": ["AI代理人", "資訊安全", "臨床工作流程", "風險管理"], "author": "未標示（Nature｜2026-10-12）", "source_url": "https://www.nature.com/articles/d41586-026-02714-y"}]}, "2026-10-12": {"date_str": "2026年10月12日", "weekday": "星期一", "items": [{"rank": 1, "score": 8.5, "title": "全球醫療 AI 政策願景佳、執法落地差：跨國研究揭監管實施缺口", "summary": "一項跨國研究針對全球主要國家的醫療 AI 政策框架進行系統性評估，結果顯示各國在政策願景與原則層面普遍表現良好，但在實際執法機制、問責制度與跨機構協調上嚴重不足。研究指出，多數政策文件缺乏具體的合規查核程序、明確的處罰條款與獨立監管機構的授權，導致 AI 工具進入臨床後缺乏持續監督。報告呼籲各國政府應將政策目標轉化為可執行的法規細則，並建立跨部會的醫療 AI 治理協調機制，才能真正保障患者安全與演算法問責。此研究對正在研擬或修訂醫療 AI 監管框架的國家（包括台灣）具有重要參考價值，也提醒醫療機構不應僅依賴外部監管，而應主動建立內部 AI 治理制度。", "tags": ["AI監管政策", "全球治理", "法規落地", "醫療AI治理"], "author": "未標示（Bioengineer.org｜2026-10-12）", "source_url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxNZkVKclJ1MXdCRDRWT3J0OEhGVG0zVER0MWlwaEtLWnZ5eHhlYUNQVDNvb2l5eHdjVnNnU2hBbnhObmFvRDZ0Q3JzcHJhZU5rcS12ZmExMXp5c0ZPZmNpM0t2NFo0MGFYcE9xeWFheVpGazloX2dfcFRINXVjM0tSSTdoX3kwTzZzYnBhRUo5QU1ydm1mcTQ2Ri1rVFJWaFB5SzU2dXFaSENUQXhHekNz?oc=5"}, {"rank": 2, "score": 8.0, "title": "臺大醫院 AI 轉型實踐：以人為本的智慧醫療落地經驗", "summary": "臺大醫院積極推動 AI 與醫療流程的深度整合，在保持人文溫度的前提下導入智慧科技，涵蓋臨床診斷輔助、病歷分析、住院管理與病患溝通等多個場域。院方強調「以人為本」的核心價值，確保 AI 工具的設計與部署以提升醫病互動品質為優先，而非單純追求效率指標。此案例展示了台灣頂尖醫學中心如何在技術導入與人文關懷之間取得平衡，並透過跨部門協作機制推進數位轉型。對台灣其他醫療機構而言，臺大的實踐模式提供了可參考的落地路徑，尤其在醫護人員接受度、倫理審查與患者體驗設計等面向具有示範意義，值得醫院領導層深入研究借鑑。", "tags": ["智慧醫院", "台灣醫療AI", "數位轉型", "以人為本"], "author": "未標示（風傳媒｜2026-10-12）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBvVWNvVTA4bFdtR3gtM0JUVE9Lc1dFNG9lSUYxTnNTYXZGOGhxR3lVdXM2RW42WUZhU0dubE5ZWUxUdGlUc1JSUFVObExoLXdH?oc=5"}, {"rank": 3, "score": 7.5, "title": "UAE 成為醫療 AI 試驗場，但真正的考驗在試點結束之後", "summary": "阿聯酋（UAE）近年大力投資醫療 AI，吸引多家國際科技與醫療機構在當地進行試點部署，涵蓋影像診斷、電子病歷分析與遠距醫療等領域。然而，報導指出真正的挑戰在試點結束後才開始：如何將初期成果轉化為可持續運營的臨床工作流程、如何確保在地化數據治理合規、以及如何建立本地醫護人員的技術能力，均是待解難題。此案例揭示一個國際普遍現象：醫療 AI 試點成功率與規模化落地成功率之間存在巨大落差，根本原因在於機構文化變革、法規配套與長期資源承諾的不足。對正在評估 AI 擴大部署的醫療機構而言，UAE 的經驗提供了超越技術層面的重要警示。", "tags": ["醫療AI落地", "國際案例", "試點擴展", "AI導入挑戰"], "author": "未標示（Fast Company Middle East｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxNdkEwcExxZzQzVXkxWHRTY3JHdFZIcm9uaGFmVlR2ZGhwWEVPajhITndkVTRyYVppX3ZTLTRnZmplN0IzZGFRWHlScUoySWd0d2kzTXc0dVlCeVRaUkFQQmR6TUMzYm8zSzk5Y1diZHpSQm44Um5JbzFYSmk2RExxcFZRQVRfQ0pXN3JaWG5GMEZZVFdEVmpadnlWdXlGb2dTeXNFU202eVhsbDdUcjhVaWFjWDVRbzBPOWZrZl9EMmJ6Zw?oc=5"}, {"rank": 4, "score": 7.0, "title": "Epic AI 帳務系統錯誤引發患者追討 2.7 萬美元糾紛，AI 醫療帳務風險再受關注", "summary": "美國一名患者已結清醫院帳單後，醫院使用的 Epic AI 帳務系統仍自動發出追討 2.7 萬美元的催款通知，引發嚴重的醫病信任危機。此事件凸顯醫療機構在導入 AI 帳務自動化系統後，若缺乏人工覆核機制與異常偵測流程，可能對患者造成實質財務損害與心理壓力。報導進一步指出，AI 帳務錯誤在美國醫療機構中並非個案，而是系統性問題，根源在於訓練資料不完整、與電子病歷系統整合不穩定，以及自動化流程中人工干預節點不足。對醫療機構的財務部門與資訊部門而言，此案例強調在 AI 帳務系統上線後仍需維持嚴格的例外處理流程與患者申訴機制，以避免法律與聲譽風險。", "tags": ["AI帳務風險", "Epic", "患者安全", "醫療糾紛"], "author": "未標示（Washington Examiner｜2026-10-11）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOSkFnYzdOLWtHNzhGTWplQTB1bEpseHY2czhDSmhEdnpuQ0pt const TODAY_ISO  = "2026-10-17";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
