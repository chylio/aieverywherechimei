<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年08月04日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

cal AI｜2026-08-03）", "source_url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxOZmNjQnAtWnc4Wm5pRDhYbmdzck9QVFNhOURjZDJuaWZrMlpDXzVEbmRGaEpGbGNNWVNqbnFzVjBwRTgxbW1BazdxZDNDNDNpdXlQajdUaW5Eam95MmZ2b29mdGNqZFlwMXVaUmdrc0hCV1Foa3lkSk5BUWJLRGhsdHV1QzY1VFhFTVpWdUpjcjRVQm5T?oc=5"}]}, "2026-08-02": {"date_str": "2026年08月02日", "weekday": "星期日", "items": [{"rank": 1, "score": 8.5, "title": "Nature 與 MBZUAI 提出醫療 AI 七層級責任歸屬框架，為全球法規奠定基礎", "summary": "Nature 期刊與阿布達比人工智慧大學（MBZUAI）聯合提出一套七層級醫療 AI 責任框架，依照 AI 系統的自主程度與臨床介入深度，系統性地界定開發者、醫院、臨床醫師及主管機關各自應承擔的法律與倫理責任。此框架涵蓋從單純輔助診斷工具到全自動決策系統的完整光譜，並建議各國監管機構依層級訂定不同的上市前審查標準與事後稽核要求。此架構的提出背景，是全球醫療 AI 問責訴訟案例日益增加，現行法規多未能明確區分「AI建議」與「醫師決策」之間的責任邊界。對於醫院資訊治理與採購合規而言，此框架提供了一個可操作的風險分級參考依據，預計將影響 FDA、歐盟 MDR 及亞太各國對 AI 醫材的監管政策走向，值得醫療體系法務與數位轉型團隊密切追蹤。", "tags": ["醫療AI責任", "法規政策", "AI治理", "國際框架"], "author": "未標示（GNews-Medical AI｜2026-08-01）", "source_url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE11Tmo0ZFFmQi0zMFQ2YlJzYjJVa2FDclA3RWVVXzV4T2dxZ3IzamE2ZlAtQlJxMXMxVGd0TXBMbXhPZDdXOV9rM0N1dHdxVGRCRktuOQ?oc=5"}, {"rank": 2, "score": 8.0, "title": "OpenEvidence 臨床決策支援平台進駐醫院，實證型 AI 工具加速臨床採用", "summary": "OpenEvidence 宣布將其以實證醫學為核心的臨床決策支援平台（Clinical Decision-Support Platform）正式導入醫院場域，目標協助臨床醫師在床邊快速查詢最新治療指引、藥物交互作用及診斷建議。OpenEvidence 的產品設計強調以經同儕審查的醫學文獻為知識來源，區別於一般大型語言模型可能出現的幻覺問題，並針對急診、住院及門診不同場景提供客製化查詢界面。此次進駐醫院標誌著臨床 AI 工具從醫師個人使用邁向機構層級系統整合的重要轉折，也對院內 EHR 串接、資安合規與授權管理提出新的挑戰。隨著多家競爭者（包括 Doximity、Anthropic 等）同步布局臨床決策 AI，醫院採購評估的標準化與驗證機制需求日益迫切，此動態值得各臨床科主任與資訊部門關注。", "tags": ["臨床決策支援", "AI工具", "醫院導入", "實證醫學"], "author": "未標示（GNews-AI clinical｜2026-08-02）", "source_url": "https://news.google.com/rss/articles/CBMieEFVX3lxTE0zVnBsdGVBR3FOVmpnRHpyLUZIWlhlQTlyX2piNklWMWwtc2dSS0w4SlBmV0FyQzI2VEZhYUpuSFFjSmhHemFDaVRnTUN0MDdDQTBKWXZ2N0hJanpxd2s3bF9LWXV3UFF0SlM0cmVFTlRMeGhaWHBmag?oc=5"}, {"rank": 3, "score": 7.5, "title": "紐澤西州 11 家醫院 AI 工具與死亡率下降顯著相關，臨床成效再獲印證", "summary": "美國紐澤西州一項涵蓋 11 家醫院的觀察性研究顯示，導入 AI 早期預警工具的病房死亡率明顯低於未使用院區，進一步支持臨床 AI 在住院安全管理上的實際效益。該研究追蹤了 AI 系統對患者生命徵象、實驗室數值及護理 hor": "未標示（遠見雜誌｜2026-07-31）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE55eFBGbUFtY3U3a0VsMkIta2NOUUxzSjZQSG5TcEpHYXZQM2NLYk9ZMC1tVXo1V0tObVVTYWFFSExGY0czYlhyUlZxSEp1UQ?oc=5"}]}, "2026-07-31": {"date_str": "2026年07月31日", "weekday": "星期五", "items": [{"rank": 1, "score": 8.5, "title": "醫療 AI 快速普及國家最難承受 AI 盲點——新興市場導入風險警示", "summary": "一篇來自摩洛哥世界新聞的深度分析指出，醫療 AI 採用速度最快的國家，往往也是最缺乏資源來識別與修正 AI 系統盲點的地區。這些國家在數據代表性、基礎設施、監管能力等方面存在明顯落差，卻因醫療資源短缺而急於引進 AI 輔助診斷工具。報導強調，若訓練數據缺乏多元族群代表性，AI 模型在特定人群中的診斷準確率可能大幅下滑，進而加劇現有醫療不平等。對於正積極推動 AI 落地的醫療體系而言，此報導提醒必須優先評估 AI 工具在在地族群上的驗證成果，而非僅依賴原廠在歐美市場的臨床數據。此議題與台灣推動醫療 AI 國際輸出及在地化驗證的政策方向高度相關，值得醫院領導層及數位轉型團隊關注。", "tags": ["醫療AI公平性", "新興市場", "AI盲點", "在地化驗證"], "author": "未標示（Morocco World News｜2026-07-30）", "source_url": "https://news.google.com/rss/articles/CBMixAFBVV95cUxQd3dvME9zcHdiU0FnNV9EcGlQZGVqTGNIOGFtelBwaUdiY0oyTi03U0pGQXVCRHpuVGl1M3FKSVVuNXVtbVBoZVE2LUN4VFdLME94enRKbU1uX3loR1NsZ1BZUm9xVjc2a1JkUUdheFVpV3pxeld4aXR4SGcyZ21MMTlRcXVvcDg0eHViVTM4MDduSlZ3UlMzVF9ocDFNZEZkMW9jWjNRT3JIenlibjhtQUdCMXVKS19lMXQwVXNsaEc2TVk1?oc=5"}, {"rank": 2, "score": 8.0, "title": "醫療 AI 學到錯誤功課：捷徑學習讓診斷基準測試「被唬住」", "summary": "Tech Times 報導一項關鍵研究警示，醫療 AI 模型存在「捷徑學習」（shortcut learning）問題——模型可能並非真正學習疾病的病理特徵，而是抓取數據集中的非醫學偏差訊號（如標籤位置、掃描設備差異）來做出診斷，導致在標準基準測試中表現優異，但部署到真實臨床環境後準確率大幅下滑。研究人員指出，現有的醫療 AI 評估框架無法有效偵測此類缺陷，形成系統性的安全漏洞。此問題對放射科影像 AI、病理切片分析等高度依賴圖像辨識的臨床工具尤為危險。這項發現與近期多項關於醫療 AI 評測標準缺陷的批評相互呼應，對醫院在採購與驗證 AI 工具時應設立更嚴格的在地測試標準具有直接參考價值。", "tags": ["捷徑學習", "AI評估", "診斷AI", "患者安全"], "author": "未標示（Tech Times｜2026-07-30）", "source_url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxPTGR1S1lOTFp0MFg3UkpyNjQwWENKNGVjSmktdnVKczNKUy1lcE04Y2VxNU02VkZkZVlaaGE5R2hTQk9Va2FKcEZDRkZ5SU1tM2JyZkRHc1NzeVBiU0V6cUN5dDNfYWFLbjVFbTl1cmkweHR0OHBqcmoyTThoUlVwYnY4aHZUUjdLYVVmd1NkdVF2aGh3NU95VzRwODNjUl9zYnc2LVJoaFZuQ1pDSVlPMjYwY2VDMS10clFTWUlZaEg2aC1XM080YnhIYXE?oc=5"}, {"rank": 3, "score": 7.5, "title": "Mayo Clinic Platform 與巴西 Einstein 醫院攜手推進全球 AI 健康創新安全數據協作", "summary": "Mayo Clinic Pla  的商業模式結合臨床數據分析、AI 輔助診斷與個人化治療建議，透過與大型醫療機構合作累積龐大真實世界數據，形成數據飛輪效應。此波整合浪潮正在重新定義精準醫療的競爭格局，傳統診斷公司、基因檢測業者與 AI 新創之間的界線日益模糊。對台灣醫療體系而言，Tempus AI 的擴張路徑提供了一個觀察跨國精準醫療 AI 平台如何快速規模化的參考案例，也預示未來台灣醫療機構在選擇 AI 合作夥伴時，數據資產的歸屬與使用授權將成為關鍵談判籌碼。", "tags": ["Tempus AI", "精準醫療", "FDA核准", "醫療AI併購"], "author": "未標示（CMoney投資網誌｜2026-07-31）", "source_url": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQMDdTeUxmQXNhMWZwS0xJMVp6N3lQcklZNk9lRW9WOU9yNUJTa0RtOU9DWjJBQ0RrWWd1d2dfcHpkWjlRYkRjRDR1YXRJUUlPaHV4clJ5enBpajBWaTJtb1IybkMxcUp3VTR1Y0tHM25SY1hOMFFiaTlXM1d6NzJBcFlKdGF5QXljNFo2SjViaXVnMWxrb184OGs1bVRIQW1TTlBnaFRNNkpMNDNhRXJaU1FhUnR0X3h4cDRYZGdxUFpONExSVUNfejJ6Q0xKd2M?oc=5"}, {"rank": 6, "score": 6.5, "title": "AI 與能源成本將壓縮醫院 2027 年非人力支出——Vizient 報告示警", "summary": "Fierce Healthcare 引述 Vizient 最新研究報告指出，AI 技術投資與能源價格上漲的雙重壓力，將在 2027 年顯著壓縮醫院的非人力支出預算。報告指出，醫院為維持競爭力必須持續投入 AI 工具採購與基礎設施升級，但同步面臨電力成本攀升的挑戰，兩者合計對醫院財務形成明顯衝擊。Vizient 建議醫療機構提前進行支出結構重組，優先投資能直接產生 ROI 的 AI 應用，並重新評估能源使用效率。此報告對正在規劃 AI 預算的醫院領導層與財務長具有直接參考意義，尤其是如何在 AI 投資與成本控制之間取得平衡，將成為 2027 年醫院管理的核心挑戰之一。", "tags": ["醫院財務", "AI支出", "非人力成本", "Vizient"], "author": "未標示（Fierce Healthcare｜2026-07-30）", "source_url": "https://news.google.com/rss/articles/CBMisAFBVV95cUxOWnB4ajBJWXJ4NVhjd0xIQVZiYlpicmZNbk0wSWN5bmNucFBsdjVXckhsUzc4Q3V2MVo4OTNpMmdvSmZuZ1dqS0NFUGxSdWRibnl3MDNFeVRKbmxuQ2Vzc3lTWDBuZWJhaGFkUXhPekNYaUJObjBweWFHUUhCQ1JwbzdfdmtESjdKY0hwbjJGZ3NwdXVDbkhldDk4U1E2Y2lRNXFSM3d1bW85Qkk0QmdDYg?oc=5"}, {"rank": 7, "score": 6.0, "title": "醫揚科技結合 Intel 平台打造 AI 醫療外骨骼，協助下肢傷患安全復健", "summary": "台灣醫揚科技宣布採用 Intel 軟硬體平台，開發出具備 AI 輔助功能的醫療外骨骼裝置，專為下肢運動障礙或受傷患者設計，協助其在安全監控下進行復健訓練。該系統透過 AI 即時分析步態數據與肌肉力量，動態調整外骨骼的輔助程度，降低復健過程中跌倒或二次傷害的風險。此產品將 AI 邊緣運算能力直接整合至穿戴式醫療設備，代表台灣醫療器材業者在 AI 臨床復健領域的重要突破。對復健科、骨科及神經科等臨床科別而言，此類 AI 驅動的主動式復健工具有望縮短住院復健時程，並提升患者的自主訓練意願。此發展也呼應台灣政府 AI 新十大建設中對醫療 AI 在地化製造的政策支持方向。", "tags": ["AI外骨骼", "復健科技", "台灣醫療器材", "穿戴式醫療"], "author": "未標示（Cool3c｜2026-07-30）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE5zUXppWUpkTWlJc1p4dzhDTTFsRjBUVTR0RFRwTl9tZl9sck 病患惡化跡象，有效降低住院死亡率", "summary": "Medical Xpress 報導一項新研究成果，顯示專為即時監測設計的 AI 病患惡化偵測工具，能在傳統臨床指標發出警報前更早識別高風險病患，進而爭取更充裕的介入時間。研究團隊分析多間醫院的住院資料，發現導入 AI 監測系統後，需緊急救治的重症事件與死亡人數均呈現下降趨勢。該工具透過持續分析生命徵象、實驗室數值及護理紀錄等多維度資料流，即時產生風險評分並自動通知臨床團隊。研究者強調，AI 的優勢不在於取代臨床判斷，而在於協助醫護人員在龐大資訊量中快速辨識優先處置對象。此類工具的推廣對提升加護病房與一般病房的照護品質均具潛在效益，亦為醫院評估 AI 投資報酬率提供了具體的臨床結果依據。", "tags": ["病患安全", "早期預警", "AI監測", "臨床決策支援"], "author": "未標示（Medical Xpress｜2026-07-29）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxNTDA3XzlEdjVvVjk4WE85RG0tZ0lDejNuR0hQRjlHX1hLNVRKMndvQUlIYlkycVdjTXhxYlJrT1d5dXFkYmNVZXRpY0RjTGZNT2o1STlCUUhKaGtLZnBTSnFsQTR1VWFYQlVLLXRnLU5va1BWV1JiSzRxT0pWeHppYUJrQmxqckd2"}, {"rank": 3, "score": 8.0, "title": "臨床 AI 評測標準存在共同缺陷，OpenEvidence、OpenAI、Anthropic、Doximity 皆中招", "summary": "Fortune 報導一項最新醫療 AI 研究，揭露目前主要臨床 AI 工具（包括 OpenEvidence、OpenAI、Anthropic 及 Doximity 旗下產品）在評測方法上存在相同的系統性缺陷。研究發現這些工具雖在標準醫學問答基準測試中表現亮眼，但其評分機制未能充分反映真實臨床情境的複雜性，例如不確定性的表達、罕見疾病的處理及跨科別知識整合等面向。研究者指出，現行 benchmark 設計過於依賴封閉式問題，導致各家平台都能「刷高分」，卻可能在實際臨床使用中出現隱性錯誤。此一發現與同日 STAT News 對臨床聊天機器人評測問題的深入報導相互呼應，共同凸顯醫療 AI 工具在進入臨床前需要更嚴謹、更貼近實務的評量框架，對醫院在選型與採購決策上具有直接警示意義。", "tags": ["臨床AI評測", "LLM", "醫療安全", "工具選型"], "author": "未標示（Fortune｜2026-07-29）", "source_url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxOMXBfTUl1blBKNEl4NU1xQXNycnJ1TmNndGNXMmJlTmdZMDVqUDZZTFFfVm5NSWt3Z0tmM09OZVhPaG5yNkh5b1dLYWdJYlc0SUxxZ1N4LV90V3RuQWVuZkQ2UUFUTG9WbzZHR0VwWTIta3AwQjVVLUZKeWNYbFdZTUhtaHF5Z0djRTNBdkhHSFhjSk1lQnFGWDQ4Rk9YdGFHakVF"}, {"rank": 4, "score": 7.5, "title": "台灣 AI 病房數位助理：告別鍵盤醫療，讓醫師目光重回病人", "summary": "CIO Taiwan 報導台灣醫療機構正積極導入病房端 AI 數位助理技術，透過語音辨識、環境感知與自動化病歷記錄等功能，大幅減少醫師在電腦鍵盤前花費的時間，使臨床注意力得以重新聚焦於病患本身。相關解決方案整合了自然語言處理與智慧醫療物聯網，可在不干擾現有工作流程的前提下，自動擷取查房對話、更新護理紀錄並觸發後續醫囑提示。報導中指出，此類「隱形」AI 工具的設計理念在於輔助而非替代，讓醫護人員保有主導權的同時降低行政負擔。對台灣醫療體系而言，此一趨勢不僅回應了長期以來醫師過勞與文書作業繁重的痛點，也為智慧病房的下一階段發展提供了具體的落地參考，值得各醫院資訊與臨床部門共同關注。", "tags": ["智慧病房", "語音AI", "台灣醫療", "臨床工作流程"], "author": "未標示（CIO Taiwan｜2026-07-30）", "source_url": "https://news.google.com/rss/articles/CBMiREFVX3lxT function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
