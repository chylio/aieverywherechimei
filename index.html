<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月05日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

y": "星期六", "items": [{"rank": 1, "score": 8.5, "title": "放射科 AI 部署後監控關鍵策略：確保臨床安全與效能持續優化", "summary": "隨著放射科 AI 工具在醫療機構大量部署，上線後的持續監控已成為維護患者安全與工具可靠性的核心挑戰。本文探討放射科 AI 部署後監控的關鍵策略，涵蓋效能漂移偵測、資料分佈變化監控、演算法失敗模式識別，以及建立臨床回饋迴路等面向。專家指出，許多醫療機構在 AI 工具通過採購與初步驗證後，往往缺乏系統化的持續追蹤機制，導致演算法在真實臨床環境中表現下滑卻未能即時察覺。文章建議應建立自動化效能儀表板、定期與放射科醫師進行案例審查、設定臨界值警示機制，並將上市後監控納入 AI 治理框架，以符合 FDA 對軟體即醫療器材（SaMD）的持續監管要求。此議題對正積極擴展醫療 AI 應用的醫療體系而言具有高度參考價值。", "tags": ["放射科AI", "部署後監控", "AI治理", "醫療器材法規"], "author": "未標示（diagnosticimaging.com｜2026-10-03）", "source_url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxQRW5OLUZKY3NUR2dKRFl1TnMtQTM1QnVKTmx2S1gtUUs0MmdSMTV4RFo3czlNVjdPd0hWbHVXeWVFNmNMQUFwRFBVeGRoX2dvY0hFUjFPUC1mYnU5QlRkNmw1enhxcHJUQUpvY3lxMXpCLXNqNHdLRDZJeUNTRWNWZlZqRE5NRGtNeGNfMUpB?oc=5"}, {"rank": 2, "score": 8.0, "title": "台中榮總 AI 智慧醫療獲獎：30 秒篩骨質疏鬆、每年減少 6 萬次抽血", "summary": "台中榮總因其 AI 智慧醫療創新應用榮獲大獎，展示出兩項具高度臨床應用價值的成果。第一項為骨質疏鬆 AI 篩查系統，僅需 30 秒即可完成初步篩檢，大幅縮短傳統評估流程；第二項為 AI 輔助血液檢查優化系統，透過演算法判斷哪些患者可以免除重複抽血，實現每年減少約 6 萬次不必要的抽血檢查，顯著降低患者負擔並釋放醫療資源。此案例展示台灣公立醫學中心在 AI 落地應用方面的具體成效，不僅驗證了 AI 在效率提升與患者體驗改善上的可量化效益，更提供其他醫療機構推動智慧醫療轉型的實證參考。對正規劃 AI 落地應用的醫療體系而言，此類具可重複性與可量化效益的案例具有極高借鑒意義。", "tags": ["台灣醫療AI", "骨質疏鬆篩查", "智慧醫療", "臨床效益"], "author": "未標示（自由健康網｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE01ZDVJZV9GUDRORkhmZ1Z2TE5qNzZyYzliMWpiWnlqbHZCcC1XM3FuWnhNcVAwVXBRSm5pdl83MW5sNlRrMVhHcHhpNXpsR2RIcDhNR0JKcl9rNkx2RUstUUR5WFM?oc=5"}, {"rank": 3, "score": 7.5, "title": "長庚醫院創立 50 周年醫學週：聚焦 AI、精準醫療與再生醫學三大創新方向", "summary": "長庚醫院舉辦創立 50 周年醫學週，總統賴清德親臨出席，活動聚焦 AI 醫療、精準醫學及再生醫學三大核心主題，象徵台灣指標性醫學中心正式宣示邁向智慧醫療新時代。本屆醫學週匯聚國內外跨領域專家，探討 AI 技術在癌症診療、基因體醫學及細胞治療等前沿領域的整合應用，並展示長庚過去數年在數位轉型、大數據分析與 AI 輔助診斷方面的階段性成果。活動同時探討台灣醫療體系如何在全球 AI 競爭格局中取得戰略定位，以及公私協力推動醫療 AI 生態系建立的路徑。此次高規格醫學週顯示台灣頂尖醫療機構已將 AI 轉型列為核心戰略，對整體醫療產業的影響值得持續關注。", "tags": ["台灣醫療AI", "長庚醫院", "精準醫療", "智慧醫療"], "author": "未標示（ETtoday健康雲｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBlc2M2SS14YzNsa2xoTFgwbDJtd01sQWk5TjdHRS1iN25Rc1hoSEJPMGp3U0g4eUNJRFJrNDRMN21tYnNjY2h1Vjg4WFNpX0VO0gFPQVVfeXFMT1ZsZk5DQVljYjh3c3BzMDFoWWZWQ2p2XzNGT0pJR1llRU9yaXNTczBEMGNCVlBXS0pNTWNqU2U5TmhmUmtLMmNxSzJsdDZPOA?oc=5"}, {"rank": 4, "score": 7.5, "title": "The Lancet 評論：Anthropic 安全科學家警告 AI 十年內滅絕人類風險逾 10%，醫學界應如何回應？", "summary": "《The Lancet》刊載評論文章，聚焦 Anthropic 安全科學家 Evan Hubinger 在社群媒體上發表的言論——他估計 AI 在未來十年內造成人類滅絕的機率超過 10%。文章以醫學視角切入，探討臨床醫師長期以來如何透過疾病自然史與隨機對照試驗預測預後，並對照這種「預測文化」討論 AI 風險評估的方法論困境。作者指出，醫學訓練本身提供了一種處理不確定性預言的框架，但 AI 風險的複雜性遠超傳統疾病模型。文章呼籲醫學界不應置身事外，而應積極參與 AI 安全討論，共同建立符合人類福祉的 AI 治理框架。此評論反映頂尖醫學期刊開始正視 AI 存在性風險議題，對醫療機構領導層思考 AI 戰略具有背景參考價值。", "tags": ["AI安全", "AI治理", "醫療AI倫理", "The Lancet"], "author": "未標示（The Lancet｜2026-10-03）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01979-3/fulltext?rss=yes"}, {"rank": 5, "score": 7.0, "title": "NHS 活動人士發起「反 Palantir 日」行動，批評英國國民健保署與科技巨頭的數據合約", "summary": "《The Lancet》世界報導指出，英國社會活動人士針對 NHS（英國國民健保署）與美國科技公司 Palantir 所簽訂的數據合約，發起大規模抗議「行動日」，引發廣泛關注。批評者擔憂，Palantir 的合約賦予其存取大量患者健康數據的權限，潛在的隱私風險與商業利益衝突尚未獲得充分說明與公眾監督。此事件凸顯醫療機構與科技公司合作時，數據主權、患者隱私保護及透明度等議題的社會高度敏感性。Palantir 已深度參與多個國家的醫療 AI 與數據整合項目，此次英國民間反彈對全球醫療數據治理辯論具有指標意義，也提醒各國醫療體系在推動 AI 數據合作時，應重視公眾信任建立與監督機制設計。", "tags": ["醫療數據治理", "NHS", "患者隱私", "AI倫理"], "author": "Talha Burki（The Lancet｜2026-10-03）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01982-3/fulltext?rss=yes"}, {"rank": 6, "score": 7.0, "title": "鴻海 AI 智慧醫療進軍長照：三大場域啟動實證計畫", "summary": "鴻海集團宣布將旗下 AI 智慧醫療解決方案正式延伸至長期照護領域，並在三大長照場域同步啟動實證計畫。此舉標誌台灣科技巨頭從急性醫療跨入長照服務市場，意圖以 AI 技術解決台灣高齡化社會的長照需求缺口。三大實證場域涵蓋居家照護、機構式長照及社區型服務，將導入 AI 監測、風險評估及照護排程等功能，測試 AI 在非急性照護環境中的可行性與效益。鴻海此前已與台北榮總等醫療機構合作心臟疾病 AI 監測項目，此次進軍長照是其醫療 AI 生態系建構策略的重要延伸。對台灣醫療體系而言，科技產業深度介入長照 AI 化值得密切追蹤，其商業模式與臨床整合模式將影響整體產業發展方向。", "tags": ["台灣醫療AI", "長期照護", "鴻海", "高齡化照護"], "author": "未標示（自由財經｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5PMTFoc2tFRTBxQ0QtY0luTVQ0UUg4dVZvRU5TdUZnbFliODBwOUxUWDFXS3ZNbmlER1U3dzA3V2dMWDFGUDFrOVQ5UjgweVRkZW1pX2JnbDlIcU8zbjk4 0 月簽署三項專門規範醫療 AI 應用的法案，成為全美在醫療 AI 領域立法最為積極的州政府之一。此舉標誌著醫療 AI 監管從聯邦層級延伸至州層級的重要轉折，涵蓋範圍預計包含演算法透明度、資料隱私保護及 AI 輔助臨床決策的責任歸屬等核心議題。對醫療機構而言，此類州級法規將直接影響其 AI 工具採購標準、廠商合約條款及內部治理框架的設計。加州作為全美最大醫療市場，其立法動向往往成為其他州效仿的藍圖，也可能對跨州營運的醫療系統產生連鎖效應。台灣及亞太地區醫療機構在評估醫療 AI 導入策略時，亦可參酌此類法規框架，提前布局合規機制。醫院資訊部與法務團隊應密切追蹤法案細則，研擬對應的 AI 治理政策。", "tags": ["AI治理", "法規政策", "醫療AI立法", "美國"], "author": "未標示（Healthcare IT News｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxOZzl5OHVlczdydGxrX1FIUzZ0ZENaQjFYcEdjZGc1NE9wR201RkJLRDRscV8zNHN6WkEzTG5YYmhkc05qb2RwNXlRNmpzLWxBbmxkS3lUYlZmYVVDODJDSVdFOTl0Q3RwRGxXZjc1NEZCRDhVcnA5RXBaOV8yMm96QnZyZzRWT0twWGxvWkJpMU9fTmFfRnlkWGJB?oc=5"}, {"rank": 2, "score": 8.5, "title": "AI 從常規病理切片預測 12 種腫瘤類型癌症生物標記，精準醫療應用大幅躍進", "summary": "最新研究顯示，AI 模型能夠直接解讀標準 H&E 染色病理切片，跨越 12 種腫瘤類型精準預測多項癌症生物標記，無需額外的分子檢測程序。此技術突破意義深遠：傳統上判斷基因突變或蛋白質表現需仰賴昂貴且耗時的次世代定序或免疫組織化學染色，而 AI 若能從常規切片直接萃取等效資訊，將大幅降低精準腫瘤學的門檻與成本。對資源有限的醫療機構而言，此模型有望縮短從診斷到治療決策的時間，並擴大生物標記檢測的普及率。研究跨越多種癌別的驗證結果亦顯示模型的泛化能力，為後續臨床轉化提供有力基礎。病理科、腫瘤科與精準醫療團隊應關注此研究的臨床驗證進展，評估未來整合至現有數位病理工作流程的可行性。", "tags": ["AI病理", "精準醫療", "腫瘤學", "生物標記"], "author": "未標示（Bioengineer.org｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMirgFBVV95cUxOTDctNk9aUkRrbEd3Mk9LTVRNYkYwTHBtU2lkd1NrOFlzNnBYSzhTRmRNVWVjZENMamxCS3JqSWgxVDhNUV84TGtuUllieXlPU2lTSEc2T2piY0xWYmVhNU93cGlINl9CeFcxSXNncjBpUG1Rbnd3a3lkaVZ4T0xVR3ZQUVl0aXc4ZG1lN0pyNHBKZ1E0MXlTM0FhczZiZ05qTl9xRm9SWElpUS1TRGc?oc=5"}, {"rank": 3, "score": 8.0, "title": "AI 病理工具如何晉升為伴隨診斷？關鍵條件與監管路徑深度解析", "summary": "Drug Discovery News 深度探討一項關鍵問題：AI 病理分析工具在何種條件下能夠從一般性輔助工具升格為受 FDA 正式認可的伴隨診斷（companion diagnostic）。伴隨診斷與特定治療藥物綁定，用於識別最可能受益的病患族群，其監管要求與一般 AI 醫療器材截然不同，需通過更嚴格的臨床驗證與上市前審查程序。文章指出，AI 病理工具若要取得此地位，須在特定臨床試驗框架下積累足夠的分析效能數據，並與製藥廠商緊密協作。對醫院腫瘤委員會及精準醫療部門而言，理解此分類差異有助於正確評估廠商宣稱的臨床效益，避免採購決策錯誤。此議題亦牽涉健保給付資格與院內病理實驗室的法規遵循策略。", "tags": ["AI病理", "伴隨診斷", "FDA監管", "精準醫療"], "author": "未標示（Drug Discovery News｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOZnpJVktPVFl6cmhFOEpwY1 e）高風險影像、減少遺漏率方面亦有正向貢獻，為臨床品質指標改善提供依據。持續累積此類真實世界效益數據，是推動醫療 AI 從試驗走向規模化應用的關鍵。", "tags": ["放射科AI", "效率提升", "真實世界數據", "私人診所"], "author": "未標示（Radiology Business｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxNN1l6R29IN2l6X0ZYRGNtLUkzRTJmNWNCSzJXa2lHRy11dS1wNUhQc2ppWTBjZmpta0Q2b2RnYzFHb1N2QTNTcU01NjlhWlZWUlB1TXVFcDgxaVdIU1FaaHcwR2xiTVRBM0ZxZ3RsdTZmdG50bWxuMDBRU0R2anZtY19ab0JXSF9IVVFtdXpfbWllT1BXMXVkbi1oaERjWXNrQUxjYnAxNG95c2YyYXZaZGpEOGVNaUtfNWlPWDYtbHhoRXR3RlRpNEtRcEJ6Z21MRkZv?oc=5"}, {"rank": 7, "score": 6.5, "title": "醫療體系 AI 實踐學：聚焦臨床一線痛點的落地策略", "summary": "哈佛商業評論台灣版刊載深度分析文章，探討醫療體系在導入 AI 時如何從臨床一線的實際痛點出發，制定有效的落地策略。文章強調，成功的醫療 AI 應用並非從技術端推導，而是應先釐清臨床工作流程中最耗時、最易出錯或最亟需輔助的環節，再反向尋求適配的 AI 解決方案。此觀點呼應近期國際研究所揭示的「試驗止步困境」——許多醫療 AI 概念驗證成功後卻無法推廣至全院，根本原因正是缺乏與臨床需求的深度連結。文章亦討論醫療機構在推動 AI 時應如何建立跨部門協作機制，涵蓋臨床科室、資訊部門與行政管理層的角色分工，對正處於 AI 擴展階段的醫院管理層具有實務參考價值。", "tags": ["AI落地", "臨床工作流程", "台灣醫療AI", "數位轉型"], "author": "未標示（hbrtaiwan.com｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE9NajJ5OXpSOVUydk5mb2xXODdxY1hjT21qMnR2QlhZMVZibWNwS0ZsaXJrYXhlUkU5SkxvZHl5c09WbHdWaUxJSDFRMEg3cDA1cks4YkFhNzctb0U0THNDUFdzdFVtd3RmdWpkMXBWZDVtYnM?oc=5"}, {"rank": 8, "score": 6.0, "title": "Regenstrief 研究院：以數據與實證建構醫療 AI 信任基礎", "summary": "美國 Regenstrief Institute 發表研究觀點，指出醫療 AI 信任危機的核心解方在於系統性累積數據與實證。文章指出，目前醫療機構及臨床人員對 AI 工具的信任度參差不齊，主要原因包括黑盒模型缺乏可解釋性、訓練數據代表性不足，以及真實世界效益驗證的缺位。Regenstrief 作為美國重要的醫療資訊學研究重鎮，長期致力於電子健康紀錄與臨床決策支援研究，其觀點具有較高的專業參考性。文章強調，建立信任需要多方協作：開發者應提供透明的模型卡與效能報告，醫療機構應建立本地驗證機制，臨床人員則需接受充分的 AI 素養培訓。此框架對正在建構院內 AI 治理架構的醫療機構具有方向性指引意義。", "tags": ["醫療AI信任", "AI治理", "實證醫學", "Regenstrief"], "author": "未標示（Regenstrief Institute｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE05UzFhSG9zeFlnSmJqMDM4YldhSUZGWWl5RTEwZWdVTXpua0pjSlBsYVQzZ0M2RkZpblpHQWFNOUY5WkZYTi1iQjRQWldWS3Z4ZXItek9sbmlickxPTjZnWXI4bGJEVThXdkU4ODZBX0RwcDg?oc=5"}]}, "2026-10-01": {"date_str": "2026年10月01日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.2, "title": "放射科 AI 授權數量年增 42%，監管環境持續演進", "summary": "根據 Radiology Business 最新報導，放射科 AI 產品的監管授權數量在過去一年內大幅成長 42%，顯示 FDA 對影像診斷 AI 的審查流程逐漸成熟，市場擴張速度加快。隨著核准工具數量持續攀升，醫療機構在選購與導入放射科 AI 解決方案時面臨更複雜的評估壓力，包括如何區分不同授權等級的工具效能、確保上市後監控機制到位，以及與現有 PACS 工作流程的整合挑戰。監管環境的快速演進也意味著醫院需建立持續追蹤法規更新的能力，避免使用未及時更新合規狀態的 AI 工具。此一趨勢對放射科、資訊部門及採購決策者均具有直接參考價值，需系統性規劃 AI 產品生命週期管理。", "tags": ["放射科AI", "FDA授權", "法規監管", "影像診斷"], "author": "未標示（Radiology Business｜2026-09-30）", "source_url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxQcGFxV1hJbkI4WXRDOWdXTjdaT29FRnlWS3NjTTVoRzIzLWg1VnI4Q3M4bHlHTVpOVlg3TURJZDc2dzg0THNIYzFqeUV5b2d0a1hha3dKZGh3RnhYVFVxR29kZmNfUm5uOHdiT2hVMXk0dnRLLVRObS1ucjYwLU5qcExTWE1CeWZ3cUpYVmpPVl85bHdScTQ4NkI4blBpNGdqVGN2R21ack9MMnpPandmT213U2Q0WGZOQjR5VXllUnM5Zlk?oc=5"}, {"rank": 2, "score": 9.0, "title": "HHS 與 ARPA-H 宣布以 AI 加速擴大臨床試驗規模，正面迎戰中國競爭", "summary": "美國衛生及公共服務部（HHS）聯合 ARPA-H 宣布啟動 SURPASS 計畫，目標透過人工智慧技術加速臨床研究流程、擴大試驗規模，以強化美國在全球生醫研究的競爭地位，特別是應對中國日益增強的臨床研究能力。該計畫將探索 AI 在試驗設計、患者招募、數據分析及監管申報等環節的應用，期望大幅縮短藥物與醫療器材進入臨床的時程。此舉不僅代表聯邦政府正式將醫療 AI 列為國家策略工具，也預示未來臨床試驗生態將加速數位轉型。對於國內醫院及學術醫學中心而言，此政策動向可能帶動 AI 輔助試驗工具的研發需求，並影響未來與政府或跨國研究機構的合作模式。", "tags": ["臨床試驗AI", "ARPA-H", "政策法規", "數位轉型"], "author": "未標示（STAT News｜2026-10-01）", "source_url": "https://www.statnews.com/2026/09/30/hhs-arpa-h-clinical-trials-artificial-intelligence-surpass-program/?utm_campaign=rss"}, {"rank": 3, "score": 8.8, "title": "Ortet 攜 5 億美元資金入場，宣示醫療 AI 進入重量級資本競賽", "summary": "醫療 AI 新創公司 Ortet 宣布以 5 億美元承諾資金正式啟動，成為近期最受矚目的醫療 AI 創投案例之一。此次融資規模顯示全球投資機構對醫療 AI 商業化潛力的高度信心，亦進一步加速既有醫療 AI 公司在技術研發、市場拓展與人才競爭上的壓力。Ortet 的具體應用方向雖尚未完整揭露，但其鎖定醫療場景的定位預示未來將與既有 EHR 廠商、臨床決策支援平台及放射科 AI 業者形成競合關係。資本大規模湧入意味著醫療 AI 市場正從早期驗證階段邁向規模化商業部署，醫療機構在評估合作廠商時需同步考量供應商財務穩定性與長期經營能力。", "tags": ["醫療AI投資", "新創融資", "產業動態", "商業化"], "author": "未標示（The Pharma Letter｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxPa21mVjl6eC1NYUxmWE85RE1wbURlaXVEdUlGTFdqaXVvNkxKMzNWZmxBb2dLc1QwWVZXejF4M3hrckhuOTBmejJHLUVoOGh1NEFMZkVIc2VCQzJLZzFCMEZfN0E0Z3QxTnd0eURsRDhuST wire 報導，一款針對放射科住院醫師設計的 AI 訓練輔助工具正式上線，能夠自動分析學員的判讀紀錄，識別知識與技能缺口，並動態生成個人化補強課程。此工具結合大型影像資料庫與自適應學習演算法，可追蹤學員在不同影像類別（如胸部 X 光、CT、MRI）的表現趨勢，並對指導教師提供視覺化績效報告。對於面臨放射科人力短缺與訓練資源不均的醫療機構而言，此類工具有望縮短住院醫師培訓時程、提升判讀一致性，同時為教師提供更客觀的評核依據。此一應用方向亦呼應 RSNA 近期推動放射科 AI 教育體系升級的整體趨勢。", "tags": ["放射科教育", "AI訓練工具", "住院醫師培訓", "自適應學習"], "author": "未標示（PR Newswire｜2026-10-01）", "source_url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxOdGFaT203aDBDZ3JyYUV4a1JsckF6c0pmTE5wQktEV0l0LTRyYUhZWDAxRGxwc3NvalMtb0NscTFSRXBFQnZkZWNLRmJaNVdfRU5TLXZvZWs1M0hxbUNQTThmWGxPaWl3UFhieFhadGcyN1pSdWFwSEgwSzN2UVkxd3lmamhlbVRWUVNRTGpLYjI1anZYNVdIRjdMZjJjMDNKMkZOekRGN3JCZ2QtSWdEbVh5Yng1MVRU?oc=5"}, {"rank": 8, "score": 7.5, "title": "台北市聯合醫院打造「逆轉腎」AI 門診，整合糖尿病、心臟病與腎病跨科照護", "summary": "工商時報報導，台北市立聯合醫院榮獲臺灣 AI 卓越獎，其「逆轉腎」AI 門診以人工智慧整合糖尿病、心臟病與慢性腎病的跨科數據，建立以患者為中心的連續性照護迴路。該系統透過 AI 模型分析病患的多項生理指標與用藥紀錄，主動預警腎功能惡化風險，並協調內分泌科、心臟科與腎臟科的聯合介入時機。此一模式將原本分散於各科的照護流程整合為單一 AI 驅動的管理平台，有效降低患者因資訊碎片化而導致的照護落差。此案例對有意推動多科整合型慢性病 AI 管理的醫療機構具有重要的本土實踐參考價值。", "tags": ["台灣醫療AI", "慢性病管理", "跨科整合", "腎臟照護"], "author": "未標示（工商時報｜2026-09-30）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE0zWVYzLVFsZGd4UVV1TEdlSEdyMXVkWXJRaWl4ZUNlc0lycVQ0NURzQTVFQXNTbTlkM1NmcHhiWjB6UnNUd1lzVjZLYWNsYUh1ZHRCcTU3QTRQelNaMVFV?oc=5"}, {"rank": 9, "score": 7.3, "title": "GE 醫療新設首席 AI 官，強化全球醫療 AI 應用戰略佈局", "summary": "商傳媒報導，GE 醫療（GE HealthCare）宣布設立首席 AI 官（Chief AI Officer）職位，由此正式將 AI 治理與應用策略提升至最高管理層級。此舉標誌著全球最具規模的醫療影像設備商之一，正式將 AI 能力內化為核心競爭要素，而非僅作為輔助功能。首席 AI 官的設立預計將統籌 GE 醫療旗下影像設備的 AI 模型開發、監管合規策略、與醫院客戶的 AI 共創計畫，以及跨部門的數據治理架構。對於採用 GE 醫療設備的醫院而言，此人事佈局可能加速其設備端 AI 功能更新頻率，並帶動更緊密的廠商合作關係，值得採購與資訊部門持續關注。", "tags": ["GE醫療", "首席AI官", "企業治理", "醫療影像"], "author": "未標示（商傳媒｜2026-09-30）", "source_url": "https://news.google.com/rss/articles/CBMi2wJBVV95cUxNTndmdS11VXRrcHJlUDczek1QU0F4dVBwOUV3Njd0X2xXS2xtTXVERzVTTExCTUFwZFkxSzJ6Tlk0bDF6cEZZZ1RQcjJHMmJCVnJMMUF4dUEzcUgydW5uYkhHVUdad25McVNnQ21PbVBEbGpKWUZmWU93c29Ud3hPMklVdGFUYk5xdlVhNVZIT3UzT2ZUWEtvZmFrQ095bDg1UG4yNWRJX21rTkk5bVNDdFFueVp1Yi1rX     ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
