<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月08日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

ceSoft 報告揭示採購與成效脫節警訊", "summary": "ScienceSoft 最新發布的醫療 AI 採用報告指出，全球醫療機構部署 AI 工具的速度已明顯超越其驗證實際價值的能力，形成「採購先行、驗證滯後」的結構性風險。報告顯示，許多醫院在缺乏完整 ROI 分析或臨床效益數據的情況下，即大規模引入 AI 輔助診斷、自動化行政或預測分析工具。這種現象雖短期內可展現數位轉型動能，但長期恐造成資源浪費、員工信任危機及病患安全隱患。報告建議醫療機構應建立標準化的 AI 價值評估框架，包含導入前的基準設定、導入後的持續績效追蹤，以及跨科室的使用者回饋機制，才能確保 AI 投資真正轉化為醫療品質提升。", "tags": ["AI採購治理", "價值驗證", "數位轉型", "醫療機構管理"], "author": "未標示（Rutland Herald｜2026-10-07）", "source_url": "https://news.google.com/rss/articles/CBMiggJBVV95cUxQd1lwQjVZZkNLbTVOX2RWUDBGckVMaVp0QjJSZTQzaGdoWVpoeFBjcG1hbGRCVkQySnlkMEFNM2wzcEJNRlhpYUR6WE8xeTU4em9Oc1ZaNjd6T1FWS3I5anJkcDRkdXhadlZoUkoxTVQ5MnF0cUdLaEpGZVdCQWdIZWxscmFzS3FabjNaY3NWd1JiR2JEZWRhSjREWFJXcXdWNmV6YUtaMFhCUHRXSVU0SEdpZXQwSW1YVEpfZ2xOaGEzVWNidW8wT0NyT1Z5cEdwSVZIZVdaZkJtT0NCWGEzSmRnTTh1ZkFwRkNycVFVSjFYekJJWVVmSktFQ1E5bF9lWFE"}, {"rank": 4, "score": 7.5, "title": "醫療 AI 投資報酬比預期更快實現：最新調查帶來正向訊號", "summary": "Endpoints News 引述一份針對醫療機構的最新調查顯示，AI 投資在醫療照護領域的回報速度正快於業界原先預期。受訪的醫院與醫療系統主管表示，AI 應用於行政流程自動化（如病歷摘要、帳務核對）、臨床決策支援及排班優化等面向，均出現比預期更早的效率提升與成本節省成果。調查指出，成功案例的共同特徵是：導入前有清楚的問題定義、設定可量測的 KPI，以及跨部門的協作推動機制。此報告為醫療機構的 AI 投資決策提供了正面佐證，但研究者也提醒，部分效益來自流程再造而非 AI 本身，需謹慎歸因，避免誇大 AI 的單獨貢獻。", "tags": ["AI投資報酬", "醫療效益", "數位轉型", "醫院營運"], "author": "未標示（Endpoints News｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxObFVvejJPLVBKZ2Z0Q3FrcmY0eVBhZTFwODlnSkk3NU9JRDlQanp6OWduRW9kUUktZjhWbWN5S3pCRHA5dWpwSEdYWXcteFRJTGlOQ0RtSTVCVHBETWY3TzN2blZHQXhCcm55MmtvQ205M2xHN0pab1d2NmtmTUlPY1A1UDVfV0hFVy1FRW1ZWWNiMVlpMl9MMkRyNGswcnJQeW9F"}, {"rank": 5, "score": 7.5, "title": "三分之四 FDA 批准的 AI 醫療器材集中於放射科，研究揭示領域高度集中現象", "summary": "由 GigHz 創辦人主導的最新研究分析 FDA 歷年 AI 醫療器材授權數據後發現，在所有獲批的 AI 醫療設備中，高達四分之三屬於放射科應用，包括 CT、MRI、X 光等影像辨識與分析工具。此一高度集中現象反映出 AI 在影像判讀領域具備較清晰的技術成熟度與可驗證性，相對容易達到監管標準。然而，研究同時指出，其他臨床科別如病理、心臟科、急診及初級照護等領域的 AI 工具核准數量仍相對稀少，顯示 AI 醫療應用的發展仍存在明顯科別落差。此研究對醫院規劃 AI 導入策略時具有重要參考意義，說明放射科是目前最成熟且監管驗證最完備的 AI 切入點。", "tags": ["放射科AI", "FDA核准", "AI醫療器材", "影像診斷"], "author": "未標示（PR Newswire｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxQdFZfT1NVcVR1MU41QlJxc1Vhd0hSOTVRNWdYeUcxZVlJbXpnWWhVQ1BTQjFzSjl3UDhmZGU3SlZvMDJva0JrZVUtazFRZ1lGeHJUQllUYzJ5alRRb1hxcXNkZ1YwMzNZTndsdkhuMHZNRk9SNjZORjIweF9hTXVPbGxmZ0szNVBpZG95YkdwYU4wZUxsUUtwU2JvMVpBeWtmWGMzMGxpVHBRTzRCbW4xZnptMUFta0xYTUktSWtoZlpOTl8zSWI0S0pWYktDS193bjdWQnRWcUhkdW94UHJnUFZjMTh4NUVWWlVjdm1Hem1nNjA"}, {"rank": 6, "score": 7.5, "title": "醫療 AI 為何會出事？從模型變更、PCCP 到上線後風險控管的完整解析", "summary": "國家新創獎平台發布一篇深度解析文章，系統性探討醫療 AI 工具在臨床落地後可能引發安全事故的核心成因。文章指出，AI 模型的風險不只發生在研發階段，更常見於上線後的三大情境：一是未預告的模型版本更新導致效能改變；二是未依據 FDA 的預定變更控制計畫（PCCP）進行合規管理；三是缺乏系統性的上線後監測機制，無法及時偵測模型漂移或異常輸出。文章以具體案例說明各情境的風險型態，並提出醫院應建立的內部風控流程建議，包含版本控管、定期效能稽核與異常通報機制，對正在或計畫導入 AI 工具的醫療機構具有極高的實務參考價值。", "tags": ["AI風險控管", "PCCP", "模型監測", "醫療AI安全"], "author": "未標示（國家新創獎｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxNeS1ndFlTdnMwa1I5aVBNTnk0NGpXVFZNbzQzNmRRUXhxdXg5MS12ZFlvcDNCU1lyYnZ6WXAwS09CZ29TUHJsMzRlQ0pXYXhEdlMyN3ZJN09yQjAwdUJOODd2cndxYlRZTnZlNFNGT0c1bVFTT2xQUmtrWnpqOVFQVFZ3aktBMTNq"}, {"rank": 7, "score": 7.0, "title": "醫院面對 AI 驅動的網路攻擊威脅，資安專家呼籲超越傳統災難復原思維", "summary": "在 Rubrik 醫療保健峰會上，多位網路資安領導人警示：AI 技術的普及已使針對醫院的網路攻擊手法大幅升級，傳統以備份與還原為核心的災難復原計畫已不足以應對新型威脅。專家指出，AI 驅動的攻擊可自動化偵測醫院系統漏洞、產生高度擬真的社交工程誘餌，並能在短時間內癱瘓包含 EHR、醫療影像系統在內的關鍵基礎設施。建議醫院將資安策略從「事後復原」升級至「事前韌性」，涵蓋零信任架構導入、AI 異常行為偵測部署，以及跨部門的資安演練，並特別強調在 AI 醫療工具快速擴張的背景下，每新增一個 AI 系統即代表一個潛在的新攻擊面，需納入整體資安治理框架。", "tags": ["醫療資安", "AI攻擊威脅", "災難復原", "醫院資訊安全"], "author": "未標示（MedCity News｜2026-10-07）", "source_url": "https://medcitynews.com/2026/10/cybersecurity-experts-to-hospital-leaders-think-beyond-traditional-disaster-recovery-planning/"}, {"rank": 8, "score": 7.0, "title": "延世大學附設醫院開發 AI 模型，以 8 項術前指標預測急性腎損傷", "summary": "韓國延世大學附設醫院（Severance Hospital）研究團隊發表最新成果，開發出一套能在手術前預測急性腎損傷（AKI）風險的 AI 模型。該模型僅需輸入 8 項術前常規指標，包含年齡、腎功能基準值、手術類型及用藥史等，即可於術前完成風險分層，協助臨床團隊提前規劃液體管理與麻醉策略，以降低術後腎損傷發生率。AKI 是外科手術後常見且嚴重的併發症，與住院延長、死亡率上升及長期腎功能惡化密切相關。此模型的術前預測特性使其具備高度臨床可行性，無需額外檢查即可整合至現有術前評估流程，對手術量大的醫學中心具有直接的臨床應用價值。", "tags": ["急性腎損傷", "術前 用 CT 掃描，耗時且輻射劑量較高。此工具整合至 MRI 流程後，可在不增加輻射暴露的前提下同步取得體組成資訊，有助於提升診斷效率並支援個人化治療決策。FDA 的核准代表該工具通過安全性與有效性審查，對醫院放射科及相關臨床科別導入 AI 影像分析具重要政策信號意義，亦顯示 MRI 輔助 AI 工具的監管路徑日趨明確。", "tags": ["FDA核准", "MRI影像AI", "體組成分析", "放射科"], "author": "未標示（Unite.AI｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxNaUR2Sm1fQWpYcmFmaU9NLVlURjVNRElZNi0xTHRXN0Z3dm13SE15Ql9GVG1XQlNrandEZ2FBZHRVOHY4S3VmblJMNzhlOVVzd2xtdVFDU1FJZm9FUEI3SDBxUUZWVGNBQ0FzNWFQVmhDcUtWVzhPd2l4SmVZZ3pfd1ZJcnZHU3Bmb05wMFFZUWM2dw?oc=5"}, {"rank": 2, "score": 8.5, "title": "猶他州擴大醫療 AI 沙盒計畫：AI 可直接評估病患並開立處方，無需人工事前審核", "summary": "美國猶他州宣布擴展其醫療 AI 監管沙盒計畫，新增處方開立與女性健康兩大應用領域。最受矚目的是，此次計畫允許特定 AI 產品在無需醫師事前審核的情況下，自主評估病患狀況並開立新藥處方，打破現行醫療 AI 輔助決策的常規框架。猶他州同時宣布引入第三方稽核機制，以確保 AI 工具的安全性與合規性。此舉是美國州級醫療 AI 監管實驗的重要里程碑，意味著部分臨床決策權正式向 AI 系統開放，在提升醫療可近性的同時，也引發醫療責任歸屬、患者安全與監管充分性的高度爭議。這一政策走向對各國醫療主管機關與醫院法遵團隊具有重要的參考與警示價值，值得持續追蹤後續影響。", "tags": ["醫療AI監管", "AI處方開立", "沙盒計畫", "政策法規"], "author": "未標示（STAT News｜2026-10-06）", "source_url": "https://www.statnews.com/2026/10/05/utah-expands-health-ai-sandbox-picks-third-party-auditors/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "德州大學啟動 2,500 萬美元醫療 AI 治理計畫，建構負責任 AI 應用框架", "summary": "德州大學宣布啟動一項規模達 2,500 萬美元的醫療 AI 治理倡議，旨在建立系統性的 AI 責任框架、評估標準與最佳實踐準則，以支持醫療機構負責任地部署人工智慧工具。此計畫將聚焦於 AI 系統的透明度、可解釋性、公平性及臨床安全性等核心議題，並計劃與醫院、政策制定者及技術開發商協作，共同制定適用於醫療場域的 AI 治理規範。在醫療 AI 快速擴張、監管框架尚未完備的當下，此類大型學術機構主導的治理研究計畫具重要意義，其研究成果有望成為醫院 AI 導入評估與風險管理的重要參考依據，對醫院領導層及數位轉型團隊的政策制訂具直接參考價值。", "tags": ["AI治理", "醫療AI責任框架", "學術研究", "政策法規"], "author": "未標示（distilledpost.com｜2026-10-05）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQX2FJQ2RoWU9RTXJ6eTZCbWR6U2lobDN2aGx4T0V0U3BnZ2JDMzNNc05qU3ZOTUFfb3dmcjNCTjY5VWMzUjlxWXBvZTJ3M2dMTTc5MFlpZjVPRXZyRzJMWVdSdzc4YU1fV1YzemlaTDdDZ1NvSHlLb3pWZWJVX3FiQXhyMWJiU3lQSjlQVG5BZlp3RS0tUG1IOE5RVzlUbUJmT2J6WmNB?oc=5"}, {"rank": 4, "score": 7.5, "title": "AI 皮膚病灶分類工具整合至醫院臨床工作流程，從設計到落地的實踐經驗", "summary": "最新研究報告描述一套專為醫院臨床環境設計的 AI 皮膚病灶分類工具，該工具從開發之初即與臨床工作流程深度整合，而非事後加裝。研究團隊針對皮膚科實際診療流程進行分析，確保 AI 輸出結果能無縫嵌入現有電子病歷與診療決策環節，降低臨床使用摩擦。此案例呈現了醫療 AI 工具「以使用者為中心」的設計理念，強調技術開發與臨床需求同步對齊的重要性。皮膚病灶分類為 AI 影像辨識的重要應用場域，此工具的整合策略與實際部署經驗，對計劃引入皮膚科或其他影像輔助診斷 AI 的醫院資訊與臨床團隊具備直接參考價值，亦提供了一個從需求分析到工作流程落地的可複製模型。", "tags": ["皮膚科AI", "臨床工作流程整合", "影像辨識", "AI落地實踐"], "author": "未標示（medicalxpress.com｜2026-10-06）", "source_url": "https://news.google.com/rss/articles/CBMigAFBVV95cUxOWGlNZndhSElEUTF3bGJCeTBlWWdVVGd0MFdWMUJOV3k5azRHdmZIdWdReUozT2lsekNGVEFsa2NtSl8ySVRHeTg4clI5YnBvMXluLThEUzBzemdCQWJFQWVGNWZSemVtZ2tqNHpqSDNOT093NG9jZVExb29CWFZfNQ?oc=5"}, {"rank": 5, "score": 7.0, "title": "海鞘仿生 AI 突破聯邦學習瓶頸：醫院模型訓練不再洩露患者資料", "summary": "研究人員受海鞘（Tunicate）群體協作機制啟發，開發出一種新型聯邦學習演算法，可在多家醫院協同訓練 AI 模型時，有效防止患者個人健康資料外洩。傳統聯邦學習雖已能在不集中原始資料的前提下進行模型訓練，但仍存在梯度洩漏等隱私風險。此仿生演算法透過模擬海鞘的分散式訊號傳遞機制，強化了各節點間的隱私保護能力，同時維持模型的學習效能。在醫療 AI 跨機構合作日益普遍、各國資料隱私法規持續收緊的背景下，此技術突破對醫院資訊部門在規劃多中心 AI 研究合作及資料安全架構時具重要參考意義，亦為醫療 AI 的隱私合規問題提供了新的技術解法。", "tags": ["聯邦學習", "患者隱私", "醫療AI安全", "跨院合作"], "author": "未標示（Bioengineer.org｜2026-10-05）", "source_url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPSVNDdWFCa0liaXJGR0prS1hfTTh2alpwdnhJdmFVYTlHUUd2MlFEV2Z0Rm1HT3BxekswYzlYLW44NGd0d3RzX2Y0cU00RHBnTUFtcWM1aHhYaHVKSnRldHR2MU55c0RlbXVSMUFHWmhaMEFpWllEYWcwRnJPT284c0NpOVhHTUJiSnZQX3kxMVdvOW1MN3VsOFFjYk1rVjVRMExWOVdyMmJkUQ?oc=5"}, {"rank": 6, "score": 6.5, "title": "台灣 AI 3D 醫療影像技術：從一週縮短至半小時，台大醫院拚 2028 年全院導入", "summary": "台灣自主研發的 AI 3D 醫療影像重構技術近日獲得廣泛報導，核心突破在於將原本需耗時一週的 3D 影像重建流程大幅縮短至約半小時，顯著提升精準手術術前規劃效率。台大醫院宣示目標於 2028 年完成全院導入，配合「醫療元宇宙」概念，將 3D 影像與虛擬實境技術結合運用於臨床教學與手術模擬。國內廠商智捷同步宣布計劃於 2028 年前將此系統推廣至全台 29 家醫學中心，並積極備戰 2027 年興櫃。衛生福利部石崇良署長出席相關大會並表態以政策支持台灣智慧醫療國際化，此一產官學合力推進的態勢，顯示台灣在醫療 AI 影像領域的自主技術能量正持續提升，對國內醫學中心的影像科技採購策略具參考意義。", "tags": ["台灣智慧醫療", "3D醫療影像", "手術導航", "醫療元宇宙"], "author": "未標示（UDN｜2026-10-05）", "source_url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5SbDVhSjBXbzFaM2V1dWNLLUIwMjlPeWl5RjRUN1Y1eEdEM2VnYVJxZWtyeVp3d19PQWRoS0JvMlNad04wd2owNjVlUllTLXFkaWtjVnJ30gFWQVVfeXFMTlJsNWFKMFdvMVozZXV1Y0stQjAyOU95aXlGNFQ3VjV4R0QzZWdhUnFla3J5Wnd3X09BZGhLQm8yU1p3TjB3ajA2NWVSWVMtcWRpa2NWcnc?oc=5"}, {"rank": 7, "score": 6.0, "title": "亞東醫院攜手板橋醫療園區，結合 AI 與遠距醫療打造「無藩籬醫院」", "summary": "亞東醫院宣布與板橋醫療園區正式簽約，啟動以 AI 與遠距醫療為核心的「無藩籬醫院」建設計畫。此一模式旨在突破傳統醫療服務的空間限制，透過 AI 輔助診斷、遠端監測與數位化照護平台，將醫療服務延伸至院外社區，提升醫療可近性與持續照護能力。在台灣高齡化社會與長照需求持續增加的背景下，此類結合智慧醫療與場域延伸的創新模式具重要示範意義。亞東醫院此前已連續獲得智慧醫療相關獎項，此次計畫進一步展示其在 AI 應用落地與院外服務整合方面的持續佈局。對國內有意推動院際合作或社區醫療 AI 應用的醫療機構，此案例提供了可參考的整合架構與實踐路徑。", "tags": ["遠距醫療", "無藩籬醫院", "台灣智慧醫療", "社區照護AI"], "author": "未標示（蕃新聞｜2026-10-05）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTFBGUWxSRW1YODhqZUFhMElyTE81Q2NJVkM3TS1Kdk50R2JLS3p1YjN3SkE1MHQxSV9aeVV4MVR3MzVvVndXNHI0QWo1elJIelpKUGc?oc=5"}, {"rank": 8, "score": 5.5, "title": "Nature 社論：AI 生化武器炒作不應分散對現實生物安全威脅的關注", "summary": "《Nature》發表社論，適逢美國炭疽攻擊事件 25 周年，呼籲社會各界不應過度渲染 AI 在生物武器開發方面的潛在威脅，以免分散對現實生物安全風險的防範資源與注意力。文章指出，當前對 AI 生化危害的恐慌情緒在缺乏實證支撐的情況下快速蔓延，反而可能阻礙合理的生命科學研究監管框架建立。社論強調，確保生物安全的關鍵在於維持強健且受妥善監管的生命科學體系，而非對 AI 採取過度限制。此立場對醫療機構在評估 AI 倫理風險、制定 AI 使用政策時具參考價值，提醒決策者在回應社會輿論與制度性風險之間保持理性平衡，避免因誇大的 AI 風險敘事而影響正當的醫療 AI 應用推進。", "tags": ["AI生物安全", "科技倫理", "生命科學監管", "Nature"], "author": "未標示（Nature｜2026-10-05）", "source_url": "https://www.nature.com/articles/d41586-026-03135-7"}]}, "2026-10-05": {"date_str": "2026年10月05日", "weekday": "星期一", "items": [{"rank": 1, "score": 7.5, "title": "醫院 AI 設備大量上線，卻多數未經嚴格測試——安全性隱患引發警示", "summary": "根據 Earth.com 報導，目前醫療 AI 裝置已廣泛部署於醫院臨床環境，然而其中大多數設備在正式投入使用前並未通過完善的臨床驗證與安全性測試。報導指出，這些未受充分測試的 AI 工具涵蓋影像診斷、臨床決策輔助等多個高風險應用場景，若在未驗證的狀態下運作，可能對病患安全造成潛在威脅。專家呼籲醫院管理層與監管機構應建立更嚴格的上市前評估標準，並要求廠商提交真實世界臨床效能數據，以確保 AI 工具的安全性與有效性。這一問題也凸顯現行 AI 醫療器材監管框架的不足，在 FDA 授權數量持續攀升的背景下，如何確保每項工具均符合臨床安全要求，已成為醫療體系數位轉型過程中的核心課題。", "tags": ["醫療AI安全", "監管驗證", "臨床部署", "AI醫療器材"], "author": "未標示（GNews-Medical AI｜2026-10-04）", "source_url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxNcjNYVUhMUVEtQXRaNHJaWGxqT1VIWmljcHN4S091bmJsNWRYUFNvNzN1MDVPUFF5SHJjcS1CTjJ2OVZ3WnozQTNEaGNTSWxaTkNFRmNfa2UyMDFsdDFPQjBjSTBGMjBleno2NmxSdTZXZUlGVERJZ0htYm9VOW0xbmZmNEFwV2FYWi0xSW0xN1J2YXJER3BtUTdoN3prQUE2aTE5cGRqNnI?oc=5"}, {"rank": 2, "score": 6.0, "title": "醫療隱私主管借助 AI 強化資安監控與資料外洩調查效能", "summary": "在近期一場以隱私為主題的研討會上，醫療資安與隱私領域專家深入探討 AI 在醫療數據安全中的應用潛力。與會者指出，AI 工具能顯著加快資料外洩事件的偵測與調查速度，並提供傳統方式難以達到的深度分析洞察，協助隱私主管更精準辨識高風險行為與異常存取模式。然而專家同時強調，醫療機構在引入 AI 強化資安能力的同時，也必須審慎評估 AI 本身帶來的新型隱私風險，包括模型訓練數據的合規性、演算法偏差可能導致的誤判，以及與第三方 AI 供應商共享敏感數據的法律責任等議題。整體而言，AI 被視為提升醫療資安防護的有力工具，但需配套完善的治理框架方能有效管控伴隨而來的新興風險。", "tags": ["醫療資安", "隱私保護", "數據外洩", "AI治理"], "author": "未標示（MedCity News｜2026-10-04）", "source_url": "https://medcitynews.com/2026/10/healthcare-privacy-leaders-look-to-ai-to-improve-monitoring-and-data-breach-investigations/"}]}, "2026-10-04": {"date_str": "2026年10月04日", "weekday": "星期日", "items": [{"rank": 1, "score": 7.5, "title": "AI攻破澳洲政府醫療網路，資安專家示警醫療體系防護拉警報", "summary": "澳洲政府醫療資訊網路遭到 AI 工具滲透，資安專家對此發出嚴重警告。此事件揭示醫療體系在數位化與 AI 導入加速的背景下，面臨的資安漏洞風險日益嚴峻。攻擊者利用 AI 技術大幅提升入侵效率與精準度，使傳統防火牆與身份驗證機制難以有效抵禦。醫療資料因含大量敏感個人健康資訊，歷來是駭客攻擊的高價值目標；一旦系統遭入侵，不僅涉及病患隱私洩漏，更可能影響臨床作業連續性與診療安全。專家呼籲各醫療機構應重新審視現有資安架構，特別針對 AI 驅動攻擊模式進行演練與防禦升級，並建立跨部門的資安應變機制。此案例對正積極推動智慧醫院與雲端化的亞太地區醫療體系而言，具有高度警示意義。", "tags": ["醫療資安", "AI攻擊", "數位風險"], "author": "未標示（商傳媒｜2026-10-03）", "source_url": "https://news.google.com/rss/articles/CBMi1AJBVV95cUxNaFdxbVhZVmxVZ1hwUFBBc24tR2R6OS1KemFPZDU4TEM3bDdKZldPb1B1MmVlbFVZUGFqUHJLWU1TeFZObC1zajJubndxbW1XM0xlcUotR1NhWE9EMnZ6bVgxbmlDU2tHbWdXeWs5MHN6YmFWMXhBWm5qTmxQeHdDQ09oOENKdEJDcFdPZERqbm45a0lIWDZsdThuNzBCMmRMaTR5Q3dtcVh5c0J2bDltY3FVMmFDUTJheVlzMHR0VGVmZkNzMElfVFpPZWJ4UWJQaklqT0pZc1FHUmtwRnV2M216UEpJdFVVZ2ZCbjZNSHRXOEJvXzRqVjBqZ0hXSFdmcWRYMlBZTk1sRURPQkRxMTdiS2JfeU1XQkF6RTFQbjNRcktfb0VPb3kxS09JXzlJemdGYW40c1djY0dyeGpvUXhRbnZGSEJ4bXZwdlJjNWxBa2l6?oc=5"}, {"rank": 2, "score": 7.0, "title": "醫療 AI 為何「高分低能」？香港深度剖析 AI 醫生的落地困境", "summary": "香港01 推出「AI 醫生」系列報導，第一篇聚焦探討醫療 AI 系統在學術評測中表現優異、臨床實際應用卻頻頻失靈的核心矛盾。文章分析 AI 在真實醫療場域中面臨的多重挑戰，包括訓練資料與實際病患族群的分布落差、模型在邊緣案例的泛化能力不足、臨床工作流程整合困難，以及醫師對 AI 建議的信任度與接受度問題。報導同時指出，許多醫療 AI 產品在受控研究環境中達到甚至超越人類專家水準，但在面對多樣化、複雜化的真實病人時，準確率往往大幅下降。此現象提醒醫療機構在評估採購 AI 工具時，不應僅以論文數據為依據，更需要在本地臨床環境中進行嚴格的驗證測試，方能確保病患安全與 抽血", "summary": "台中榮總因其 AI 智慧醫療創新應用榮獲大獎，展示出兩項具高度臨床應用價值的成果。第一項為骨質疏鬆 AI 篩查系統，僅需 30 秒即可完成初步篩檢，大幅縮短傳統評估流程；第二項為 AI 輔助血液檢查優化系統，透過演算法判斷哪些患者可以免除重複抽血，實現每年減少約 6 萬次不必要的抽血檢查，顯著降低患者負擔並釋放醫療資源。此案例展示台灣公立醫學中心在 AI 落地應用方面的具體成效，不僅驗證了 AI 在效率提升與患者體驗改善上的可量化效益，更提供其他醫療機構推動智慧醫療轉型的實證參考。對正規劃 AI 落地應用的醫療體系而言，此類具可重複性與可量化效益的案例具有極高借鑒意義。", "tags": ["台灣醫療AI", "骨質疏鬆篩查", "智慧醫療", "臨床效益"], "author": "未標示（自由健康網｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE01ZDVJZV9GUDRORkhmZ1Z2TE5qNzZyYzliMWpiWnlqbHZCcC1XM3FuWnhNcVAwVXBRSm5pdl83MW5sNlRrMVhHcHhpNXpsR2RIcDhNR0JKcl9rNkx2RUstUUR5WFM?oc=5"}, {"rank": 3, "score": 7.5, "title": "長庚醫院創立 50 周年醫學週：聚焦 AI、精準醫療與再生醫學三大創新方向", "summary": "長庚醫院舉辦創立 50 周年醫學週，總統賴清德親臨出席，活動聚焦 AI 醫療、精準醫學及再生醫學三大核心主題，象徵台灣指標性醫學中心正式宣示邁向智慧醫療新時代。本屆醫學週匯聚國內外跨領域專家，探討 AI 技術在癌症診療、基因體醫學及細胞治療等前沿領域的整合應用，並展示長庚過去數年在數位轉型、大數據分析與 AI 輔助診斷方面的階段性成果。活動同時探討台灣醫療體系如何在全球 AI 競爭格局中取得戰略定位，以及公私協力推動醫療 AI 生態系建立的路徑。此次高規格醫學週顯示台灣頂尖醫療機構已將 AI 轉型列為核心戰略，對整體醫療產業的影響值得持續關注。", "tags": ["台灣醫療AI", "長庚醫院", "精準醫療", "智慧醫療"], "author": "未標示（ETtoday健康雲｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBlc2M2SS14YzNsa2xoTFgwbDJtd01sQWk5TjdHRS1iN25Rc1hoSEJPMGp3U0g4eUNJRFJrNDRMN21tYnNjY2h1Vjg4WFNpX0VO0gFPQVVfeXFMT1ZsZk5DQVljYjh3c3BzMDFoWWZWQ2p2XzNGT0pJR1llRU9yaXNTczBEMGNCVlBXS0pNTWNqU2U5TmhmUmtLMmNxSzJsdDZPOA?oc=5"}, {"rank": 4, "score": 7.5, "title": "The Lancet 評論：Anthropic 安全科學家警告 AI 十年內滅絕人類風險逾 10%，醫學界應如何回應？", "summary": "《The Lancet》刊載評論文章，聚焦 Anthropic 安全科學家 Evan Hubinger 在社群媒體上發表的言論——他估計 AI 在未來十年內造成人類滅絕的機率超過 10%。文章以醫學視角切入，探討臨床醫師長期以來如何透過疾病自然史與隨機對照試驗預測預後，並對照這種「預測文化」討論 AI 風險評估的方法論困境。作者指出，醫學訓練本身提供了一種處理不確定性預言的框架，但 AI 風險的複雜性遠超傳統疾病模型。文章呼籲醫學界不應置身事外，而應積極參與 AI 安全討論，共同建立符合人類福祉的 AI 治理框架。此評論反映頂尖醫學期刊開始正視 AI 存在性風險議題，對醫療機構領導層思考 AI 戰略具有背景參考價值。", "tags": ["AI安全", "AI治理", "醫療AI倫理", "The Lancet"], "author": "未標示（The Lancet｜2026-10-03）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01979-3/fulltext?rss=yes"}, {"rank": 5, "score": 7.0, "title": "NHS 活動人士發起「反 Palantir 日」行動，批評英國國民健保署與科技巨頭的數據合約", "summary": "《The Lancet》世界報導指出，英國社會活動人士針對 NHS（英國國民健保署）與美國科技公司 Palantir 所簽訂的數據合約，發起大規模抗議「行動日」，引發廣泛關注。批評者擔憂，Palantir 的合約賦予其存取大量患者健康數據的權限，潛在的隱私風險與商業利益衝突尚未獲得充分說明與公眾監督。此事件凸顯醫療機構與科技公司合作時，數據主權、患者隱私保護及透明度等議題的社會高度敏感性。Palantir 已深度參與多個國家的醫療 AI 與數據整合項目，此次英國民間反彈對全球醫療數據治理辯論具有指標意義，也提醒各國醫療體系在推動 AI 數據合作時，應重視公眾信任建立與監督機制設計。", "tags": ["醫療數據治理", "NHS", "患者隱私", "AI倫理"], "author": "Talha Burki（The Lancet｜2026-10-03）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01982-3/fulltext?rss=yes"}, {"rank": 6, "score": 7.0, "title": "鴻海 AI 智慧醫療進軍長照：三大場域啟動實證計畫", "summary": "鴻海集團宣布將旗下 AI 智慧醫療解決方案正式延伸至長期照護領域，並在三大長照場域同步啟動實證計畫。此舉標誌台灣科技巨頭從急性醫療跨入長照服務市場，意圖以 AI 技術解決台灣高齡化社會的長照需求缺口。三大實證場域涵蓋居家照護、機構式長照及社區型服務，將導入 AI 監測、風險評估及照護排程等功能，測試 AI 在非急性照護環境中的可行性與效益。鴻海此前已與台北榮總等醫療機構合作心臟疾病 AI 監測項目，此次進軍長照是其醫療 AI 生態系建構策略的重要延伸。對台灣醫療體系而言，科技產業深度介入長照 AI 化值得密切追蹤，其商業模式與臨床整合模式將影響整體產業發展方向。", "tags": ["台灣醫療AI", "長期照護", "鴻海", "高齡化照護"], "author": "未標示（自由財經｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5PMTFoc2tFRTBxQ0QtY0luTVQ0UUg4dVZvRU5TdUZnbFliODBwOUxUWDFXS3ZNbmlER1U3dzA3V2dMWDFGUDFrOVQ5UjgweVRkZW1pX2JnbDlIcU8zbjk40gFkQVVfeXFMTWhoVjdHbXNLbWxiQVM4QjctTDR2Vm0tYlNEVWVzb2o4eEVfTnE0TkY3T045V3pXZklYNGZyb2dNS2ZOZ3k1aDZ3SXlXRXgydTZfZlNvNm4wZzBxUEhMVERObWlMdw?oc=5"}, {"rank": 7, "score": 6.5, "title": "RFK Jr. 的醫療 AI 言論引發醫師強烈反彈，醫療 AI 公共辯論持續升溫", "summary": "美國前衛生部長 RFK Jr. 針對醫療 AI 的相關言論引發醫師社群強烈批評，進一步點燃醫療 AI 在公共政策層面的辯論熱度。批評者指出其論述缺乏科學依據，可能誤導大眾對 AI 輔助診療工具的認知，並干擾醫療 AI 監管政策的理性討論。此事件折射出醫療 AI 領域目前面臨的複雜公共溝通挑戰：一方面技術快速發展、臨床應用日益廣泛；另一方面公眾對 AI 診療的信任度、安全性疑慮與政治化論述相互交織，使得政策制定更加困難。醫師團體的集體反彈顯示，臨床社群對醫療 AI 的論述主導權高度敏感，也凸顯醫療機構在推動 AI 應用時，必須同步建立清晰的公共溝通策略與患者教育機制。", "tags": ["醫療AI政策", "公共溝通", "AI信任", "醫師立場"], "author": "未標示（Fierce Healthcare｜2026-10-02）", "source_url": "https://news.google.com/rss/articles/CBMixwFBVV95cUxQOHRnMWZ6VzFhNkZ3QzFkUFFOOE1lMXdhTmk0b3R5WTc0QWZVUUVkUXgtM0wtZFpJSG5TWDF1WGoySFljbXN4X0VNdWhTX1ZmY25qUVhZSzVkbGhBbzN5dHhNNnVlVUJKdnJwaWhBYVFvSXVDQTVn const TODAY_ISO  = "2026-10-08";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
