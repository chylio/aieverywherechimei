<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年07月08日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

aU40YkxKa2NYZVR4bXBWdlhpbzh4QVlkdWpkcGlXaW40UU9RbEg2Wmx5QVp0Zw"}, {"rank": 7, "score": 7.5, "title": "AI 病理工具可預測罕見癌症免疫治療成功率，具潛力改變用藥決策", "summary": "來自 Clinical Lab Products 的報導指出，一項新開發的 AI 病理分析工具能夠透過分析標準病理切片影像，預測罕見癌症患者接受免疫治療的成功機率。這項技術的意義在於無需額外的基因定序或特殊檢測，僅利用現有常規病理工作流程即可產出預測結果，大幅降低應用門檻。免疫治療費用高昂且並非對所有患者有效，能夠在治療前精準篩選可能獲益的族群，不僅提升臨床療效，也具有顯著的醫療資源配置效益。此工具對腫瘤科、病理科及精準醫療策略規劃均具直接參考價值，也符合目前國際間推動「可預測、可負擔的精準治療」的政策方向。", "tags": ["AI病理", "免疫治療", "罕見癌症", "精準醫療"], "author": "未標示（Clinical Lab Products｜2026-07-07）", "source_url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxQRDhIdW1xYXNKS2d1R3pYWXkzMnNmNWpQbThkQjhuRzFoU1JwNllES0Y1WEtyYXItRmtuNlVMSE9XcjhELWRDVFpPUHZ0NW5wX0dSN0tVSHRIWlItY25ubzZGa3ZHR1VORUdUM2Mta3FxZFFiR21FZmprTzJOc290aklkNWNSeGctUGZsdEdlQmduX29DcWt6VDBOWlB0YXhESGFNT0h6eU10XzIwb3FDU3ZMQ003b2Z3OTBUNVc1MHF4QQ"}, {"rank": 8, "score": 7.0, "title": "醫療 AI 被忽視的應用場景：供應鏈管理才是最適合 AI 發揮的領域", "summary": "MedCity News 一篇觀點文章提出，醫療機構在推動 AI 應用時往往聚焦於臨床診斷與行政流程，卻忽略了供應鏈管理這個 AI 最能發揮效益的場域。文章論點指出，AI 表現最佳的情境需符合四個條件：問題定義明確、資料密集、作業重複性高、規模超越人力追蹤上限，而醫療供應鏈恰好完全符合這四項標準。醫院耗材管理、藥品庫存預測、設備維護排程等場景，若導入 AI 預測與自動化工具，可大幅降低缺貨風險、減少浪費並優化採購成本。此觀點對醫院行政管理層、採購部門及資訊長在規劃 AI 投資優先順序時，提供了一個值得重新審視的策略角度。", "tags": ["供應鏈管理", "醫院營運", "AI應用策略", "成本優化"], "author": "未標示（MedCity News｜2026-07-07）", "source_url": "https://medcitynews.com/2026/07/the-ai-use-case-that-healthcare-is-overlooking/"}, {"rank": 9, "score": 7.0, "title": "馬偕醫院發表資安防禦白皮書，為 AI 時代醫療數據安全築起防線", "summary": "馬偕紀念醫院發布資安防禦白皮書，針對醫療機構在 AI 數位轉型過程中面臨的資安威脅提出系統性防禦框架。白皮書內容涵蓋電子病歷保護、AI 系統存取控制、醫療物聯網裝置安全管理及員工資安意識培訓等面向，並結合實際醫院場景提出具體防護措施建議。隨著醫院導入越來越多 AI 工具與雲端服務，資料外洩與系統入侵的風險也隨之上升，資安已成為醫療 AI 落地不可忽視的核心議題。此白皮書的發布對國內各醫療機構資訊部門及資安長具有重要參考價值，亦顯示台灣醫院體系在主動建構 AI 時代資安治理框架方面已踏出具體步伐。", "tags": ["醫療資安", "白皮書", "台灣醫院", "AI治理"], "author": "未標示（Yahoo新聞｜2026-07-07）", "source_url": "https://news.google.com/rss/articles/CBMi0wJBVV95cUxNOWhKXzRoWXN6U0djWHVoSUJNSTJWay1HUFpVWVd1aUdNWEh6V0tic2h5N2E5bE56djktVXJnNk5Menp5QUUwWWZKZWxLb0lVdFNNNXZic2Z2X0VWX21wUWY4cXVYaGEweEVkQm5vcmN1dEI0T0NHY3RaYmlPR1BfQUloUFVBTzRYTVctRHp0U19iLTdfQ1lnTXNvSVR1UXdQQVVfRk9IMnVtUXdIejhNdXZQWjFlU0g2cnNFZGp0MWlSVVpIMHhVaWVSZUVFUkhBbmpoLThoU1NIU2ozdlJxZ1F6Y3VXWlhOTjlmS2tyUUliUVU4RkhMS01FSHhHNzJJSnpJMTV2VE95UnpxbE8yMlVRYkRoSGpROE41TXJPM3Y3anhEeGlNVEN3bGpHb0ItS0lkYXREZGFJTnZPaVlrcE5iLUNPSGlFOGhwekN4UFZBXzA"}]}, "2026-07-07": {"date_str": "2026年07月07日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "賓州大學醫學院部署 AI 問診代理人，目標釋放醫師時間專注診療", "summary": "賓州大學醫學院（Penn Medicine）宣布將 K Health 的 AI 驅動問診代理人整合至其虛擬基層照護服務中。該系統於病患就診前自動蒐集病史、症狀描述與用藥資訊，讓臨床人員在進入診療環節時已掌握完整背景，從而減少重複性資訊蒐集工作。Penn Medicine 強調，導入目的並非取代醫師判斷，而是將寶貴的醫師時間從繁瑣的資料填寫轉向真正的醫病互動與臨床決策。此舉代表 Agentic AI 在門診流程自動化的又一具體落地案例，尤其適合大型醫學中心在虛擬照護量持續擴增的背景下提升服務效率。對於正積極規劃智慧醫院與虛擬門診的醫療體系而言，此模式具有直接參考價值，也再次驗證 AI 代理人在醫療前端流程的可行性。", "tags": ["Agentic AI", "虛擬門診", "病患問診自動化", "臨床流程優化"], "author": "未標示（MedCity News｜2026-07-07）", "source_url": "https://medcitynews.com/2026/07/penn-medicine-agentic-ai/"}, {"rank": 2, "score": 8.5, "title": "Stanford 醫學院：AI 從標準病理切片推斷腫瘤多細胞交互作用", "summary": "Stanford Medicine 研究團隊發表成果，展示透過 AI 模型分析標準蘇木素—伊紅（H&E）染色病理切片，即可推斷腫瘤微環境中各細胞族群的複雜交互作用，無需額外昂貴的空間基因體學實驗。此技術意義重大：現有病理科工作流程毋須大幅改變，即可獲取過去需要高成本多組學實驗方能取得的腫瘤免疫微環境資訊，對於精準腫瘤學的臨床決策與新藥研發均有潛在助益。這項研究也代表 AI 病理學從「影像辨識分類」向「生物機制推斷」的重要躍進，有助於縮短基礎研究與臨床應用之間的落差，未來可能改變腫瘤科醫師評估治療反應與選擇免疫治療方案的方式。", "tags": ["AI病理學", "腫瘤微環境", "精準醫療", "Stanford"], "author": "未標示（Stanford Medicine｜2026-07-07）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBFa2dPU0YtOXppWFBkeHJkWWFwSGU1UmFvb2M1dmVtb3Jsc01ucmMwOHBGU1lkV1g1Z3M0N0MwV0FvVnBXdG9EQ2dSa1VHQkkwbkNiY2h6S09zaEw1RjY3YU95VmJ4NmtHa1VZQWJiZEM0dHBock1LRjZB"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 的挑戰不在導入，而在「就緒度」：組織準備程度才是關鍵", "summary": "Unite.AI 一篇深度分析指出，醫療機構在 AI 落地過程中最核心的障礙並非缺乏技術選項或導入意願，而是組織層面的「就緒度」不足，包含數據基礎設施的完整性、臨床工作流程的標準化程度、員工 AI 素養，以及治理與問責框架的建立。文章強調，許多醫院在尚未評估自身準備狀態之前便急於採購 AI 工具，導致投資報酬率低落、臨床人員抵制或安全疑慮浮現。建議醫療領導層在推動 AI 策略時，應優先進行組織就緒度評估，從資料品質、流程再造與人員培訓著手，再逐步擴大技術部署規模，以確保 AI 真正融入照護流程而非流於形式。", "tags": ["AI就緒度", "數位轉型", "醫院管理", "AI治理"], "author": "未標示（Unite.AI｜2026-07-07）", "source_url": "https://news.google.com/rss/articles/CBMif0FVX3lxTE5tcmpZUDVnMWNtVHZmdmtYdC16RzdVSWtKZ0RwRFdSWHRWRm9zSUI3OWZ0S2kycDZPV2hkNXNGZXIzM2FkTFExTXU2Si1SRm8yQk1rVjdndy1LZ0hlV1hySU5ib2JZZFNVOUJHcXo0bjdfcmpGbzEzNHc2M19Ba0k"}, {"rank": 4, "score": 7.5, "title": "FDA 警告信揭示製藥 GMP 稽核中 AI 責任歸屬新挑戰", "summary": "PharmTech.com 報導 FDA 近期針對製藥業 AI 應用所發出的警告信（Warning Letter），深入分析其對藥廠 GMP（良好製造規範）合規責任的重大意涵。警告信的核心問題在於：當製藥企業在品質管控流程中使用 AI 工具時，若系統產生錯誤判斷，責任應由廠商、AI 供應商抑或監管機構共同承擔？FDA 的立場傾向於廠商應對 AI 工具的驗證與監督負完全責任，不得以「AI 判斷」作為合規失敗的免責理由。此一監管立場對所有引進 AI 輔助系統的醫療機構與醫材廠商同樣具有參考意義，提示各方須建立完善的 AI 系統驗證文件與問責機制。", "tags": ["FDA監管", "GMP合規", "AI責任歸屬", "醫療AI法規"], "author": "未標示（PharmTech.com｜2026-07-06）", "source_url": "https://news.google.com/rss/articles/CBMimAFBVV95cUxOQnhDVE0xcC1aNVE2STdRNlVleURqMERHT05fRV9wdWt5OXg3MGFrcTFRWHFoSzBaZ1pmVUNkNVdmdDRORGIzVjRfMllVdUFjQVNTMmdicFFTbS15dnJ5ZU1LSEhqYjd5aGJzZ21RRFNnYUpxSFhKbFBGWmRBWWoyRHQ0M0VlT2hrWURjblRWX1c5S3VHNmI0SQ"}, {"rank": 5, "score": 7.5, "title": "高雄醫學大學論壇：AI 輔助推動「無邊界醫院」概念逐步成形", "summary": "聯合新聞網報導高醫大舉辦的 AI 醫療論壇，與會專家探討 AI 技術如何突破醫院物理邊界，實現「無邊界醫院」願景。論壇聚焦遠距診療、穿戴裝置整合與社區健康管理三大面向，討論 AI 如何協助醫療資源延伸至院外場域，包含居家監測、社區篩檢及跨院資料串接。專家指出，台灣高齡化趨勢加速，單純依賴實體醫院已難以滿足照護需求，AI 輔助的院外照護生態系建置刻不容緩。論壇亦呼籲政府在健保支付制度、個資保護法規及 AI 醫材認證等面向儘速提供配套，以利相關應用加速落地，讓「無邊界醫院」從概念轉化為實際可運作的照護模式。", "tags": ["無邊界醫院", "智慧照護", "遠距醫療", "台灣醫療AI"], "author": "未標示（UDN｜2026-07-07）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE11Y2l1Y2t4SEdaaDR4T1ZqSzdrWGhlZ1pjWlA3eDMyOWpxUVNQa1JhR0c4ZHI5NUVLQkQ1ZlpZQnB1VlFGX0tjaTg5RkZkVnFC0gFWQVVfeXFMUGpsUFRHZDFsbGkwM2FxaW9kR3NSTEt2NkZ0bWxJb3pyTkJYVGFSS1p1djNUZUpmUEpIY09yRlFnUDVSWkdZRkpISXczWGlHcmRDNDVJdWc"}, {"rank": 6, "score": 7.0, "title": "韓國盆唐濟生醫院導入 AI 數位診斷檢測系統，提升血液檢測精準度與效率", "summary": "韓國 koreabiomed.com 報導，盆唐濟生醫院正式引進 AI 驅動的數位診斷檢測系統，主要應用於血液檢測自動化分析。該系統結合影像辨識與機器學習技術，能夠減少人工判讀誤差，並大幅縮短檢驗報告回報時間，有助於加速臨床診斷流程。院方表示，此次導入是醫院數位化轉型計畫的一環，預計未來將延伸至其他體液檢測項目。此案例顯示亞洲醫療機構持續加速 AI 臨床檢驗應用，也呼應全球 AI 體外診斷（IVD）市場快速成長趨勢。對於有意強化醫院檢驗科數位能力的醫療體系而言，此實例提供了具體的系統導入 助，VR 環境則用以提升患者訓練動機與神經可塑性效果。此案例代表復健醫學領域的科技整合新標竿，亦展示三項前沿技術在同一臨床場景的協同應用模式，對台灣各醫院復健科及神經科在規劃未來科技升級時具參考價值。", "tags": ["復健醫療AI", "機器人治療", "虛擬實境", "智慧醫院"], "author": "未標示（Health Tech World｜2026-07-03）", "source_url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOVzUtdzVnMGEwMnlSaFUwd0xkTHktaFhtWWVSVlhHdkdfd3hRRWJXTTFOMU9HbHlnbEZOQzUtVkJGbDdrOENHT19KV0lyTnNjZHozRXZVaGQyMkFDUHZHOEpUb1hLeGV3b1FXYTNvT3lGLTV6d3pvemhoOU84Uy1zMHppVzhHczBnSEFJN09ZNmlGZw?oc=5"}]}, "2026-07-03": {"date_str": "2026年07月03日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "FDA 史上首次核准生成式 AI 糖尿病管理裝置：LLM 究竟是介面還是決策者？", "summary": "STAT News 報導，FDA 近日批准一款以大型語言模型（LLM）為核心的糖尿病管理應用程式 UpDoc，被業界稱為「歷史性核准」。該裝置協助患者依照醫師制定的治療計畫自主管理血糖，引發監管與臨床層面的根本性疑問：當 LLM 在患者端直接參與醫療決策流程時，它究竟扮演的是使用者介面角色，抑或已具備事實上的決策功能？此問題牽涉醫療 AI 監管責任歸屬、安全性驗證標準及廠商責任邊界等重大議題。前 FDA AI 監管官員 Tala Fakhouri 亦指出，生技醫藥業者普遍對 FDA AI 指引採取過度保守的詮釋，而 FDA 本身也有更多空間提供產業指引。此案例為醫院與醫師在採用生成式 AI 輔助病患自我管理工具時，提供了重要的法規參照框架，亦將影響未來醫療 AI 產品設計與責任劃分標準。", "tags": ["FDA核准", "生成式AI", "糖尿病管理", "法規監管"], "author": "未標示（STAT News｜2026-07-02）", "source_url": "https://www.statnews.com/2026/07/02/fda-clearance-raises-questions-updoc-use-generative-ai-diabetes-treatment/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "前 FDA AI 監管官員：生技醫藥業對 FDA AI 指引解讀過度保守，監管方也應強化溝通", "summary": "STAT News 專訪前 FDA AI 監管官員、現已轉入產業界的 Tala Fakhouri，她指出當前生技醫藥公司在執行 FDA 人工智慧指引時普遍趨於保守，在產品設計與臨床驗證上設下過多自我限制，導致具潛力的 AI 醫療工具上市進程延滯。她同時指出 FDA 本身亦需強化指引說明，讓業界更清楚了解法規彈性空間。此觀點對醫院資訊部與數位轉型團隊具有直接參考價值：隨著 FDA 持續更新醫療 AI 監管框架，醫院在評估採購或自行開發 AI 醫療工具時，應主動了解現行法規真實邊界，避免因誤讀指引而錯失應用機會或承擔不必要的合規風險。此篇為了解 FDA AI 監管政策走向的重要業界視角。", "tags": ["FDA監管", "醫療AI法規", "產業政策", "生技醫藥"], "author": "未標示（STAT News｜2026-07-02）", "source_url": "https://www.statnews.com/2026/07/02/fda-ai-guidance-pharma-industry-caution-tala-fakhouri-explains/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 導入速度超前基礎建設，「影子風險」正在加速累積", "summary": "FutureIOT 報導指出，醫療機構在大規模導入 AI 工具的過程中，基礎資訊架構與資安防護能力的升級速度明顯跟不上 AI 應用部署的腳步，形成所謂的「影子風險」——包括未受管控的 AI 工具使用、資料治理漏洞、與現有系統的相容性問題，以及臨床端對 AI 輸出結果的過度信任等。報告特別警示，許多醫院在缺乏完整評估框架的情況下倉促引入 AI 解決方案，短期內可能難以察覺潛在的病患安全與隱私風險，待問題浮現時往往已造成難以逆轉的後果。此分析對醫院領導層在制定 AI 治理政策、評估資訊安全準備度時具有重要參考意義，也呼應了近期業界對醫療 AI 落地速度與安全性失衡的廣泛討論。", "tags": ["AI治理", "資訊安全", "醫療AI風險", "數位轉型"], "author": "未標示（FutureIOT｜2026-07-03）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxQMENzLUlaVmQ5OHVGWURQU3d0bzcyU2FuQXg4X3A5VG1kaTFJM0lQdTZtaHNfMnZELVFPNzc0ekktU0Q4VjA4LVNYbXdRWXZteDhMa24wV0xpVTlEbGZreVd3eEpZbTcwU0MwNkk3R1FlejR6Rlc3MVVtdElaeUhOWDlBcUJ4blhTRUJMYkpabmxxZDJJWklN?oc=5"}, {"rank": 4, "score": 7.5, "title": "Agentic AI 從「回答問題」進化為「處理任務」：醫療場景的下一個應用前線", "summary": "MedCity News 深度分析指出，靜態聊天機器人在醫療場景中的功能侷限日益明顯——患者面臨保險申訴、跨科協調、藥物管理等複雜任務時，傳統問答式 AI 無法有效承擔。Agentic AI（自主行動型 AI）的概念因此受到關注：這類系統不僅能回應問題，還能主動執行多步驟任務，例如協助患者完成就醫前準備、追蹤後續照護步驟或協調保險相關流程。文章同時提醒，Agentic AI 在醫療場景的落地面臨責任歸屬、錯誤容忍度與監管未臻完善等挑戰，實際部署前需審慎評估。此分析對醫院資訊與臨床流程改善團隊探索 AI 自動化應用邊界具有直接參考價值，並呼應當前醫療 AI 從輔助工具向自主執行轉型的產業趨勢。", "tags": ["Agentic AI", "臨床流程自動化", "病患照護", "醫療AI應用"], "author": "未標示（MedCity News｜2026-07-02）", "source_url": "https://medcitynews.com/2026/07/what-happens-when-ai-stops-answering-and-starts-handling-healthcare-tasks/"}, {"rank": 5, "score": 7.0, "title": "醫療 AI 建置信心不足成最常見落地障礙：Healthcare IT News 深度分析", "summary": "Healthcare IT News 發布報告指出，醫療機構在推動 AI 導入時，最普遍遭遇的障礙並非技術本身，而是組織內部的「信心缺口」——涵蓋臨床人員對 AI 輸出的不信任、管理層對 ROI 的不確定，以及資訊團隊對整合複雜度的疑慮。報告強調，要跨越這道心理與組織障礙，需要透明的模型解釋能力、漸進式試點策略，以及建立明確的績效指標來累積內部信任。此觀點對醫院各層面 AI 推動者均具實務參考意義，特別是在選擇 AI 工具導入策略、設計員工培訓計畫及向臨床端溝通 AI 決策邏輯時，可作為重要的評估依據。此分析亦與全球醫療 AI 實施現況調查結果高度吻合，顯示信心建立是醫療 AI 落地的關鍵非技術要素。", "tags": ["醫療AI落地", "組織變革", "信任建立", "Healthcare IT"], "author": "未標示（Healthcare IT News｜2026-07-02）", "source_url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxOZkYxcG5Xb3hJSTluS1duTURLaFdPb1NMd2NJZHhzZzBIVjNqT0FQSnR5ZmM3cmFYLWtLRFd6SlhiSUlScFN3SkE0OXlVcUw5aE0tN1M3UnlHU1VUSXFQOUp6YWhueTlnbGFBZmpfZDE0YktibnJpR0c2a3M5TlhiS1U1MHpZdWI2YnUyMURVQlNZWm5S?oc=5"}, {"rank": 6, "score": 6.5, "title": "台灣 AI 醫材落地實戰：聿信醫療、博鑫醫電剖析全球取證與資料開放關鍵挑戰", "summary": "環球生技月刊報導，聿信醫療與博鑫醫電兩家台灣 AI 醫材業者，於近期研討會中分享從全球法規取證到臨床資料開放應用的實際挑戰與解決策略。兩家公司均強調，AI 醫材要在多個市場取得監管許可，需面對各地法規標準不一、資料標注品質參差、模型泛化能力驗證困難等問題。在資料開放方面，如何在保護病患隱私與提升模型訓練效能之間取得平衡，是台灣 AI 醫材業者共同面臨的核心難題。此分享對醫院與 AI 醫材廠商合作評估、建立院內資料治理機制，以及理解台灣 AI 醫材產業現況均具參考價值，也呼應了政府推動 AI 醫材國際化的政策方向。", "tags": ["台灣醫療AI", "AI醫材", "法規取證", "資料治理"], "author": "未標示（環球生技月刊｜2026-07-02）", "source_url": "https://news.google.com/rss/articles/CBMiaEFVX3lxTE4ydjliQXdyZHpLN2E2VzVhM2xsQ3dCX1V4RThJX2Y2NWotSHRlb3VDRDdxQmpsVFAwbXg1TmVXcWRFejZ3bDBDZGJqVjF0NUFacWhDWllMLUVibUxQTmF3Vk1nY21VUkto?oc=5"}, {"rank": 7, "score": 6.5, "title": "放射科 AI 自動化提升判讀效率而非取代醫師：歐洲醫療觀點剖析", "summary": "healthcare-in-europe.com 報導指出，當前放射科 AI 工具的核心價值在於「自動化輔助」而非「取代放射科醫師」，此論點正在歐洲醫療圈形成主流共識。AI 工具在影像前處理、異常初篩、報告結構化等流程的自動化，能有效降低放射科醫師的認知負擔，縮短報告周轉時間，並協助應對影像科工作量持續攀升的壓力。然而，報告亦指出，AI 工具若未能深度嵌入現有工作流程，獨立運作反而可能增加操作干擾。文章呼籲醫院在採購放射科 AI 方案時，應優先評估工作流程整合度與使用者介面設計，而非單純比較模型精準度指標。此觀點對醫院放射科主任及數位轉型團隊評估 AI 影像解決方案具有直接實務參考意義。", "tags": ["放射科AI", "影像自動化", "工作流程整合", "臨床輔助"], "author": "未標示（healthcare-in-europe.com｜2026-07-02）", "source_url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE1iM1VpNXZVRVh6aVY5eHRmWFpQR0o3TEJ3aVpwc2U0bXBJMHJZajI5dEhiM2JqY0VEQlVaUEdmbktnU2gtQnhxbkxDdGhwdkVIeFdaRWh0eXdnZEw3X21fVlFPOG9fcmprSUNNQVBTUXVjcTcwSi13?oc=5"}, {"rank": 8, "score": 6.0, "title": "長庚大學推六年制醫學 AI 雙碩士學位，超前部署台灣 AI 醫師培育", "summary": "鏡週刊報導，長庚大學宣布推出創新六年制醫學系課程，讓醫學生在完成醫學教育的同時，同步取得醫學與 AI 雙碩士學位，成為台灣高等醫學教育因應 AI 浪潮的重要里程碑。課程設計旨在培育兼具臨床診療能力與 AI 應用素養的新世代醫師，涵蓋機器學習、醫療資料科學與 AI 醫療倫理等跨領域訓練。此舉反映台灣醫學院校正積極調整教育架構，以回應醫療 AI 快速發展對臨床人才技能組合的根本性要求。對醫院人力資源規劃與未來醫師培訓策略制定者而言，此案例提供了人才供應端的重要參照，亦預示未來臨床 AI 應用推動將有更堅實的人才基礎支撐。", "tags": ["台灣醫療AI", "醫學教育", "AI人才培育", "長庚大學"], "author": "未標示（鏡週刊Mirror Media｜2026-07-02）", "source_url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTFBObC1HejlaREhQQlA2UDJVZGxBN3NseEJXaGtzaXN3UENmLU9tdE5JY3VwM3NNQWNXWFhJRHJtV2tSM0UtZ2dNcV9LSl9JUG05emNQczM2RVBxNHpCb0thaWo0NFZTUdIBa0FVX3lxTE1xelAzeUlKZFR2NFg4bUszOHZIaUdEUjJOcGNTbkNTanlGMUpFclUyajRERDFSTk9PY3V6MFNTcWZvbS12Tm1qNDFVVkg0ZVNCRlhwZkhDbGZ2UnVhdWpPU0VkajkxWWxBbDJJ?oc=5"}]}, "2026-07-02": {"date_str": "2026年07月02日", "weekday": "星期四", "items": [{"rank": 1, "score": 8.5, "title": "醫療 AI 架構問題：醫院 AI 策略失敗的三大模式與預防之道", "summary": "MedCity News 刊載專論指出，醫療機構的 AI 策略失敗根源往往不在模型選擇，而在系統架構設計。文章歸納三種反覆出現的架構缺失模式：資料孤島阻礙跨系統整合、模型部署缺乏可擴充性設計，以及治理機制與技術架構脫節。這些問題在事後補救的成本遠高於事前預防。作者強調，醫院領導層在啟動 AI 專案前，應先確立資料基礎設施與互通標準，並將 AI 治理框架納入架構設計階段，而非等到系統上線後才亡羊補牢。這對正在規劃或擴大 AI 導入規模的醫療機構具有直接的參考價值，提醒決策者技術投資的重點應從「選對工具」轉向「建對架構」。", "tags": ["醫療AI策略", "系統架構", "AI治理", "數位轉型"], "author": "未標示（MedCity News｜2026-07-01）", "source_url": "https://medcitynews.com/2026/07/your-healthcare-ai-strategy-is-probably-an-architecture-problem/"}, {"rank": 2, "score": 8.0, "title": "醫院導入 AI 病歷文件工具前，領導層必須掌握的關鍵準備事項", "summary": "MedCity News 專論針對醫療機構導入 AI 輔助臨床文件工具提出實務警示。文章肯定此類工具的臨床價值，但強調缺乏充分準備將導致部署失敗。作者列出醫院領導層須預先解決的核心問題，包括：確保 AI 工具與既有電子病歷系統的工作流程深度整合、建立醫護人員培訓與變革管理計畫、制定明確的資料隱私與安全合規框架，以及設計可量化臨床效益的成效評估機制。文章特別強調，若在未完備基礎條件下倉促部署，不僅無法減輕醫師負擔，反而可能增加文件錯誤風險並降低醫護人員信任度。這份指引對正在評估或推進 AI 文件工具導入的醫院資訊與臨床主管極具參考意義。", "tags": ["AI文件工具", "臨床工作流程", "導入準備", "醫師負擔"], "author": "未標示（MedCity News｜2026-07-01）", "source_url": "https://medcitynews.com/2026/07/what-healthcare-leaders-should-know-before-implementing-ai-powered-documentation-tools/"}, {"rank": 3, "score": 7.5, "title": "Evernorth 投入 1 億美元建構 AI 專科藥局計畫，目標改善病患照護品質", "summary": "美國 Cigna 旗下健康服務公司 Evernorth 宣布，將於 2028 年前投入 1 億美元，推動名為「Pharmacy Forward」的 AI 驅動專科藥局計畫。該計畫聚焦於利用人工智慧優化專科藥品的配送流程、改善病患用藥依從性追蹤，並強化藥師與臨床團隊之間的協作溝通。Evernorth 表示，AI 工具將協助識別高風險病患、預測用藥中斷時機，並提供個人化的用藥支持介入。此舉顯示美國大型健保與健康服務集團正積極將 AI 投資從實驗性試點轉向大規模系統性部署，並以改善臨床結果而非單純降低成本作為核心訴求。對於布局智慧藥局或慢病管理 AI 的醫療機構而言，此案例提供了整合醫療與藥事服務的新思路。", "tags": ["AI藥局", "專科藥品管理", "健康服務投資", "用藥依從性"], "author": "未標示（MedCity News｜2026-07-02）", "source_url": "https://medcitynews.com/2026/07/evernorth-invests-100m-for-ai-specialty-pharmacy-program/"}, {"rank": 4, "score": 6.5, "title": "Zelis 推出 AI 解決方案，協助健保業者簡化《無意外法》獨立爭議解決流程", "summary": "醫療支付科技公司 Zelis 發布新款 AI 解決方案，專為協助健康保險業者因應美國《無意外帳單法》（No Surprise const TODAY_ISO  = "2026-07-08";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
