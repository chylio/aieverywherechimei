<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年08月24日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

ty｜2026-08-21）", "source_url": "https://news.google.com/rss/articles/CBMimAFBVV95cUxNWjQta3o3MzFGbU9MXzIxekp2ajZ3VnpHRGNYWWhFMFVYTTNWc2pGcUdDeVpmNFBuQ2lueDZsT3JLb3VtTUJick42bnRZSlFfcU5XaWhzZ05ZZzNNU3J0Rm5uOEp2YnVIX2J3NzVBaFMtcThYM2ZqMm5nVEY0ajlXZzgyVk9wNzdnUnlGbXlWUFRKMUNuVVozdg?oc=5"}, {"rank": 4, "score": 7.5, "title": "新 AI 框架大幅提升癌症病理診斷可靠性，有效降低誤診率", "summary": "News-Medical 報導，研究人員開發出一套新型 AI 框架，專門針對癌症病理診斷的可靠性問題進行優化。傳統深度學習病理模型在面對不同醫院染色差異、切片品質不一及罕見病例時，容易出現預測不穩定的情形。該框架透過不確定性量化（uncertainty quantification）技術，使模型在預測信心不足時主動標記供病理科醫師複核，而非直接輸出結果，從而在臨床應用中建立更安全的人機協作模式。初步驗證結果顯示，此方法能有效減少假陽性與假陰性，對於腫瘤科及病理科的 AI 輔助診斷具有重要的實務意涵，也為後續多中心臨床試驗奠定方法論基礎。", "tags": ["病理診斷", "癌症AI", "不確定性量化", "數位病理"], "author": "未標示（News-Medical｜2026-08-21）", "source_url": "https://news.google.com/rss/articles/CBMitgFBVV95cUxOQzNhaER6LW9uMjhTcGtISlBVZm9HVUE0ck9LS0ktaUZpcXNvMjRxY1VYUzhMN0xRejNBSUV0aE9vb21nbTJ0TGFScHl5dVZvVmRCSVA5YkN3SFRzQnE4Y3ZUbTVjbXZ2Tk5vbGlpOUlMcWJDRHQ4dzBBU20tSzNMcVpVR2tLdzJ1SFVqSzQ0MHE5MkpfaHFmeVFrdHVLUzk1TmwzSXpYZFFqQU9od3hPVzA2emstdw?oc=5"}, {"rank": 5, "score": 7.0, "title": "藥物警戒引入 AI 加速採用，治理機制成決定成敗關鍵", "summary": "MedCity News 發表分析文章，探討 AI 在藥物警戒（pharmacovigilance）領域的快速滲透趨勢。隨著製藥企業與醫療機構越來越仰賴 AI 自動化處理不良事件報告、信號偵測與病例報告整合，如何確保演算法決策具備可解釋性、可稽核性與問責機制，已成為核心挑戰。文章指出，若缺乏完善的 AI 治理架構，組織反而可能因過度依賴自動化而削弱對患者安全的真實掌握能力。專家建議機構應將人類監督嵌入 AI 工作流程的每個關鍵節點，並定期驗證模型輸出的準確性。此議題對醫院藥劑部、品質管理及法規事務團隊具有直接的政策參考價值。", "tags": ["藥物警戒", "AI治理", "患者安全", "法規合規"], "author": "未標示（MedCity News｜2026-08-20）", "source_url": "https://medcitynews.com/2026/08/ai-in-pharmacovigilance-why-governance-will-define-success/"}, {"rank": 6, "score": 6.5, "title": "WHO 將以色列醫療 AI 模式列為全球領先典範之一", "summary": "Jewish News 報導，世界衛生組織（WHO）已將以色列的醫療 AI 整合模式列入全球頂尖實踐案例。以色列因其高度數位化的全國性健康資料庫、跨機構的資料共享機制，以及結合臨床需求的 AI 開發生態，獲得 WHO 高度肯定。此認可突顯出，成功的醫療 AI 落地不僅依賴技術能力，更需要政策環境、資料基礎建設與臨床協作的系統性整合。以色列的經驗提供了醫療體系在國家層級推動 AI 轉型的可行路徑，包括數據治理框架的建立、AI 臨床驗證標準的制定，以及跨部門協作機制的形成，對亞太地區醫療系統具有重要的政策參考意義。", "tags": ["WHO", "醫療AI政策", "國際典範", "健康資料治理"], "author": "未標示（Jewish News｜2026-08-21）", re.com/articles/s41586-026-10687-1"}, {"rank": 2, "score": 8.8, "title": "Radiology Partners 旗下 Mosaic 正式向 FDA 請願，要求明確影像 AI 監管規範", "summary": "美國大型放射科集團 Radiology Partners 旗下子公司 Mosaic 於 2026 年 8 月 19 日向 FDA 提交正式請願書，要求監管機構針對醫學影像 AI 產品制定更清晰、一致的法規框架。請願內容涵蓋 AI 器材核准標準、上市後臨床效能監測義務、以及演算法版本更新時的重新申請門檻等核心議題。此舉反映業界對現行 510(k) 與 De Novo 審查路徑應用於影像 AI 的疑慮，以及對監管不確定性可能阻礙創新落地的憂慮。隨著 FDA 核准 AI 醫材數量已逾 1,500 項，但實證基礎參差不齊的問題持續受到關注，本次請願有望推動 FDA 加速釐清影像 AI 監管政策，對採購或開發放射科 AI 工具的醫療機構具有直接政策參考意義。", "tags": ["影像AI監管", "FDA政策", "放射科AI", "醫材法規"], "author": "未標示（AuntMinnie｜2026-08-19）", "source_url": "https://news.google.com/rss/articles/CBMi6gFBVV95cUxQbTc2YlZmeEVKWVBhWlZUXzNiX0xlbGhxOVVuYV9lS25mYjVsUk54VDJ1UHVrRG82VlJGLXNyWFhiWmd6R3JkWGZuX0MyV3Nid0RpVmN1U1Q4QVBmQ3ZoUjBiLUdrVndsRHlZUGkzbUFBV29CZm96MFRZbWd6aTR2TUZOT1hCS0ZHU19GYVZrWEdNN0cyWVJIR29JVVFucUVvODk4WF82ckp5LWJCcXgwNnlnOXhuNmZfZFBTVmhXdTNtbkVwR1ZWVWgtcnpKQkU2QlVMc0tnOXIwQ09BdjV1Ri0wbDAzeEN5ekE?oc=5"}, {"rank": 3, "score": 8.5, "title": "Epic 年會揭示 AI 新藍圖：代理人平台、Cosmos 預測模型與工作流程自動化全面擴張", "summary": "Epic 於 2026 年度用戶大會上發布多項 AI 戰略進展，包括推出 AI 代理人（Agent）平台、基於 Cosmos 大型資料庫的臨床預測模型，以及深度嵌入 EHR 工作流程的自動化功能。Cosmos 平台整合來自數千家醫療機構的去識別化患者資料，用於訓練預測住院風險、再入院率及敗血症預警等模型。AI 代理人功能則可自動完成病歷摘要、預授權申請及轉介協調等任務，大幅降低行政負擔。然而據 STAT 報導，Epic 年會閉門討論中亦存在對 AI 部署進度與整合複雜度的疑慮，顯示醫院端對 Epic AI 路線圖的期待與落地現實之間仍有落差。此動態對使用 Epic 系統的醫療機構資訊部門及數位轉型團隊具有高度戰略參考價值。", "tags": ["Epic", "臨床AI代理人", "EHR自動化", "醫院數位轉型"], "author": "未標示（Fierce Healthcare｜2026-08-19）", "source_url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxOQ0x3MzF1enVIdE50cm1xb3Nsa0lxRk1VWWxQc2JGaHU3OHBmQVdEYldHY043NFVUeFlqUTFrTUp6VFUxTDhkbjV5WkIzQ2dacF9zVV8wekZhMm1UMGI5cTdhdnNQNUctUkdwTUZYSVNxb0FlbVBJNWl4S2tMTmFhLU5EVWxZc0VyNWE0MWZJY0N6Z1d1SVJEV0RseGR5Z2RsMjBaVDFLQzNNSHBJblJTVC1SQTZTdGhlaEY5elI1Y3RzdTUxbXJKOHh4ZWU?oc=5"}, {"rank": 4, "score": 8.2, "title": "雲林醫療 AI 登上國際：單張 X 光影像提前識別骨折高風險族群", "summary": "台灣雲林地區醫療院所發展的 AI 骨折風險預測系統已登上國際舞台。該系統透過單張 X 光影像，運用深度學習演算法分析骨質密度、骨骼微結構等特徵，提前識別具骨折高風險的患者族群，無需額外的骨密度掃描（DXA）即可完成初步篩查。此一技術突破對偏鄉或資源有限的醫療環境具有特別意義，可望降低骨折篩檢門檻並擴大高風險族群的早期介入機會。系統已通過國際學術驗證，展現台灣在醫療 AI 影像應用領域的研發實力。對骨科、老年醫學科及放射科而言，此類工具有潛力整合至常規健康檢查流程，提升骨折預防效率。", "tags": ["台灣醫療AI", "骨折風險預測", "X光影像AI", "偏鄉醫療"], "author": "未標示（元丰傳媒｜2026-08-20）", "source_url": "https://news.google.com/rss/articles/CBMieEFVX3lxTE03ZUphV0llOVEyRnczMm5lWVdXT0I5QzY4ckRrbDNvV2V0bnpnQnVKLWN1ZndCTzBoVFVTMjViYUNDZ2dKX09Mc04tdUYyQS1HTXgwbVJMUlpnS2g3d1JPNDdHc3o3M3pBSkp2WUlzd3RMY3k4TDloaA?oc=5"}, {"rank": 5, "score": 7.8, "title": "FDA 核准 AI 醫材逾 1,500 項，但多數未以患者結局作為測試基準", "summary": "AuntMinnie 最新報導指出，儘管 FDA 已核准超過 1,500 項 AI 醫療器材，但大多數產品在上市前並未以真實患者結局（patient outcomes）作為效能驗證的核心指標，部分僅依靠影像辨識準確率或技術性能指標取得核准。此現象引發臨床研究者與監管專家的廣泛質疑，認為現行核准機制可能無法充分保障 AI 工具在實際臨床場域中的安全性與有效性。報導呼籲 FDA 強化上市後追蹤要求，並建立以患者為中心的 AI 器材評估框架。此議題與 Radiology Partners 向 FDA 請願強化影像 AI 監管的行動相互呼應，顯示業界與學界對醫療 AI 實證基礎的關切正持續升溫。", "tags": ["FDA醫材審查", "醫療AI實證", "患者結局", "AI監管政策"], "author": "未標示（AuntMinnie｜2026-08-20）", "source_url": "https://news.google.com/rss/articles/CBMi6AFBVV95cUxONDJyTzBzeXUzeWFzU05JaFZaQWVyaHlnZHhnTk9sby1PRjRGNENMUG5vUDRDV1NGaXI1b0sxbDBIQnFrZDUyVHhOQ3JWdkdRUUpNZG5RYmRFV2xCN1p4ZThLdmVsUGs3dTRBMkdrSHZKVGgyUzlOMUc3V01JbTRWZ0FEMFFQNU1IR0twX1NOZ2tuaElmUmtuZ0NIZ2VPMUhsQlg4dnVfY3BQX2plUEtaeGFubVRTVm82T2pnaUwzNlZSUlEzM2JVWVZEbVRDSXZCdk1seGpXNU1oX3pZQ291MGVsZ09yUEF4?oc=5"}, {"rank": 6, "score": 7.5, "title": "AI 在空間病理學的突破：深度學習解析組織切片空間資訊", "summary": "Drug Discovery News 報導，AI 深度學習技術正被應用於空間病理學（spatial pathology），透過分析組織切片中細胞的空間排列與微環境互動，提取傳統病理判讀難以量化的特徵。相較於標準數位病理，空間病理 AI 可同步分析細胞位置、鄰近關係及基因表現空間分佈，對腫瘤異質性評估、免疫細胞浸潤分析及治療反應預測具有重要潛力。目前多個學術中心已將此技術與多模態 AI 模型結合，探索其在乳癌、肺癌及大腸癌診斷分期中的應用。此趨勢對醫院病理科、腫瘤科及精準醫療發展方向具有高度前瞻參考價值，亦呼應數位病理整合 AI 的全球發展趨勢。", "tags": ["空間病理學", "數位病理AI", "深度學習", "腫瘤診斷"], "author": "未標示（Drug Discovery News｜2026-08-20）", "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxOd1RsOEgyamxKdFJtREw1SlRUamoyOGVaTnpQVERVSjUzYmF0UlJBNGk2TTdjQUZlLTh3bjFqVXpsMmdJaVJmT0VJN2d5V2NqZ0NRQ08zS29veEw0Sk5obERlWVdtSmJEODRYRE5sSUhhUm9mX2QtcTUyUXNNSXp5TldRcmhyYVZBaGpad25DWWg0Q2NfS3RZ?oc=5"}, {"rank": 7, "score": 7.3, "title": "FDA 核准首款全自主機器人抽血裝置 Aletta，無需操作人員手動介入", "summary": "FDA 於 2026 年 8 月 20 日正式核准 Aletta，這是全球首款獲准獨立運作的機器人靜脈抽血裝置，可在無需操作人員手動介入的情況下，完成從患者手臂抽取血液檢體的全程操作。Aletta 整合影像辨識、機械臂定位與自動穿刺技術，能夠識別靜脈位置並精準執行抽血流程。此核准標誌著醫療機器人技術從輔助型邁向全自主型的重要里程碑，對護理人力短缺的醫院而言具有實質減輕工作負擔的潛力。潛在應用場景包括門急診抽血站、長期照護機構及偏遠地區醫療站點。醫院管理層與護理部門可關注此類自動化醫療裝置對人力配置與工作流程的影響。", "tags": ["醫療機器人", "FDA核准", "自動化醫療裝置", "護理工作流程"], "author": "未標示（FDA Press Releases｜2026-08-20）", "source_url": "http://www.fda.gov/news-events/press-announcements/fda-authorizes-first-its-kind-robotic-blood-draw-device"}, {"rank": 8, "score": 7.0, "title": "醫療 AI 自動化成效落差大：部分醫療體系報酬顯著，另一些卻停滯不前", "summary": "The AI Journal 分析報告指出，不同醫療體系在導入 AI 自動化工具後呈現截然不同的結果：成效顯著者多具備清晰的資料治理架構、跨部門整合機制及 AI 導入專責團隊；而停滯不前者則普遍面臨資料品質不一、工作流程整合困難及臨床人員接受度不足等挑戰。報告強調，AI 技術本身並非決定性因素，組織變革管理能力與 AI 策略的成熟度才是關鍵差異所在。具體成功案例集中於行政自動化（如預授權、帳單處理）與臨床排程最佳化兩大領域，而直接涉及臨床決策的 AI 應用落地速度則相對較慢。此分析對正在評估或擴大 AI 投資的醫院領導層與資訊部門具有重要的策略借鑑意義。", "tags": ["醫療AI導入", "自動化效益", "組織變革管理", "數位轉型"], "author": "未標示（The AI Journal｜2026-08-20）", "source_url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQRFRZbEQwUzl2S1ktaEI4M1RqVXhlT3pnYjNoTjdZYm01SFN5VExqQ1JBVjF3RWtpM2VCckNid3ZFZlM1WUlKLTdmX2VvYjB6TmJwejJydjlvTzlXbDhpUEZFRnRGckVjaThwcDRuTXBMM3BuYzEwV2pMVFZpZTZQS0plS3g3dDY0dk5JODl4NVhSZ2pxcGxRcXBCdm9fUlFuY0pvOW53?oc=5"}, {"rank": 9, "score": 6.8, "title": "訊飛醫療營收年增 49.4%，醫療大模型加速規模化落地中國市場", "summary": "中國科大訊飛旗下訊飛醫療公布最新財務數據，營收年增幅達 49.4%，顯示其醫療大型語言模型（大模型）在臨床場域的商業化部署正加速推進。訊飛醫療的核心產品包括 AI 輔助診斷、智慧門診、病歷結構化及慢病管理等應用，已在中國數百家醫院完成落地。此次高速成長反映中國醫療 AI 市場在政策支持與醫院數位化需求雙重驅動下的爆發性擴張。訊飛醫療的規模化路徑與商業模式，包括與政府採購體系的深度合作及基於大模型的 SaaS 服務，對台灣醫療 AI 業者的市場策略與技術定位具有比較參考價值，亦反映亞太地區醫療 AI 競爭格局的快速演變。", "tags": ["醫療大模型", "中國醫療AI", "商業化落地", "智慧醫院"], "author": "未標示（香港商報｜2026-08-19）", "source_url": "https://news.google.com/rss/articles/CBMie0FVX3lxTFBEQ3BpR2xRc29Xd0tXMDMyYVhrUGtxVkN4VFNzbXYyWkp3aVdUWUpqOHBFdDhCdGRybkhyMFNZTXV3bWVEbDIxUC1NVmNJWlZiem5Ralg1XzhybnJMbjB4bFNpZ2dNV1JiaWFYckYyek5zd21aTXZVNHFtUQ?oc=5"}]}, "2026-08-19": {"date_str": "2026年08月19日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.5, "title": "FDA 就生成式 AI 醫療器材監管方向公開徵求各界意見", "summary": "美國食品藥物管理局（FDA）於 2026 年 8 月 18 日發布討論文件，正式就生成式 AI（GenAI）醫療器材之監管框架向公眾徵集意見。文件聚焦於四大核心議題：風險評估方法、上市前評估標準、上市後監測機制，以及其他監管考量。此舉標誌著 FDA 正式將生成式 AI 醫療器材納入獨立監管體系的規劃進程，與既有的傳統 AI 醫療器材審查路徑有所區隔。目前全球醫療體系正大量導入 GenAI 工具於臨床診斷、病歷摘要及決策支援等場景，而相應的監管準則仍屬空白。本次公開徵詢結果將直接影響未來 GenAI 醫材的核准流程與上市門檻，對醫療器材開發商、醫院採購決策與臨床實施風險管控均具有重大政策意涵，各醫療機構宜密切關注後續正式規則之走向。", "tags": ["FDA監管", "生成式AI", "醫療器材", "法規政策"], "author": "未標示（FDA Press Releases｜2026-08-18）", "source_url": "http://www.fda.gov/news-events/press-announcements/fda-seeks-public-feedback-inform-regulatory-approach-generative-ai-enabled-medical-devices"}, {"rank": 2, "score": 9.0, "title": "Sheba 醫學中心成為 OpenAI 首個國際醫院合作夥伴：AI 整合醫院的實踐路徑", "summary": "以色列 Sheba 醫學中心宣布成為 OpenAI 全球首個國際醫院合作夥伴，雙方將共同探索大型語言模型（LLM）在臨床工作流程中的深度整合應用。Sheba 長期被視為全球數位醫療轉型的標竿機構，此次合作涵蓋臨床文件生成、患者溝通輔助、醫療決策支援等多個場景。OpenAI 選擇 Sheba 作為首家國際醫院夥伴，顯示 AI 大廠已從技術輸出轉向與頂級醫療機構建立深度共創關係。此案例對全球醫院領導層具有高度參考價值，尤其在醫院如何與 AI 平台廠商洽談合作架構、確立數據安全邊界、推動臨床場景驗證等方面，提供具體的實踐模型。對於正在評估或推進 AI 導入的醫療體系而言，此案例值得深入研究。", "tags": ["OpenAI", "醫院合作", "臨床AI整合", "數位轉型"], "author": "未標示（drugdiscoverytrends.com｜2026-08-19）", "source_url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxOaEJIMnY3dllNd01BM195TS1JRnFBNFNkVkVqS0kwY2p0Nm5tV043dmxsVTJ0dTR6Q1o1RHdRdENVa0kzSU9ZRW1iLThKMXptNmtTUTZzMXlPWkktMjZOT2w4Tk4tWWZDTlNJWGpqd1N3SGlZc2VsWTdzTzNDZEVtSWxBTmRCSjVDajNpcmlZWTIza2lOcjUyM2JHTWUwMUFCYjlWY0JhUlBIWmc5cS1OeHdwTQ?oc=5"}, {"rank": 3, "score": 8.5, "title": "工作流程問責制：定義醫療 AI 下一發展階段的關鍵要素", "summary": "Healthcare IT News 最新分析指出，醫療 AI 的發展正從「技術可行性」轉向「工作流程問責制」的新階段。文章探討隨著 AI 工具在醫院臨床環境中大規模部署，如何建立清晰的責任歸屬機制成為最迫切的治理挑戰。現有 AI 系統在診斷建議、用藥輔助或行政自動化出現錯誤時，責任鏈往往不清晰，涉及醫師、技術廠商與醫院管理層三方。文章呼籲醫療機構在引入 AI 工具前，應制定完善的工作流程問責框架，明確 AI 建議的採納流程、錯誤回報機制及人工覆核標準。此議題對正在規劃或已部署 AI 系統的醫院資訊部與臨床管理層具有直接的政策制訂參考價值，預期將成為醫療 AI 治理討論的核心焦點。", "tags": ["AI治理", "工作流程問責", "臨床AI", "醫院管理"], "author": "未標示（Healthcare IT News｜2026-08-19）", "source_url": "https://news. const TODAY_ISO  = "2026-08-24";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {

    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;

  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;

  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;

  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {

    }

  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
