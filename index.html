<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年10月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

official-believes-genai-enabled-tools-will-need-to-be-assessed-like-a-physician/"}, {"rank": 2, "score": 8.8, "title": "OpenAI 專家預言：AI 有望將醫療指引更新週期從 17 年壓縮至數小時", "summary": "OpenAI 相關專家公開預言，目前醫療臨床指引從新證據產出到正式更新平均需耗時 17 年，是造成「知識落差」的重大問題。藉由 AI 自動化文獻回顧、證據分級與指引草稿生成，這一週期有望大幅壓縮至數小時。這不僅對臨床決策支援系統（CDSS）的即時性具有革命性意涵，也對醫學教育、繼續教育及醫院品質管理流程帶來衝擊。若 AI 能實現指引的近即時更新，各科主任及品管委員會的知識維護責任與流程將面臨重塑。目前此技術仍處於概念與早期驗證階段，量產部署尚需克服資料品質、語言本地化及法規審查等挑戰，但其所描繪的未來圖景已引發醫療界廣泛討論。", "tags": ["臨床指引", "AI文獻回顧", "知識更新", "OpenAI"], "author": "未標示（商傳媒 SUN MEDIA｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiwwJBVV95cUxOc2pRQ1FIUWxCWVNQRzhzWlQzNVY2emIyYkdTYl9BUjlpR3Vod2dRdDhjdVVaQzZJYzdTdHNsSXhvMEk3V3k3VXdNYlVwR1haOFRiUk12TE1LOGMzSEI1TDBTeXdNV3BNMEdHNFhRN0dwVHowMVNZMkY4ZUxtTkdjSWpuTmJZQTI3YlZQbXVkVmVycHdqNWRkT1ZQTmUzSWNQVHh4UXpzTXVROWRoR1AtUS1FeXdpSFJFTndONWh4dmlZcC12dnlCZ25LQUQyWGR0dURwNTRsbkxsZmdZeEpYbEVoXzYyS2ktR2VzaGdlcUdtTHFCZUV3VHVGNE53ZXlMZGh5OEJUNFVtUS0walZVM1Z3TlRMc3dZN2YxS2FHbzJOWUhEQnJ1bktRclp2OUVnbHFpTWxyMFlxME1YbGdwTTY5TQ?oc=5"}, {"rank": 3, "score": 8.5, "title": "Doximity 將 UpToDate 整合進 AI 臨床支援工具，醫師查詢品質大幅提升", "summary": "Doximity 宣布將全球最廣泛使用的臨床決策資源 UpToDate 整合至其 AI 臨床支援工具中，使醫師在同一介面即可獲得 AI 生成回應並佐以 UpToDate 的循證醫學內容。此整合旨在解決純 AI 語言模型在臨床場景中可能產生的幻覺或證據品質不足問題，透過權威醫學資料庫的背書提升回應可信度。對醫院資訊部門而言，此模式代表「AI + 結構化知識庫」的混合架構正逐漸成為臨床輔助工具的新標準，既可提升使用者信任，也有助於符合醫療法規要求。Doximity 平台在美國擁有龐大醫師用戶群，此整合若推廣至台灣或亞太市場，將對本地電子病歷及臨床決策支援系統的整合策略提供重要參考。", "tags": ["臨床決策支援", "Doximity", "UpToDate", "AI整合"], "author": "未標示（MobiHealthNews｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxNZ1NSdi1ka2trb2gxeWVRMUJLZ3JUN3pzQlNhSmdZam1kRE1sT0tMWmkwY29yOEo0QVdzSS1XaHdfVTZVX0ozM0tDUmpvbUVhVURpNk5WOHV1b0NoeWVzVXNOczlNSWxIU2ZZaGp6M3J6bExQZVg5R2NnNDlCMmxqZ0ZLbWdXLXdqdFFMVFNDYmViVWM?oc=5"}, {"rank": 4, "score": 8.2, "title": "AI 分析照片預測癌症存活率：最新「看相」技術震撼醫界", "summary": "最新研究顯示，AI 技術已能透過分析患者照片（包括臉部影像特徵）預測癌症存活率，此一「視覺生物標記」方法在部分癌症類型中展現出與傳統臨床指標相當甚至更優的預測能力。研究人員認為，患者外觀特徵反映了年齡、營養狀態、免疫功能等多重生理資訊，AI 能從中擷取人類醫師難以量化的細微訊號。此技 的流量、病床需求及人力配置，協助醫院在資源有限的情況下更精準地調度急重症照護能量。該系統能整合歷史病患資料、季節性疾病趨勢及即時入院資訊，提前數小時至數天預警高峰時段，使行政管理團隊得以提前因應。此類 AI 預測工具的應用範疇已超越純臨床診斷，進入醫院營運管理層面，對降低超載風險、提升病患安全及優化人員排班具有實質效益。隨著類似系統在各大醫學中心逐步落地，醫院資訊部門與營運管理團隊的跨部門協作模式也將隨之調整。", "tags": ["醫院營運AI", "急重症管理", "預測模型", "兒科"], "author": "未標示（wandtv.com｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMiqwFBVV95cUxNYUFrWERnWGFsNkRBNjZJVVlhRTlTcGFTQ1JYYWF1S0xSbVdROTVvSkF1TGszYVpjamxPTk1FWWxSSW5qWVkxMWd1YjlmbDhMdHBhWTZEaEhVSzJnMndkdDEteGR1UVNOVkdsTHdnY09EV1I5cDZBQTlpSGhLa0hLcnVOcFlYX0M2U2JkNjNwMnFoSlVENDMyd3FpVTJRUXZOdlAtczlGZy1aN2M?oc=5"}, {"rank": 8, "score": 7.0, "title": "FDA 最終指引確立處方藥應用程式與軟體監管框架，醫療 AI App 合規路徑明朗化", "summary": "美國 FDA 正式發布處方藥應用程式（App）與配套軟體的最終指引，為藥廠如何開發、配發及標示與處方藥搭配使用的數位工具建立清晰法規框架。此指引明確區分「功能性數位療法」與「行銷輔助工具」的監管差異，並對軟體安全性、資料隱私、臨床驗證及標示資訊提出具體要求。對醫療機構而言，此指引不僅影響院內自行開發或採購的藥物管理 App，也對未來整合處方藥數位伴隨工具的智慧醫療服務設計具有規範意義。此外，該框架亦可作為台灣衛福部食藥署研擬本土數位療法監管規範時的重要參考依據。", "tags": ["FDA法規", "數位療法", "處方藥App", "醫療軟體"], "author": "未標示（FDA Press Releases｜2026-10-20）", "source_url": "http://www.fda.gov/news-events/press-announcements/fda-issues-final-guidance-prescription-drug-apps-and-software"}, {"rank": 9, "score": 6.8, "title": "Sophont 推出 Holon-S1：從常規病理切片直接解讀腫瘤生物特性", "summary": "新創公司 Sophont 正式發布 Holon-S1 AI 平台，宣稱可直接從醫院常規製作的 H&E 病理切片中解析腫瘤微環境、免疫細胞浸潤程度及分子表型等深層生物資訊，無需額外進行昂貴的分子檢測或免疫組化染色。這對資源有限的醫院或缺乏先進分子病理設備的機構而言，具有降低腫瘤診斷成本、縮短檢測周期的潛在優勢。Holon-S1 的推出代表 AI 計算病理學（computational pathology）正從單純的形態辨識，進化至能提供治療指導意涵的「虛擬分子病理」階段。病理科及腫瘤科主任可關注此類工具在提升診斷深度、輔助用藥選擇及臨床試驗患者分層方面的應用潛力。", "tags": ["計算病理學", "腫瘤AI", "數位病理", "生物標記"], "author": "未標示（PR Newswire｜2026-10-21）", "source_url": "https://news.google.com/rss/articles/CBMi0AFBVV95cUxOQ3RUNUZpVWxMZEtWWWszWHBWaDVHZnYyZzZkMjVGTTNLdDc4Ty14dHNRNGZZdmp1by1FQ0JWeVUtUTRxV2ZHaTJGQkNnekkxRGViNjdyU0JLb2tOWHNGZFdCMmhTZFJlVlVRWllDSV9tVVJCQjRFYTlHSDNGbWhnRVl0NWRlWjdrZlhSTGdNZ2tBMVlEUmk4enhXa29KLUROU1NMSGxoYm81XzlKbk9YUzFnbEpDb05xNTd1am1MNkNzUl9OVDdwLV9LMWNTVTRm?oc=5"}]}, "2026-10-20": {"date_str": "2026年10月20日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "Stanford HAI：如何真正衡量醫療 AI 的實際能力", "summary": "Stanford HAI 發布最新評析，探討醫療 AI 系統在真實臨床環境中的效能衡量方式。文章指出，目前業界多數 AI 評測仍停留於標準化資料集上的準確率指標，未能反映 AI 在實際醫院工作流程、跨族群患者、多元資料品質等場景下的真實表現。Stanford HAI 研究人員呼籲建立更完善的評估框架，涵蓋臨床意義、公平性、可解釋性及患者預後等面向，並強調「能在排行榜上表現優異的模型，未必能在臨床現場帶來實質效益」。此一觀點對醫院領導層選購或評估 AI 工具具有重要參考價值，提醒決策者在採購時應要求廠商提供貼近真實臨床場景的驗證數據，而非僅依賴論文或競賽結果。", "tags": ["AI評估框架", "臨床驗證", "Stanford HAI", "醫療AI採購"], "author": "未標示（GNews-Medical AI｜2026-10-20）", "source_url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE9QQ3ZxUjkybVI0Wko2S0R6WVJQM0FEUmhYb0dpNlY4dm4tRW0zLTdVeDMwMWRIRGg1TU1sdTlGV01aYzE3SFJ3U2M3ZE9EZ2ZqNGttdjN4MUFDOE9zZVNnWmk5cnRZVjVpSElGNmhiWXo3cndCV3NPbTY3NA?oc=5"}, {"rank": 2, "score": 8.5, "title": "台灣 27 家醫學中心年底完成病歷互通，明年 3 月前推雙重同意機制加速 AI 醫療", "summary": "據聯合新聞網報導，台灣 27 家醫學中心預計於 2026 年底前完成病歷互通建置，並將於 2027 年 3 月前推行「雙重同意機制」，讓患者能在知情同意下授權病歷用於 AI 醫療研究與應用。此政策代表台灣在醫療數據治理與 AI 加速應用上邁出關鍵一步，透過跨院病歷整合，有助於訓練更具代表性的本土 AI 模型，同時建立患者資料使用的倫理防護。對醫院體系而言，病歷互通基礎設施的完備，將直接影響 AI 輔助診斷、臨床決策支援系統及健保數據應用的發展速度，並在資安與隱私合規上帶來新的管理課題，值得資訊部門與臨床領導層密切關注。", "tags": ["病歷互通", "醫療數據治理", "雙重同意", "台灣醫療AI政策"], "author": "未標示（GNews-台灣醫療AI｜2026-10-19）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE1TOHkyTFhwOWJpYUxkbEhjbF8ydlJ6TGxKVzRfLVZvck84YXFuRFZuUkljSHBpU0VYTHpHdm1hcng4VHNCRW5IcDhDSFlHX3F40gFWQVVfeXFMT1Bwdl9aRm13N3FmVzhTeElnWVJDclVHdnV1bFZIbnczTTZ6Tm0zeEQ4b05XN3c5MXlVblFFNDMtbW1OOFZidkdiYV9aZjVLT29hSkFaR3c?oc=5"}, {"rank": 3, "score": 8.0, "title": "AI 給錯醫療建議卻無跡可尋：研究呼籲建立追蹤與通報機制", "summary": "TechNews 科技新報報導，最新研究指出，當前 AI 系統提供錯誤醫療建議時，往往缺乏有效的錯誤追蹤與通報機制，導致潛在傷害難以被系統性記錄與改善。研究人員呼籲，醫療院所在部署 AI 工具時，應建立類似藥物不良反應通報的監測制度，要求廠商提供錯誤日誌與審計追蹤功能，並設置院內 AI 安全通報管道。此議題與各國監管機構對 AI 醫療器材上市後監測的要求方向高度一致，對醫院資訊部門、醫療品質管理單位及院長室在制訂 AI 治理政策時具有直接的參考意義，亦呼應近期國際間對醫療 AI 問責機制的高度關注。", "tags": ["AI安全通報", "醫療AI治理", "錯誤追蹤", "AI問責"], "author": "未標示（GNews-台灣醫療AI｜2026-10-20）", "source_url": "https://news.google.com/rss/articles/CBMifEFVX3lxTE50Y0gycGJsSHc2VTVPeUcxVkttaG1xWXN6QkpHTUhzTGVsUW5xS0VoVlh 均存在重大監管漏洞", "summary": "DOTmed 報導指出，醫療機構在部署 AI 系統時普遍面臨「雙重治理缺口」：一是輸入 AI 的原始數據在品質管控、隱私合規與偏誤審查方面不足；二是 AI 系統產出結果後缺乏有效的監督與稽核機制。文章援引多項調查數據，顯示大多數醫院尚未建立完整的 AI 治理框架，即便已部署商業 AI 工具，也難以追蹤模型在真實臨床環境中的表現漂移（model drift）問題。報告強調，數據治理與 AI 輸出監控應被視為同等重要的兩個環節，缺一不可。此議題對醫院資訊部門、法規遵循團隊及臨床 AI 採購決策者具有高度參考價值，呼應近期各國監管機構對醫療 AI 上市後監控要求的趨勢。", "tags": ["醫療AI治理", "數據合規", "AI監管", "患者安全"], "author": "未標示（DOTmed｜2026-10-16）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE4tVWJtRUZCUjBhM3hUbmdmTkNFZV9RamZTeFdWbU8tRDFNZ0x3bkd3WEJVdVNjWGx5SWlud281SkkwTVducms3MTlkc1Z5b1Jq?oc=5"}, {"rank": 6, "score": 7.5, "title": "自監督式 AI 以 Mamba 架構解讀心律，達到醫院級準確度", "summary": "Bioengineer.org 報導一項以自監督學習（Self-Supervised Learning）結合新型序列模型 Mamba 架構開發的心律判讀 AI，在大規模醫院心電圖數據集上達到與臨床醫師相當的判讀準確度。有別於傳統深度學習模型需要大量人工標注數據，此研究採用自監督預訓練方式，讓模型從海量未標注 ECG 波形中自行學習心律特徵，大幅降低訓練資料門檻。Mamba 架構在處理長序列時序數據方面優於 Transformer，有助於捕捉心律不整的細微時序模式。此研究成果對心臟科及急診醫學具有直接臨床意義，也為資源有限的醫療機構提供了高效能 AI 輔助心電圖判讀的可行技術路徑。", "tags": ["心電圖AI", "自監督學習", "心律不整", "臨床AI"], "author": "未標示（Bioengineer.org｜2026-10-16）", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxPVHhlSUpXb0lNc3hfOHNvbjdaRHJYaGJUTmxRd1N4SVNyZnVlamtCWXdUSzBTdmVyclJ0ZFlrZjYwcXBQbHJ4MDdFcUZYZE81aUl4d190Qm1LM1pFVG9kS3NIdUpTc3FKWWVMbjB0M1JaWlplaGdKY2RsdkxNQ0dHNmdIcFJlc0dza3NEOU5vM1k1S1lhVnE1N2RaX25YLVNuTlZrUVJ5RQ?oc=5"}, {"rank": 7, "score": 7.0, "title": "Sirona Medical 完成 4,000 萬美元 D 輪融資，擴展雲端原生放射科 AI 平臺", "summary": "Sirona Medical 宣布完成 4,000 萬美元 D 輪融資，資金將用於擴大其雲端原生放射科平臺 Cortex AI 的規模化部署。Sirona 的平臺整合了放射科工作流程管理、AI 輔助影像判讀及報告生成功能，主打以單一雲端架構取代傳統放射科多套分散系統，降低 IT 維運複雜度並提升影像判讀效率。此輪融資反映出投資人對雲端放射科整合解決方案的持續看好，也顯示放射科 AI 市場正從單點工具走向平臺化整合的趨勢。對正在評估放射科資訊系統升級或雲端遷移的醫院資訊部門而言，Sirona 的商業模式與本輪融資規模均值得關注，可作為市場競局分析的重要參考。", "tags": ["放射科AI", "雲端醫療平台", "AI融資", "影像工作流程"], "author": "未標示（citybiz｜2026-10-16）", "source_url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPM1BHbXZLcEd3cUVXTlZhQU9lWnpkeWpoalJVUmVYT2RiSzE2bjM1bGJqbzR5SFh1UEdWR0pjNHE2NFlZcktsbERrOXhadWJab1FKcEhMWm1yTW5PaXJWXzU0cXRYU2c0X1AtM2VyRmNVN // ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
