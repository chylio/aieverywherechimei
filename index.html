<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年09月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

決策支援及醫院營運優化等多個層面。在商業模式方面，AI帶動新型態服務提供者崛起，傳統醫療機構與科技業者的界線日趨模糊。文章亦點出當前挑戰，包括監管框架尚未跟上技術發展速度、醫療AI的責任歸屬不明，以及訓練資料的代表性與公平性問題。對於醫院領導層而言，如何在擁抱AI效益的同時，建立完善的風險管控機制，將是決定數位轉型成敗的關鍵因素。", "tags": ["數位轉型", "醫療AI產業", "臨床決策支援", "台灣醫療"], "author": "未標示（蕃新聞｜2026-09-20）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE5KNWg1VXl1TlUyLVRld1FELTA4NU5taXI3VFJPb244MFZ4RFdTY0VsdGpYcFlORlc2WlFjQ0lIdlNtZmNGTzNjeTQtd2htQlltT3c?oc=5"}, {"rank": 4, "score": 7.0, "title": "高雄市立聯合醫院聯合學術研討會聚焦AI智慧醫療，打造品質、安全、永續新典範", "summary": "2026年高雄市立聯合醫院醫事聯合學術研討會以「AI智慧醫療」為核心主題，匯集醫師、護理師、藥師、醫技等各醫事專業人員共同參與。研討會聚焦如何將AI工具應用於臨床品質提升、病人安全強化及醫院永續營運三大面向，並分享院內各科導入AI輔助系統的實際經驗與成效。與會者討論AI在臨床路徑優化、異常事件早期預警及跨科溝通協作方面的潛力，同時也正視AI落地過程中的挑戰，包括系統整合、人員培訓及倫理規範。此次研討會的規模與議題廣度，反映台灣公立醫院體系對AI智慧醫療的高度重視，並將其列為提升醫療品質與機構競爭力的重要策略方向。", "tags": ["智慧醫療", "醫院管理", "台灣醫療", "臨床品質"], "author": "未標示（蕃新聞｜2026-09-19）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE1VdHE4cFBMZ3htSDJ4MVp2Y2RRNFpEaWIyZ3BPbzBKY2pzZnNSMjVJSUFuRUhKb1R2SkJSeVozYnJUUlp3aXA5ZmxidnZWYXRhYlE?oc=5"}, {"rank": 5, "score": 6.5, "title": "阿里達摩院通用醫療AI登《Science》：腹部CT辨146種病勝多數醫師（台灣媒體後續報導）", "summary": "台灣財經媒體BigGo針對阿里巴巴達摩院醫療AI研究成果進行深度解析報導。該AI模型已刊登於《Science》期刊，能透過腹部CT影像辨識多達146種疾病，整體表現超越多數臨床醫師。此一進展被視為通用型醫療AI的重要里程碑，有別於過去僅針對單一疾病的專用模型，此系統具備跨疾病類別的廣泛辨識能力。報導分析此成果對台灣醫療AI發展的啟示，包括大型訓練資料集的重要性、模型泛化能力的突破方向，以及未來在實際臨床環境中部署通用型AI所面臨的監管與倫理挑戰。此則新聞與去重清單中2026-09-19「Alibaba開源可偵測癌症及近150種疾病的醫療AI模型」為同一事件之不同面向報導，但提供了本土媒體觀點與產業分析視角，具補充參考價值。", "tags": ["通用醫療AI", "放射影像", "阿里巴巴", "科學期刊"], "author": "未標示（BigGo財經｜2026-09-19）", "source_url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFAzaE4tMElvb0k2VmhKYmxOV3lxeXMxblNVYlZGNzE1bkdFSjZEVVgzVlZpLUgtVFlVa21WcFB2dU01S0hKemhKZEU0Rjlfa2VOVVNVM2tUaElmRXdZWWFOT1pWOEdnczU3Z3N1c3VMc3lIcEc3UmNlaTVn?oc=5"}]}, "2026-09-19": {"date_str": "2026年09月19日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.2, "title": "Alibaba 開源可偵測癌症及近150種疾病的醫療 AI 模型", "summary": "阿里巴巴（Alibaba）宣布開源一款醫療 AI 模型，該模型能夠偵測癌症及近150種疾病，涵蓋範圍廣泛。此舉對全球醫療 AI 生態系統影響深遠：開源策略意味著醫療機構、研究單位與新創公司均可自由取用、調整與部署該模型，大幅降低技術門檻。就臨床意義而言，支援如此多元疾病類型的單一 AI 基礎模型，有助於推動多病症整合篩檢與輔助診斷。就產業競爭態勢而言，此舉與 Google、Microsoft 等西方科技巨頭在醫療 AI 基礎模型領域的佈局形成直接競爭，並可能加速亞洲市場採用速度。對於正在評估醫療 AI 基礎建設選型的醫療體系而言，此模型的開源性質提供了一個值得納入評估的新選項，但仍需審慎評估其訓練資料來源、法規合規性與臨床驗證狀況。", "tags": ["開源AI模型", "癌症偵測", "阿里巴巴", "多疾病診斷"], "author": "未標示（South China Morning Post｜2026-09-18）", "source_url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxONnFwRTMwNjhXMXJDNjRRckxPZE1mNFNrUzI2ZkdkcWk5WTlfLU9CWmpROGg0eDlvTkdaZGFYTWFOSzYzSDdXNGpXRExQVVQ3RVZMVGtuZlgxUVFBdUFpYjJZd2NwTl90Sy1BRkZFNkxMSkRmcVNJWHU0a1pQLXB0dWVBRFFrVXZONkFJX0RFSGZpdk5YTm5XQnNJbFhraHE0ZHVfZXo0X1JkQW1OYWt3dEVXY3dzUmpoUTZXQVR1S1dlMUpSRHJFZG1jX0jSAcwBQVVfeXFMTUhSMTJoTmplU2xXM3ZKeGFCMFJTRXVxbUFraUdqZkh0aWJhVlFTVnc0bmxhR3l0SklzeGhHbUZJWk81T3dNN0d0c1JLMDVKWnZ5U1lCeGxhNzhRTG9nWjA5MTlUSS1laFhsaVpvVmV0eEpRQ2xpZE9wZTFMcG81V2tpdy1GelExQXVaNm9rY3lTQ3lHOEtUMlVfWWdtU3JpMndLOHkweU9EYUhoMmF1NUxRNWIwenpjY1VOTlNQQ0RYUE5faEhnMEt6dzJS?oc=5"}, {"rank": 2, "score": 8.8, "title": "自主心血管監測 AI 平台問世：持續監測與自律臨床決策支援", "summary": "EurekAlert! 報導一款針對心血管疾病設計的主動式（Agentic）AI 平台，具備持續心血管監測與自律臨床決策支援功能。該平台可在無需人工逐步指令的情況下，主動分析患者生理數據、識別風險訊號並提供處置建議，代表 AI 在心臟照護領域從被動工具轉型為主動協作角色的重要里程碑。對心臟內科、加護病房及遠距醫療而言，此類平台若能整合至現有監測設備，有望顯著提升早期預警能力與院內急救反應效率。此外，「自律決策」特性也引發關於 AI 醫療責任歸屬與臨床監管框架的討論，適合醫院資訊部與臨床科主任共同評估導入的時機與條件。", "tags": ["主動式AI", "心血管監測", "臨床決策支援", "自律AI"], "author": "未標示（EurekAlert!｜2026-09-19）", "source_url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTFBPZWozTHB0bjFlM1RtVG9GajdXdlF6WVljSmxSQkVDUHhfVjhDbHgzakxWTzBPN3pjNTgyaFNHYnN3RGFhOHZ1Smc5UjQtSW5OZXc5aUp4MlhOS3E3?oc=5"}, {"rank": 3, "score": 8.5, "title": "醫療 AI 的「驗證困境」：效果難以量化成為推廣最大阻力", "summary": "《金融時報》（Financial Times）深度分析指出，醫療 AI 當前面臨的核心障礙並非技術能力不足，而是缺乏嚴謹、可信的臨床實證。多數醫療 AI 產品仰賴內部測試或有限的回顧性研究，難以說服臨床醫師、醫院採購委員會與監管機關。文章進一步指出，AI 廠商通常以準確率、AUC 等技術指標行銷，但這些數據未必能反映真實臨床環境的表現與病患預後改善。此「驗證困境」同時影響醫療機構的採購決策與保險給付政策的制定。對於正在評估或已導入醫療 AI 的醫院而言，建立系統性的院內驗證流程與真實世界績效追蹤機制，已成為確保 AI 投資效益的關鍵課題。", "tags": ["醫療AI驗證", "臨床實證", "AI採購", "監管挑戰"], "author": "未標示（Financial Times｜2026-09-18）", "source_url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxOZHh1OXRja21yY1BGU0pacGhEQTEtOV9yOWFJbGpkbHpzZlhrNlN3MTNBeVR3SG5EdEktVzVJVEw3WUx6WDF4SGJjZTJxV21XRzF1RUVjUE9ERUQ0QjRmOWhTdXZLMFRLSGFCeDVGTVFOQ3dYdkNFRW4zWGlyekRQSEdrd2M?oc=5"}, {"rank": 4, "score": 8.2, "title": "台灣醫院自建主動式 AI 系統：從採購走向自主研發新模式", "summary": "MobiHealthNews 報導，台灣一家醫院自行研發主動式 AI（Agentic AI）系統，不依賴外部商業產品，走出一條醫院自主開發的技術路徑。此舉在亞洲醫療 AI 領域具有標竿意義：自建模式可讓醫院依據本地病患族群、電子病歷格式與臨床流程進行深度客製化，同時掌握資料主權與模型更新主導權。相較於採購現成商業 AI，自建路徑雖需投入更多資源，卻能避免廠商鎖定（vendor lock-in）與資料外流風險。這對台灣醫療體系尤具參考價值，反映出部分領導型醫院正從 AI 應用者轉型為 AI 共同開發者的趨勢，也對醫院資訊部門的人才培育與技術能量提出新要求。", "tags": ["台灣醫院", "主動式AI", "自主研發", "資料主權"], "author": "未標示（MobiHealthNews｜2026-09-18）", "source_url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxQQmdoSzNwUWlhN3RQelFsUHZPWXdQVG80R00tVXBWUEJyQUtzemtrRDV4bGlvVHBKU1p2ZjBDOWpuT09UY3M2SFhvOHFOcDVGMHVxUG5qdWFmcmJaWWUwcFlYT3R2eUVfXzRJY3R6dDdfSHpTYnM0S1g1Slp4RkIybFhzdzdSOW1ON1E?oc=5"}, {"rank": 5, "score": 8.0, "title": "醫療 AI 的真正瓶頸不在智慧，而在整合", "summary": "CIO.com 一篇深度分析文章指出，目前阻礙醫療 AI 廣泛落地的最大挑戰並非演算法能力，而是系統整合問題。多數醫院的電子病歷（EHR）、影像系統、實驗室資訊系統各自為政，AI 工具難以在異質環境中順暢運作與取得完整資料。文章強調，AI 廠商往往在理想化的資料環境中測試產品，但真實醫院的資料品質、格式標準與存取權限落差，使得整合成本遠超預期。對醫院 IT 部門而言，這意味著導入 AI 前必須先投資於資料治理與互通性基礎建設，否則再優秀的 AI 工具也難以發揮效益。此觀點對正在規劃醫療 AI 整體架構的數位轉型團隊具有重要參考價值。", "tags": ["醫療AI整合", "電子病歷", "資料治理", "數位轉型"], "author": "未標示（CIO.com｜2026-09-18）", "source_url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxPVWpocUVocFM1NXlqNzlzM29GU0pRdTNfbVY0ZHVpWW8ydnh0MW5EVlB2TkxwaDYwTXdhaG1kLTYwM3RXWGNIUVpXUTdxTGVQeXhpc0V6aU9GQmk2V19YSDJ5SS0zWGlkSENPbTJlS3JQT0tIc0dCcVkzUzVlaUtuWktNR3ctVjNTaDd4SjM0c1N1TURXcjBZdkR1em84NFR5U0thc2ZYcGk?oc=5"}, {"rank": 6, "score": 7.8, "title": "放射 AI 監管風險已然到來：法律分析揭示當前合規挑戰", "summary": "Reed Smith 律師事務所發表分析文章，深入探討放射科 AI 當前面臨的監管風險。文章指出，隨著 FDA 對 AI 醫療器材審查標準持續收緊，醫療機構若使用未妥善取得上市許可的放射 AI 工具，可能面臨合規風險與法律責任。此外，AI 演算法持續學習（Continuous Learning）的特性，使得初次核准後的後市場監管成為灰色地帶。文章亦提及醫療機構在採購合約中應明確釐清 AI 工具的監管狀態與廠商責任歸屬。對於已導入或規劃採用 AI 放射診斷工具的醫院，法務與資訊部門應共同建立 AI 醫材 用於解決醫院內部物流的碎片化問題。當前許多醫院的藥品配送、醫材補給、廢棄物處理及檢體運送等後勤作業，仍高度依賴人力且流程分散，造成效率低落與錯誤風險。Physical AI 系統透過自律導航機器人結合智慧排程演算法，能夠整合這些分散流程，實現全天候、高精確度的院內物流自動化。報導指出，部分美國醫院已啟動試點，並在藥品配送時效與人力成本控制上取得初步成效。隨著醫院人力成本持續攀升，此類技術對醫院營運管理層具有直接的投資效益評估參考價值。", "tags": ["Physical AI", "醫院物流", "自動化機器人", "醫院營運"], "author": "未標示（Healthcare IT News｜2026-09-19）", "source_url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQZFAzVGRiM3NrZmJHb3VDS3VVN0xDdTZnM21NQjJqeHpSTWcxdkdNQkFFWWFEM2Uybk95MjVmLS1iRDlQRG0zdTFFaDh5VWtpZk9oblJpUDJjSWQ3dlhmZ0RtanBxeFlldkI2YzlxQmF4T2txWWRkZGIwSm93Qlk0bXkyMTR1Znh1U19Kd1ZZY0M2MjR6?oc=5"}]}, "2026-09-18": {"date_str": "2026年09月18日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "AI 多智能體系統發現肺癌候選新藥：「虛擬生技公司」模式問世", "summary": "Nature 報導一項突破性研究：科學家建立一套由最多 37,000 個 AI 代理人組成的「虛擬生技公司」，設有扮演「首席科學家」角色的頂層模型統籌協調，透過多層次自動化分工完成藥物發現全流程，最終識別出一款具潛力的肺癌候選化合物。此研究展示大規模多智能體（multi-agent）協作在生醫研究中的可行性，突破了傳統單一模型或小型代理人系統的限制。研究團隊認為，此架構可大幅壓縮藥物發現所需時間與人力成本，並具備延伸至其他癌症與複雜疾病的潛力。對於有意布局 AI 輔助藥物研發或與學研單位合作的醫療體系而言，此模式提供了具體的技術參照，顯示 AI 代理人協作已從概念驗證邁向實際藥物研發應用階段。", "tags": ["多智能體AI", "藥物研發", "肺癌", "生醫AI"], "author": "未標示（Nature｜2026-09-17）", "source_url": "https://www.nature.com/articles/d41586-026-02954-y"}, {"rank": 2, "score": 8.5, "title": "AI 問世幾歲了？Nature 介紹新型 LLM 平台助力生物年齡研究", "summary": "Nature 報導一項新系統，專為協助科學家精煉大型語言模型（LLM）以應用於長壽與生物老化研究而設計，目標是更準確地估算個體「生物年齡」而非僅依賴曆法年齡。該系統提供標準化的評估框架，可比較不同 LLM 在老化相關生醫問題上的推理能力，有助於篩選最適合臨床或研究情境的模型。生物年齡評估涉及多組學數據整合與複雜推論，是目前 AI 在精準醫療中的重要應用場景。此平台的出現標誌著醫療 AI 基礎設施逐漸走向專科化，不再僅仰賴通用模型。對老年醫學、預防醫學及數位健康研究團隊具有直接參考價值，亦可做為評估院內 AI 工具適用性的方法論參考。", "tags": ["生物年齡", "大型語言模型", "精準醫療", "老化研究"], "author": "未標示（Nature｜2026-09-17）", "source_url": "https://www.nature.com/articles/d41586-026-02913-7"}, {"rank": 3, "score": 8.0, "title": "FDA 維持放射 AI 須通過 510(k) 審查立場，強化上市管制框架", "summary": "PYMNTS 報導，FDA 拒絕 Harrison.ai 提出豁免部分放射 AI 產品 510(k) 上市前審查的請求，重申所有具診斷決策影響力的放射 AI 工具均須完成正式審查流程。此決定意味著放射 AI 開發商短期內難以繞過監管程序快速推進商業化，同時也確立了 FDA 在 AI 醫療器材管理上的嚴格立場。對於正在評估或已引進放射 AI 的醫療機構而言，此舉強調採購時務必確認廠商已取得合規認證，避免法律與臨床風險。此案亦與前日 7）", "source_url": "https://news.google.com/rss/articles/CBMipAJBVV95cUxPVEFSOEZxN3FDZk84aldTV3piemZndFFZaHBodU5DQlc3TmpGcWRkVzl6cnhPZHRFUmZ2TS1ERUVsV1hkNklsWXI5ZUdlMkRsblotajVCRGNyOUlYVkFtM2hnZTNBNm4tRDM3VEFmZUItWGJuc3FYc2V0b2hYYWZuamYzV2EtUXNHYXBQOGluWExTSDByWEdncS1lRlZabkVHSE1oSW9NdjJnSzg5UzhIQ1cxaTVPb1B3WVJ6MzRCWURoOVBCQ1cyQi1UYnk1ZnAyaGRDQnRmNzFNdndUbFVEX2dNSzNVaWtQUW1kSlRaMlRNUVp6TUJFdFlvdzdJZXhoZ3M5X3NERlFDVnF1ZXNEQkxOVjYtaVhzbkVQSFp1VkxYaTFx"}, {"rank": 2, "score": 8.5, "title": "Cognita 獲 FDA 129 萬美元合約，開發生成式 AI 放射科評估新方法", "summary": "Cognita Imaging 獲得 FDA 授予的 129 萬美元合約，任務為建立一套評估放射科生成式 AI（Generative AI）的全新測試方法學。此合約凸顯 FDA 正積極投入資源，以確立針對生成式 AI 醫療應用的評估標準，而非僅被動等待廠商申請。放射科生成式 AI 的應用範疇包含影像重建、報告生成與異常偵測等，其評估難度遠高於傳統判讀輔助 AI，亟需專屬的測試框架。對醫院採購決策者而言，此合約代表未來將有更具公信力的第三方評估標準問世，有助於判斷生成式 AI 產品的真實臨床效能。醫院在導入此類新興工具前，可持續關注 FDA 後續公布的評估框架與指引。", "tags": ["FDA法規", "生成式AI", "放射科AI", "醫療器材評估"], "author": "未標示（Business Wire｜2026-09-16）", "source_url": "https://news.google.com/rss/articles/CBMiggJBVV95cUxPem5HMkh4cHJpZjRXY0hOeDZ0dXpjdnhrN0JCSHZFbkF1ZUZ5bngzZGRGd09UaHZFek9JbDRWSWNaSmJMaFFOdHBCVmtSTl9mcl8ydnZfS0x4eWtGTTl1V1BJb1ZscEJzdVo4WWRvX3NaSUhFajVZdVhBLXoyUC1iaWZWSkdkLXZoenN6dHd6b1hVX0VWSGtGa2lDRUZnQVE4aWhmVTNidE5DREM3eW5GdnJibVB2Uk9BVUNtX2htUUxMeUg3dGlKOVNRcng0bXZyVGoxLTF4c2hMOEhKMmVUQzcweGl2cmczWWJ2MEZyNjlVVktmR0w5UURvYWxKRUxwRFE"}, {"rank": 3, "score": 8.0, "title": "Nature 新工具 Paper2Agent：將醫學論文轉化為可互動的 AI 代理人", "summary": "Nature 發表 Paper2Agent 研究，這套系統能將研究論文（包含論文本文、程式碼與資料集）自動轉換為基於模型情境協議（Model Context Protocol, MCP）的 AI 代理人，使其不僅能重現原始研究結果，更能回答新的科學查詢、並與其他 AI 代理人協作產生新見解。此工具在醫學研究領域具有高度潛力，臨床研究人員未來或可直接與論文「對話」，快速獲取特定情境下的數據分析。對醫院研究部門與實證醫學團隊而言，此技術有望大幅壓縮文獻查詢與應用的時間成本。然而，AI 代理人在解讀醫學論文時的準確性與可靠性仍需嚴格驗證，相關倫理與著作權議題亦值得持續關注。", "tags": ["AI代理人", "醫學研究", "自然語言處理", "實證醫學"], "author": "未標示（Nature｜2026-09-16）", "source_url": "https://www.nature.com/articles/s41586-026-11044-y"}, {"rank": 4, "score": 7.5, "title": "亞洲放射科擁抱 AI 提速，但診斷決策仍持謹慎態度", "summary": "Healthcare Asia Magazine 最新報導指出，亞洲各地醫院放射科已廣泛導入 AI 工具以加速影 // ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
