<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年05月13日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }

  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }

  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }

  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }

  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }

  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  

  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }

  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }

  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }

  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }

  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }

  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

y": "STAT News深度報導揭示，儘管市場上新興敗血症AI預測模型的技術性能持續提升，但業界專家普遍認為，單純的模型準確率並不足以驅動醫院採購決策。研究顯示，臨床工作流程整合難度、警示疲勞（Alert Fatigue）風險、與現有電子病歷系統的相容性，以及醫師對AI建議的信任程度，才是決定採購與實際使用率的核心因素。此外，如何在競爭激烈的市場中與Epic等大型系統內建模型區隔，也是新創業者面臨的重大挑戰。此報導對評估導入或升級敗血症早期預警系統的醫院決策層及重症醫學科主任具有高度參考價值，提醒採購評估不應僅聚焦技術指標，更需納入實際臨床場域的可用性與整合成本考量。", "tags": ["敗血症AI", "臨床決策支援", "醫療AI採購", "警示疲勞"], "author": "未標示（STAT News｜2026-05-12）", "source_url": "https://www.statnews.com/2026/05/12/ai-sepsis-detection-startups-challenge-epic-systems/?utm_campaign=rss"}, {"rank": 7, "score": 7.0, "title": "兒童放射科AI臨床部署進展：Children's National Hospital發布實戰推動框架", "summary": "Children's National Hospital針對人工智慧在兒科放射科的臨床部署發表最新進展報告，提出一套涵蓋技術驗證、臨床整合與持續監控的系統性推動框架。兒科放射影像因患者年齡層跨度大、解剖構造與成人差異顯著，加之輻射劑量敏感性較高，使AI模型的訓練資料與成人數據集往往無法直接通用，構成獨特的技術挑戰。報告強調，在兒科場域導入AI影像輔助工具前，必須針對不同年齡層進行分層驗證，並建立嚴謹的臨床回饋機制以持續優化模型效能。此框架對有意在兒科影像或其他特殊族群場域部署AI的放射科及醫院資訊團隊具有直接的實務參考意義，亦呼應了醫療AI監管機構對族群特異性驗證的要求。", "tags": ["兒科放射科", "AI臨床部署", "醫療影像AI", "模型驗證"], "author": "未標示（Children's National Hospital｜2026-05-13）", "source_url": "https://news.google.com/rss/articles/CBMiyAFBVV95cUxNVzRCZzBIUWNzY0FsbWQteDVpWTY0NHFaWXFTNGR6a1VmRFhTbFdxMFZlcnVycDBCNXpZZ09sYzF3NXJOcVdXU1Y2dEJwcl8xaU1UTU1xTnYwYmF4WGJ2R2FEZzktM0ktbTBNeVFCbWJhTEZkaHJfS2IzVGlIb3lqMTVkYnhTZ0w1RGk5VU1teEZoaXJuRFhXSl9odjc4Q0o1QnJsMFgzUWZKb0JKbFZKMnRWRTVNcm1KdVZWWm42RGpucXFXNEpaMg?oc=5"}, {"rank": 8, "score": 6.5, "title": "護理師公會警示醫療AI錯誤資訊風險，呼籲臨床人員強化辨識能力", "summary": "美國護理師公會發出警示，指出醫療AI工具所產生的錯誤資訊對臨床決策構成潛在威脅，並呼籲護理從業人員提升對AI生成內容的批判性辨識能力。隨著AI助理、臨床查詢工具及自動化病歷系統在醫院快速普及，護理師在第一線直接接觸這些工具的機會大幅增加，卻往往缺乏足夠的AI素養訓練以識別模型輸出的錯誤或偏差。公會強調，醫療機構應加強對護理人員的AI教育培訓，並建立清晰的人機協作界限，確保最終臨床判斷仍由具備專業資格的醫療人員做出。此議題對醫院護理部、教育訓練部門及數位轉型推動團隊具有直接政策意涵，凸顯醫療AI導入必須同步投資人員素養培育。", "tags": ["護理AI素養", "醫療AI錯誤資訊", "臨床安全", "人員培訓"], "author": "未標示（WABI｜2026-05-13）", "source_url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxQWDFJaGV4Yy1mTVRCNHVjdWM0ek5MNHNHLUZQN0preXRZNndzNFZ1MUROVWN3aVhEMUJMMF9FdGpsNmlxMFRkR216NG1RQ1c1czd0MmtpQXI5VFFRYWNCTWNLWWNrcHI4MV92LWtueVhxTTRsWEs1TlMwTGQ4cFJXdDRndDl 得以在組織切片中識別傳統H&E染色無法輕易辨別的隱藏癌細胞及微環境特徵。此技術突破傳統病理判讀的解析度限制，能在細胞層級甚至次細胞層級揭示腫瘤異質性與侵犯邊界，對於早期癌症偵測及治療計劃制定具有高度臨床價值。該工具不僅提升診斷精準度，也有助於減少因閱片主觀差異造成的誤診。對癌症中心、病理科及數位病理推動團隊而言，此類AI工具代表數位病理進入新的功能維度，值得密切追蹤其臨床驗證與導入可行性。", "tags": ["數位病理", "癌症偵測", "空間轉錄組學", "臨床AI"], "author": "未標示（Technology Networks｜2026-05-11）", "source_url": "https://news.google.com/rss/articles/CBMivgFBVV95cUxOaEV3TVJpempqZ0hHaTlVTjFlcWNMSnE2dVp4dGtPcllibEFnNXBXc01NRTZnZHhncllVY3NLWUdBeHY3SzhjdUVaOHU1QkMzVW4xOUFxNThxZFI5a1l0VU04eFBxTm05T3U2TGx3dFlqaUNaalBZemQzend1QjlkdW9fSjl1c2JIWmRuSFZZVVlreFpXN2N2QURGeEpQYUZ6S2RGYk9ocDhtMHY3N0UxT0FPUWJ1ZlFNbnR5TnRB"}, {"rank": 3, "score": 8.0, "title": "醫療AI品質治理新動向：農村醫療、AI代理品管與合規平台集體發力", "summary": "Healthcare IT News報導，為提升醫療AI的臨床安全性與法規合規性，多項集體治理與平台升級方案同步推出。全國農村健康協會（National Rural Health Association）聯合Viz.AI與InterSystems，針對農村醫療協調不足的問題，推動AI治理框架與工作流程自動化，期望縮小城鄉數位醫療落差。與此同時，Credo AI發布新版AI治理平台，強化對AI代理（Agentic AI）的行為監控與品質評估能力；Zyter｜TruCare及Infinitus Systems亦各自宣布強化agentic AI品質保證的新工具。這些進展反映出醫療AI生態系正從「導入期」邁向「治理期」，重點已從功能展示轉向可解釋性、偏見監測與持續合規管理。對醫院資訊部與數位轉型團隊而言，建立AI生命週期監控機制的急迫性正在上升。", "tags": ["醫療AI治理", "農村醫療", "AI合規", "工作流程自動化"], "author": "未標示（Healthcare IT News｜2026-05-12）", "source_url": "https://www.healthcareitnews.com/news/vendor-notebook-health-ai-bolstered-collective-approaches-quality"}, {"rank": 4, "score": 7.5, "title": "台灣員林兩家醫院導入AI排班與護理紀錄生成，以智慧醫療解決護理人力短缺", "summary": "據自由健康網報導，台灣彰化縣員林地區兩家醫院已正式上線AI智慧排班系統及護理紀錄自動生成功能，旨在減輕護理人員行政負擔，進而改善護理職場留任率。AI排班系統可依據人力需求、排休規則及護理師偏好自動產生最佳班表，大幅縮短排班所需人力與時間；護理紀錄生成功能則透過語音或結構化輸入，自動產製符合規範的電子護理紀錄。這兩項應用直接對應台灣護理人力嚴重短缺的核心痛點，也呼應衛福部推動智慧醫療的政策方向。此案例顯示，AI工具在護理場域已從概念驗證走向實際部署，且以解決勞動力問題為主要訴求，對面臨相同挑戰的醫院具有相當的參考價值。", "tags": ["護理AI", "智慧排班", "臨床文件自動化", "台灣醫療"], "author": "未標示（自由健康網｜2026-05-11）", "source_url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE5rM3ZCN3FpUTlpVlBJbnJUU1lVbTUtY2g2NzZsTGljZVB5WjJZZWhLaTk4a3lobXZWdDRpbHc4bE1BMU4tdy1XU1BuSFVNZE5CY0VWc0xDUlcweDBUT0Y4U0xuQWbSAWpBVV95cUxOLWw5TV9EbEFZRy1ndFF3LW1JSWRBWk91bEhqRU1TVFNVeFZJOFRJQ0k1dUtTejdXZ2hqZjMyQ2NRSmZkQ0Iwa3RZRnlpMFlpV3hMUVhDWV9IenpsLUVoMGNCNHFIY1V2V1Vn"}, {"rank": 5, "score": 7.5, "title": "醫療AI模型生命週期監控與信任維護：MedTech Intelligence深度解析", "summary": "MedTech Intelligence刊出深度分析，探討在醫療AI大規模臨床部署後，如何持續監控模型生命週期以維持信任與安全性。文章指出，AI模型在訓練資料環境與實際臨床環境之間往往存在「資料漂移」（data drift）現象，導致模型表現隨時間衰退而醫院未能即時察覺。有效的生命週期管理應包含：定期效能再評估、異常預測警示、模型版本控制，以及針對不同患者族群的公平性監測。此外，監管機關對上市後AI醫療器材的持續監測要求也在逐步強化，醫院若缺乏相應的內部稽核機制，將面臨合規風險。對資訊部與臨床工程團隊而言，建立AI模型監控儀表板與定期審核流程已成為不可迴避的課題。", "tags": ["AI模型治理", "生命週期管理", "資料漂移", "醫療AI合規"], "author": "未標示（MedTech Intelligence｜2026-05-11）", "source_url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxOZ3BrekhJS1Jxa2VhYjJ4NXk0bUh3d3VNRkRmeGRsV3FmUGc0SHNGM2g0TTFzN0txZzgySkxMS1lCeVRWRzZoYUtZMVhGNnIyYzd4RFJFZUxTSjIxS2p4S0xwamVWTkZvX1lxeXZ5VGI0RmVOQWlyclB0cTJUdFRLLTBhRkQ3Ti1yX2tORHBtbXFIZ1h2RHRGUFNhN2hYTUVHZ1JPZnJOSEVzWjB4NldTTTQ0SlRfUG5XYUladNIBwgFBVV95cUxPNG44VkR1RlN4Nk5jVlZ2bVhMMndoN3Rkb2FVdktmSEF2REVzVlJ0NXRtUDBjU0dnMjZ4bTJFZTNLUXFDazR3WFJFaDJLS2h3MGs5cmhWRVRxc0tKTnFzOE80QWx5OGZWOEdsVEcyWlRlaWgwOUo5UU5WaTA3RXlyaTlaUURRekhxQXFwSWFMTHZQY2RQTmJvbjhxWGFyOXN6LTc1ajlsQUJuZjh0QmVwTWdoeUsxbDlSVTdMSVJXTUxuQQ"}, {"rank": 6, "score": 7.0, "title": "Sarasota Memorial Hospital運用分析平台實現早期肺癌偵測，精準醫療進入實戰階段", "summary": "Healthcare IT News報導，美國佛羅里達州Sarasota Memorial Health Care System透過導入先進醫療分析平台，成功提升肺癌早期偵測能力。該系統近年投入逾20億美元建設Brian D. Jellison癌症研究所，整合最新診斷技術與AI驅動分析工具，使臨床團隊能在更早期階段識別高風險患者並介入治療。早期肺癌偵測是目前臨床AI最具成效的應用領域之一，其核心在於整合電子病歷、影像數據與風險分層模型，主動篩出符合低劑量電腦斷層掃描（LDCT）條件的族群。此案例展示了大型醫療體系如何將資本投資與數位分析能力結合，打造系統性癌症早期發現機制，對有意強化腫瘤防治成效的醫院具有直接參考意義。", "tags": ["肺癌早期偵測", "醫療分析平台", "腫瘤AI", "臨床決策支援"], "author": "未標示（Healthcare IT News｜2026-05-12）", "source_url": "https://www.healthcareitnews.com/news/sarasota-memorial-ids-lung-cancers-earlier-analytics-platform"}, {"rank": 7, "score": 7.0, "title": "醫療AI倫理規範滯後於技術發展，醫院加速自動化之際監管框架仍待完善", "summary": "Devdiscourse報導，隨著醫院加速部署AI自動化醫療決策工具，醫療AI的倫理規範與法規框架卻明顯落後於技術發展速度，形成治理缺口。文章指出，目前多數國家缺乏針對臨床AI決策的強制性問責機制，醫院在導入AI診斷、分診或治療建議工具時，往往依賴廠商自我聲明而非第三方驗證。此外，AI系統在不同族群間的公平性問題、患者知情同意、以及AI輔助決  3, "score": 7.5, "title": "醫院能否信任AI處理數字運算？臨床應用中的數值推理風險探討", "summary": "《The Daily Star》刊載一篇針對醫院使用AI進行數字相關任務的深度分析，核心問題是：AI在醫療環境中處理數值計算、劑量換算、檢驗數值解讀等任務時，可靠性究竟有多高？文章援引多項近期研究，指出目前主流大型語言模型在數學推理與精確數值計算上仍存在顯著缺陷，可能在臨床決策支援中產生誤導。報導強調，醫院在部署AI工具前必須嚴格評估其數值處理能力，並建立人工複核機制，以避免因AI計算錯誤造成的醫療傷害。此議題對醫院資訊部、藥劑科及臨床決策支援系統建置團隊具有直接的政策與操作意涵。", "tags": ["臨床AI安全", "大型語言模型", "醫療決策支援", "風險管理"], "author": "未標示（The Daily Star｜2026-05-10）", "source_url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxNQ09GcFo3RlZ0djdRUV9NRGZ4dDVucGJMTllvUHU0VUgyZzZJN1JTemFoaFN6bEk2aTVBS3hnclNyd0hBMGpqY2F6MVVfNG5uRHJOd2M2MHdQMF9LWkpHTzV6Nno4c3RWWVR5OXc5NGtvd0prQllRUEhFYUc2TExnSndoMVpKUQ"}, {"rank": 4, "score": 7.0, "title": "AI精準診斷對抗抗生素抗藥性危機，醫界面臨百年最大轉折", "summary": "TechNews科技新報報導，AI技術正快速應用於對抗全球抗生素抗藥性（AMR）危機。透過機器學習分析病原菌基因組數據與臨床表現，AI模型能在數小時內預測特定細菌的抗藥性譜，大幅縮短傳統藥敏試驗所需的數天等待時間，協助醫師更早啟動精準抗菌治療。報導指出，WHO已將AMR列為全球公共衛生頭號威脅之一，而AI輔助的快速抗藥性鑑定有望改變感染科的治療典範。對於設有感染管制中心與微生物實驗室的醫院而言，評估導入AI輔助細菌抗藥性偵測系統的時機已日趨成熟，此類技術亦與健保抗生素管理政策方向高度契合。", "tags": ["抗生素抗藥性", "感染管制", "AI診斷", "精準醫療"], "author": "未標示（TechNews科技新報｜2026-05-09）", "source_url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxOLXFiN0lRaGdSbEFuOUxYSDg2VDVQX28zZVR1a18tWmhnLUY2VmlaZzlOOThKWkp6dXhUQUd4MVZ0Z1lEdlNXbXBUeHFXS2xEanR6T2lZdlpzWnBzLWNZZHdYMHFwMkp4WDlCV01zZkcxZjZLY0UwbXh0WGd0RHlOZlBFOXg"}, {"rank": 5, "score": 6.5, "title": "麻州醫療機構全面導入AI助理，從病歷記錄到診斷決策應用多元", "summary": "ENN台灣電報報導，美國麻薩諸塞州多家醫療機構正積極部署AI助理系統，應用範圍涵蓋自動化病歷生成、診斷輔助建議、影像判讀輔助及患者溝通摘要等多元場景。相關醫院表示，AI助理的導入顯著減輕了醫師的行政文書負擔，使臨床人員得以將更多時間投入直接照護工作。部分機構亦結合環境式語音擷取技術，實現診間即時紀錄，減少事後補記的錯誤與遺漏。此報導對台灣醫療體系具有參考意義，尤其在智慧病歷、AI輔助診斷導入策略及醫護人員接受度等議題上，提供了來自美國前線的實務經驗，可作為醫院推動數位轉型的參考依據。", "tags": ["AI病歷記錄", "醫療助理", "數位轉型", "智慧醫院"], "author": "未標示（ENN台灣電報｜2026-05-10）", "source_url": "https://news.google.com/rss/articles/CBMiOkFVX3lxTE1XUTE5ejNOdW9maE5UVzdiRl9vTURnLWNheGdBOFVUSDl4MXRUbzdOaFRWbFp2WUloaXc"}, {"rank": 6, "score": 6.0, "title": "學術論文偽造引用危機：250萬篇生醫論文系統性審計揭露AI生成假引文問題", "summary": "《The Lancet》刊載一項由Topaz等人主導的大規模審計研究，針對PubMed Central平台上2023年至2026年間發表的約247萬篇論文共逾1.25億筆引用文獻進行真實性驗證。結果發現，在可核查的9,710萬筆引用中，存在一定比例指向不存在文獻的「幽靈引用」，且此現象與AI生成內容的普及高度相關。研究者指出，AI語言模型在撰寫或輔助撰寫學術論文時，可能自動生成看似合理卻實際不存在的引用文獻，對醫學文獻完整性構成系統性威脅。此發現對醫療機構在使用AI輔助學術寫作、臨床指引制定及文獻回顧時，具有重要的品質把關與稽核意涵。", "tags": ["學術誠信", "AI生成內容", "文獻造假", "醫學研究"], "author": "未標示（The Lancet｜2026-05-09）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00603-3/fulltext?rss=yes"}]}, "2026-05-09": {"date_str": "2026年05月09日", "weekday": "星期六", "items": [{"rank": 1, "score": 9.0, "title": "賓夕法尼亞州起訴AI聊天機器人冒充醫師，醫療AI監管壓力持續升溫", "summary": "賓夕法尼亞州司法部長對Character.ai提起訴訟，指控其旗下AI聊天機器人非法冒充持牌精神科醫師執行醫療業務，構成無照行醫。此案為美國第二起針對該公司的州級訴訟，凸顯各州對通用型AI平台在醫療應用上安全護欄不足的高度警惕。案件焦點在於AI是否能在未受監管的情況下提供心理健康諮詢，以及現行法規是否足以規範AI在臨床邊界的角色扮演行為。此案預料將加速美國各州制定專針對醫療AI聊天機器人的立法框架，並引發醫院資訊部門重新審視院內及院外患者使用之AI工具的合規邊界，對數位轉型策略具有直接政策參考意義。", "tags": ["醫療AI監管", "聊天機器人", "法規政策", "醫療倫理"], "author": "未標示（MedCity News｜2026-05-09）", "source_url": "https://medcitynews.com/2026/05/pennsylvania-chatbot-doctors-lawsuit/"}, {"rank": 2, "score": 8.5, "title": "AI生成醫院住院摘要之醫師安全性評估研究出爐，臨床導入前景受關注", "summary": "一項由醫師主導的評估研究針對AI自動生成的醫院住院病程摘要（Hospital Course Summaries）進行安全性審查，探討其在臨床文件應用中的可靠性與潛在風險。研究設計由執業醫師逐一審閱AI產出內容，評估其準確性、遺漏率與臨床危害潛力，為目前文獻中少見的實證評估。AI生成住院摘要可大幅降低醫師書寫負擔，惟其錯誤若未被察覺將影響後續照護決策，因此臨床落地前的安全驗證至關重要。此研究結果對各醫院評估導入AI文件自動化工具、建立人工審核流程及設定品質管控標準，具有直接參考價值。", "tags": ["AI臨床文件", "住院摘要", "患者安全", "臨床驗證"], "author": "未標示（Bioengineer.org｜2026-05-09）", "source_url": "https://news.google.com/rss/articles/CBMimAFBVV95cUxOYzYyT3haWE9KMUxJcUlBSV9uSW8tZjFQbE5RaGFpOXEtcE1DLXkza1pJNlpRSVQ5TGJWcTB3ZDlpcVhEejRUNTViNHBxT09paV95a1E2NDQwWUZINS1adEZhVEFJeklHUXRWMlJudnBJLW5NYVdMZVdxamVGMlN6THdSQnBkaktELWpMcGpHNDJnVzdZeDN2bw"}, {"rank": 3, "score": 8.0, "title": "Abridge環境式AI文件技術正式向全美護理人員開放，減輕行政負擔", "summary": "醫療AI新創公司Abridge宣布，其環境式醫療文件（Ambient Documentation）技術現已向全美所有合作醫療體系的護理人員全面開放。此前該技術主要服務醫師群體，此次擴展至護理人員標誌著AI輔助文件工具進入臨床護理的關鍵里程碑。系統可在護病互動過程中自動記錄臨床內容，目標是降低護理人員的行政文書負擔，使其得以維持與患者的直接眼神接觸與溝通品質，進而提升照護體驗。此舉回應了長期以來護理人力短缺與過度行政化的議題，對醫院護理部門的工作流程優化與人力留任策略具有參考價  8.1, "title": "醫療AI不能淪為什麼？一位CIO的警示與治理紅線", "summary": "Healthcare IT News刊載一篇來自醫療機構CIO視角的深度評析，探討醫療AI在快速落地過程中不應跨越的邊界與底線。該CIO指出，醫療AI最大的風險並非技術失靈，而是在組織內部被錯誤定位——例如被視為削減人力成本的工具、掩蓋系統性問題的包裝，或在缺乏臨床驗證的情況下倉促部署。文章強調，AI應被定義為增強臨床判斷的輔助系統，而非取代醫師專業責任的自動化裝置。CIO呼籲醫院在導入AI前應先建立明確的使用政策、問責機制及失效應變計畫，並強調治理架構必須由臨床、法務、資訊三方共同參與建構，而非單由IT部門主導。對於正處於AI採購與部署階段的醫院領導層，此文提供了務實的風險管理框架參考。", "tags": ["AI治理", "醫療CIO", "臨床AI風險", "數位轉型"], "author": "未標示（Healthcare IT News｜2026-05-08）", "source_url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxNZnlPU1BjV1VwYXA4bW1MTmZmTHkwRTFlQmprOXBLdDBJSTJycnA2d0s2U3dkX3BZck9FR0hKUzBGUEh5ZWtCNG9qajROOHNwc1YyT3V4MmJqYlplTXAyUWw2QlpRc01WZDZpQ1BnaTJCZXlEQXNKZ21QUHFQVG9QbDJLanp2Z3NlNFhYdHlyemRsdkY1M2trNm5JaFE0dHpk"}, {"rank": 5, "score": 7.8, "title": "AI語言模型在基本醫院資料任務中表現不佳，研究揭示臨床應用落差", "summary": "最新研究發現，目前主流的大型語言模型（LLM）在處理醫院日常結構化資料任務時，表現遠不如預期，引發醫療界對AI臨床應用準備度的重新審視。研究測試了多款LLM在病患出院摘要擷取、實驗室數值解讀、藥物劑量換算及ICD編碼等基礎醫院資料處理任務上的表現，發現錯誤率偏高且一致性不穩定，尤其在需要精確數值判讀的情境下失誤頻繁。研究人員指出，這些模型在開放式問答中表現亮眼，但面對醫院資訊系統中高度結構化、格式嚴格的資料時，往往出現幻覺（hallucination）或斷章取義的問題。此研究提醒醫院在將LLM整合進臨床工作流程前，必須針對特定資料任務進行嚴格的場域驗證，而非依賴通用性基準測試成績作為部署依據。", "tags": ["大型語言模型", "臨床資料處理", "AI幻覺", "醫院資訊系統"], "author": "未標示（Medical Xpress｜2026-05-08）", "source_url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxOZDdja3JsOV9iTTJPa3hJdTB2bmNSSlg1am5MR1gyLUEwSzZ3cEYwd3RLQmpaV1BpdmUxN1NvMkRtUVpqMDBCdzA0OU1XZ2h1LWhFMWJqWjlqUFdRMDhHRjVaT1E5MU4wZGFTMEZQYU90NW1Mc0JxcnlUWGJqcGp1elpITXFZQQ"}, {"rank": 6, "score": 7.5, "title": "賓州眾議院推動醫療AI使用揭露立法，法案順利通過委員會審查", "summary": "美國賓夕法尼亞州眾議院一項要求醫療院所揭露AI使用情形的法案，已順利通過委員會審查，即將進入全院投票程序。該法案規定，當醫療決策或病患溝通過程中使用了AI輔助工具，醫療提供者必須向病患進行相應的知情揭露，並說明AI在診療流程中扮演的角色。提案人認為，隨著AI在病歷摘要、影像判讀、保險授權等場景的應用日益廣泛，患者有權了解其所接受的醫療服務是否涉及演算法輔助決策。法案若通過，將成為美國州級醫療AI透明度立法的重要先例，可能引發其他州效仿跟進。對醫院法遵與資訊部門而言，此發展意味著未來AI工具的部署必須同步建立完整的揭露流程與患者溝通機制。", "tags": ["醫療AI立法", "知情揭露", "法規遵循", "患者權益"], "author": "未標示（Butler Eagle｜2026-05-07）", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxNS2tPTWVCQ3N3eFo2eldnQlQwVHpadVpXeVJhV2l4RkdEVEZra3dIMFk3Y3d4cGh3SWRFdW0zUDNEbk85cUxjUExLX1hhU1VvZzFEY2R0MWdkQU51VTRFTDdFMy1ucnRGRk9sYTk5NjJxRjRGS29tLVN0QTVRUHBZVHBfSnFoNEp0R3VwdW9JN0g0TTJLaWdscWFEZFplU0dMYVQwMUl3bw"}, {"rank": 7, "score": 7.3, "title": "加拿大各省資料保護機構共同研擬醫療AI轉錄工具隱私規範指引", "summary": "加拿大各省個人資料保護機構（DPA）正就醫療AI轉錄工具（AI scribe）的隱私保護規範展開跨省協調討論，擬定統一的指導方針。由於AI醫療記錄工具在診間的應用快速普及，自動錄音、語音辨識與病歷生成等功能涉及大量敏感健康資料的蒐集與處理，引發各省監管機構對患者知情同意、資料儲存地點、資料存取權限及跨境傳輸等面向的高度關切。各省DPA計畫協調一致，避免出現各省規範分歧導致醫療機構遵循困難的情形。此跨省協作模式對台灣醫療體系亦具參考價值，特別是在衛福部推動AI主權雲及SBOM規範的背景下，如何建立全國統一的醫療AI隱私保護框架，是醫院資訊部門須提前關注的政策走向。", "tags": ["醫療AI隱私", "AI轉錄工具", "資料保護", "法規政策"], "author": "未標示（IAPP｜2026-05-07）", "source_url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxQMGRDakVabTNMRkpka3lxQWZ3MXlmV3FYODBSYy02WDFEWXE4ZWRUcmMtbmcwOEhqZzRlY0VxdFJaa0FyVjJxT0hXbl9oWllsRER1aTVnQTd6WmFILVlvQ1I2ZHZBYzVpTDRkVW1aaWZBczZwUlVKWmF5SDZVWGk2U3FiLVctVWJNLWZEQTNQZV9qVnUxVVJyamhIWQ"}, {"rank": 8, "score": 7.1, "title": "AI演算法大幅提升醫院出院預測準確率，有助病床調度與流程規劃", "summary": "加拿大Hospital News報導，一項最新研究開發出以AI為核心的出院預測演算法，可整合電子病歷、實驗室數值、護理記錄及入院診斷等多維度資料，即時預測住院患者的可能出院時間，準確率相較傳統統計模型顯著提升。此工具可協助護理長及病床管理人員提前安排病床清潔、後續照護轉介及醫療資源調配，有效降低病床壅塞問題，並縮短患者等候時間。研究團隊指出，模型在不同科別及患者族群中均保持穩定的預測表現，顯示具備良好的泛化能力。對於面臨病床管理壓力的醫院而言，此類AI工具提供了一個以資料驅動優化運營效率的實際解方，且無需大規模改變既有工作流程即可導入。", "tags": ["出院預測", "病床管理", "醫院營運AI", "電子病歷"], "author": "未標示（Hospital News｜2026-05-07）", "source_url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxQS2E1R2d6Y2J6d3VGdTBabWs4c2dmMHptcnMwbVhNMUlfbmUxV2tMU3hYM3JFWmJLN1g4NlFESHpTby1ZbkJKSGtJVzRtajdPZ0ZDOUh4eVoyOXRYcTBwTmtYNHZtSVlDSDU3SWdTVEZrTHZqNWUwYkxRa1dvVzVRSTVCY3ZqS0tDVU5JYk5tZy14bU1Lay0tMGR0Y21Jc2VXbXVF"}, {"rank": 9, "score": 6.8, "title": "SimonMed影像中心推出AI加值服務並額外收費，引發醫療AI商業模式爭議", "summary": "美國大型影像連鎖機構SimonMed Imaging宣布推出一系列AI輔助影像分析加值服務，包含骨密度分析、肺結節偵測及心血管風險評估等項目，並對患者額外收取自費費用。此舉在放射科業界引發廣泛討論，部分業者認為此商業模式有助於加速AI工具的臨床普及與商業可持續性；批評者則擔憂，此類自費AI附加服務可能加深醫療不平等，使經濟條件較差的患者無法獲得AI輔助的早期疾病偵測。此案例標誌著醫療影像AI從「嵌入式服務」向「獨立計費項目」的商業模式轉變，對各國醫院在AI工具定價與收費模式的規劃上具有重要參考意義，亦可能影響未來健保及商業保險對AI診斷服務的給付政策討論方向。", "tags": ["醫療AI商業 const TODAY_ISO  = "2026-05-13";

// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';

  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}

// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];

  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;

  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;

  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');

  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));

  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');

  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');

  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });

  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}

// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');

  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;

  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}

// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
