<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年07月27日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

次峰會被視為繼 EU AI 法案之後，國際社會在醫療 AI 監管層面最具代表性的多邊行動之一，其共識成果將對各國衛生主管機關的政策制定產生深遠影響，也為醫院在引進 AI 系統時的合規標準提供重要參考依據。", "tags": ["醫療AI治理", "全球政策", "病患安全", "監管法規"], "author": "Talha Burki（The Lancet｜2026-07-25）", "source_url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01495-9/fulltext?rss=yes"}, {"rank": 2, "score": 8.5, "title": "白宮發布科學藍圖：大力挹注 AI 研究、縮減生命科學傳統資助", "summary": "《自然》報導，美國白宮首席科學顧問正式發布美國科學新藍圖，核心方向是將數千億美元的研究經費從大學體系轉移至產業界，並明確點名 AI 為優先加速領域，同步宣布多項以 AI 加速科學研究的新資助計畫。此舉對生命科學與醫療 AI 生態系影響深遠：學術醫療中心恐面臨基礎研究資金萎縮，而民間 AI 醫療新創將獲得更多政策與資金紅利。報告引發科學界褒貶不一的反應，支持者認為此舉能加速 AI 在臨床與藥物開發的落地，批評者則憂心基礎研究能量的流失及科學獨立性受損。此政策走向預示美國醫療 AI 產業格局將出現結構性重組，值得醫院領導層與數位轉型團隊密切追蹤。", "tags": ["美國科學政策", "AI資助", "產業化趨勢", "醫療研究"], "author": "未標示（Nature｜2026-07-24）", "source_url": "https://www.nature.com/articles/d41586-026-02332-8"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 資安防護必須從治理架構出發，技術層面遠遠不夠", "summary": "Healthcare Finance News 一篇深度報導指出，隨著醫療機構 AI 應用快速擴張，資安威脅已從傳統 IT 系統延伸至 AI 模型本身，包括訓練資料投毒、模型對抗性攻擊及 AI 決策的可解釋性漏洞等新型風險。文章強調，醫療 AI 資安的根本解方不在於單純部署防火牆或加密技術，而必須從治理架構切入，涵蓋 AI 模型生命週期管理、存取控制政策、稽核追蹤機制，以及跨部門的風險責任分工。報導呼籲醫院 CIO 與資安長應將 AI 資安納入整體數位治理框架，而非視為獨立的技術問題，並建議制訂 AI 資安事件應變計畫，以因應日趨複雜的威脅環境。", "tags": ["醫療AI資安", "治理框架", "數位轉型", "資訊安全"], "author": "未標示（Healthcare Finance News｜2026-07-24）", "source_url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPZXYxQ2VxX0dPTzNHbVM3ZXdJdTVLcW5UTW01d2tVd3NvYWlxOHJtVHNaY2M1SkpBSk9EYUZTdFNXbjl2a1F2cGdvbWZYUElueFUtcURLSFQ0WkxvbWUtSVRWaExNZ1ExdkNNR1ItRW9jNDJPOVg4TnhWQ0hjdE1mNmtvUWNGNkxmdVdwbGZOVVV6aWs?oc=5"}, {"rank": 4, "score": 7.5, "title": "亞洲與英國醫療 AI 開發者普遍缺乏法規認知，研究示警", "summary": "MobiHealthNews 報導一項最新研究結果，調查橫跨亞洲多國與英國的醫療 AI 開發者後發現，相當比例的業者對當地及國際醫療 AI 監管要求缺乏充分認識，部分開發者甚至不清楚其產品是否需要取得醫療器材許可。研究指出，此現象在中小型新創公司中尤為明顯，可能導致不符規範的 AI 產品進入臨床場域，形成病患安全隱患。報告呼籲各國衛生主管機關加強對開發者的法規宣導，並建立更清晰的 AI 醫療器材分類標準。對於正在評估或導入第三方 AI 解決方案的醫院而言，此研究提示在採購流程中應強化對廠商法規合規狀態的盡職調查。", "tags": ["醫療AI法規", "開發者認知", "市場監管", "亞洲醫療"], "author": "未標示（MobiHealthNews｜2026-07-24）", "source_url": "https://news.google.co 列順序。初步應用成果顯示，可縮短高風險患者的影像等待時間，有助於加速臨床決策。此類工作流程 AI 工具兼具實作可行性與臨床效益，對資源有限的急診影像環境尤具參考價值。", "tags": ["急診室AI", "影像排程", "CT掃描", "工作流程優化"], "author": "未標示（Radiology Business｜2026-07-24）", "source_url": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNRUM0YTRjenFKSGJ0Q3VyS0pIZE1zUG95WjR4dEczaTVycXhqNTBuT3ZjalY1aWhhMnAydWpDb3VFal81UkRKaF9LclZGRnNSQ0p3ZWo2b09JTUNsT0lQR0NVMVR4TUNrMGo5U0lxTVFCUFRZVXJ2VTczcXhqeUVlVEZqdzFLbTl6VGY2blJKWjJVX3ROc0lMUGVQNmxraEt2cXZOeEFOY0hkdUR3NkE?oc=5"}, {"rank": 8, "score": 5.5, "title": "台灣慈濟大林醫院開發 AI 教學系統，聚焦提升醫療照護品質", "summary": "大林慈濟醫院自行開發 AI 輔助教學系統，目標是將人工智慧技術融入醫護人員的在職教育與臨床訓練流程中，以提升整體醫療照護品質。該系統據報導可協助醫護人員透過 AI 模擬情境、智慧測驗與個人化學習路徑，加速知識吸收與臨床技能精進。此舉反映台灣醫療機構開始將 AI 應用從單純的診斷輔助延伸至醫學教育場域，探索 AI 在人才培育上的潛能。隨著醫療 AI 應用範疇持續擴展，如何將 AI 工具有效整合進醫療教育體系，將成為醫院管理者與教學部門的重要課題。", "tags": ["台灣醫療AI", "AI醫學教育", "臨床訓練", "慈濟醫院"], "author": "未標示（Yahoo新聞｜2026-07-24）", "source_url": "https://news.google.com/rss/articles/CBMi_wFBVV95cUxPeHFTN3gzd2FNdGNDVDUzakQzWks1UHdacDVyQzdudlpNckZ4bnFuTWRaeHpiRXRnZ25PeWZrVi1PVVdZQnlTQ2NHS2E4QlRMNDR2c1BSd1o5Qlk4bHhSSGI0bmozMndyRU5wYzNZNW1RNUdLaGhLall1NTJFRmdUNEZvdldjNlBOWGxrUFlESWJ3OGtzdFNkWklBU28wV0tkQ3VYQWhOU3lwanJJeWZIWGlJMFJLb3I3WlVSbkxkWXNoQkowbEZfRWdGRDhnYXNqSWRMOXhWcjhJMzAwQklCbXJCeEpFQnktRmw4LWZUYld6VW42V2M1Wl9mM1hNUlE?oc=5"}]}, "2026-07-24": {"date_str": "2026年07月24日", "weekday": "星期五", "items": [{"rank": 1, "score": 9.0, "title": "美國 HHS 召集專家制訂臨床 AI 標準，OSTP 同步發布 AI 報告", "summary": "美國衛生及公共服務部（HHS）宣布加入科學研究 AI 倡議，並邀集各界專家共同研擬臨床 AI 的政策標準框架；與此同時，白宮科技政策辦公室（OSTP）亦同步發布最新 AI 報告，就聯邦政府如何推動負責任的 AI 應用提出具體建議。此舉被視為美國聯邦層級首次系統性整合臨床 AI 治理方向，對未來醫療機構導入 AI 工具的合規要求、監管路徑及驗證標準均可能產生深遠影響。美國醫院協會（AHA）亦就此發布專文，提醒醫療體系密切關注後續政策走向。對於正積極評估或已部署臨床 AI 系統的醫院而言，此次 HHS 的政策行動代表監管環境即將進入新階段，值得領導層提前掌握並預備因應策略。", "tags": ["臨床AI政策", "聯邦監管", "HHS", "AI治理"], "author": "未標示（American Hospital Association｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPOFJlYVR0VnYwSFA4NmhmWTNQelFCSDlCNUx6Mk5aZTlkUmc5LWlTdzZZeWtkTUtibGZCbWh1amlKeFhYTGFDTHlhNEtqRi1Pb1NJaWJfMU15ckRRdjc0U2JnQzFoVldJeThUd0V6ZGhMMmZIUGxTUkN1R25DdHpBd1pWVnQ5dHVzeGxqU3dXbkRkbjJwYTVkdGhBYm0tSXF0Q3ZSdmhZa1lTUkx4MkJMVGdn"}, {"rank": 2, "score": 8.5, "title": "HHS 邀專家為臨床 AI 制訂規範，Whoop 任命新 CMO、腦機介面動態齊受矚目", "summary": "STAT News《健康科技》專欄報導，HHS 正式召集領域專家，就臨床 AI 的標準制訂展開政策對話，涵蓋 AI 輔助診斷、臨床決策支援工具等面向的監管與驗證框架。此外，穿戴裝置品牌 Whoop 宣布任命新任首席醫療官（CMO），顯示消費健康科技公司正加速引入臨床領導力；腦機介面領域亦有最新進展受到關注。整體而言，本期報導勾勒出 2026 年下半年醫療 AI 政策與產業的三大動態：聯邦政府從被動應對轉向主動制訂標準、穿戴健康平台深化醫療化佈局、以及神經科技持續突破。對醫院資訊與數位轉型團隊而言，HHS 臨床 AI 標準討論的走向，將直接影響未來 AI 工具的採購合規與上線策略，建議密切追蹤後續進展。", "tags": ["臨床AI標準", "HHS政策", "數位健康", "腦機介面"], "author": "未標示（STAT News｜2026-07-23）", "source_url": "https://www.statnews.com/2026/07/23/hhs-convenes-experts-on-clinical-ai-health-tech/?utm_campaign=rss"}, {"rank": 3, "score": 8.0, "title": "AI 輔助影像工作流程讓一般放射科醫師達到乳房專科水準", "summary": "Radiology Business 報導一項最新研究成果：透過 AI 輔助的影像工作流程介入，一般（非次專科）放射科醫師在乳房攝影判讀上的表現，可提升至接近乳房專科放射科醫師的水準。此研究直指醫療 AI 在縮短「一般醫師與專科醫師判讀能力落差」方面的實質效益，對人力資源不足或缺乏次專科醫師的基層醫院與區域醫院而言，具有高度臨床參考價值。研究結果顯示，AI 的角色不僅是輔助提速，更能在標準化判讀品質方面發揮關鍵作用，有助醫院在不增加人力配置的前提下維持或提升篩檢品質，是近期放射 AI 應用研究中具代表性的實證成果。", "tags": ["放射AI", "乳房攝影", "影像工作流程", "臨床實證"], "author": "未標示（Radiology Business｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxQcjhzT2JXaGR4WnZOZkVRbFp3TEZWMUpBMURiWDBTSmdPOXRCVTZ0RENCS3JKM1hCSndSNGFVQVRfUzlaUHFxd0lFQ2FZZktHOXpLdmpXdFpMdVpHQ3JzQlUteVRjX1g0N2lBTS1LRy1tbWNIdHNVbk1UbUpiV1A4OTVPTDEtcF93ZXZBRlpFWVlTZ3NzaHlUMTJibDQwWVR1Y2J6UjcxOC1rX3Z3UTl6c19vQWhTWVBXUndqc1dfU08xelJWRDZKalhnVWx1Tl92Z19fS3pFamFuR3dQ"}, {"rank": 4, "score": 7.5, "title": "Sectra 在美國推出 AI 驅動放射報告解決方案，強化影像科工作效率", "summary": "瑞典醫療影像資訊系統大廠 Sectra 宣布於美國市場正式推出其 AI 驅動的放射科報告解決方案，主打智慧化報告草擬與結構化輸出，目標是大幅縮短放射科醫師的報告撰寫時間並提升一致性。Sectra 在全球醫療影像 IT 市場具備相當規模，此次進軍美國 AI 報告市場，意味著放射 AI 解決方案的競爭版圖持續擴大。對於正在評估或更新 PACS／RIS 系統的醫療機構而言，此類整合式 AI 報告工具的導入，不僅影響影像科工作流程，亦涉及 AI 模型合規、資料互通性及臨床驗證等層面，是近期放射科數位化採購的重要參考案例。", "tags": ["放射AI", "AI報告", "影像資訊系統", "Sectra"], "author": "未標示（Radiology Business｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMisAFBVV95cUxNOEp1MDFDVE1tcHdZUFdpdW14OUVsOEVkY0pfTUx5a1hCTTVLT05zMjRiQlhxTHp3d1dCZHlzakxLa0Q5U2xsLXpLamw3SmJQbWIyRzIzZ3ozc21YdXRXb0FDWHhqaTNsYnhkMGFyUWRiWUJSYmlfQmQ3dnhnR1FwY3QwM3NtNUdhbTlITTJldk1JYUc2alVBXzdPVUQ3TzdUbmljNW5zMS1ScUtlREE3Sg"}, {"rank": 5, "score": 7.0, "title": "台灣醫療產業 AI 信心充足，但營運落地整合度明顯不足", "summary": "根據最新調查報告，台灣醫療產業對於 AI 的整體發展信心普遍偏高，多數受訪機構認為 AI 將在未來五年內深刻改變醫療作業模式。然而，同一份調查也揭示明顯落差：在實際營運層面，AI 工具的整合程度仍相當有限，反映出「信心走在落地前頭」的現象。業界分析指出，主要瓶頸在於跨部門協作機制不健全、AI 導入缺乏清晰的成效評估框架，以及人才培育進度跟不上技術採購速度。此現象在台灣醫療體系中具有一定普遍性，對於正推動數位轉型的醫院而言，如何縮短「想用」與「用好」之間的距離，將是下一階段最關鍵的管理課題。", "tags": ["台灣醫療AI", "數位轉型", "AI落地", "產業調查"], "author": "未標示（蕃新聞｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMiUkFVX3lxTE9ySVBmRldBaHh0UEJvVnlBTktYUGtvcmgtb0tTWEtpVlZhYnpDeklEY0lubXhHWE5iSW5sMThIU2hJZGFoUV9hdVU2eUlvN0h3LUE"}, {"rank": 6, "score": 6.5, "title": "台灣超高齡化浪潮下，政府積極導入 AI 強化長照醫療照護", "summary": "公視新聞報導，面對台灣快速邁入超高齡社會所帶來的多元長照需求，政府正積極將 AI 技術引入醫療照護體系，涵蓋居家照護輔助、機構照護品質監測及智慧化健康管理等面向。相關計畫旨在透過 AI 輔助減輕第一線照護人員負擔、提升服務效率，並協助在人力資源有限的情況下維持照護品質。此項政策方向呼應台灣健保署與衛福部近年持續推動的數位健康轉型目標，對於大型醫院體系中設有長期照護、老年醫學或居家醫療服務的部門，具有直接的政策參考價值，也預示著 AI 在長照場域的應用將進入更具體的落地階段。", "tags": ["台灣醫療AI", "長照", "超高齡化", "政府政策"], "author": "未標示（公視新聞網PNN｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE13amVOWWVvTDFMYXc5WTNMS0JTQk9KNXZYaENsU3FhRXdLZmpqUlAzREpleW9fSWZOTjJnQTJxQjJSNERHN21EREVPUVN2Zjg"}, {"rank": 7, "score": 6.5, "title": "華碩攜手國家衛生研究院深化 AI 醫療場域驗證合作", "summary": "DIGITIMES 報導，台灣科技大廠華碩與國家衛生研究院（國衛院）宣布策略合作，雙方將共同推進 AI 醫療應用的臨床場域驗證工作。此次合作聚焦於將華碩在硬體與 AI 運算平台上的技術優勢，與國衛院在醫療研究與臨床資料方面的資源相結合，共同建立符合台灣醫療情境的 AI 模型驗證機制。此類產學研合作模式，是台灣醫療 AI 生態系走向本土化、系統化驗證的重要里程碑，有助於縮短 AI 工具從研發到臨床部署的時程，並提升本土 AI 醫療解決方案的公信力與市場競爭力，對有意引進或共同開發 AI 工具的醫療機構具有參考意義。", "tags": ["台灣醫療AI", "臨床驗證", "產學合作", "華碩"], "author": "未標示（DIGITIMES｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxQSHJvalh0WFJDb29Ba0MxMXU2MXBqYXZ0WWx0ckVvR0VnNWpHMl9SenZBOTRGVk90MklVSmRjcHROekU1aVRGaXQyQXkwbWhuOURyYWRzOTk5a3pSdDdURGE4X2FSTXVldnUxd0pWS09RYl80SnBlaEZuUTNMNTVHT0Jna1RuVmhPb3A2bUxB"}, {"rank": 8, "score": 6.0, "title": "AI 如何協助科學家設計下一代生物製劑藥物", "summary": "MIT Technology Review 深度報導 AI 在生物製劑藥物設計領域的最新應用進展。文章指出，新藥研發長期面臨高成本、高失敗率困境，一款新藥從研究到上市往往耗時逾十年且耗資龐大。AI 的介入正在改變這一現狀：透過深度學習模型預測蛋白質結構與功能、生成候選分子、篩選最具潛力的生物製劑設計方案，AI 已大幅縮短早期研發週期並降低試錯成本。文中尤其聚焦於工程蛋白質類藥物（biologics）的 AI 輔助設計，包括抗體、蛋白質療法等，並分析多家生技公司實際應用案例。此報導對醫院體系中涉及精準醫療、腫瘤科及新藥評估的臨床及研究部門，提供了技術趨勢的全面性概覽。", "tags": ["AI藥物設計", "生物製劑", "精準醫療", "深度學習"], "author": "未標示（MIT Technology Review｜2026-07-23）", "source_url": "https://www.technologyreview.com/2026/07/23/1140346/how-ai-helps-scientists-design-the-next-generation-of-medicines/"}, {"rank": 9, "score": 5.5, "title": "Assured Health 獲 1,900 萬美元融資，以 AI 代理人大幅加速醫師網絡資格認證", "summary": "醫療行政科技新創公司 Assured Health 完成 1,900 萬美元融資，其核心產品為 AI 代理人（agentic AI）系統，專門用於自動化醫師資格驗證（credentialing）及保險網絡入網（enrollment）流程。傳統上，醫師完成資格認證並加入保險網絡需耗費數個月時間，嚴重影響醫師快速上線執業及醫院收益。Assured Health 表示，其 AI 系統可將整個流程壓縮至數天內完成，大幅降低行政負擔並加速醫療人力部署效率。對於管理大規模醫師團隊的醫院集團或正在拓展服務網絡的醫療體系，此類 AI 行政自動化工具代表一個值得關注的新興應用方向，有助於提升醫院的營運靈活性與人力資源管理效率。", "tags": ["AI行政自動化", "醫師資格認證", "醫療新創", "代理人AI"], "author": "未標示（MedCity News｜2026-07-23）", "source_url": "https://medcitynews.com/2026/07/assured-health-healthcare-credentialing/"}]}, "2026-07-23": {"date_str": "2026年07月23日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.0, "title": "醫院 AI 系統正在悄悄漂移，最高領導層必須親自把關", "summary": "STAT News 刊出由 Peter Pronovost、Justin Norden 與 Kedar Mate 三位醫療領導人共同撰寫的深度評論，指出醫院部署的 AI 系統往往在上線後逐漸「漂移」——模型效能隨時間衰退、訓練資料與現實脫節、臨床使用情境不斷改變，卻無人即時察覺。文章強調，AI 治理不能只是季度性的技術委員會任務，而必須納入院長、醫療長等最高領導層的日常管理責任。作者提出具體建議：建立持續監測儀表板、明確指定 AI 系統「負責人」、定期進行臨床績效審查，並將 AI 安全納入品質改善框架。此文對正在規劃或已部署多項 AI 工具的醫院而言，具有高度的治理參考價值，呼籲領導層從被動等待問題出現，轉為主動建立問責機制。", "tags": ["AI治理", "醫院領導層", "模型漂移", "患者安全"], "author": "未標示（STAT News｜2026-07-22）", "source_url": "https://www.statnews.com/2026/07/22/hospital-ai-systems-ceo-leadership-accountability-governance/?utm_campaign=rss"}, {"rank": 2, "score": 8.5, "title": "FDA 啟動 TEMPO 數位健康裝置試驗計畫，首家製造商正式入選", "summary": "FDA 宣布「Technology-Enabled Meaningful Patient Outcomes（TEMPO）數位健康裝置試驗計畫」完成首家製造商遴選，正式展開實施。TEMPO 計畫旨在建立以患者實際臨床結果為核心的數位健康裝置審查新框架，突破傳統以技術規格與安全性為主的審查模式，強調裝置在真實世界中對患者生活品質與健康結果的實質影響。此舉被視為 FDA 在 AI 輔助醫療裝置監管路徑上的重要里程碑，預期將為後續數位健康與 AI 醫療器材的上市審查提供可複製的評估模板。對於有意申請 FDA 認證的 AI 醫療工具開發者與醫院採購決策者，此計畫的進展值得密切追蹤，因其可能重塑未來數位醫療產品的設計方向與法規預期。", "tags": ["FDA", "數位健康", "法規監管", "醫療器材"], "author": "未標示（FDA Press Releases｜2026-07-23）", "source_url": "http://www.fda.gov/news-events/press-announcements/fda-announces-first-participant-selected-tempo-digital-health-devices-pilot"}, {"rank": 3, "score": 8.0, "title": "成本不是評判醫療 AI 的正確標準，臨床醫師提出新主張", "summary": "Medical Economics 刊出多位臨床醫師的聯合意見，主張醫療機構與政策制定者在評估 AI 工具時，不應以「是否節省成本」作為主要或唯一指標。作者指出，若純以財務效益衡量 AI 導入成果，將造成系統性偏誤——那些對病患安全、診療品質或醫師工作負擔有顯著改善的工具，可能因短期成本效益不明顯而遭排除。文章呼籲改以「臨床價值」為核心，建立涵蓋診斷準確率、不良事件減少、患者體驗及工作流程優化等多維度的評估架構。此論述對正在制定 AI 採購標準或進行投資報酬率分析的醫院決策層具有直接參考意義，也呼應當前醫療 AI 付費機制討論中「如何定義價值」的核心爭議。", "tags": ["醫療AI評估", "臨床價值", "採購決策", "醫師觀點"], "author": "未標示（Medical Economics｜2026-07-23）", "source_url": "https://news.google.com/rss/articles/CBMinAFBVV95cUxNZzNpbVM2bWFLSnZmZEV4VDJUc2l5a2tVNGROTzF0UGlxMm91bzhCbVFYMFJ1am42REhaVnJpRTRIUllTcld1RFZabDFiWWE0cENsZ01xR0dZUXZkQzZseUpkTEZvWkFPeDd1LW9BazI2NlAxODlYM0NreDFGNDluaW1uUzJzOXdoQ1Q1YVREWElmT09tLVVvVEJQVWs?oc=5"}, {"rank": 4, "score": 7.5, "title": "NVIDIA 高層深談醫療 AI 未來：從影像辨識到全院智慧化佈局", "summary": "MobiHealthNews 刊出對 NVIDIA 醫療事業部高層的深度專訪第一部分，探討 NVIDIA 對醫療 AI 未來發展的整體戰略觀點。受訪者闡述 NVIDIA 如何從單一的影像辨識應用，延伸至支援醫院全院層級的 AI 基礎設施建設，涵蓋 AI 訓練平台、臨床決策支援、數位雙生醫院模型及藥物研發加速等多個面向。訪談中特別提及 GPU 運算力在大型語言模型醫療應用的關鍵角色，以及 NVIDIA 如何與醫療機構、電子病歷廠商及新創公司建立生態系合作。對正在評估 AI 基礎設施投資的醫院資訊部與數位轉型團隊而言，此訪談提供了重要的產業視角，有助於理解未來三至五年醫療 AI 技術演進的主要驅動力量。", "tags": ["NVIDIA", "醫療AI基礎設施", "數位轉型", "產業趨勢"], "author": "未標示（MobiHealthNews｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMifkFVX3lxTFBtdE55eUFlT2thLUxJY3NER19jeXVLTzF1Z2JqeXVGc1VRQm5xdE5FbVhUSUgyemxKREFiQzQ4NjZPOFRWRjZVNjRiMmQyVjN1eUZDd182ek1fVnBzaDB1dnVGUVFhelpsN0Jod1hYZE1ubnM3YWxBRlVZeWZfQQ?oc=5"}, {"rank": 5, "score": 7.5, "title": "AlphaFold3 驅動的接觸預測模型大幅提升 DNA 鹼基編輯精準度", "summary": "Nature 最新刊出研究，介紹名為 ContactSeek 的新型基因組編輯工具，以 AlphaFold3 的蛋白質接觸預測能力為核心，顯著提升 DNA 鹼基編輯的精準度與特異性。研究團隊展示 ContactSeek 能有效降低脫靶效應，在多種細胞類型及基因組位點均表現出穩定的高效率編輯能力。此突破對精準醫療、罕見遺傳疾病治療及癌症基因治療的開發具有重要意義。AlphaFold 系列模型持續擴展其在醫療科學研究的應用邊界，從蛋白質結構預測延伸至基因編輯工具設計，顯示 AI 在基礎醫學研究的角色日益核心化。對醫院基因治療團隊與轉譯醫學研究人員而言，此技術進展值得持續關注其臨床轉譯潛力。", "tags": ["AlphaFold", "基因編輯", "精準醫療", "AI生物技術"], "author": "未標示（Nature｜2026-07-22）", "source_url": "https://www.nature.com/articles/s41586-026-10794-z"}, {"rank": 6, "score": 7.0, "title": "可稽核的放射科 AI 基礎模型 CLEAR 問世，以臨床概念為錨點", "summary": "Newswise 報導新型放射科 AI 基礎模型 CLEAR（Clinical Concepts-grounded Auditable Radiology Foundation Model）正式發表。與現有黑箱式放射影像 AI 不同，CLEAR 的設計核心在於「可稽核性」——其決策過程以可解釋的臨床概念為基礎，使放射科醫師能追蹤模型判讀的推理路徑，而非僅接受結果輸出。研究團隊強調此設計有助於建立臨床信任、符合監管要求，並在模型出錯時提供可追責的審查依據。在 EU AI 法案對高風險醫療 AI 要求透明度與可解釋性的背景下，CLEAR 的架構思路具有重要的法規合規參考價值，也直接回應了放射科 AI 臨床導入的核心障礙之一。", "tags": ["放射科AI", "可解釋性AI", "基礎模型", "臨床信任"], "author": "未標示（Newswise｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxPZWtsLUxOb21Jc3dwMlJlOXZmS2V3LUpUek9POHpaVks4dHFLTTFwdnlqQ2NQelBObDJCb2FPTmtVbkxqRnB3THozSWVDeUhYTFgwZHF3NlROZUdNQWlaTUNsclp4V3ByX1hCRUpiSTZCMTFSLU5zOFFhTnJ2Ym1mU3NFT29LR2FxNmIyajIxRk5ERkZvV1ZQQllLOThudEI2NXhzb0NxUUhad3VSVmZsUFJOcw?oc=5"}, {"rank": 7, "score": 7.0, "title": "AI 病理診斷提速：從 5 分鐘壓縮至 50 秒的臨床突破", "summary": "CGTN 報導中國醫療機構導入 AI 輔助病理診斷系統後，將單張病理切片的判讀時間從平均 5 分鐘大幅縮短至 50 秒，效率提升達六倍以上。該系統整合深度學習影像分析，能在數位病理切片中自動識別腫瘤區域、細胞形態異常及分子標記特徵，並提供初步診斷建議供病理科醫師確認。報導指出此技術已在多家三級醫院完成臨床驗證，顯示 AI 在縮短病理報告周轉時間、紓解病理科人力瓶頸方面具有實質效益。對於面臨病理科醫師短缺與檢體量持續增加雙重壓力的醫療機構而言，此類 AI 輔助工具的部署經驗具有高度參考價值。", "tags": ["病理AI", "數位病理", "診斷效率", "影像辨識"], "author": "未標示（news.cgtn.com｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxNR2llX2l4empkSzQ0Q002LTIyRnhPZWplVEFuWk5acTR4aFFVNmdlTWwwLVRWR1RpbmRPRGY1TFlkRXJZS0JwLS1SUWFFazBHOUNYQU5OUEtyaWNUSWZTd1VNSnUwVTlvLU1kcWJvSkw0QkNoMnpiZ091SzFtN3hBNFRKUDJWT2dZZkNGaFR3dmduTzFpc1podXk3UWlKODZ2ZDZWLTNpUi1LTm5VSjE2X3YzV3JxcWVSOXFzSGZuVQ?oc=5"}, {"rank": 8, "score": 6.5, "title": "個人化醫療的種族盲點：AI 基因預測模型為何系統性忽視非白人族群", "summary": "關鍵評論網刊出深度分析，指出當前以 AI 驅動的基因風險預測與個人化醫療工具，因訓練資料嚴重偏向歐洲裔白人基因組資料庫，導致對亞洲、非洲及其他非白人族群的預測準確度明顯低落，形成「個人化醫療的種族不平等」。文章援引多項研究，顯示多基因風險評分在非歐裔族群的預測效能僅達白人族群的 30%–60%，可能導致高風險患者被低估、藥物基因組建議出現偏差。此議題對台灣醫療體系尤具意義：台灣患者若依賴以白人資料訓練的 AI 工具進行基因風險評估，可能面臨系統性診斷誤差。文章呼籲建立涵蓋多元族裔的基因資料庫，並在 AI 醫療工具採購時納入族裔代表性審查標準。", "tags": ["AI公平性", "基因體學", "族裔偏誤", "個人化醫療"], "author": "未標示（TNL The News Lens 關鍵評論網｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE04dDZxaG1DWXJFdF9PdzJOaWRnYXZmV2Q4ZDdRd1hUQ0tWQWpnTWtzZTZnRldmUGRDMGhyU1YxcEpNd19kbUxfMkpqLVZPTzJObmxWNQ?oc=5"}, {"rank": 9, "score": 6.0, "title": "AI 重新設計蛋白質演化起始點，酵素工程效能大幅躍升", "summary": "Nature 刊出研究，提出結合 AI 重新設計蛋白質起始序列的酵素演化新工作流程。傳統蛋白質演化方法以天然蛋白質序列為起點進行定向演化，而此研究團隊透過 AI 模型預先生成最佳化的「人工起始點」，再進行演化篩選，最終獲得的酵素在活性、穩定性及特異性上均顯著優於從天然序列出發的對照組。此方法論突破有望加速酵素藥物、生物催化製程及抗體藥物的開發效率。對於生技製藥領域而言，AI 輔助蛋白質工程正從結構預測擴展至主動設計，代表藥物研發管線的深層變革。此研究亦彰顯 AI 在生命科學基礎研究的持續滲透，為醫院附設研究中心及轉譯醫學部門提供前瞻技術參考。", "tags": ["蛋白質工程", "AI藥物研發", "酵素演化", "生技製藥"], "author": "未標示（Nature｜2026-07-22）", "source_url": "https://www.nature.com/articles/s41586-026-10820-0"}]}, "2026-07-22": {"date_str": "2026年07月22日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.0, "title": "AI 成功提前 16 個月揪出胰臟癌，精準判讀建立早期診斷新標竿", "summary": "風傳媒報導，台灣臨床團隊運用醫療 AI 影像精準判讀技術，成功在症狀出現前 16 個月即偵測出素有「癌王」之稱的胰臟癌病灶。胰臟癌因早期症狀不明顯、缺乏有效篩檢工具，確診時多已屬晚期，五年存活率極低。此案例顯示 AI 輔助影像分析具備捕捉微小異常徵兆的能力，可大幅縮短確診所需時間，為高風險族群提供更積極的早期介入機會。該案例對於推動 AI 應用於消化道腫瘤早期篩檢具有重要示範意義，也引發醫界對於如何將類似技術系統性導入常規健康檢查流程的討論。若此類 AI 工具能通過大規模臨床驗證並獲得主管機關核准，將對胰臟癌的整體診療策略產生根本性影響，並為醫院建立癌症早期偵測競爭優勢提供有力依據。", "tags": ["早期癌症偵測", "AI影像判讀", "胰臟癌", "台灣醫療AI"], "author": "未標示（風傳媒｜2026-07-21）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE9TNFJ5a09ycHN2QXppV28wNVpYWTZpemZIWGg0QWtxdEtiZTJlT0NLR01WMnpsc1duSGZuLVQ4VkpveENNOXNBQVR3WFFtdw?oc=5"}, {"rank": 2, "score": 8.5, "title": "EU AI 法案放射科篇：合規之外，病患安全才是真正核心", "summary": "AuntMinnieEurope 深度分析歐盟 AI 法案（EU AI Act）對放射科 AI 部署的實質影響，指出許多醫療機構目前僅聚焦於「達到法規合規門檻」，卻忽略該法案真正的立法精神——以病患安全為最終目標。文章指出，放射科 AI 系統在 EU AI Act 架構下被歸類為高風險 AI，須符合嚴格的透明度、可解釋性與臨床驗證要求。作者警示，若醫院僅以勾選清單方式應付合規審查，而未建立持續監測 AI 誤判率、確保人機協作品質的內部機制，將無法真正保障診斷安全。此篇分析對正在規劃或已部署放射科 AI 的醫院具有直接參考價值，尤其適合資訊部與影像醫學科聯合審視現行 AI 治理框架是否符合「安全優先」原則，而非僅滿足表面合規要求。", "tags": ["EU AI法案", "放射科AI", "AI治理", "法規合規"], "author": "未標示（AuntMinnieEurope｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxOaDEwcFpTYW1kR1Fyd2JYai1rQnZ3NmNPYUhhUm4zOE1hU2lfUDc4SVdSam11OVVJR2U1d05zR0hWR2gwYXljMnhMVnhUQTJtcDJXSG01NW1QZ2VkVHF1SWg4ZVBUTmREVThfMHFHUUZIZ2x5dFNlZEdOLU1jN2FfRk13WlNFT2hnRWxQZWY1blhzWFNrTGk3MW5tY1ctNUtaaVBvcEFyWldGR0p3aWdTVV9pWm9kUVBZUGV6cDJXcDFySW5rdDVQUXNsTmRBbkJOOFEweEVPM0pYUWlaOWhwRDhQWQ?oc=5"}, {"rank": 3, "score": 8.0, "title": "醫療 AI 隱私風險遠超預期，Physics World 最新研究示警", "summary": "Physics World 發表研究警示，醫療 AI 系統的隱私洩漏風險遠比學界與業界過去所認知的嚴重。研究指出，AI 模型在訓練過程中可能無意間記憶並重現病患個人資料，即便採取匿名化或資料去識別化處理，仍無法完全防止「成員推斷攻擊」（membership inference attack）等手法還原敏感資訊。隨著醫院大規模導入以真實病患資料訓練的診斷 AI 工具，此類隱私風險將直接衝擊醫療機構的資安合規責任與病患信任基礎。研究呼籲開發端與部署端應採用差分隱私（differential privacy）、聯邦學習等技術降低資料洩露風險，並建議監管單位重新審視現行醫療 AI 隱私保護標準。此篇對資訊部、法規遵循團隊及採購 AI 產品的臨床科別均具重要參考意義。", "tags": ["AI隱私風險", "資料安全", "醫療AI治理", "聯邦學習"], "author": "未標示（Physics World｜2026-07-21）", "source_url": "https://news.google.com/rss/articles/CBMimAFBVV95cUxQNlJiZzd1M3MwQnowOTF5bTZ2ZWtnSmVYeHNkQUVmZy1XNmdBLTJWWEFxN3U0c0ozY2Nvc0U3WHZlM0llYU9WSXJTcEFjTWhKcGlJRjNWam05MnlUcVlZemZMUEVETGRkUzMzQ3FUSDI0UTNpTUV4dDZUWnIwUDFiblJCMmdTeDF6alNveDc4dDRJTEg3TG5aUw?oc=5"}, {"rank": 4, "score": 7.5, "title": "新加坡樟宜綜合醫院攜手 IBM 打造 AI 兒科急診訓練平台", "summary": "新加坡樟宜綜合醫院（Changi General Hospital）宣布與 IBM 合作，共同開發以 AI 驅動的兒科急診醫療訓練平台。該平台旨在透過模擬真實急診情境，協助醫師與護理人員強化在高壓環境下的臨床決策能力，並利用 AI 即時分析學員表現、提供個人化回饋建議。兒科急診因病情變化快速且病患溝通困難，歷來是醫療人員訓練的高難度挑戰領域。此合作模式展示了 AI 在醫學教育與技能培訓場域的實際應用潛力，有別於傳統標準化病人或模擬器訓練，AI 平台可無限次重現罕見危急情境，並客觀追蹤學員進步曲線。此案例對有意推動住院醫師培訓數位化或建立急診模擬中心的醫療機構具有重要參考價值。", "tags": ["AI醫學教育", "兒科急診", "臨床訓練", "醫療AI應用"], "author": "未標示（The Edge Singapore｜2026-07-21）", "source_url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxQTVNmcHRKWkUxbTFGbVJTUWNFLVEzSERQQnI1bTQ2UzhkYTlUVVJmcUZJUnFaZUNOTzRhc01KYnN5U0FXSFBOQUdyV013VzFhTjRVVHZ6aGxscXBBTHd6N3RYZWNSakdRUEJidjFHeGM3Y2s2OEpPRHNMdFlYcm5nZElFYTBjRUx2SW0zaGpVVUVjWE95d2RpeU8zZWVNTlhhbkNhZzVqU2lmcXNSbGl2a0lHQ1N2U0VWVzFfaWtFdVh0UdIBxwFBVV95cUxPSDVGdTZpR2NqRnBaUTE3d21ka3JhMDl4aVhJYXpXT2xYQ2hfODZVLUpPcFoxeXhnN0VtanI0WjROM1dtRDNaY3RoUC1tYUQ3ZGhWQTJFa1M1d3l6MkZ2RlhrdEpHd29iR2VxbFBJTUU0ZUMtR3YyU0NkLVYxNVRpZGJlbGd3X09BLS1PTTRSMXdOTWR6cW82U2tkWGFsYzQ5RVBTc0d3RXJTZ3MxWVdlSDBoUDZfTXJQbkFpdmI1bjdtZXg2V1lN?oc=5"}, {"rank": 5, "score": 7.0, "title": "MIC 報告：AI 正全面加速台灣醫療業數位轉型", "summary": "資策會產業情報研究所（MIC）最新報告指出，人工智慧正快速滲透台灣醫療產業各環節，涵蓋影像診斷輔助、臨床決策支援、藥物研發加速及醫院行政流程自動化等面向，整體轉型步伐明顯加快。報告分析，台灣醫院在電子病歷基礎建設相對完善的優勢下，具備導入 AI 應用的良好條件，但人才培育、資料標準化與跨院資料共享仍是關鍵瓶頸。MIC 同時指出，健保資料庫的開放程度與監管政策走向，將直接影響台灣醫療 AI 生態系的發展速度。對於醫院領導層而言，此報告提供了台灣醫療 AI 市場整體發展趨勢的宏觀視角，有助於評估機構自身數位轉型進度與產業平均水準之間的落差，並作為優先投資項目規劃的參考依據。", "tags": ["台灣醫療AI", "數位轉型", "MIC報告", "AI產業趨勢"], "author": "未標示（UDN｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTE5BTjZpVEhULVp2MUVESDktWHROM1k2WFNVTF9aLTZNbVpwQXNKd2VtNlpGb0lweXNqYnpqVGRoSmFiWUh6b01OWUowTGJUTy1U0gFWQVVfeXFMTl9HbGxYVk5Bbi1uTlRETFNSWVhwWncycFoxS2lLd3pUejJkeGdjQlZBUGRxV0lVSV9uN3lZWUpPcVR5MTM2eEhvbEJ6eG92M21WVWNIb2c?oc=5"}, {"rank": 6, "score": 6.5, "title": "醫療 AI 軟體測試新框架：三層信任策略突破傳統品質驗證困境", "summary": "HIT Consultant 刊載分析文章，提出針對醫療 AI 軟體的「三層信任策略」（Three-Tiered Trust Strategy），主張現行標準軟體測試方法不足以因應醫療 AI 系統的複雜性與高風險特性。三層架構分別為：技術層（演算法準確性與穩定性驗證）、臨床層（真實醫療情境下的有效性評估）及組織層（導入後持續監控與治理機制）。文章強調，許多醫療機構在採購 AI 工具時過度依賴供應商提供的測試報告，缺乏獨立的臨床驗證程序，導致上線後發生預期外錯誤。此框架建議醫院資訊部與臨床科室共同建立標準化的 AI 上線前測試流程，並設置明確的退場機制，以確保 AI 工具在真實環境中維持預期表現，保障病患安全與醫療品質。", "tags": ["醫療AI測試", "AI品質驗證", "軟體治理", "臨床AI部署"], "author": "未標示（HIT Consultant｜2026-07-21）", "source_url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQV0Q0eFRxM0g1OTFXTzl4WHd1Nk9hRlhGU3FxSXdHM1J4Vzl2NHVHME12RlJpdkN1eEVFbXVaZXBvVzBPNXZ4QVJYZlk3TjRQSk5aai1BdFBRMmpyOVVRSjBLUjNXaU1HOUNTNlhJWTJMakJqU2xSZ05XaHZ5OXBSVFdZVW5rUGY1R3RKQzlwZzQ3SDc1?oc=5"}, {"rank": 7, "score": 6.0, "title": "AI 武器偵測系統強化醫院安全防線，提升院區即時應變能力", "summary": "Security Today 報導，新一代 AI 武器偵測系統正被引入醫療院所，透過結合電腦視覺與深度學習技術，對進入醫院的人員進行非接觸式武器掃描，可即時辨識刀具、槍械等威脅物品，並自動觸發安全警報。相較於傳統金屬探測門，AI 系統具備更高的辨識精準度、更低的誤報率，且不需要人員停留配合，可大幅降低急診室與高流量入口的安全管理負擔。隨著醫療場所暴力事件受到全球關注，此類 AI 安防工具為醫院提供了兼顧效率與安全的新選項。然而，導入前須審慎評估隱私法規相容性、資料儲存政策及誤判率對就診體驗的影響，確保安全防護不影響病患就醫權益。", "tags": ["醫院安全", "AI武器偵測", "院區安防", "電腦視覺"], "author": "未標示（Security Today｜2026-07-22）", "source_url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxNLU91dE9tTGxRT1VNanVTOFpfQ1YxZXRLeXR5OEI2cG9GLURyNzc3TlRjeFVNYmRZcmktNm1Pd1R4Wm41V3pvRWFCZE1qZ3JOS01DelRPSDFBbm1KaUFxVGI1SEFRZnY1RmhHUExPajRGX1FzWlVNcnF1NVl4ZXJ3Vzl1dTBCSWJDQ0M1V3Izb0Vydl9GNGxZeHVNWHQ5d21KNVZpY2tSeGc?oc=5"}, {"rank": 8, "score": 5.5, "title": "Nabla 新任 CEO 上任，加速搶攻競爭激烈的 AI 醫療語音記錄市場", "summary": "STAT News 報導，環境式 AI 語音記錄開發商 Nabla 宣布由 Brian Manning 接任執行長，帶領這家總部位於巴黎的公司在競爭日趨白熱化的 AI 語音病歷（ambient scribe）市場中擴張市占率。Nabla 的核心產品能在診間自動擷取醫病對話並生成結構化病歷草稿，協助醫師減少行政文書負擔。然而，包括 Nuance（微軟旗下）、Suki、Abridge 等競爭對手均在積極爭奪醫院合約，市場進入白熱化競爭階段。新任 CEO 的策略布局與 Nabla 的差異化定位，將直接影響其能否在北美市場取得突破。對於正在評估或已導入 AI 語音病歷系統的醫療機構，此人事異動可作為觀察供應商長期穩定性與產品路線圖的參考指標。", "tags": ["AI語音病歷", "Ambient Scribe", "醫療AI新創", "臨床文書自動化"], "author": "未標示（STAT News｜2026-07-21）", "source_url": "https://www.statnews.com/2026/07/21/ai-scribe-nabla-new-ceo-plan-gain-marketshare/?utm_campaign=rss"}]}, "2026-07-21": {"date_str": "2026年07月21日", "weekday": "星期二", "items": [{"rank": 1, "score": 9.0, "title": "Aidoc 放射報告草擬 AI 獲 FDA 突破性指定，影像醫學自動化邁入新里程", "summary": "影像 AI 領導廠商 Aidoc 宣布其放射科報告草擬 AI 系統獲得 FDA「突破性醫療器材指定（Breakthrough Device Designation）」，成為全球首批獲此殊榮的放射報告自動化工具之一。此指定意味著 FDA 將給予優先審查資源並與開發商密切互動，加速取得上市許可的時程。Aidoc 的系統能根據影像掃描結果自動生成結構化診斷報告草稿，目標大幅縮短放射科醫師報告撰寫時間、降低積壓工作量。此舉對全球面臨放射科人力短缺的醫療體系具有重要意義，亦顯示 FDA 對臨床工作流程 AI 輔助工具的政策態度持續開放。對於正在評估影像 AI 導入的醫院資訊與放射科團隊而言，此一監管里程碑值得密切追蹤，後續上市時程與臨床驗證數據將是決策關鍵依據。", "tags": ["放射科AI", "FDA突破性指定", "影像醫學", "工作流程自動化"], "author": "未標示（The Healthcare Technology Report｜2026-07-20）", "source_url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxPQk1oc3Ywd1hMb1hZcHRLV3ZPSWJyQ18weHJxakpVUlB2QU4xd2IwSndaQVdEazZDa3JTOHdvMVJmeWNUYUM1cktZX09Sc0hNVTh3X1FrV1Z2bW5UbFpRT1BlTHhCWTFTWUdHVFVLQWNRMDZmMkgwa09LNGY5Z0xkWHR6TVFOYWZybE9vNEpXZTBNeHdjVFpqa1FLQVNhcUhjNmYwRmtJRk10ME1Gdm8xOXh0NW52R0VLazNV?oc=5"}, {"rank": 2, "score": 8.5, "title": "臨床 AI 如何定價付費？Peterson 研究院提出三大關鍵警示", "summary": "Peterson Health Technology Institute 最新報告指出，現行醫療支付模式根本不適用於臨床 AI 工具，若不加以改革，反而可能推高整體醫療成本。報告提出三大核心觀察：第一，現行論量計酬（fee-for-service）制度可能誘導不必要的 AI 驅動檢查或治療；第二，缺乏成效導向的付費機制，使醫院難以獲得合理回報而陷入投資困境；第三，AI 的跨機構擴散效益無法在現行架構下被合理捕捉。報告呼籲 CMS 及民間保險業者儘速建立以病患預後為核心的 AI 給付框架，並要求 AI 工具提供真實世界臨床證據才能申請給付。此議題直接影響醫院決策層評估 AI 投資報酬率的依據，也與先前 CMS 提出的成效導向給付方向相互呼應，是 2026 年下半年醫療 AI 政策最關鍵的討論焦點之一。", "tags": ["臨床AI給付", "醫療政策", "支付模式改革", "CMS"], "author": "未標示（MedCity News｜2026-07-21）", "source_url": "https://medcitynews.com/2026/07/how-should-clinical-ai-be-paid-for-3-takeaways/"}, {"rank": 3, "score": 8.0, "title": "Johns Hopkins 與 FDA 合作開發工具，專門揪出醫療 AI 訓練資料中的隱性偏誤", "summary": "Johns Hopkins 大學研究團隊與 FDA 合作，發表一套可系統性偵測醫療 AI 訓練資料中「隱性偏誤」的評估工具。研究指出，許多醫療 AI 模型雖在整體表現上達標，但針對特定族群（如少數族裔、老年人或低收入患者）的預測準確率明顯偏低，此類偏誤往往隱藏於訓練資料的採樣不均與標籤錯誤中，難以用傳統驗證方法察覺。新工具能自動掃描資料集的人口結構分布、標記潛在偏誤區段，並生成可供監管審查的偏誤報告。FDA 的參與顯示此類工具未來可能納入醫療 AI 上市前審查的標準流程，對正在自建或採購 AI 解決方案的醫院資訊部門具有直接的合規參考價值，有助於在部署前識別並修正模型公平性問題。", "tags": ["AI偏誤", "資料品質", "FDA監管", "醫療AI公平性"], "author": "未標示（iAfrica.com｜2026-07-20）", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxOSlZVeTNoQ0QtdUZzN2F2Rkl4RE5HZVo3eGM3aF9qRXk4cmMxM3J1eWFPUURXZU1aRnJMSFZESzhsWDFKLWVxMVNYWFc0bnFNU0VTemdsRVAxenVJaVcydlVJY1dTbk9SYy1LRXpVZXJBMnFwWXpSRmY1dnpGck9GdFJDcmlYQTMyY3NfREs4TTQwRXUxeUpyT3k1WDZYSjVid2pPVm5oRQ?oc=5"}, {"rank": 4, "score": 7.5, "title": "協助病患的 AI 同時成為攻擊醫院的武器——芝加哥大學醫學中心資安主管示警", "summary": "芝加哥大學醫學中心資訊安全暨隱私長 Karen Habercoss 公開示警，指出醫療機構廣泛導入 AI 以改善照護品質的同時，駭客與國家級攻擊者也正利用同等技術發動更快速、更精準的網路攻擊。AI 能自動化掃描醫院系統弱點、生成高度擬真的釣魚郵件、甚至偽造醫療語音指令，使傳統防禦機制難以應對。Habercoss 強調，醫院必須建立跨部門的 AI 治理架構，將資安風險納入 AI 導入決策的核心評估項目，而非事後補救。她指出現行多數醫院的 AI 治理框架仍側重臨床效能，對雙重用途風險（dual-use risk）明顯準備不足。此議題對正在推進醫療 AI 數位轉型的醫院領導層與資訊部門具有高度警示意義，建議將 AI 資安評估納入採購與部署標準流程。", "tags": ["醫療資安", "AI治理", "網路攻擊", "雙重用途風險"], "author": "未標示（MedCity News｜2026-07-21）", "source_url": "https://medcitynews.com/2026/07/ai-cybersecurity-hospital/"}, {"rank": 5, "score": 7.5, "title": "醫療 AI 的專利、FDA 審查與 HIPAA 三重法規張力：開發者如何在夾縫中生存", "summary": "MedCity News 深度分析指出，醫療 AI 開發者正同時面臨三套相互牽制的法律體制：專利法要求盡早公開揭露以確保保護，但過早揭露可能影響 FDA 審查策略；FDA 的上市前審查強調安全性與臨床證據，但審查週期拉長又可能讓競爭者搶先佈局；而 HIPAA 對患者資料的嚴格限制，則直接制約了訓練資料的可及性與模型的持續優化空間。文章指出，三種法律框架的設計初衷各異，彼此之間缺乏協調機制，導致開發者必須從立項之初便同步規劃法規路徑，否則後期調整成本極高。此分析對醫院自行開發或與新創合作推動 AI 工具的法務、資訊與臨床團隊具有實務參考價值，有助於提前識別合規風險並建立跨部門協作機制。", "tags": ["醫療AI法規", "FDA審查", "HIPAA", "知識產權"], "author": "未標示（MedCity News｜2026-07-20）", "source_url": "https://medcitynews.com/2026/07/the-ai-tension-in-healthcare-patent-strategy-fda-reality-and-hipaa-constraints/"}, {"rank": 6, "score": 7.0, "title": "Tempus AI 以 15 億美元收購 Personalis，液態切片與癌症 MRD 檢測市場格局劇變", "summary": "醫療 AI 領導企業 Tempus AI 宣布以 15 億美元收購液態切片公司 Personalis，交易完成後將強化其在微量殘存病灶（MRD）檢測領域的市場地位。Personalis 的核心產品能在癌症初次治療後偵測血液中極微量的殘留癌細胞，Tempus AI 自 2023 年起即為其商業合作夥伴，熟悉其技術架構與市場通路。此次垂直整合意味著 Tempus 將把 AI 數據分析平台與高敏感度基因檢測緊密結合，預期大幅提升癌症復發預警的精準度與商業規模。MRD 市場目前快速成長，多家大型檢驗機構與醫療 AI 新創均積極布局。對腫瘤科與病理科而言，此一整合將影響未來癌症隨訪監測的工具選擇與採購策略，也反映醫療 AI 與精準診斷正加速走向高度整合。", "tags": ["癌症AI診斷", "液態切片", "MRD檢測", "醫療AI併購"], "author": "未標示（MedCity News｜2026-07-21）", "source_url": "https://medcitynews.com/2026/07/tempus-ai-personalis-acquisition-cancer-mrd-diagnostics-detection-tem-psnl/"}, {"rank": 7, "score": 6.5, "title": "醫療 AI 會考試不等於會看病：權威研究揭示臨床任務表現僅 44.8 分", "summary": "一項廣受關注的權威研究指出，現行主流醫療 AI 模型雖然在標準化醫師執照考試（如 USMLE）中表現優異，但面對真實臨床任務時，綜合表現評分僅達 44.8 分（滿分 100 分），顯示考試型評估與實際臨床應用之間存在顯著落差。研究分析了模型在病史詢問、鑑別診斷、治療計畫擬定及與患者溝通等多個臨床情境下的表現，發現模型在需要整合多源資訊、處理模糊情境及進行動態決策時表現明顯不足。研究者警示，以考試成績作為醫療 AI 臨床部署的主要評估依據存在根本性風險，呼籲建立更貼近真實臨床工作流程的評估標準。此一發現對 const TODAY_ISO  = "2026-07-27";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
