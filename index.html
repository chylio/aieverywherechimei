<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇美 AI Everywhere Brief｜2026年06月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0a1628;
    --blue:    #1a4a8a;
    --accent:  #2b7fe8;
    --light-blue: #e8f2fd;
    --teal:    #0e9f8e;
    --red:     #d63c2f;
    --orange:  #e07520;
    --green:   #1e9e5a;
    --bg:      #f2f5f9;
    --surface: #ffffff;
    --border:  #dce4ef;
    --text:    #1a2333;
    --text2:   #445066;
    --muted:   #7a8899;
    --serif:   'Noto Serif TC', serif;
    --sans:    'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.8;
  }
  /* ── HEADER ── */
  .header {
    background: var(--navy);
    background-image: linear-gradient(135deg, #0a1628 0%, #162d58 60%, #1a4a8a 100%);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .logo-icon img, .logo-icon svg { width: 100%; height: 100%; object-fit: contain; }
  .logo-text h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .logo-text p { font-size: 0.8rem; color: #8aafd4; margin-top: 1px; }
  .header-date {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.88rem;
    color: #a8c8ea;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-archive-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px;
    font-size: 0.88rem; font-weight: 700; white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 10px rgba(43,127,232,0.3);
    transition: transform 0.15s, filter 0.15s;
  }
  .header-archive-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  /* ── BREADCRUMB ── */
  .breadcrumb {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .breadcrumb-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { color: #c0c8d4; }
  .breadcrumb .current { color: var(--accent); font-weight: 600; }
  /* ── LAYOUT ── */
  .layout {
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 32px 100px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }
  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 82px; }
  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.06);
  }
  .sidebar-head {
    background: var(--navy);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 12px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    font-size: 0.92rem;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid #f0f4f8;
    transition: all 0.15s;
  }
  .sidebar-link:last-child { border-bottom: none; }
  .sidebar-link:hover { background: var(--light-blue); color: var(--accent); }
  .sidebar-link.active { color: var(--accent); font-weight: 700; background: #eef5fd; }
  .sidebar-link .count {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-link.active .count { background: var(--accent); color: #fff; }
  .tag-cloud { padding: 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag-chip {
    font-size: 0.84rem;
    color: var(--accent);
    background: var(--light-blue);
    border-radius: 20px;
    padding: 3px 10px;
    text-decoration: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tag-chip:hover { background: var(--accent); color: #fff; }
  /* ── MAIN ── */
  .main { min-width: 0; }
  .page-title-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 36px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(10,22,40,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title-bar h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .count-badge {
    background: var(--light-blue);
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .list-meta {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .list-meta-label {
    background: var(--accent);
    color: #fff;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 4px;
  }
  /* ── ARTICLE CARD ── */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 40px 30px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 0 24px;
    transition: background 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.4s ease both;
  }
  .article-card:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .article-card:last-child { border-radius: 0 0 12px 12px; }
  .article-card:hover { background: #fafcff; box-shadow: inset 3px 0 0 var(--accent); }
  
  .article-card:nth-child(1) { animation-delay: 0.05s; }
  
  .article-card:nth-child(2) { animation-delay: 0.1s; }
  
  .article-card:nth-child(3) { animation-delay: 0.15s; }
  
  .article-card:nth-child(4) { animation-delay: 0.2s; }
  
  .article-card:nth-child(5) { animation-delay: 0.25s; }
  
  .article-card:nth-child(6) { animation-delay: 0.3s; }
  
  .article-card:nth-child(7) { animation-delay: 0.35s; }
  
  .card-num { padding-top: 4px; text-align: center; }
  .num-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .num-top1 { background: #fff0ee; border-color: var(--red); color: var(--red); }
  .num-top2 { background: #fff4ec; border-color: var(--orange); color: var(--orange); }
  .num-top3 { background: #edfbf4; border-color: var(--green); color: var(--green); }
  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; }
  .b-top1 { background: var(--red); color: #fff; }
  .b-top2 { background: var(--orange); color: #fff; }
  .b-top3 { background: var(--green); color: #fff; }
  .b-focus { background: var(--blue); color: #fff; }
  .b-cat { background: var(--light-blue); color: var(--blue); font-weight: 600; border: 1px solid #c5dbf5; }
  .card-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .card-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .article-card:hover .card-title a { color: var(--accent); }
  .card-meta {
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-summary { font-size: 0.98rem; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid #f0f4f8;
  }
  .hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { font-size: 0.84rem; color: var(--accent); text-decoration: none; }
  .hashtag:hover { color: var(--navy); text-decoration: underline; }
  .source-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .source-btn:hover { background: var(--accent); }
  /* ── FOOTER ── */
  .footer {
    background: var(--navy);
    color: #6a8aaa;
    text-align: center;
    padding: 28px 20px;
    font-size: 0.82rem;
    margin-top: 40px;
    line-height: 2;
  }
  .footer strong { color: #a0bcd8; }
  /* ── DATE NAV ── */
  .date-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    box-shadow: 0 2px 6px rgba(10,22,40,0.04);
  }
  .date-nav-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
    white-space: nowrap;
  }
  .date-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 68px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .date-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--light-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(43,127,232,0.15);
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(43,127,232,0.3);
    transform: translateY(-1px);
  }
  .date-btn.disabled {
    opacity: 0.38;
    cursor: not-allowed;
    background: #f6f8fb;
    border-color: #e4e9f0;
    color: var(--muted);
  }
  .date-btn-weekday {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .date-btn-md {
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* ── RWD ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 20px 16px 60px; }
    .sidebar { display: none; }
    .header-inner { padding: 14px 20px; }
    .header-date { display: none; }
    .article-card { padding: 18px 18px 16px; grid-template-columns: 32px 1fr; gap: 0 12px; }
    .card-title { font-size: 1.05rem; }
    .page-title-bar { padding: 16px 20px; }
    .date-nav-inner { padding: 0 16px; gap: 7px; }
    .date-btn { min-width: 56px; padding: 7px 8px; }
    .date-btn-weekday { font-size: 0.7rem; }
    .date-btn-md { font-size: 0.82rem; }
    .date-nav-label { display: none; }
  }
</style>
</head>

"tags": ["敗血症", "AI預警系統", "患者安全", "急重症照護"], "author": "未標示（Palo Alto Daily Post｜2026-06-19）", "source_url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxOcGVpVzNZamlEb3ZndXhVSE9vVkxOUktfX2huUzU2ZWxQWS1FVjNRaDRBTWE1clhPSXQ3SnFkOFJlOG1ScW9lamZrcm01WWY0eVhxMnkxRGM3aTA5TENDVWE0VmRXWVpvdzFkNWR5eEU3UEhPcWlmVF9ySTM3R3Q3YnpYdFlaUXVsdjFZLW5R?oc=5"}, {"rank": 4, "score": 8.5, "title": "AI診斷錯誤將加重醫院法律責任，醫師深度介入成關鍵", "summary": "News-Medical報導一項法律與醫療責任研究，指出當AI輔助診斷系統發生錯誤時，若醫師未保持深度介入與獨立判斷，醫院將面臨更高的法律責任風險。研究分析多起涉及AI診斷失誤的案例，發現法院傾向於認定醫療機構對AI系統輸出負有督導義務，「AI決定、醫師簽核」的被動模式將使醫院難以主張免責。研究者強調，AI應定位為輔助工具而非決策主體，並建議醫療機構建立明確的AI使用規範、錯誤通報機制及定期稽核流程，以降低法律暴露風險。此議題對醫療體系的臨床治理框架與AI部署政策具有直接影響，醫院管理層與法務部門應共同制定因應策略。", "tags": ["AI法律責任", "醫療治理", "臨床決策", "患者安全"], "author": "未標示（News-Medical｜2026-06-18）", "source_url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxOTUl3U3BEaWVoU3hZOWxjclFyOUluSUZsQkVRQjFPcVh5OHRqTEQ2X2ZZV2ozcFB4MEVLMXNzT2pxckZGYnBtbzA2WHRfR2NrNDA2TlpYZnl2WUNNOWJwRl8taEJsMlF6NFRmUnEwbWRNMVljR0hqWWN4MWJybFg2NkJoV2twUEIwTHFCWngzR1VPT3UyQmNaMTg1QU5RakU0S0pyelp6U0V4aWxxT0tjMTJha2VJN2s0SE1qLW1UN25vUQ?oc=5"}, {"rank": 5, "score": 8.3, "title": "Nature警示：過度依賴AI將侵蝕醫師與工程師的專業技能", "summary": "Nature刊出研究報告，彙整多項早期研究結果，發現持續依賴AI工具已對醫師及軟體工程師等專業人員的核心技能產生負面影響。在醫療場域，研究顯示當AI輔助診斷工具長期使用後，醫師對影像判讀、差異診斷及臨床推理的獨立能力出現退化跡象，尤其在AI系統暫時不可用時，醫師的表現明顯低於未依賴AI的對照組。此一「技能侵蝕」效應引發醫學教育界對於如何在AI輔助環境中維持臨床能力的深切關注。專家建議醫療機構在引入AI工具的同時，應同步設計「不依賴AI的訓練情境」，確保醫師維持獨立判斷能力，避免人機協作關係中人的能力持續弱化，進而影響患者照護品質與醫療安全。", "tags": ["AI技能退化", "醫學教育", "臨床能力", "人機協作"], "author": "未標示（Nature｜2026-06-18）", "source_url": "https://www.nature.com/articles/d41586-026-01947-1"}, {"rank": 6, "score": 8.0, "title": "醫療AI認證機制能否填補治理缺口？業界探索標準化路徑", "summary": "Healthcare Dive報導醫療AI治理議題的新進展，探討認證機制是否能有效解決當前醫療AI部署中普遍存在的治理缺口。文章指出，隨著AI系統在臨床決策、影像診斷及行政流程中的應用快速擴張，醫療機構面臨缺乏統一評估標準、監管框架不一致及責任歸屬不清等挑戰。業界部分聲音認為，建立類似醫療設備認證的AI認證體系，可提升各機構間的信任基礎，並協助採購方評估產品可靠性。然而，批評者指出認證流程若設計不當，反而可能形成進入障礙、延緩創新或製造虛假安全感。報導呼籲監管機構、醫療學會與產業界共同研擬具實質意義的認證標準，並結合上市後監測機制以確保持續性品質保障。", "tags": ["AI治理", "認證機制", "醫療監管", "法規政策"], "author": "未標示（Healthcare Dive｜2026-06-18）", "source_url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxOOTI2bGg0Z2s3cGZUUllBQWZjQUNScTByc3ZFUnZDNmxzVGFqWjZRTVdNLTZiSEtSWG9NS0N6aF9ic2o5NVNqOGRPdkNYaTVQUE5fT2Y2dHUyNEtoUjZVc19WWERSWUp6UXIzVlNKTE1xYTl4WGtQT3RSMm5ZN3U2ZEdhM3VjejFaRGdRVE02OVlkX2J3X3R1cXIxM2lranVkZ1hVXzRHODBLZFR1dE1oR1RUN1Z4cnU3TGp0cjJSRFhPZw?oc=5"}, {"rank": 7, "score": 7.8, "title": "Midjourney跨足醫療影像：計畫以水中超音波進行全身高速掃描", "summary": "iThome報導，以AI影像生成聞名的Midjourney宣布跨入醫療影像領域，計畫開發以水中超音波技術為基礎的全身高速掃描解決方案。此一跨界動作引發業界高度關注，Midjourney擬將其在影像生成與深度學習領域的技術積累轉移至醫療影像分析，並結合超音波物理特性開發非輻射性全身掃描平台。相較於傳統CT或MRI，水中超音波掃描具有無游離輻射、成本相對較低及掃描速度快等潛在優勢。然而，醫療影像AI需通過嚴格的臨床驗證與法規審查，技術轉移至臨床應用仍面臨相當挑戰。此消息顯示科技巨頭跨界醫療影像的趨勢持續升溫，對現有醫療影像設備市場及AI診斷生態系將帶來長期結構性影響。", "tags": ["醫療影像AI", "超音波技術", "跨界創新", "台灣醫療AI"], "author": "未標示（iThome｜2026-06-18）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE91a3ZqeEdxQVZ0aURpMFhZYmhsUmdCaXJHMTZXYVYwMzJseldzbGVtVXAwVnlJZGZWQVlyRUJXMmZxNngzeHpQTWNjZ29kUQ?oc=5"}, {"rank": 8, "score": 7.5, "title": "醫療AI擴大部署如何跨越試驗陷阱並維繫機構信任", "summary": "MedCity News刊出深度分析文章，探討醫療機構在嘗試將AI從概念驗證（PoC）擴展至全院規模部署時，如何避免陷入「永遠在試驗、從未真正落地」的困境。文章指出，許多醫院AI計畫停留在試驗階段的根本原因，在於未能將AI視為可支撐數百個動態模型的企業級平台，而非單一用途工具。作者強調，成功規模化的關鍵要素包括：建立明確的AI治理委員會、制定跨部門資料標準、確保與既有電子病歷系統的深度整合，以及持續量測臨床與營運效益。此外，維繫臨床醫師與管理層的信任同等重要，需透過透明的績效報告與使用者回饋機制加以鞏固，才能使AI真正成為醫院數位轉型的核心動力。", "tags": ["AI規模化", "醫療數位轉型", "AI治理", "企業AI平台"], "author": "未標示（MedCity News｜2026-06-18）", "source_url": "https://medcitynews.com/2026/06/beyond-the-pilot-trap-how-healthcare-can-scale-ai-without-losing-trust/"}, {"rank": 9, "score": 7.3, "title": "健保署擴增LOINC上傳欄位，醫學中心優先試傳推動數據標準化", "summary": "iThome MedTech雙周報第51期報導，台灣健保署今年將擴增LOINC（邏輯觀察識別碼與名稱系統）上傳欄位，並規劃由醫學中心優先進行試傳。此舉旨在強化健保資料庫的結構化程度，為未來醫療AI模型訓練、跨院資料交換及臨床研究奠定更完整的數據基礎。LOINC是國際通用的醫療資料標準，廣泛用於實驗室檢驗、影像及臨床觀察結果的標準化編碼。健保署此次擴增舉措，代表台灣醫療資料互通性政策的重要進展，有助於縮小與國際醫療資訊標準的落差，並為健保AI應用創造更豐富的結構化資料來源。各醫學中心資訊部門應提前評估系統配合需求，確保在試傳期間符合上傳規格要求。", "tags": ["健保署", "LOINC", "醫療資料標準化", "台灣醫療AI"], "author": "未標示（iThome｜2026-06-18）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTFBiWnFjamptSmN0NFVlY0VJQ2pNejJKeHBRa3JuSExwOWFRdS1lbGRIcVFVaEJqY25UX2NpQ1lsRVJHc2RqaUhxR1JtUWhxQQ?oc=5"}, {"rank": 10, "score": 7.0, "title": "Proscia推出第五代Concentriq平台，嵌入多模態AI強化病理與藥物開發", "summary": "Lab Manager報導，數位病理平台公司Proscia正式發布第五代Concentriq平台，核心亮點為嵌入式多模態AI功能，整合影像分析、基因組學及臨床資料，同時服務臨床病理診斷與藥物開發兩大場域。新版本強化了AI模型在不同組織類型與染色方案下的泛化能力，並提供更完善的資料管理與工作流程自動化工具。對於製藥公司的臨床試驗病理評估及醫院病理科的日常診斷作業，此平台均可提供端對端的數位化解決方案。Proscia此次升級顯示數位病理AI已從單一腫瘤類型邁向跨癌種的泛化診斷能力，也呼應了近期「從單一腫瘤到泛癌症AI診斷」的整體趨勢，對病理科數位轉型規劃具有參考價值。", "tags": ["數位病理", "多模態AI", "癌症診斷", "藥物開發"], "author": "未標示（Lab Manager｜2026-06-19）", "source_url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxPNmxKSkh5eWVjNkQzcmsyM3hDdk9MdnBsRU1LLV9rN1luUlZUZjRMdFp0UHd2c3hhTG1PVUNkdk5mTGFfM0JRVEdkWjdRYTZJbk5BM1YydTY1YTNIMlRiZUZTYjRjNWFJamh1Mmw2WDNMZUZJajBqWjJKbVVWRFU3RkJoUmFPMEM1eC1mLTl4MW9DSnVPeVBmYkRsVTdOVW1SeC1Td3NnZnF2OUVzbkc1ci0xYzFxaDFhaDhrTjA2RzA3eHFXQk40SzczMHdFdmQ0OUpZQTd1bnUyU00?oc=5"}]}, "2026-06-18": {"date_str": "2026年06月18日", "weekday": "星期四", "items": [{"rank": 1, "score": 9.5, "title": "Nature重磅：自主醫療AI代理人在電子病歷系統中表現超越資深臨床醫師", "summary": "Nature期刊於2026年6月17日發表重要研究，展示一款大型語言模型AI代理人在沙盒化電子健康紀錄系統中，能夠自主完成詢問病史、開立檢查、解讀結果、診斷病情及提出治療方案等完整臨床工作流程。研究結果顯示，該AI代理人在多項任務上的表現優於資深臨床醫師，且同步遵守安全標準與臨床指引。此研究代表醫療AI從「輔助工具」邁向「自主代理人」的重大典範轉移，對醫院資訊系統整合、醫師角色定位及AI監管框架皆具有深遠影響。研究採用沙盒環境以確保安全性，但作者亦強調在真實臨床部署前仍需審慎驗證，包括多元族群適用性、法律責任歸屬與透明度等課題，值得醫院領導層與臨床科主任密切關注。", "tags": ["自主AI代理人", "電子病歷", "臨床決策", "大型語言模型"], "author": "未標示（Nature｜2026-06-17）", "source_url": "https://www.nature.com/articles/s41586-026-10675-5"}, {"rank": 2, "score": 9.0, "title": "Nature同期刊出：對話式AI用於慢性病管理之實證研究", "summary": "Nature期刊同日（2026年6月17日）刊載另一篇重要研究，探討對話式AI在慢性疾病管理中的實際應用成效。研究聚焦於AI如何透過自然語言互動，協助患者進行持續性的健康狀況追蹤、用藥提醒與衛教溝通，並評估其對臨床結果的影響。此研究與前述自主AI代理人論文同步發表，共同勾勒出AI在整個醫療照護連續體中的角色從急性診斷到慢性病長期管理的全面滲透趨勢。對於面臨慢性病患者管理壓力的醫院體系而言，此研究提供對話式AI工具的實證基礎，亦引發對醫病關係、患者隱私及資料治理的深層討論，具有高度臨床與政策參考價值。", "tags": ["對話式AI", "慢性病管理", "患者溝通", "臨床實證"], "author": "未標示（Nature｜2026-06-17）", "source_url": "https://www.nature.com/articles/s41586-026-10764-5"}, {"rank": 3, "score": 8.5, "title": "Google AMIE醫療AI新研究：展示慢性病管理輔助潛力", "summary": "Google於2026年6月17日在官方部落格發布最新研究成果，顯示其醫療AI系統AMIE（Articulate Medical Intelligence Explorer）在協助管理慢性健康狀況方面展現顯著潛力。此研究進一步拓展AMIE的應用範疇，從先前的診斷對話延伸至長期慢性病照護場景，包括患者病程追蹤與臨床溝通。Google持續在醫療AI領域深耕，AMIE的最新進展與Nature同日發表的對話式AI研究形成相互呼應，共同強化了AI輔助慢性病管理的實證基礎。此一動向對醫院數位轉型策略及未來與科技巨頭合作模式均具重要參考意義，醫療機構領導層應持續評估此類工具的臨床導入可行性。", "tags": ["Google AMIE", "慢性病AI", "醫療對話系統", "數位轉型"], "author": "未標示（GNews-Medical AI｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxPM1l6b1JxaHFNLUI0R2wyVlVwM041aW1QUXJkMTZjWmcxYUlRME9DNDZfLVVBcGtWdDVXVEtPbDFXcE90U0lSOE85UE9VcVkzU3ppRTUzaEdUUFlDTDVoZ1dqWjlGbzE5Rlh5QlNuNmstWl9mdkh6QS05TGZMcUJMTEhiVU42YTBvQWJTTkpsYkVmZlEwM0RzQklURFJVdjR6N2Z1YXVvSGxtYjNIUTFKWUNR?oc=5"}, {"rank": 4, "score": 8.0, "title": "完全開放的醫療AI框架問世：任何人均可稽核臨床LLM的建構過程", "summary": "Medical Xpress於2026年6月17日報導一項重要進展：研究團隊發布全面開放的醫療AI框架，允許任何人對臨床大型語言模型（LLM）的建構過程進行完整稽核。此框架涵蓋訓練資料來源、模型架構、評估方法等關鍵環節，旨在提升醫療AI的透明度與可信賴性。在AI監管日趨嚴格、患者安全議題受到高度關注的背景下，此開放框架為醫療機構評估與採購AI工具提供重要參考依據，同時也呼應全球各地對醫療AI可解釋性與問責機制的政策訴求。對於醫院資訊部門及數位轉型團隊而言，了解並參與此類開放生態系，有助於強化院內AI治理能力與風險管控。", "tags": ["開放框架", "臨床LLM", "AI透明度", "醫療AI治理"], "author": "未標示（GNews-Medical AI｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxPVkZvZXJLUkRDVDlrRHhNZDA4ZUVwMWpTdEtVQVY4QUdIYXRnclJaTy1XM2VSM0x5UUpOMUdrVENrOEFYYnBDeVlQc3k0QXBtWDFNWmFsX3dzRFVUa0libDJTZWlad2VLNkV5WmwzLUhWYVo3WWY2dlpsbnNfcGdIV0VrQS12QQ?oc=5"}, {"rank": 5, "score": 7.5, "title": "輝達與鴻海聯手打造大腸鏡AI Agent，協助醫師精準識別病灶", "summary": "遠見雜誌於2026年6月17日報導，輝達（NVIDIA）與鴻海（Foxconn）攜手合作，共同開發應用於大腸鏡檢查的AI Agent系統，目標是協助消化科醫師在內視鏡檢查過程中更清楚、即時地識別病灶，提升腸道腫瘤及息肉的偵測率。此合作案結合輝達在AI運算與醫療影像處理的技術優勢，以及鴻海在硬體整合與醫療設備生產上的能量，具有產業生態系整合的標誌性意義。對於消化內科及內視鏡中心而言，AI輔助偵測工具的成熟應用將直接影響早期癌症篩檢品質。此合作亦顯示台灣科技產業積極布局醫療AI領域的戰略企圖，值得國內醫療機構持續追蹤後續臨床驗證進展。", "tags": ["大腸鏡AI", "內視鏡偵測", "台灣醫療AI", "輝達鴻海"], "author": "未標示（GNews-台灣醫療AI｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMiTkFVX3lxTE40YWdHVXkyaDlBcHFrZ3pnaDgwVzFsOHAzNGVOVkpEeDNuY1pYXzdLZGNnSC02dGpCa1l2YUpVZW01VldHM3pCSlhMNkZIUQ?oc=5"}, {"rank": 6, "score": 7.5, "title": "資誠與台北醫學大學共建AI創新平台，智慧醫療競爭力邁向生態系整合", "summary": "CIO Taiwan於2026年6月17日報導，資誠聯合會計師事務所（PwC Taiwan）與台北醫學大學正式合作共建AI創新平台，目標是將智慧醫療的競爭力從單一機構延伸至整體生態系佈局。此合作涵蓋醫療數據治理、AI應用開發及人才培育等面向，期望透過顧問業與學術醫療機構的跨界協作，加速台灣智慧醫療產業化進程。此舉代表台灣醫療AI發展正從個別醫院的點狀應用，走向跨機構、跨產業的系統性整合，具有重要的產業生態示範意義。對於有意推動AI轉型的醫療機構而言，此類公私學合作模式提供資源整合與風險共擔的新路徑，值得借鑑參考。", "tags": ["台灣醫療AI", "產學合作", "智慧醫療生態系", "AI平台"], "author": "未標示（GNews-台灣醫療AI｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMiREFVX3lxTFAzUEtIWUJkNVRDajFrR3FyNnJibW9RdFJqU3B0a0l2NXljWEtyUDZDSkt3dTE5T3J1c0NpMUVsY2xZZ1pL?oc=5"}, {"rank": 7, "score": 7.5, "title": "中山大學攜手高雄榮總簽署策略聯盟，打造南台灣AI智慧醫療基地", "summary": "自由健康網於2026年6月17日報導，國立中山大學與高雄榮民總醫院正式簽署策略聯盟協議，攜手打造南台灣AI智慧醫療基地。此聯盟整合中山大學的AI研發能量與高雄榮總的臨床醫療資源，計畫在影像判讀、疾病預測、智慧病房等多項應用上展開深度合作。此一合作不僅強化南台灣醫療AI研究能量，亦呼應台灣政府推動「健康台灣」及AI醫療產業化的政策方向，有助於縮短南北醫療AI發展差距。對於台灣各大醫療體系而言，此類大學與醫學中心的戰略聯盟模式，提供了整合研究、臨床驗證與人才培育的重要範例，具有推廣借鑑價值。", "tags": ["台灣醫療AI", "產學聯盟", "南台灣", "智慧醫院"], "author": "未標示（GNews-台灣醫療AI｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFA1V3lKVW11WFRxdDZ3bDVHeTBBVE0yQi1fazdlQjF6NEJOTjEyMjhiVl81WFhpVjFnYWFaZWJSUzdaTklZem10T0hGd2RtTHRMM0pWVVM5YW14dnBQdjRsZi05RlFKbk9VaUHSAWpBVV95cUxQNVd5SlVtdVhUcXQ2d2w1R3kwQVRNMkItX2s3ZUIxejRCTk4xMjI4YlZfNVhYaVYxZ2FhWmViUlM3Wk5JWXptdE9IRndkbUx0TDNKVlVTOWFteHZwUHY0bGYtOUZRSm5PVWlB?oc=5"}, {"rank": 8, "score": 7.0, "title": "AI輔助上消化道內視鏡品質管控：彌補上消化道GI聯合手術的品質缺口", "summary": "MedCity News於2026年6月17日刊載專題報導，指出美國醫療院所合併上下消化道內視鏡（聯合GI手術）的執行已日趨普遍，然而上消化道（upper GI）的品質標準基礎建設卻明顯落後於臨床需求。文章提出AI技術可有效協助填補此一品質缺口，包括即時影像分析、異常偵測提示及報告標準化等應用。隨著內視鏡量能擴張，如何維持一致且高品質的檢查標準，成為消化科及內視鏡中心的核心挑戰。AI工具的導入有望在不增加人力負擔的前提下，提升品質管控的一致性與可追溯性。此議題對擁有消化內科及健檢中心的醫院體系具有直接參考價值。", "tags": ["消化道內視鏡", "AI品質管控", "上消化道", "臨床AI應用"], "author": "未標示（MedCity News｜2026-06-17）", "source_url": "https://medcitynews.com/2026/06/combined-gi-procedures-are-becoming-routine-ai-can-help-address-the-gap-in-upper-gi-quality-standards/"}, {"rank": 9, "score": 7.0, "title": "Cleveland Clinic Abu Dhabi啟用「AI科學家」平台，強化臨床決策支援能力", "summary": "ITP.net於2026年6月17日報導，Cleveland Clinic Abu Dhabi正式啟用「AI科學家」（AI Scientist）平台，用以支援臨床醫師的決策制定。該平台整合大量醫學文獻與臨床資料，能夠在臨床情境下快速提供循證建議，協助醫師在複雜病例中做出更精準的判斷。Cleveland Clinic作為全球頂尖醫療機構，此舉具有強烈的標竿示範效果，顯示AI輔助臨床決策已從概念驗證走向正式臨床部署。此案例同時揭示國際一流醫療中心在AI整合策略上的具體作法，對於規劃導入臨床決策支援系統的醫院資訊部門及各臨床科主任，提供了珍貴的實務參考。", "tags": ["臨床決策支援", "AI科學家", "Cleveland Clinic", "醫院AI部署"], "author": "未標示（GNews-AI clinical｜2026-06-17）", "source_url": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxQbHM2MnNWT1NtSGhvQ3lITWFJckNWZEo2ZHlBRi1BczNaVVpuWVpsVHhBVGpkTWIzUFB4S0Y3VUlEM1BUNXBUWDgwM1RSbHpnQklHT2xWMzQwZ2RkeHg0WDdHOEF6cElqMkx4ZGxfRGhBeFA1YldSVGE3djBHUnU4Q2QweXJ6Zmp0NTgwX0EyT2NCNkZjbmYtZXB4UmhoTGtMSV9NZE1mb19CSGdEaXpqbkhkN3hZSXRkNlFtZzFqQmdsV1gwcnlOSzR5U3BSVXBjeHRRcGcwazY?oc=5"}, {"rank": 10, "score": 6.5, "title": "Abridge「以患者為中心」的定位主張遭質疑，醫療AI場域倫理論述引關注", "summary": "STAT News於2026年6月17日在「AI Prognosis」專欄中，由記者Brittany Trang深度檢視環境式病歷記錄工具開發商Abridge所宣稱的「以患者為中心」定位是否言過其實。文章指出，Abridge的AI環境式聆聽（ambient scribe）技術雖能自動記錄醫病對話並生成病歷，但其「患者中心」的行銷主張在實際設計邏輯、資料使用方式及臨床工作流程整合上，仍存在值得商榷的落差。此報導反映出醫療AI領域中品牌定位與實質效益之間的透明度爭議，同時提醒醫療機構在評估採購AI工具時，需審慎檢視廠商的實證依據與倫理承諾，不應僅憑行銷話語做出決策。", "tags": ["環境式病歷記錄", "Abridge", "醫療AI倫理", "患者中心"], "author": "Brittany Trang（STAT News｜2026-06-17）", "source_url": "https://www.statnews.com/2026/06/17/is-scribe-developer-abridge-patient-centered-ai-prognosis/?utm_campaign=rss"}]}, "2026-06-17": {"date_str": "2026年06月17日", "weekday": "星期三", "items": [{"rank": 1, "score": 9.0, "title": "FDA AI 醫療設備指引草案出爐：強調風險管理框架與監管變革方向", "summary": "美國食品藥物管理局（FDA）近日發布 AI 醫療設備相關指引草案，針對 AI 輔助診斷、治療決策等應用明確提出風險管理要求，並預告監管架構將進行重大調整。草案強調製造商須建立完整的風險評估機制，涵蓋演算法偏差、資料品質與臨床驗證等面向，同時要求上市後持續監測 AI 系統的安全性與有效性。此一政策走向對全球醫療 AI 產業具有深遠影響，尤其是計畫引進或自行開發 AI 醫療設備的醫療機構與廠商，均需提前因應新規。台灣業者與醫院在評估 AI 採購或研發合作時，應密切追蹤 FDA 最終定稿，作為產品設計與風險治理的重要參考依據。", "tags": ["FDA監管 const TODAY_ISO  = "2026-06-20";
// ── 產生單張文章卡片 HTML ────────────────────────────────────────
function renderCard(item, rank) {
  const badges = {
    1: ['b-top1','🥇 Top 1'],
    2: ['b-top2','🥈 Top 2'],
    3: ['b-top3','🥉 Top 3'],
  };
  const numClasses = { 1:'num-top1', 2:'num-top2', 3:'num-top3' };
  const [badgeCls, badgeTxt] = badges[rank] || ['b-focus','焦點'];
  const numCls  = numClasses[rank] || '';
  const tags    = item.tags || [];
  const catBadges = tags.slice(0,2).map(t=>`<span class="badge b-cat">${esc(t)}</span>`).join('');
  const titleHtml = item.source_url
    ? `<a href="${esc(item.source_url)}" target="_blank">${esc(item.title)}</a>`
    : esc(item.title);
  const hashtags = tags.map((t,i)=>
    `<a class="hashtag" href="#" onclick="filterByTag(this,'${esc(t)}');return false;">#${esc(t)}${i<tags.length-1?'、':''}</a>`
  ).join('');
  const srcBtn = item.source_url
    ? `<a class="source-btn" href="${esc(item.source_url)}" target="_blank">🔗 原始來源</a>` : '';
  return `
  <article class="article-card" data-tags="${tags.map(esc).join('|')}" style="animation-delay:${(rank*0.05).toFixed(2)}s">
    <div class="card-num"><div class="num-circle ${numCls}">${rank}</div></div>
    <div class="card-body">
      <div class="card-badges"><span class="badge ${badgeCls}">${badgeTxt}</span>${catBadges}</div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta"><span>📅 ${esc(item.author||'')}</span></div>
      <div class="card-summary">${esc(item.summary||'')}</div>
      <div class="card-footer">
        <div class="hashtags">${hashtags}</div>${srcBtn}
      </div>
    </div>
  </article>`;
}
// ── 切換到指定日期 ─────────────────────────────────────────────
function switchDay(dateIso) {
  const day = ALL_DAYS[dateIso];
  if (!day) return;
  const items = day.items || [];
  // 標題列
  document.getElementById('page-title').textContent =
    `醫療AI每日情報｜${day.date_str}（${day.weekday}）`;
  document.getElementById('count-badge').textContent =
    `今日精選 ${items.length} 則`;
  document.getElementById('list-count').textContent =
    `共 ${items.length} 筆`;
  // Header 日期
  const hd = document.querySelector('.header-date');
  if (hd) hd.textContent = `📅 ${day.date_str}（${day.weekday}）`;
  // 文章列表
  document.getElementById('article-list').innerHTML =
    items.map((item, i) => renderCard(item, i+1)).join('');
  // 收集所有標籤
  const allTags = [];
  items.forEach(item => (item.tags||[]).forEach(t => {
    if (!allTags.includes(t)) allTags.push(t);
  }));
  // 側欄分類
  document.getElementById('sidebar-links').innerHTML =
    `<a class="sidebar-link active" href="#" onclick="filterByTag(this,'all');return false;">
       今日精選 <span class="count">${items.length}</span>
     </a>` +
    allTags.map(t =>
      `<a class="sidebar-link" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 標籤雲
  document.getElementById('tag-cloud').innerHTML =
    allTags.map(t =>
      `<a class="tag-chip" href="#" data-filter="${esc(t)}"
          onclick="filterByTag(this,'${esc(t)}');return false;">${esc(t)}</a>`
    ).join('');
  // 日期按鈕 active 狀態
  document.querySelectorAll('.date-btn[data-date-iso]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dateIso === dateIso);
    // 今天的按鈕文字
    const weekdayEl = btn.querySelector('.date-btn-weekday');
    if (weekdayEl) {
      if (btn.dataset.dateIso === TODAY_ISO) weekdayEl.textContent = '今天';
      // else 保持原來的星期文字（Jinja2 渲染時已設定）
    }
  });
  // Footer
  const footer = document.querySelector('.footer');
  if (footer) footer.innerHTML =
    `<strong>🧠 奇美醫療AI每日情報</strong>｜奇美醫療體系 · AI Everywhere 計畫<br>
     本簡報由奇美 AI Everywhere 情報代理人自動生成 · ${day.date_str}`;
}
// ── 標籤篩選 ──────────────────────────────────────────────────
function filterByTag(el, tag) {
  const cards = document.querySelectorAll('.article-card');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  let visible = 0;
  cards.forEach(card => {
    const match = tag === 'all' ||
      (card.getAttribute('data-tags')||'').split('|').includes(tag);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('list-count').textContent  = `共 ${visible} 筆`;
  document.getElementById('count-badge').textContent = `今日精選 ${visible} 則`;
  const vis = [...cards].filter(c => c.style.display !== 'none');
  cards.forEach(c => { c.style.borderRadius=''; c.style.borderTop=''; });
  if (vis.length) {
    vis[0].style.cssText += ';border-radius:12px 12px 0 0;border-top:1px solid var(--border)';
    if (vis.length===1) vis[0].style.borderRadius='12px';
    else vis[vis.length-1].style.cssText += ';border-radius:0 0 12px 12px';
  }
}
// ── HTML 跳脫工具 ─────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ── 頁面初始化 ────────────────────────────────────────────────
switchDay(TODAY_ISO);
</script>
